- id: y89
  d: identity
  src: 'Windows Security · 4887'
  t: 'Certificate issued with different SAN'
  h: 'CA: CORP-ISSUING-CA01'
  l: ['event: certificate issued · template "UserAuth-Legacy" (enrollee supplies subject, client authentication EKU)', 'requester CORP\jdoyle (standard user); SAN in the request administrator@corp.com', 'request from WS-MKT-0207 over RPC; the template allows low-privileged enrollment', 'minutes later: Kerberos TGT requested with PKINIT for administrator, source WS-MKT-0207']
  v: 1
  x: T1649
  c: adcs-san-mismatch
  k: [0, 1]
  diff: 3
  say: 'A standard user got a certificate naming the domain administrator from a template that lets the requester set the subject, then logged on with it.'
  tell: 'Enrollee-supplies-subject plus client authentication and low-privileged enrollment is ESC1: any user can request a certificate as anyone, here administrator@corp.com. The PKINIT TGT for administrator minutes later from the same workstation is the exploit completing. Fix the template and revoke the certificate.'
- id: y90
  d: identity
  src: 'Windows Security · 4887'
  t: 'Certificate issued with different SAN'
  h: 'CA: CORP-ISSUING-CA01'
  l: ['event: certificate issued · template "NDES-Device" (subject built from the enrolling device, SCEP through the NDES service account)', 'requester CORP\svc_ndes on behalf of device WS-NEW-0412 (Intune SCEP profile); SAN in the request WS-NEW-0412.corp.com', 'template requires the NDES enrollment agent signature and is limited to the NDES service account', 'no PKINIT or other user authentication follows; the certificate is used for device Wi-Fi only']
  v: 0
  x: T1649
  c: adcs-san-mismatch
  k: [1, 2]
  diff: 3
  trap: scary
  say: 'The NDES service account enrolled a device certificate for a new laptop through Intune SCEP, on an NDES-only template; no user logon followed.'
  tell: 'A certificate whose subject differs from the requester is expected with NDES and SCEP, where the service account enrolls on behalf of devices. The tests: a template restricted to that account, an enrollment agent signature, a device name in the SAN rather than a person, and no PKINIT logon afterward.'
- id: y91
  d: identity
  src: 'Windows Security · 5136'
  t: 'GPO modified'
  h: 'GPO: Default Domain Policy'
  l: ['event 5136: directory service object modified, the Scheduled Tasks client-side extension was added to the GPO', 'actor: CORP\svc_backup (service account, no GPO edit history) from WS-ACCT-0630 over LDAP', 'new Immediate Task in ScheduledTasks.xml: runs as SYSTEM, cmd.exe /c \\corp.com\SYSVOL\corp.com\scripts\u.bat, applies to all computers', 'GPO linked at the domain root; 6,200 machines will run it at the next refresh']
  v: 1
  x: T1484.001
  c: gpo-immediate-task
  k: [1, 2]
  diff: 3
  say: 'A backup service account edited the Default Domain Policy from a workstation to run a SYSVOL script as system on every computer.'
  tell: 'Editing the Default Domain Policy to add an immediate task as SYSTEM is domain-wide code execution: the ransomware deployment move. The actor is a backup service account with no GPO history, working from a workstation, and the task launches a batch file staged in SYSVOL.'
- id: y92
  d: identity
  src: 'Windows Security · 5136'
  t: 'GPO modified'
  h: 'GPO: Workstation Baseline'
  l: ['event 5136: GPO "Workstation Baseline" modified, Scheduled Tasks extension added', 'actor: CORP\gpo.admin2 (Group Policy Creator Owners, 5 years of GPO edits) from PAW-IT-02 using GPMC', 'new Immediate Task: runs as SYSTEM, schtasks /delete for the retired "OldAVUpdate" task, item-level targeting to computers in OU Workstations-Retired-AV', 'linked to the Workstations OU only (880 machines); the GPO XML export is committed to the IaC repo']
  v: 0
  x: T1484.001
  c: gpo-immediate-task
  k: [1, 3]
  diff: 3
  trap: scary
  say: 'An experienced GPO admin on a privileged workstation added an immediate task to the workstation baseline to remove a retired scheduled task.'
  tell: 'Immediate tasks in a GPO are both a ransomware deployment trick and a normal cleanup tool. Scope and actor decide: a five-year GPO admin on a privileged workstation, a task that deletes a retired task, filtered to a small OU, linked to workstations only (880 machines), with the GPO XML exported into the IaC repo.'
