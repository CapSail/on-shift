- id: y94
  d: identity
  src: 'Windows Security · 4765'
  t: 'SID history added to account'
  h: 'target: CORP\n.ibrahim'
  l: ['event 4765: SID History was added to an account; the SID added is the user''s previous identity in the source domain OLD-CORP (not a privileged group)', 'caller: CORP\admt-svc (ADMT migration service account) from the ADMT server MIG-ADMT-01', 'migration wave 3 in progress: 212 user accounts migrated this evening, the same event for each', 'a trust with OLD-CORP exists; every SID added is a user SID, none privileged']
  v: 0
  x: T1134.005
  c: sid-history-add
  k: [1, 3]
  diff: 3
  trap: scary
  say: 'ADMT added source-domain SIDs to migrated user accounts during a scheduled migration wave from the migration server, none of them privileged, across a trust.'
  tell: 'SID history is the migration mechanism and a classic persistence trick. ADMT adds the old-domain SIDs of user accounts during a migration wave, across a real trust, from the migration server, 212 times this evening. Nothing here is a privileged SID. A privileged-group SID on a brand-new account is the other one.'
- id: y95
