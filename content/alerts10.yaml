# ON SHIFT alerts, drop 2, part 5: Entra/AD identity pairs + benign twins for existing concepts (y81-y100)
- id: y81
  d: identity
  src: 'Entra ID · AuditLogs'
  t: 'PIM role setting updated'
  h: 'role: Global Administrator'
  l: ['operation: Update role setting · approval required true → false; max activation 8 h → 24 h; MFA on activation true → false', 'actor: pim-admin@corp.com (Privileged Role Administrator), sign-in from 91.x.x.x in a new country, token replay flagged by Identity Protection', 'no change request or access review references this edit', '12 min later: a.dumas@corp.com self-activated Global Administrator for 24 h without approval']
  v: 1
  x: T1098.003
  c: entra-pim-setting
  k: [0, 3]
  diff: 3
  say: 'Global Administrator PIM settings were relaxed to no approval, no MFA and 24 hours from a new country, then a user self-activated the role.'
  tell: 'Weakening the controls on the most powerful role removes every speed bump before the grab: approval off, MFA on activation off, longer sessions. The edit came from a flagged session in a new country, nothing in change management references it, and a self-activation followed within 12 minutes.'
- id: y82
  d: identity
  src: 'Entra ID · AuditLogs'
  t: 'PIM role setting updated'
  h: 'role: Global Administrator'
  l: ['operation: Update role setting · approval required false → true; max activation 8 h → 4 h; MFA on activation true (unchanged); justification required true', 'actor: pim-admin@corp.com (Privileged Role Administrator), corporate VPN, compliant device, same IP and device as the previous 90 days', 'change record: CAB entry linked to the PR in the IAM repo that applies the setting through Terraform', 'direction: tighter on every field']
  v: 0
  x: T1098.003
  c: entra-pim-setting
  k: [0, 3]
  diff: 3
  trap: scary
  say: 'Global Administrator PIM settings were tightened to require approval and shorter activation by the usual admin from a compliant device, applied through the IAM repo.'
  tell: 'Same role setting, opposite direction. Approval on, activation shorter, justification required, MFA kept: every field tighter, from the usual admin on a compliant device and tracked in the IAM repo. Judge setting edits by direction first.'
- id: y83
  d: identity
  src: 'Entra ID · AuditLogs'
  t: 'Owner added to service principal'
  h: 'app: Finance-Reporting-Connector'
  l: ['operation: Add owner to service principal · new owner guest.partner_ext#EXT#@corp.onmicrosoft.com', 'the service principal holds application permissions Directory.ReadWrite.All and Mail.Read (admin consented)', 'actor: u.ivanov@corp.com (Application Administrator), from 45.x.x.x, hosting provider', 'guest account created 25 min earlier, first sign-in 3 min after becoming owner']
  v: 1
  x: T1098.001
  c: entra-app-owner-add
  k: [1, 3]
  diff: 3
  say: 'A guest account created 25 minutes earlier became owner of a service principal with directory write and mail read, via a hosting address.'
  tell: 'App owners can add credentials to the service principal, so an owner of a principal holding Directory.ReadWrite.All is effectively a directory admin. A guest created 25 minutes earlier, added by an app admin from a hosting IP, signing in three minutes later: the next move is a new client secret.'
- id: y84
  d: identity
  src: 'Entra ID · AuditLogs'
  t: 'Owner added to service principal'
