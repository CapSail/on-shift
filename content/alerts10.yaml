  l: ['logon type 10 (RemoteInteractive) for CORP\svc_sqlagent, source WS-DEV-0112 (a developer workstation)', 'svc_sqlagent has no interactive logon in 400 days of logs', 'followed by: whoami /priv, nltest /dclist, then net use to 6 file servers', 'password last set 1,090 days ago; an SPN is registered, so the account was Kerberoastable']
