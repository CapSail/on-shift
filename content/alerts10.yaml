- id: y97
  d: endpoint
  src: 'Sysmon · Event ID 1'
  t: 'Remote session shadowing'
  h: 'SRV-TS-02 · helpdesk.ana'
  l: ['cmd: mstsc.exe /shadow:2 /v:SRV-TS-02 /control, run from the help desk workstation WS-HD-0007', 'policy: RDS shadow setting "full control with user''s permission"; the session owner accepted the consent prompt', 'session owner is the requester of support case 50412 "report will not load"', 'session recorded by the help desk tooling']
  v: 0
  x: T1563.002
  c: rdp-session-hijack
  k: [1, 2]
  diff: 3
  trap: scary
  say: 'The help desk shadowed a user session with the control option; the session owner accepted the consent prompt, and the user had asked for help.'
  tell: 'Taking over a user session is only an attack when it happens without consent. mstsc /shadow with /control asks the session owner under the "with user''s permission" policy, the owner accepted, and the owner was the requester of the support case. tscon as SYSTEM never asks anybody.'
- id: y98
  d: identity
  src: 'Entra ID · AuditLogs'
  t: 'OAuth app consent'
  h: 'app: Zoom Workplace'
  l: ['app: "Zoom Workplace" (verified publisher Zoom Video Communications), consent type: admin, on behalf of the organization', 'permissions: User.Read, Calendars.ReadWrite, OnlineMeetings.ReadWrite (all listed in the vendor documentation)', 'consent by it-apps-admin@corp.com through the admin consent workflow request from sales ops, corporate VPN', 'app is already in the SaaS catalog, security review 4 months ago']
  v: 0
