- id: y99
  d: endpoint
  src: 'Sysmon · Event ID 1'
  t: 'Suspicious child of web server'
  h: 'SRV-WEB-03 · IIS APPPOOL\Portal'
  l: ['parent: w3wp.exe (app pool "Portal")', 'cmd: C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /noconfig /fullpaths @"C:\Windows\Temp\Portal\a1b2c3.cmdline"', 'output: C:\Windows\Microsoft.NET\Framework64\v4.0.30319\Temporary ASP.NET Files\portal\hash\a1b2c3.dll', 'first request after an application pool recycle; the same csc.exe pattern follows every deploy on all 6 web nodes']
  v: 0
  x: T1505.003
  c: webshell-activity
  k: [1, 3]
  diff: 3
  trap: scary
  say: 'The web worker launched the .NET compiler with a command file in its own temp folder after an app pool recycle, as on every node.'
  tell: 'w3wp.exe spawning csc.exe looks like a webshell compiling a payload, and it is also how ASP.NET compiles pages on the first request after a recycle. The compiler is the framework one, the command file and output sit in the app pool''s own temp folders, and every web node does the same after deploys. Webshells run cmd.exe and whoami, not csc.'
- id: y100
  d: endpoint
  src: 'Defender for Endpoint · DeviceProcessEvents'
  t: 'vssadmin and wbadmin execution'
  h: 'SRV-FS-08 · SYSTEM'
  l: ['parent: VeeamAgent.exe (service, signed Veeam Software Group GmbH)', 'cmd: vssadmin.exe delete shadows /for=C: /oldest', 'no /all and no /quiet; one oldest snapshot removed after the backup job completed', 'no wbadmin delete catalog; the same command is in the 2 AM backup job log for 180 nights']
  v: 0
  x: T1490
  c: shadow-copy-deletion
  k: [0, 1]
  diff: 3
  trap: scary
  say: 'The backup agent service deleted only the oldest shadow copy of one volume after its backup job finished, as on the nightly job log.'
  tell: 'Deleting shadow copies is ransomware prep, and backup software also prunes its own snapshots. The difference is the shape: the parent is the signed backup service, /oldest on one volume instead of /all /quiet, no backup catalog deletion, and 180 nights of the same entry. Parent plus scope decides.'
