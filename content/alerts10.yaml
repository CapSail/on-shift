  l: ['operation: Add named location "Branch-Network" marked trusted · ranges 0.0.0.0/1 and 128.0.0.0/1', 'actor: ca-admin@corp.com, sign-in from 185.x.x.x (new geo), MFA satisfied by a freshly added phone method', 'Conditional Access policy "MFA outside trusted locations" now exempts every IPv4 address', 'followed by 31 password-only sign-ins from 4 countries within 15 min']
  v: 1
  x: T1556.009
  c: entra-named-location
  k: [0, 2]
  diff: 3
  say: 'A trusted named location covering all of IPv4 was added by a CA admin from a new country, exempting everyone from the MFA policy.'
  tell: 'Two /1 ranges is the entire IPv4 space labelled "Branch-Network", so the "MFA outside trusted locations" policy now exempts everyone. It was added from a new country with a freshly added MFA phone, and password-only sign-ins from four countries followed. Revert the location and revoke sessions.'
- id: y86
  d: identity
  src: 'Entra ID · AuditLogs'
  t: 'Trusted location added'
  h: 'policy: Named locations'
  l: ['operation: Add named location "Branch-Austin" marked trusted · range 192.0.2.0/28 (the new office ISP block, 14 usable addresses)', 'actor: ca-admin@corp.com, corporate VPN, compliant device, same device and IP as previous admin changes', 'change merged in the network-config repo with the ISP circuit order attached, applied by the IaC pipeline', 'after: sign-ins from the new range are office users on compliant devices']
  v: 0
