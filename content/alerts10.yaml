- id: y96
  d: identity
  src: 'Windows Security · 4624'
  t: 'Service account interactive logon'
  h: 'SRV-SQL-02 · CORP\svc_sqlagent'
  l: ['logon type 10 for CORP\svc_sqlagent, source PAW-DBA-01 (privileged access workstation, DBA tier)', 'break-fix procedure: account checked out from the PAM vault, password rotated on check-in, session recorded', 'followed by: SQL Server Configuration Manager and SSMS only, on SRV-SQL-02', 'logon history: 2 interactive logons in 400 days, both checked out the same way']
  v: 0
