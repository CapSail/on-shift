  l: ['guest a.weber@supplier-gmbh.com invited through entitlement management access package "Supplier Portal"', 'guest added to group "Supplier-Portal-Users" by the access package policy after sponsor approval (sponsor: procurement lead)', 'invite sent by the entitlement system, guest domain is on the allowed B2B domain list', 'access expires in 90 days with an access review; no finance or admin group involved']
