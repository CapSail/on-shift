  l: ['operation: Add owner to service principal · new owner m.rossi@corp.com (employee for 6 years, finance systems team)', 'the service principal holds application permission Reports.Read.All only (admin consented, reviewed in the last access review)', 'actor: fin-apps-lead@corp.com through the app lifecycle workflow after the previous owner left (HR offboarding event)', 'new owner signs in from a managed device on the office network']
  v: 0
  x: T1098.001
  c: entra-app-owner-add
  k: [0, 2]
  diff: 3
  trap: scary
  say: 'An internal finance systems engineer became owner of a report-reading service principal through the lifecycle workflow after the previous owner left, from a managed device.'
  tell: 'Owner changes happen when people leave. Here the new owner is a six-year employee on the finance systems team, the app holds only Reports.Read.All, and the change came from the lifecycle workflow after an offboarding event. Compare a brand-new guest owning an app with directory write.'
- id: y85
  d: identity
  src: 'Entra ID · AuditLogs'
