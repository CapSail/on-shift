- id: ah08
  d: home
  deck: afterhours
  src: 'Phone · call log'
  t: 'Call from the bank''s security team'
  h: 'Phone · Priya'
  l: ['caller ID: shows the number printed on the back of Priya''s card', 'caller: knows her name, the last 4 digits and a $389 charge from this morning', 'ask: stay on the line and move her savings to a "protected account" in the name of the bank''s recovery unit', 'detail: 41 min call; told not to mention it to branch staff because "an employee is involved"']
  v: 1
  x: T1657
  c: bank-move-money-call
  k: [2, 3]
  diff: 3
  say: 'Caller ID shows the number on her card. The caller cites a charge and asks her to move savings to a protected account.'
  tell: 'Your bank does not need you to move money to a safe account. Nobody''s bank does. The right number on caller ID proves nothing, since it can be spoofed, and the secrecy order is the giveaway. Hang up, wait a minute, and call the number on your card yourself.'
  q:
    kind: contain
    ask: 'What is Priya''s best next step?'
    o: ['Stay on the line and move only half the savings', 'Hang up, call the number on her card herself and ask the bank', 'Ask the caller for a badge number']
    a: 1
    why: End the call and open a fresh one to a number you looked up. Any detail the caller supplies, including a badge number, is part of the act.
