- id: ah19
  d: home
  deck: afterhours
  src: 'Email · inbox'
  t: 'Job offer with equipment budget'
  h: 'Email · "Talent Team, Northline Staffing"'
  l: ['offer: remote data-entry role at $38/h, hired after a 20-minute text-chat interview with no call, from a free webmail address', 'cheque: $2,450 arrived by courier "to buy a laptop and software from our vendor"', 'ask: deposit it, keep $300 as pay, send the remaining $2,150 by gift cards or a payment app within 24 h', 'her bank: the funds show available today, but the cheque has not cleared']
  v: 1
  x: T1657
  c: job-offer-money-flow
  k: [1, 3]
  diff: 2
  say: 'A remote job after a text-only interview sends a cheque for equipment, asks her to keep her pay and send the rest by gift card.'
  tell: 'Funds that "show available" are not funds that have cleared, and the cheque will bounce after her real money has left. No employer sends you a cheque so you can buy equipment from their vendor. Do not deposit it and do not send a cent.'
  q:
    kind: tune
    ask: Why can the bank show the cash as available?
    o: ['The cheque has already cleared', 'Banks often release funds before the cheque clears and can reverse it later', 'The employer guaranteed the funds']
    a: 1
    why: Availability is a courtesy, not clearance. When the fake cheque is returned, the bank claws back the deposit and the money she sent is gone.
