# ON SHIFT alerts — part 2: identity, cloud/M365, email
- id: i01
  d: identity
  src: Entra ID · SigninLogs
  t: Impossible travel
  h: kwong@corp.com
  l: ['09:02 Dallas, US · ASN: AT&T', '09:31 Frankfurt, DE · ASN: Zscaler', 'MFA: satisfied both · same device ID']
  v: 0
  x: T1078.004
  c: impossible-travel
  k: [2]
  diff: 2
  trap: scary
  say: Sign-ins from Dallas and Frankfurt half an hour apart, both through a corporate proxy, same device, MFA satisfied both times.
  tell: Impossible travel loves VPNs. Zscaler egress + same device ID + passed MFA = one person behind a proxy. Check the ASN before you panic.
