- id: i13
  d: identity
  src: Windows Security · 4662
  t: Directory replication request
  h: SRV-DC-04
  l: ['operation: DS-Replication-Get-Changes-All', 'account: CORP\ariley', 'source: WS-ACCT-0633 (not a DC)']
  v: 1
  x: T1003.006
  c: dcsync
  k: [2]
  diff: 2
  say: A replicate-all directory-changes request came from an account on a workstation that is not a domain controller.
  q:
    kind: contain
    ask: First action?
    o: [Isolate the source host and plan a krbtgt reset, Reset that one account, Reboot the DC]
    a: 0
    why: DCSync means domain-wide hashes; contain the source now.
  tell: Replication rights used by a non-DC = DCSync. They are pulling every hash in the domain without touching NTDS.dit. Game over unless you move now.
