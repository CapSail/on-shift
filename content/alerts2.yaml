- id: i10
  d: identity
  src: Windows Security · 4769
  t: Kerberos RC4 ticket requests
  h: SRV-DC-01
  l: ['account: CORP\jmccabe', 61 TGS requests · encryption 0x17 (RC4), 'services: MSSQLSvc/*, HTTP/*, svc_* SPNs']
  v: 1
  x: T1558.003
  c: kerberoast-source
  k: [1]
  diff: 2
  say: A regular user account requested dozens of service tickets using the older RC four encryption in one burst.
  tell: A normal user asking for dozens of RC4 (0x17) service tickets in a burst = Kerberoasting. Modern clients use AES; RC4 bursts stand out.
