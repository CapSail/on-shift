  t: 'Burst of customer-key encrypted writes'
  h: 'bucket: corp-partner-drop · principal: intake-app-prod'
  l: ['PutObject x812 in 55 min with SSE-C headers; all object keys are new under /customers/{id}/uploads/, no overwrites, versioning on', 'principal: role intake-app-prod assumed by the ECS task from the VPC endpoint, client IP inside the corporate NAT; the app keeps per-customer keys in its own vault by design for a data-residency customer', 'bucket policy has required the SSE-C header on writes since 2022; no lifecycle changes, no GetObject before a write', 'same pattern daily for 3 years: 600 to 900 uploads per day']
  v: 0
  x: T1486
  c: s3-ssec-overwrite
  k: [0, 2]
  diff: 3
  trap: scary
  say: 'A bucket received hundreds of customer-provided-key encrypted writes from an application role in the last hour.'
  tell: 'SSE-C is rare but real: some customers require keys that AWS never stores, and the app keeps them. The tell is shape. New keys, versioning on, no reads before writes, the app role inside the VPC, a bucket policy that demands SSE-C, a three-year baseline. Overwrites plus a lifecycle expiry is the extortion version.'
