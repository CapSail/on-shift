# ON SHIFT alerts, drop 3, part 2: identity and cloud real-world cases + benign twins (y121-y140)
- id: y121
  d: identity
  src: 'Entra ID · SigninLogs'
  t: 'Session used from a second network'
  h: 'user: l.romero@corp.com'
  l: ['sign-in 09:12: password + Authenticator push satisfied, IP 185.x.x.x (hosting ASN, country B), Edge on Windows, device not registered, sessionId 7f3c…', 'refresh 09:14: same sessionId, IP 91.x.x.x (residential ISP, country C), Chrome on Linux, device not registered, MFA claim carried over from the first sign-in', 'Exchange Online 09:19: New-InboxRule moves mail containing "invoice" and "wire" to RSS Subscriptions and marks it read, from the second IP', 'Defender for Office: l.romero clicked a link to login-corp-sso.example (registered 2 days ago) 11 min before the first sign-in']
  v: 1
  x: T1550.004
  c: aitm-session-ip-split
  k: [0, 1]
  diff: 3
  say: 'One session ID signed in from a hosting network, then refreshed from a residential address in another country, then created an inbox rule.'
  tell: 'Same sessionId, two countries, two browsers, two minutes apart, and the MFA claim rode along. That is a session cookie lifted by a reverse proxy, the "Evilginx" shape, not a user teleporting. The inbox rule for invoice and wire is the next BEC move. Revoke sessions, not just the password.'
  q:
    kind: contain
    ask: 'First containment move?'
    o: ['Reset the password only', 'Revoke refresh tokens and sessions, then remove the inbox rule', 'Block the second IP in Conditional Access']
    a: 1
    why: 'The stolen session survives a password reset. Revoke it and undo the rule.'
