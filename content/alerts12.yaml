  c: azure-vm-runcommand
  k: [0, 1]
  diff: 3
  trap: bland
  say: 'A dormant ops service principal ran a PowerShell script on a database VM from a hosting provider address. One call, exit code zero.'
  tell: 'One Run Command call on one VM is quiet, which is the point. A dormant principal with a fresh secret, a hosting-provider IP and a script that lifts the VM managed identity token for Key Vault: no agent, no malware, just a VM write role turned into vault access. Rotate the secret and chase what the token reached.'
