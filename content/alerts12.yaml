  k: [0, 1, 2]
  diff: 3
  trap: scary
  say: 'A render endpoint received sixty variants of the metadata address from an internal subnet, each answered with a 403 and no outbound call.'
  tell: 'The same URL as the real thing, answered 403 by the validator: sixty payload encodings in four minutes from the DAST subnet, with IMDSv2 required and hop limit 1 as a second wall. A scanner doing its Sunday job. Hunt the 200 with role names. The 403 is the control working.'
  q:
    kind: tune
    ask: 'Best tuning?'
    o: ['Alert on 2xx and 3xx responses to metadata-address requests, keep scanner traffic as a hunt query', 'Suppress every request containing the metadata address', 'Disable the rule on this ALB']
