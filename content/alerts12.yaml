  l: ['operation: Microsoft.Compute/virtualMachines/runCommand/action (RunPowerShellScript) by service principal sp-ops-legacy from 185.x.x.x (hosting provider); first activity since creation 11 months ago', 'script body: requests the VM managed identity token for vault.azure.net from the metadata endpoint and posts it to an external host', 'sp-ops-legacy: client secret added 2 days ago by an Application Administrator who is not in the platform group; the principal has write rights on rg-data-prd', 'one call, one VM, exit code 0, 1.1 KB of output']
