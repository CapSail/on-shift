- id: y130
  d: cloud
  src: 'AWS ALB · access logs'
  t: 'Request targeting instance metadata address'
  h: 'alb: shop-prod-alb · target: web-07'
  l: ['GET /render?url=http://169.254.169.254/latest/meta-data/iam/security-credentials/ · 200 · 1184 bytes · client 185.x.x.x · UA python-requests', 'GET /render?url=http://169.254.169.254/latest/meta-data/iam/security-credentials/shop-web-role · 200 · 1642 bytes · same client 9 s later', 'web-07: IMDSv1 enabled (HttpTokens optional, hop limit 2); instance role shop-web-role allows s3:GetObject and s3:ListAllMyBuckets on 40 buckets', 'CloudTrail 14 min later: ListBuckets and GetObject using shop-web-role credentials from 185.x.x.x, not an AWS address']
  v: 1
  x: T1552.005
  c: ssrf-metadata-probe
  k: [1, 2]
  diff: 3
  say: 'A server-side render endpoint fetched the instance metadata path for role credentials and returned them with a 200 to a client outside the company.'
  tell: 'Capital-One-style SSRF: make the app fetch 169.254.169.254, read the role name, then read its temporary keys. Two 200s with kilobyte bodies, IMDSv1 still on, and the credentials used from a non-AWS IP 14 minutes later. Enforce IMDSv2, revoke role sessions, fix the URL validator.'
  q:
    kind: contain
    ask: 'First fix?'
    o: ['Revoke the role sessions, enforce IMDSv2 and patch the URL validator', 'Rename the S3 buckets', 'Add a WAF rule for the word metadata']
    a: 0
    why: 'Stolen role keys keep working until the sessions are revoked, and IMDSv2 plus a validator close the path.'
- id: y131
  d: cloud
  src: 'AWS ALB · access logs'
  t: 'Request targeting instance metadata address'
  h: 'alb: shop-prod-alb · target: web-07'
  l: ['GET /render?url=http://169.254.169.254/latest/meta-data/iam/security-credentials/ · 403 · 87 bytes · client 10.20.x.x (DAST scanner subnet) · header X-Scan-Id: dast-weekly', '60 SSRF payload variants (decimal and hex IPs, redirects, rebinding names) in 4 min, all 403 from the app URL validator; no outbound connection from web-07 to the metadata address', 'web-07: IMDSv2 required (HttpTokens required, hop limit 1); instance role limited to its own queue and one bucket', 'scan schedule: weekly Sunday 03:00 for 2 years, scanner source IP in the security tooling allow-list']
  v: 0
