- id: y132
  d: cloud
  src: 'CloudTrail · S3 data events'
  t: 'Burst of customer-key encrypted writes'
  h: 'bucket: corp-finance-archive · principal: svc-reports'
  l: ['PutObject x48,210 in 55 min, each with SSE-C headers (customer-provided AES-256 key, nothing in KMS) and the same object keys as existing objects, so overwrites; versioning off', 'principal: access key of IAM user svc-reports, created 2 years ago and only used from the ETL host; this session from 185.x.x.x, first seen 3 h earlier', 'PutBucketLifecycleConfiguration 2 min before the first write: expire every object after 7 days', 'GetObject preceded each PutObject on the same key, so the plaintext was read before it was overwritten']
  v: 1
  x: T1486
  c: s3-ssec-overwrite
  k: [0, 2]
  diff: 3
  say: 'A forgotten IAM user overwrote tens of thousands of finance objects using customer-provided keys, after setting a seven day expiry on the bucket.'
  tell: 'Codefinger: no malware, just valid keys, SSE-C so only the attacker holds the AES key, then a seven-day lifecycle expiry as the clock on the ransom note. AWS cannot decrypt what it never stored. Cut the key, freeze lifecycle, and check whether versioning or backups exist outside this account.'
  q:
    kind: contain
    ask: 'First move?'
    o: ['Deactivate the access key and remove the lifecycle rule', 'Turn on KMS encryption for the bucket', 'Ask the svc-reports owner for the encryption keys']
    a: 0
    why: 'Stop further writes and the seven-day deletion clock. SSE-C keys are not recoverable from AWS.'
