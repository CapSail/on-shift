      - c: secure-protocols
        kind: best
        diff: 1
        text: >-
          Tomás Reyes finds that Boardroom 2's video system and several Halvorsen Freight switches are managed over
          Telnet, so admin usernames and passwords cross the network in clear text.
        ask: 'Which protocol is the BEST replacement for remote administration?'
        o:
          - 'SNMPv1'
          - 'HTTP'
          - 'SSH'
          - 'FTP'
        a: 2
        r:
          - 'SNMPv1 sends its community strings in clear text. Same problem, different protocol.'
          - 'Plain HTTP shows the admin password to anyone listening, just in a nicer font.'
          - 'SSH encrypts the whole session, credentials included. Telnet is switched off across the floor.'
          - 'FTP moves files, with passwords in clear text. Not an admin console at all.'
        why: >-
          SSH encrypts the whole session, including credentials, and authenticates the server, replacing Telnet for
          remote administration (TCP port 22). FTP, HTTP and SNMPv1 all send credentials in clear text.
        src: 'RFC 4251 (The Secure Shell (SSH) Protocol Architecture); ISC2 OSG ch. 11'

      - c: net-observability
        kind: best
        text: >-
          The mystery is solved: Boardroom 2's video system was sending recordings to an unknown overseas server at
          night. Kim Osei notes that Halvorsen Freight's firewalls inspect inbound traffic carefully but let almost
          anything out.
        ask: 'Which control would BEST have stopped the recordings leaving?'
        o:
          - 'Stricter ingress filtering on inbound traffic'
          - 'Egress filtering that allows only approved destinations'
          - 'A faster internet link to make uploads noticeable'
          - 'Turning off firewall logging to save space'
        a: 1
        r:
          - 'The recordings left through a connection the box itself opened outward. Inbound rules never saw them.'
          - 'Meeting-room gear may now reach only its vendor''s update service. The overseas server gets nothing more.'
          - 'Faster uploads are harder to notice, not easier.'
          - 'The logs were the only reason anyone found out. Keep them.'
        why: >-
          Egress filtering controls what leaves: allow only approved destinations and ports for each device class. A
          meeting-room system has no reason to talk to random overseas servers. Ingress rules alone don't stop data
          leaving through an outbound connection.
        src: 'CISSP 2027 outline 4.1 (edge networks: ingress/egress); NIST SP 800-41 Rev. 1 (egress filtering)'
    close: >-
      It wasn't Shifty. It was a meeting-room box with a default password and an overseas friend. It is patched, the
      IDF is locked, and egress is locked down. Staff apologize to Shifty. He accepts, graciously, from inside the
      wall.
