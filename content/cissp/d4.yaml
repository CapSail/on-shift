        kind: spot
        diff: 1
        text: >-
          Tracing the mystery cable, Tomás Reyes maps Halvorsen Freight's third floor: the wiring closet (IDF),
          Boardroom 2, open offices, a kitchen, a public visitor lounge, the stairwell and the elevators. The IDF
          door is propped open with a fire extinguisher, and an unknown device is plugged into its patch panel.
        ask: 'Tap the location with the MOST urgent physical security gap.'
        map:
