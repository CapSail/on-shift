- id: y73
  d: network
  src: 'Firewall · Fortinet'
  t: 'Direct SMTP to the internet'
  h: 'WS-ENG-0518 → external MX hosts'
  l: ['TCP 25 to 311 distinct external MX hosts in 6 min from a workstation', 'sessions: STARTTLS, 4 KB each, same HELO string "localhost"', 'source process (EDR): svchost-update.exe in %APPDATA%, unsigned', 'mail egress policy: only the gateways 10.2.2.10 and 10.2.2.11 may send port 25']
  v: 1
  x: T1071.003
  c: direct-smtp-egress
  k: [0, 3]
  diff: 2
  say: 'A workstation opened port 25 sessions to hundreds of external mail servers from an unsigned app data process; only gateways may send mail.'
  tell: 'Hundreds of distinct external MX hosts in six minutes from one workstation is a spam or relay bot, and the process is an unsigned binary in AppData. Egress policy says only the gateways may speak SMTP. Contain the host and check what it sent.'
- id: y74
  d: network
  src: 'Firewall · Fortinet'
  t: 'Direct SMTP to the internet'
  h: 'SRV-MAIL-03 → external MX hosts'
  l: ['TCP 25 to 311 distinct external MX hosts in 6 min from SRV-MAIL-03', 'sessions: STARTTLS, DKIM-signed mail, HELO mail03.corp.com matches PTR and SPF', 'source process (EDR): MSExchangeTransport.exe, signed Microsoft', 'source is one of the two registered mail gateways allowed to send port 25 (10.2.2.10)']
  v: 0
  x: T1071.003
  c: direct-smtp-egress
  k: [2, 3]
  diff: 2
  trap: scary
  say: 'A registered mail gateway opened port 25 sessions to many external mail servers from its Exchange transport process, with matching HELO, PTR and SPF.'
  tell: 'Same fan-out to hundreds of MX hosts, opposite source. SRV-MAIL-03 is a registered gateway, the process is the Exchange transport service, and HELO, PTR and SPF line up. Port 25 fan-out is normal outbound mail from the right host and a bot from any other.'
- id: y75
  d: network
  src: 'Firewall · Palo Alto TRAFFIC'
  t: 'Inbound RDP from internet allowed'
  h: '185.x.x.x → SRV-APP-12:3389'
  l: ['app: ms-rdp, action: allow, session 2 h 14 min, 41 MB', 'rule: "Vendor-Access-Temp" (created 9 days ago, source any, review date expired)', 'Windows 4624 type 10 on SRV-APP-12 for CORP\svc_vendor from the same IP', 'source IP is on a public credential-stuffing list; no VPN or gateway session in front']
  v: 1
  x: T1133
  c: rdp-exposure
  k: [1, 3]
  diff: 2
  say: 'A two-hour RDP session from an internet address reached an application server through a temporary any-source rule, with no VPN or gateway.'
  tell: 'RDP exposed to the internet through a temporary vendor rule that never expired, a successful type 10 logon for a service account, and a source IP on a credential-stuffing list. Someone logged in. Close the rule, kill the session, and look at what svc_vendor touched.'
- id: y76
  d: network
  src: 'Firewall · Palo Alto TRAFFIC'
  t: 'Inbound RDP from internet allowed'
  h: '34.x.x.x (ZTNA gateway) → SRV-APP-12:3389'
  l: ['app: ms-rdp, action: allow, session 48 min, 9 MB', 'rule: "ZTNA-Gateway-RDP" (source: the ZTNA provider published egress range only, reviewed quarterly)', 'Windows 4624 type 10 for CORP\vendor.jlee from the gateway IP; the gateway session shows MFA and device posture passed', 'session recorded by the gateway; vendor account enabled for this window by the access request workflow']
  v: 0
  x: T1133
  c: rdp-exposure
  k: [1, 2]
  diff: 2
  trap: scary
  say: 'An inbound RDP session came through the zero trust gateway published egress range under a reviewed rule, with MFA, posture check and session recording.'
  tell: 'Both alerts say RDP from an outside IP. The difference is the front door: here the source is the gateway''s published egress range under a rule reviewed quarterly, the gateway enforced MFA and device posture, and the session was recorded. The attack path has none of those.'
- id: y77
  d: network
  src: 'OT NDR · Modbus/TCP'
  t: 'Modbus write to PLC'
  h: '10.20.31.77 → PLC-FILTR-02 (10.60.2.14)'
  l: ['function code 16 (write multiple registers), 12 registers 40101-40112, 3 writes in 40 s', 'source 10.20.31.77 is an office workstation (VLAN 20), not in the registered engineering station list', 'PLC-FILTR-02 sets filtration pump speed; baseline writers are HMI-FILTR-01 and EWS-OT-04 only', 'values are 10x the normal setpoint range; no operator login on the HMI at that time']
  v: 1
  x: T1565.001
  c: ot-plc-write-source
  k: [1, 3]
  diff: 3
  say: 'An office workstation wrote twelve registers to a filtration PLC three times, with values ten times the baseline and no operator on the HMI.'
  tell: 'Modbus has no authentication, so the source is the control. An office VLAN host writing setpoints to a PLC whose only baseline writers are the HMI and the engineering station, at ten times the normal range with nobody logged in, is process manipulation. Escalate to OT, do not just block the IP.'
- id: y78
  d: network
  src: 'OT NDR · Modbus/TCP'
  t: 'Modbus write to PLC'
  h: '10.60.9.11 (EWS-OT-04) → PLC-FILTR-02 (10.60.2.14)'
  l: ['function code 16 (write multiple registers), 12 registers 40101-40112, 1 write', 'source EWS-OT-04 is on the registered engineering station list (VLAN 60, OT zone)', 'values within the documented setpoint range (+4% vs last write), operator login on EWS-OT-04 (badge and MFA) 2 min earlier', 'maintenance window "FILTR seasonal tuning" scheduled in the OT CMMS for today']
  v: 0
  x: T1565.001
  c: ot-plc-write-source
  k: [1, 2]
  diff: 3
  trap: scary
  say: 'A registered engineering station wrote twelve registers to a filtration PLC once, within the documented range, after an operator login with MFA.'
  tell: 'Same function code, same registers, same PLC. The writer is a registered engineering station in the OT zone, the values sit inside the documented range, an operator logged in with a badge and MFA first, and the CMMS has a maintenance window for it. Context, not the Modbus call, is the evidence.'
- id: y79
  d: network
  src: 'OT NDR · Remote access'
  t: 'Vendor session into OT DMZ'
  h: 'vendor.adm → JUMP-OT-01'
  l: ['RDP from the corporate VPN pool into JUMP-OT-01 as vendor.adm (shared vendor account, password last changed 214 days ago)', 'time: 02:40 local Sunday, outside the vendor support window (Mon-Fri 08:00-18:00)', 'from JUMP-OT-01: SMB and RDP attempts to 14 hosts in the control VLAN, 3 succeeded', 'bypassed the PAM broker: no recorded session, no check-out record']
  v: 1
  x: T1133
  c: ot-vendor-access
  k: [1, 3]
  diff: 3
  say: 'The shared vendor account reached the OT jump host at 02:40 on a Sunday, outside its window and the access broker, then probed control hosts.'
  tell: 'A vendor account with a 214-day-old shared password, used at 02:40 on a Sunday outside the support window, skipping the PAM broker, then fanning out SMB and RDP to the control VLAN with three successes. That is not maintenance, that is someone using vendor access as a bridge into OT.'
- id: y80
  d: network
  src: 'OT NDR · Remote access'
  t: 'Vendor session into OT DMZ'
  h: 'vendor.jlee → JUMP-OT-01'
  l: ['RDP from the PAM broker (10.60.250.5) into JUMP-OT-01 as vendor.jlee (named account, password vaulted and rotated after each checkout)', 'time: Tue 14:20 local, inside the vendor support window; check-out linked to work order WO-88231 in the OT CMMS', 'session recorded by the PAM broker; the supervisor approved the session start', 'from JUMP-OT-01: one RDP to EWS-OT-04 only, the host named in the work order']
  v: 0
  x: T1133
  c: ot-vendor-access
  k: [0, 3]
  diff: 3
  trap: scary
  say: 'A named vendor engineer connected through the access broker inside the support window, recorded, and touched only the engineering station named in the work order.'
  tell: 'Same jump host, same vendor firm, opposite everything else: a named account with a vaulted password, the broker as the source, inside the support window, a work order behind it, a recorded session approved by the supervisor, and one hop to the host in the work order.'
