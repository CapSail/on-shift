  l: ['cmdlet: New-MailboxExportRequest -Mailbox j.salazar -FilePath \\FS-LEGAL-01\pst-holds\j.salazar_2026Q3.pst', 'caller CORP\exch.admin2 from PAW-EXCH-01, a member of the Organization Management role group for 3 years; the Mailbox Import Export role was assigned at deployment, no role change in the last 24 h', 'destination is the legal hold share (ACL: the e-discovery group plus Exchange Trusted Subsystem, which exports require), file is a real PST, 2.1 GB', 'request came through the admin PowerShell session on the PAW, no web-facing request involved']
  v: 0
  x: T1114.002
  c: exchange-pst-export-path
  k: [0, 2]
  diff: 3
  trap: scary
  say: 'An Exchange admin exported a mailbox to a PST on the legal hold share from a privileged workstation, same cmdlet as earlier holds.'
