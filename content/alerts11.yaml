  v: 0
  x: T1555
  c: backup-credential-read
  k: [0, 2]
  diff: 3
  trap: scary
  say: 'The backup service read its credentials table for the nightly configuration backup, writing an encrypted file to the NAS, as on 410 nights.'
  tell: 'Reading the credentials table is also what the product does when it builds its configuration backup. Here the reader is the signed Veeam service under its own account, nothing is interactive, the output is an encrypted .bco on the NAS, and there are 410 nights of history. A script with sqlcmd and an unprotect call is the theft.'
