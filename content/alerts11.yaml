# ON SHIFT alerts, drop 3, part 1: Windows endpoint and AD intrusion tradecraft vs the admin operations that look the same (y101-y120)
- id: y101
  d: endpoint
  src: 'Sysmon · Event ID 7'
  t: 'Print spooler loaded driver module'
  h: 'SRV-DC-02 · NT AUTHORITY\SYSTEM'
  l: ['image load: spoolsv.exe (SYSTEM) loaded C:\Windows\System32\spool\drivers\x64\3\New\mscfg.dll, unsigned, hash first seen in the environment today', 'file written 40 s earlier over the network (MS-RPRN) by CORP\j.moreau (standard user) from 10.20.4.77', 'Print Spooler service is running on this domain controller; no printers are published from it', 'next: spoolsv.exe spawned cmd.exe as SYSTEM, which ran whoami /all and net localgroup administrators']
  v: 1
  x: T1068
  c: spooler-driver-load
  k: [0, 1, 2]
  diff: 3
  say: 'The print spooler on a domain controller loaded a new unsigned driver library that a standard user had copied over the network seconds earlier.'
  tell: 'PrintNightmare in one log: a standard user pushes an unsigned DLL into the spooler driver folder over MS-RPRN, and spoolsv.exe, running as SYSTEM, loads it. The spooler should not even be running on a domain controller, and it spawned cmd.exe as SYSTEM straight away. Disable the spooler on DCs and rebuild what it touched.'
  q: {kind: contain, ask: 'First containment step?', o: ['Stop and disable the spooler on the DC, isolate the source workstation, then hunt for what the SYSTEM shell did', 'Delete the DLL and close the alert', 'Reinstall the printer driver from the vendor'], a: 0, why: 'Deleting the file leaves the SYSTEM session and the exposed spooler. Fix both, then scope what ran next.'}
- id: y102
  d: endpoint
  src: 'Sysmon · Event ID 7'
  t: 'Print spooler loaded driver module'
  h: 'SRV-PRINT-01 · NT AUTHORITY\SYSTEM'
  l: ['image load: spoolsv.exe (SYSTEM) loaded C:\Windows\System32\spool\drivers\x64\3\unidrv.dll and a vendor driver DLL, both signed (Microsoft Windows Hardware Compatibility Publisher)', 'driver package added with pnputil by CORP\printadm from PAW-IT-01 an hour earlier and staged in the DriverStore from the approved vendor package', 'host is the dedicated print server; Point and Print is limited to approved servers, and the spooler is expected here', 'no child processes from spoolsv.exe; 6 queues now use the driver']
  v: 0
  x: T1068
  c: spooler-driver-load
  k: [0, 1]
  diff: 2
  trap: scary
  say: 'The print server spooler loaded a vendor driver library after a print admin staged the package from a privileged workstation. No child processes started.'
  tell: 'A spooler loading driver DLLs is its job, and the print server does it every time someone adds a driver. Signed by the hardware compatibility publisher, staged with pnputil by the print admin from a PAW, and no child process from spoolsv.exe. An unsigned DLL pushed by a standard user onto a domain controller is the other one.'
- id: y103
  d: identity
  src: 'NDR · MS-NRPC (Netlogon)'
  t: 'Netlogon secure channel anomaly'
  h: 'SRV-DC-01 · CORP\SRV-DC-01$'
  l: ['rpc: NetrServerAuthenticate3 to SRV-DC-01 from 10.20.4.77 (WS-DEV-0331, a developer workstation) claiming to be SRV-DC-01$; 312 attempts in 6 s, client credential all zero bytes', 'SRV-DC-01 Security: 4742 computer account SRV-DC-01$ changed, subject ANONYMOUS LOGON, password last set updated outside the 30-day cycle', 'next 2 min: directory replication (DRS GetNCChanges) for the whole domain from 10.20.4.77, authenticated as SRV-DC-01$']
  v: 1
  x: T1210
  c: netlogon-secure-channel
  k: [0, 1]
  diff: 3
  say: 'Hundreds of Netlogon authentication attempts hit a domain controller in six seconds from a developer workstation, then the controller''s machine account password changed.'
  tell: 'Zerologon, as the wire sees it: hundreds of Netlogon authentications in seconds with an all-zero credential, because the flaw gives roughly a 1 in 256 chance per try. Then the DC''s own machine account password changes under ANONYMOUS LOGON, which no normal password change does, and the same workstation replicates the whole domain. Assume the domain is gone.'
  q: {kind: contain, ask: 'First move?', o: ['Isolate the source, restore the DC account password, and plan a double krbtgt reset', 'Patch the DC in the next maintenance window', 'Disable the developer''s user account only'], a: 0, why: 'The empty DC password and the replication already happened. Cut the source, repair the DC account, then assume every secret in the domain is exposed.'}
- id: y104
  d: identity
  src: 'NDR · MS-NRPC (Netlogon)'
  t: 'Netlogon secure channel anomaly'
  h: 'SRV-DC-01 · CORP\SRV-DC-01$'
  l: ['SRV-DC-01 System log: Netlogon allowed a vulnerable secure channel connection from machine account NAS-ARC-01$ under the exception policy (event 5830); 3 such events this week, one per session', 'client NAS-ARC-01 (10.20.9.14) is a registered file appliance running Samba whose vendor firmware fix is scheduled; its account is listed in the Netlogon exception policy', 'no 4742 for any domain controller account, no replication requests and no burst of authentication attempts from 10.20.9.14']
  v: 0
  x: T1210
  c: netlogon-secure-channel
  k: [1, 2]
  diff: 3
  trap: scary
  say: 'Netlogon allowed a vulnerable secure channel session from a registered file appliance named in the exception policy, once, with no other activity from that address.'
  tell: 'The Netlogon hardening events caught old appliances for years after the patch. This is one session from a registered Samba appliance that is named in the exception policy, while nothing resets a DC password and nothing replicates. The attack version is hundreds of tries in seconds and a password change.'
- id: y105
  d: identity
  src: 'Windows Security · 4742'
  t: 'Computer account name changed'
  h: 'SRV-DC-01 · CORP\r.baptiste'
  l: ['event 4741 earlier: computer account WS-TMP01$ created by CORP\r.baptiste (standard user, using the default MachineAccountQuota of 10) from 10.20.6.31', 'event 4742: sAMAccountName of WS-TMP01$ changed to SRV-DC-01 (no trailing $) by the same user; SPNs cleared first', 'event 4768: Kerberos TGT requested for account SRV-DC-01 from 10.20.6.31, then sAMAccountName changed back to WS-TMP01$', 'event 4769: service ticket for cifs/SRV-DC-01.corp.com requested as administrator from the same source']
  v: 1
  x: T1068
  c: samaccountname-rename
  k: [1, 2]
  diff: 3
  say: 'A user created a computer account, renamed it to the domain controller''s name without the dollar sign, requested a Kerberos ticket, and renamed it back.'
  tell: 'A standard user made a machine account, renamed it to the DC name without the dollar sign, asked for a TGT under that name, then renamed it back so the KDC resolves the follow-up ticket to the real DC account. That is noPac, two 2021 name-handling flaws chained. Quota abuse alone is noise, the rename is the exploit.'
- id: y106
  d: identity
  src: 'Windows Security · 4742'
  t: 'Computer account name changed'
  h: 'SRV-DC-01 · CORP\svc_osd_join'
  l: ['event 4742: sAMAccountName of the computer object changed from DESKTOP-8F3K2L$ to WS-FIN-0455$ (trailing $ kept, new name unused by any other object)', 'subject CORP\svc_osd_join, the deployment-share domain-join account with delegated create and rename rights on OU Workstations-Staging only', 'source MDT-01 during task sequence "Win11 refresh"; object sits in the staging OU; 38 devices renamed this week the same way', 'no TGT or service-ticket request under the old name or any DC name, no 4741 by a user account']
  v: 0
  x: T1068
  c: samaccountname-rename
  k: [0, 3]
  diff: 3
  trap: scary
  say: 'The domain-join service account renamed a new computer object during imaging, keeping the dollar sign, in the staging container, like 38 other devices this week.'
  tell: 'Renames are normal during imaging: the device arrives as DESKTOP-something and receives its asset name. What matters is the kept dollar sign, a name no other object uses, no Kerberos requests under the old name, and a delegated join account working only in the staging OU. A rename to a DC name is noPac.'
- id: y107
  d: email
  src: 'Exchange · Admin audit log'
  t: 'Mailbox export request'
  h: 'SRV-EXCH-02 · CORP\administrator'
  l: ['cmdlet: New-MailboxExportRequest -Mailbox administrator -FilePath \\localhost\c$\inetpub\wwwroot\aspnet_client\sys.aspx', 'a New-ManagementRoleAssignment for "Mailbox Import Export" ran 2 min earlier; the IIS log shows /autodiscover/autodiscover.json with an @ in the query from 45.x.x.x just before', 'new file C:\inetpub\wwwroot\aspnet_client\sys.aspx, 41 KB, PST framing around ASP.NET script markers', 'GET /aspnet_client/sys.aspx from 45.x.x.x returned 200 fifteen seconds later']
  v: 1
  x: T1505.003
  c: exchange-pst-export-path
  k: [0, 1, 2]
  diff: 3
  say: 'An Exchange mailbox export request wrote its output into the web root instead of a file share, minutes after a management role assignment.'
  tell: 'ProxyShell leaves this signature: a Mailbox Import Export role assignment minutes earlier, then an export request whose destination is the web root instead of a share, which produces an .aspx file that is a webshell wrapped in PST framing. The follow-up GET returning 200 means it is live. Check every Exchange server for similar files.'
  q: {kind: pivot, ask: 'First pivot?', o: ['Hunt every Exchange server for new .aspx files under aspnet_client and the OWA auth folder, and check patch level', 'Delete sys.aspx and move on', 'Reset the administrator password'], a: 0, why: 'The same chain can drop several shells on several servers. Find them all and close the hole before cleaning one file.'}
