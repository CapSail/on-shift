  l: ['parent: java.exe -jar agent.jar (Jenkins agent service, WinSW wrapper jenkins-agent.exe) on the build agent', 'cmd: powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\jenkins\workspace\billing-api\build\package.ps1', 'children: msbuild.exe and signtool.exe from the workspace; downloads only from the internal artifact repository nexus.corp.com', 'log4j-core 2.17.1 on disk; no JNDI strings in request headers and no outbound LDAP from this host in 30 days']
