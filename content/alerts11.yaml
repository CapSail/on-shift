- id: y111
  d: endpoint
  src: 'Defender for Endpoint · DeviceProcessEvents'
  t: 'Backup database credentials query'
  h: 'SRV-VBR-01 · CORP\a.lindgren'
  l: ['cmd: powershell.exe → sqlcmd.exe -S localhost\VEEAMSQL2016 -E -Q "SELECT user_name,password FROM [VeeamBackup].[dbo].[Credentials]", parent explorer.exe in an RDP session from WS-IT-0210', 'the script then calls ProtectedData.Unprotect (DPAPI, machine scope) on every returned password value; the Veeam services are not involved', 'CORP\a.lindgren is a domain admin, first logon to this backup server in 200 days', 'output: 14 rows including 6 domain service accounts and the hypervisor admin, written to C:\Windows\Temp\v.txt']
  v: 1
  x: T1555
  c: backup-credential-read
  k: [0, 1, 2]
  diff: 3
  trap: bland
  say: 'A domain admin read the Veeam credentials table with sqlcmd and ran a script to decrypt the values into a temp file.'
  tell: 'It looks like a DBA query until you read the table: dbo.Credentials in the VeeamBackup database holds every stored login, and the DPAPI unprotect on the same host turns them into plaintext. Ransomware crews use the backup server as a password vault, and a 2023 unauthenticated Veeam flaw gave the same loot with no logon at all. A first logon in 200 days and a temp file seal it.'
  q: {kind: contain, ask: 'Best containment?', o: ['Rotate every credential stored in Veeam, starting with domain and hypervisor admins, and isolate the backup server', 'Rotate only a.lindgren''s password', 'Delete v.txt and re-run the backup job'], a: 0, why: 'Every stored login in that table is now exposed, not one account. Rotate them all and cut the host off.'}
