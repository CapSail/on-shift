# ON SHIFT alerts, drop 3, part 4: Linux, macOS, containers, CI/CD and supply chain real-world cases + benign twins (y161-y180)
- id: y161
  d: linux
  src: 'Linux · auditd + osquery'
  t: 'sshd loads liblzma'
  h: 'jump-prod-04 · sshd'
  l: ['osquery process_open_files: sshd (pid 2214, parent systemd) maps /lib/x86_64-linux-gnu/liblzma.so.5.6.1 through libsystemd.so.0', 'package: xz-utils 5.6.1-1 from the unstable component, installed 9 days ago by apt on a host in the stable fleet group', 'ssh auth: median CPU per handshake 480 ms, baseline 90 ms; 40 logins an hour from the admin VPN pool, no failed-password burst']
  v: 1
  x: T1195.002
  c: sshd-liblzma-load
  k: [1, 2]
  diff: 3
  trap: bland
  say: 'The jump host sshd maps liblzma 5.6.1 from the unstable component, and handshake CPU rose from 90 to 480 milliseconds.'
  tell: 'The sshd to liblzma link exists only because Debian patches OpenSSH to use libsystemd, which is exactly the path the xz backdoor rode in 2024. Version 5.6.1 from unstable on a stable-fleet host, plus handshake CPU up fivefold with no brute-force load to explain it, is the latency tell that exposed it. Isolate, downgrade, compare hashes.'
  q:
    kind: contain
    ask: First action?
    o: ['Pull the host from the fleet and verify sshd and liblzma against package hashes', 'Raise the sshd rate limit and close the alert', 'Restart sshd to clear the load']
    a: 0
    why: 'A backdoored library sits in every login path, so isolate and verify binaries before anyone else authenticates.'
- id: y162
  d: linux
  src: 'Linux · auditd + osquery'
  t: 'sshd loads liblzma'
  h: 'jump-prod-07 · sshd'
  l: ['osquery process_open_files: sshd (pid 1980, parent systemd) maps /lib/x86_64-linux-gnu/liblzma.so.5.4.1 through libsystemd.so.0', 'package: xz-utils 5.4.1 from the Debian 12 stable repo, unchanged since the image build 61 days ago; the host passes the fleet hash check', 'ssh auth: median CPU per handshake 85 ms (baseline 90 ms); the load alert comes from 3,100 failed password attempts a minute from 185.x.x.x']
  v: 0
  x: T1195.002
  c: sshd-liblzma-load
  k: [1, 2]
  diff: 3
  trap: scary
  say: 'The jump host sshd maps liblzma 5.4.1 from the stable repo, and CPU rose during 3,100 failed password attempts a minute from one address.'
  tell: 'Every Debian and Ubuntu sshd pulls liblzma in through libsystemd, so the mapping alone means nothing. Here it is the old 5.4 series from the stable repo, hashes match the fleet, per-handshake cost sits at baseline, and the CPU is a scanner hammering passwords.'
- id: y163
  d: linux
  src: 'Linux · EDR + egress proxy'
  t: 'npm install hook makes outbound request'
  h: 'build-agent-09 · svc-build'
  l: ['process: node node_modules/pkgfmt/lib/setup.js (npm lifecycle postinstall of pkgfmt@3.2.8), parent npm ci in the web-portal workspace', 'package: pkgfmt 3.2.8 published 2 h 10 min ago by a maintainer added 3 days ago; versions 3.2.0 to 3.2.7 had no install script', 'file reads by the hook: ~/.npmrc, ~/.aws/credentials, ~/.config/gh/hosts.yml and the full environment', 'egress: HTTPS POST of 41 KB to webhook.site, not on the build proxy allowlist; npm ci then exited 0']
  v: 1
  x: T1195.002
  c: npm-postinstall-egress
  k: [1, 2]
  diff: 3
  trap: bland
  say: 'A dependency published two hours ago ran an install hook that read npm and cloud credential files and posted to a public webhook receiver.'
  tell: 'A patch release two hours old, from a maintainer added three days ago, suddenly has an install script that reads npmrc, cloud credentials and the whole environment before posting to a webhook site. Same shape as the ua-parser-js hijack and the credential-stealing npm worm campaigns (Shai-Hulud). Rotate every token that agent held.'
  q:
    kind: contain
    ask: First action?
    o: ['Isolate the agent, rotate the npm, AWS and GitHub tokens it held, pin the dependency back', 'Delete node_modules and rebuild', 'Block webhook.site at the proxy and move on']
    a: 0
    why: 'The hook already read the credentials, so the tokens are burned; a proxy block does not undo that.'
- id: y164
  d: linux
  src: 'Linux · EDR + egress proxy'
  t: 'npm install hook makes outbound request'
  h: 'build-agent-12 · svc-build'
  l: ['process: node index.js --exec install (npm lifecycle postinstall of cypress@13.13.0), parent npm ci in the web-portal workspace', 'package: cypress 13.13.0 in package-lock since a PR merged 7 weeks ago; registry integrity hash matches the lockfile, maintainers unchanged', 'file reads by the hook: its own cache directory ~/.cache/Cypress only; environment read: CYPRESS_INSTALL_BINARY and HTTP_PROXY', 'egress: HTTPS GET of 214 MB from download.cypress.io through the build proxy (allowlisted), checksum verified; npm ci then exited 0']
  v: 0
  x: T1195.002
  c: npm-postinstall-egress
  k: [1, 2]
  diff: 3
  trap: scary
  say: 'A pinned test-runner dependency ran its install hook, read only its cache directory and downloaded a 214 megabyte binary through the build proxy.'
  tell: 'Install scripts look scary on paper, but plenty of real packages use them to fetch a native binary: cypress, puppeteer, prisma engines. This one has been pinned in the lockfile for seven weeks, the integrity hash matches, it reads only its own cache and downloads from its vendor through the allowlisted proxy.'
  q:
    kind: tune
    ask: Best tuning?
    o: ['Alert on hooks from packages new to the lockfile or reading credential files, not every hook', 'Block all npm install scripts org-wide', 'Exclude the build agents from the rule']
    a: 0
    why: 'Keep the signal that separates a stealer from a binary fetch: new version provenance and credential reads.'
