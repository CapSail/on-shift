  l: ['process: node-pre-gyp install --fallback-to-build (npm lifecycle install of bcrypt@5.1.1), then node-gyp rebuild with gcc and make children, parent npm ci', 'package: bcrypt 5.1.1 served by the internal Artifactory mirror, unchanged in the lockfile for 4 months, integrity matches', 'egress: HTTPS GET to nodejs.org for node headers through the build proxy (allowlisted); no other outbound connections', 'file activity: writes build/Release/bcrypt_lib.node inside the workspace only; no reads outside node_modules and the workspace']
  v: 0
  x: T1195.002
