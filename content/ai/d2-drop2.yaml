      - 'The process must be fully predictable and repeatable'
      - 'The steps are fixed and rarely change'
    a: [0, 1]
    why: 'Agents shine when the path is unknown in advance and tools must be chosen on the fly. Fixed, auditable, repeatable steps favor a deterministic workflow.'

