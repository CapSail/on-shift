    kind: mcq
    diff: 2
    q: 'An agent must call a third-party calendar API on behalf of each signed-in user, using that user''s OAuth access. Which AgentCore capability handles this?'
    o:
      - 'AgentCore Identity'
      - 'AgentCore Memory'
      - 'AgentCore Observability'
      - 'AgentCore Code Interpreter'
    a: 0
    why: 'AgentCore Identity manages how agents authenticate and obtain credentials, such as OAuth tokens, to reach tools and services for a user. The others store context, trace steps or run code.'

  - id: d2-299
    c: aws-agent-stack
    kind: mcq
    diff: 3
    q: 'A bank needs rules that block an agent from calling a payments tool above a set amount, enforced outside the agent''s own code. Which capability fits BEST?'
    o:
      - 'Policy in Amazon Bedrock AgentCore'
      - 'Amazon Bedrock Guardrails'
      - 'Amazon Bedrock AgentCore Memory'
      - 'A stricter system prompt for the agent'
    a: 0
    why: 'Policy in AgentCore checks agent tool calls against defined rules before they run. Guardrails filters harmful content, and a system prompt is guidance the model can still ignore.'

  - id: d2-300
    c: aws-agent-stack
    kind: mcq
    diff: 2
    q: 'Operators need to trace each step an agent took, including tool calls and latency, to debug a bad answer. Which AgentCore capability fits?'
    o:
      - 'AgentCore Observability'
      - 'AgentCore Identity'
      - 'AgentCore Code Interpreter'
      - 'AgentCore Memory'
    a: 0
    why: 'AgentCore Observability provides traces, metrics and dashboards for agent runs, integrated with Amazon CloudWatch. Code Interpreter runs code, Identity handles credentials, Memory stores context.'

  - id: d2-301
    c: aws-agent-stack
    kind: mcq
    diff: 3
    q: 'A team using Kiro wants related unit tests updated automatically each time the agent saves a change to a source file. Which Kiro feature fits?'
    o:
      - 'Agent hooks'
      - 'Steering files'
      - 'Spec requirements'
      - 'Prompt Management'
    a: 0
    why: 'Kiro agent hooks run actions automatically on events such as a file being saved or a tool being used. Steering files give the agent standing project guidance, and specs plan features.'

  - id: d2-302
    c: aws-agent-stack
    kind: multi
    diff: 2
    q: 'A company moves a prototype agent to production on Amazon Bedrock AgentCore. It needs secure hosting and tool access to internal APIs. Which capabilities fit? (Choose TWO.)'
    o:
      - 'AgentCore Runtime'
      - 'AgentCore Gateway'
      - 'Amazon Polly'
      - 'Amazon Quick'
      - 'Amazon SageMaker JumpStart'
    a: [0, 1]
    why: 'Runtime hosts the agent in isolated sessions, and Gateway turns internal APIs into tools the agent can call. The others turn text into speech, serve business users or host models.'

  - id: d2-303
    c: aws-agent-stack
    kind: tf
    diff: 2
    s: 'AgentCore Code Interpreter lets agents run code in an isolated sandbox environment.'
    v: true
    why: 'Code Interpreter gives agents a secure sandbox to execute code, for example for calculations or data analysis, without running it on your own servers.'

  - id: d2-304
    c: aws-agent-stack
    kind: hallu
    diff: 2
    s:
      - 'AgentCore Browser lets agents interact with websites in a managed browser.'
      - 'AgentCore Runtime hosts agents in isolated sessions.'
      - 'Kiro can connect to MCP servers for extra tools.'
      - 'Strands Agents is a paid, closed-source AWS service.'
    bad: 3
    o:
      - 'Strands Agents is a free, open-source SDK.'
      - 'Strands Agents is a GPU instance type for training.'
      - 'Strands Agents is the billing unit for AgentCore.'
    a: 0
    why: 'Strands Agents is open source, so anyone can use and extend it, and agents built with it can run anywhere, including on AgentCore Runtime.'

  # aws-genai-advantages
  - id: d2-305
    c: aws-genai-advantages
    kind: mcq
    diff: 2
    q: 'A hospital wants its application traffic to Amazon Bedrock to stay off the public internet. Which AWS feature fits?'
    o:
      - 'AWS PrivateLink VPC endpoints'
      - 'Amazon CloudFront edge locations'
      - 'AWS Key Management Service'
      - 'Amazon Macie'
    a: 0
    why: 'PrivateLink interface endpoints keep traffic between your VPC and Bedrock on the AWS network. CloudFront is a CDN, KMS manages keys, and Macie finds sensitive data in S3.'

  - id: d2-306
    c: aws-genai-advantages
    kind: mcq
    diff: 1
    pre: true
    q: 'A company wants to control the encryption keys that protect its custom model data in Amazon Bedrock. Which service fits?'
    o:
      - 'AWS KMS'
      - 'AWS PrivateLink'
      - 'Amazon Inspector'
      - 'AWS Trusted Advisor'
    a: 0
    why: 'AWS KMS lets you create and control customer managed keys that Bedrock uses to encrypt resources such as custom models. Inspector scans for vulnerabilities and Trusted Advisor gives best-practice checks.'

  - id: d2-307
    c: aws-genai-advantages
    kind: mcq
    diff: 3
    q: 'A European company must keep its Amazon Bedrock inference processing inside the EU. What should it do?'
    o:
      - 'Use an EU Region and EU-scoped inference profiles'
      - 'Use any Region, because AWS moves data to the EU'
      - 'Use a global cross-Region profile for all traffic'
      - 'Turn off encryption to make audits simpler'
    a: 0
    why: 'Choosing EU Regions, and EU geographic cross-Region inference profiles if needed, keeps processing in the EU. A global profile can route anywhere, and AWS does not relocate data for you.'

  - id: d2-308
    c: aws-genai-advantages
    kind: mcq
    diff: 1
    q: 'An auditor wants a record of who called Amazon Bedrock APIs and when. Which AWS service provides this?'
    o:
      - 'AWS CloudTrail'
      - 'Amazon Nova'
      - 'Amazon SageMaker JumpStart'
      - 'Amazon Polly'
    a: 0
    why: 'CloudTrail records API activity across AWS, including Bedrock calls, for auditing. Nova is a model family, JumpStart a model hub, and Polly turns text into speech.'

  - id: d2-309
    c: aws-genai-advantages
    kind: mcq
    diff: 2
    q: 'A company uses three different FMs in Amazon Bedrock and wants one consistent set of content safety rules for all of them, with the LEAST effort. What fits?'
    o:
      - 'Amazon Bedrock Guardrails'
      - 'Separate prompt rules for each model'
      - 'Amazon SageMaker JumpStart'
      - 'AWS Trusted Advisor'
    a: 0
    why: 'One guardrail can be applied across different models, filtering harmful content and denied topics consistently. Hand-written rules per model drift apart and are easy to bypass.'

  - id: d2-310
    c: aws-genai-advantages
    kind: multi
    diff: 2
    q: 'Under the shared responsibility model for Amazon Bedrock, which tasks are the CUSTOMER''s? (Choose TWO.)'
    o:
      - 'Writing IAM policies for who can invoke models'
      - 'Deciding what sensitive data goes into prompts'
      - 'Patching the servers that host the models'
      - 'Securing the AWS data center buildings'
      - 'Maintaining network hardware in each Region'
    a: [0, 1]
    why: 'AWS secures the cloud itself: servers, buildings and network. Customers secure what they put in it: access policies and the data they send.'

  - id: d2-311
    c: aws-genai-advantages
    kind: tf
    diff: 3
    s: 'When you fine-tune a model in Amazon Bedrock, you get a private copy, and your training data is not used to improve the base model.'
    v: true
    why: 'Bedrock customization creates a private model copy for your account. Your data is not used to train the provider''s base model or shared with other customers.'

  - id: d2-312
    c: aws-genai-advantages
    kind: hallu
    diff: 2
    s:
      - 'AWS CloudTrail can record Amazon Bedrock API calls.'
      - 'Customer managed AWS KMS keys can encrypt custom models.'
      - 'AWS PrivateLink keeps Bedrock traffic on the AWS network.'
      - 'Every Bedrock model is available in every AWS Region.'
    bad: 3
    o:
      - 'Model availability varies by Region; check before you design.'
      - 'Bedrock runs in only one Region worldwide.'
      - 'Regions only matter for Provisioned Throughput.'
    a: 0
    why: 'Bedrock and individual models roll out Region by Region. Availability affects latency, residency and cost, so check the model list for your Region early.'

  # provisioned-throughput-costs
  - id: d2-313
    c: provisioned-throughput-costs
    kind: mcq
    diff: 1
    pre: true
    q: 'A team needs to summarize 2 million archived documents for a one-time project. Results can take a day. Which Amazon Bedrock option is MOST cost-effective?'
    o:
      - 'Batch inference'
      - 'A 6-month Provisioned Throughput term'
      - 'On-demand real-time calls'
      - 'Streaming responses from a larger model'
    a: 0
    why: 'Batch inference processes a big file of prompts asynchronously at a lower price than on-demand for supported models. A 6-month commitment is wasteful for a one-time job.'

  - id: d2-314
    c: provisioned-throughput-costs
    kind: mcq
    diff: 2
    q: 'When a company buys Provisioned Throughput in Amazon Bedrock, what does it purchase?'
    o:
      - 'Model units of dedicated throughput'
      - 'A prepaid bundle of output tokens'
      - 'Dedicated EC2 instances to manage'
      - 'Spot capacity at variable prices'
    a: 0
    why: 'Provisioned Throughput is bought in model units, each giving a set throughput, billed hourly. AWS still runs the infrastructure; it is not prepaid tokens or EC2 instances.'

  - id: d2-315
    c: provisioned-throughput-costs
    kind: order
    diff: 2
    q: 'A team fine-tunes a model in Amazon Bedrock and serves it with Provisioned Throughput. Put the steps in order.'
    steps:
      - 'Prepare the training data and upload it to Amazon S3'
      - 'Create a model customization job'
      - 'Purchase Provisioned Throughput for the custom model'
      - 'Invoke the custom model from the application'
    why: 'Training data must exist before the job runs, and the custom model must exist before capacity can be bought for it. Only then can the app send requests.'

  - id: d2-316
    c: provisioned-throughput-costs
    kind: mcq
    diff: 3
    q: 'During traffic spikes, an on-demand Amazon Bedrock app is throttled in its home Region. The team wants more throughput with the least management effort. What should it use?'
    o:
      - 'Cross-Region inference profiles'
      - 'Batch inference for the live chats'
      - 'A larger maximum output token value'
      - 'SageMaker JumpStart in one Region'
    a: 0
    why: 'Cross-Region inference automatically routes requests across Regions in a geography to absorb bursts. Batch is too slow for live chat, and more output tokens make throttling worse.'

  - id: d2-317
    c: provisioned-throughput-costs
    kind: mcq
    diff: 2
    q: 'Which costs are added by fine-tuning a model in Amazon Bedrock, compared with using the base model as-is?'
    o:
      - 'Training and monthly model storage fees'
      - 'A per-character fee on every prompt sent'
      - 'A license fee for each IAM user'
      - 'Extra charges on every embedding call'
    a: 0
    why: 'Customization bills for the training job and a monthly fee to store the custom model, on top of inference. That is why prompting and RAG are usually tried before fine-tuning.'

  - id: d2-318
    c: provisioned-throughput-costs
    kind: multi
    diff: 3
    q: 'A company has a chatbot with steady, heavy, predictable traffic and a weekly report job that can wait hours. Which Amazon Bedrock pricing choices fit? (Choose TWO.)'
    o:
      - 'Provisioned Throughput for the chatbot'
      - 'Batch inference for the weekly reports'
      - 'Provisioned Throughput for the weekly reports'
      - 'Batch inference for the live chatbot'
      - 'Spot pricing for both workloads'
    a: [0, 1]
    why: 'Steady heavy traffic keeps reserved capacity busy, and batch suits delay-tolerant bulk work. Reserving capacity for a weekly job wastes idle hours, batch is too slow for live chat, and Bedrock has no Spot pricing.'

  - id: d2-319
    c: provisioned-throughput-costs
    kind: tf
    diff: 2
    s: 'Provisioned Throughput is always cheaper than on-demand, so every production app should use it.'
    v: false
    why: 'Provisioned Throughput bills every hour, busy or idle. It pays off only when traffic is high and steady enough to keep the capacity in use.'

  - id: d2-320
    c: provisioned-throughput-costs
    kind: tf
    diff: 3
    s: 'On-demand Amazon Bedrock has no throughput limits, so high-volume apps are never throttled.'
    v: false
    why: 'On-demand use is subject to service quotas, such as tokens and requests per minute. Heavy apps can be throttled; cross-Region inference, quota increases or Provisioned Throughput help.'

