# SHIFTY-1 content drop 2: Domain 2, Fundamentals of GenAI. Extra cards and facts for existing concepts.
# Ids are stable forever. Append; never renumber. Cards d2-201+, facts f2-001+.

cards:
  # tokens-and-pricing
  - id: d2-201
    c: tokens-and-pricing
    kind: mcq
    diff: 1
    pre: true
    q: 'A developer is estimating usage for an Amazon Bedrock app. Roughly how many tokens is a 750-word English passage?'
    o:
      - 'About 100 tokens'
      - 'About 1,000 tokens'
      - 'About 7,500 tokens'
      - 'About 75,000 tokens'
    a: 1
    why: 'A token is about three quarters of an English word, so 750 words is roughly 1,000 tokens. Exact counts vary by tokenizer, but the rule of thumb is good enough for cost estimates.'

  - id: d2-202
    c: tokens-and-pricing
    kind: mcq
    diff: 2
    q: 'A travel company''s Amazon Bedrock assistant gives complete answers, but users wait several seconds for long responses. Which change MOST directly reduces response time?'
    o:
      - 'Request concise answers with a lower output cap'
      - 'Switch the app from on-demand to batch inference'
      - 'Add more worked examples to every prompt'
      - 'Raise the temperature for faster sampling'
    a: 0
    why: 'Models generate output one token at a time, so shorter answers finish sooner. Batch inference is asynchronous and slower to return, extra examples add input tokens, and temperature changes randomness, not speed.'

  - id: d2-203
    c: tokens-and-pricing
    kind: mcq
    diff: 2
    q: 'A news site sends 10,000 requests a day to an on-demand Amazon Bedrock model. Each has 2,000 input tokens and 500 output tokens. What determines the daily bill?'
    o:
      - 'Input and output token counts times their prices'
      - 'The number of hours the model endpoint was running'
      - 'Only the 10,000 requests, at a flat price per call'
      - 'Only output tokens, because input tokens are free'
    a: 0
    why: 'On-demand Bedrock bills per token, with separate input and output prices per model. Hourly billing is Provisioned Throughput, and there is no flat per-call price or free input tier.'

  - id: d2-204
    c: tokens-and-pricing
    kind: mcq
    diff: 3
    q: 'A company runs the same chatbot in English and several other languages on one model. Per message, some non-English versions cost noticeably more. What is the MOST likely reason?'
    o:
      - 'Some languages need more tokens for the same meaning'
      - 'Non-English traffic is billed at a premium Region rate'
      - 'The model raises its temperature for other languages'
      - 'Translation always requires Provisioned Throughput'
    a: 0
    why: 'Tokenizers are often trained mostly on English text, so many other languages split into more tokens for the same content. More tokens per message means more cost and latency.'

  - id: d2-205
    c: tokens-and-pricing
    kind: multi
    diff: 2
    q: 'A team wants to lower the per-request token cost of a document Q&A app on Amazon Bedrock while keeping its quality target. Which actions help? (Choose TWO.)'
    o:
      - 'Retrieve only the most relevant chunks for each question'
      - 'Paste the full document set into every prompt'
      - 'Use a smaller model if it still meets the quality target'
      - 'Ask the model to explain its reasoning at length'
      - 'Repeat the instructions twice for emphasis'
    a: [0, 2]
    why: 'Focused retrieval cuts input tokens, and a smaller model usually has a lower price per token. Pasting everything, long explanations and repeated instructions all add billed tokens.'

  - id: d2-206
    c: tokens-and-pricing
    kind: tf
    diff: 2
    s: 'Streaming shows the answer to the user as it is generated, but it does not reduce the number of tokens you are billed for.'
    v: true
    why: 'Streaming improves perceived latency because the first words appear sooner. The model still generates the same output tokens, so the cost is the same.'

  - id: d2-207
    c: tokens-and-pricing
    kind: hallu
    diff: 3
    s:
      - 'Different models can count the same text as different numbers of tokens.'
      - 'The context window limits how many tokens one request can handle.'
      - 'If output hits the maximum token limit, the answer can be cut off.'
      - 'Cutting my prompt in half always cuts my bill exactly in half.'
    bad: 3
    o:
      - 'Halving the prompt cuts input cost; output tokens are billed separately.'
      - 'Halving the prompt doubles the price of each output token.'
      - 'Halving the prompt makes the request free below a size limit.'
    a: 0
    why: 'The bill is input tokens plus output tokens, each at its own price. A shorter prompt only shrinks the input part; a long answer still costs the same.'

  - id: d2-208
    c: tokens-and-pricing
    kind: match
    diff: 1
    q: 'Match each change to its main effect on an on-demand Amazon Bedrock bill.'
    pairs:
      - ['A longer system prompt on every call', 'Higher input token cost']
      - ['Wordier answers', 'Higher output token cost']
      - ['Switching to a larger model', 'Higher price per token']
      - ['Moving overnight jobs to batch inference', 'Discounted price for non-urgent work']
    why: 'Prompts drive input tokens, answers drive output tokens, model choice sets the per-token price, and batch inference trades speed for a lower price on supported models.'

  # embeddings-vectors
  - id: d2-209
    c: embeddings-vectors
    kind: mcq
    diff: 1
    pre: true
    q: 'What does an embedding model return when it is given a paragraph of text?'
    o:
      - 'A shorter, rewritten summary of the paragraph'
      - 'A vector of numbers representing its meaning'
      - 'The paragraph translated into another language'
      - 'A list of the paragraph''s most common words'
    a: 1
    why: 'Embedding models output vectors, not new text. The numbers capture meaning, so similar text lands close together, which powers semantic search, clustering and recommendations.'

  - id: d2-210
    c: embeddings-vectors
    kind: mcq
    diff: 2
    q: 'A team chunks long manuals for retrieval. Answers sometimes miss facts that span the boundary between two chunks. What should the team try FIRST?'
    o:
      - 'Add some overlap between neighboring chunks'
      - 'Raise the temperature of the answering model'
      - 'Store each manual as a single large chunk'
      - 'Use Provisioned Throughput for embeddings'
    a: 0
    why: 'Overlap repeats a little text at each boundary, so a fact split across chunks still appears whole in one of them. One giant chunk buries the fact and may exceed limits; temperature is unrelated.'

  - id: d2-211
    c: embeddings-vectors
    kind: mcq
    diff: 3
    q: 'A company switches its knowledge base to a newer embedding model. What must it do with the document vectors it already stored?'
    o:
      - 'Re-embed all documents with the new model'
      - 'Keep them, since all models share one vector space'
      - 'Convert them by raising the model temperature'
      - 'Delete the source text and keep only the vectors'
    a: 0
    why: 'Each embedding model has its own vector space. Old vectors cannot be compared with new query vectors, so the documents must be re-embedded with the new model.'

  - id: d2-212
    c: embeddings-vectors
    kind: mcq
    diff: 2
    q: 'A furniture retailer wants shoppers to upload a photo and find visually similar products in its catalog. Which approach fits BEST?'
    o:
      - 'Multimodal embeddings and similarity search'
      - 'Exact keyword search across all product titles'
      - 'A diffusion model that draws new furniture pieces'
      - 'An LLM that translates every product description'
    a: 0
    why: 'Multimodal embedding models map images and text into one vector space, so a photo can find similar products. Diffusion models create new images instead of matching them.'

  - id: d2-213
    c: embeddings-vectors
    kind: multi
    diff: 2
    q: 'A software company has 500,000 past support tickets. Which tasks can text embeddings help with? (Choose TWO.)'
    o:
      - 'Grouping tickets into topics by meaning'
      - 'Generating product screenshots for the help site'
      - 'Finding past tickets similar to a new one'
      - 'Encrypting the ticket database at rest'
      - 'Counting the tokens in each ticket'
    a: [0, 2]
    why: 'Embeddings place similar tickets near each other, which enables clustering by topic and similarity search. Image generation, encryption and token counting are different tools.'

  - id: d2-214
    c: embeddings-vectors
    kind: tf
    diff: 2
    s: 'Every embedding model produces vectors with the same number of dimensions.'
    v: false
    why: 'Dimensions vary by model, and some let you choose. Amazon Titan Text Embeddings V2, for example, offers 256, 512 or 1,024 dimensions. Smaller vectors save storage; larger ones can hold more detail.'

  - id: d2-215
    c: embeddings-vectors
    kind: hallu
    diff: 2
    s:
      - 'Cosine similarity is a common way to compare two vectors.'
      - 'Semantic search can match synonyms that keyword search misses.'
      - 'A vector store usually keeps the chunk text alongside its vector.'
      - 'Embeddings are made once in pre-training and cannot be created for new documents.'
    bad: 3
    o:
      - 'New documents can be embedded any time by calling the embedding model.'
      - 'New documents can be embedded only after fine-tuning the embedding model.'
      - 'New documents can be added only by retraining the answering LLM.'
    a: 0
    why: 'An embedding model is called at any time, like any inference: send new text, get a vector back. That is how knowledge bases stay current without retraining anything.'

  - id: d2-216
    c: embeddings-vectors
    kind: duel
    diff: 2
    q: 'Policy documents are long and cover many topics. Which retrieval design is better for a policy assistant?'
    A: 'Embed each full 80-page policy as one vector and retrieve the closest policy.'
    B: 'Split policies into section-sized chunks, embed each chunk, and retrieve the closest chunks.'
    a: 1
    why: 'One vector for 80 pages blurs many topics into one point, and retrieving it floods the prompt. Section chunks match questions precisely and send only the relevant text.'

  # fm-model-types
  - id: d2-217
    c: fm-model-types
    kind: mcq
    diff: 1
    pre: true
    q: 'A marketing team wants to create original product images from text descriptions. Which type of model is designed for this?'
    o:
      - 'Diffusion model'
      - 'Embedding model'
      - 'Text classification model'
      - 'Speech recognition model'
    a: 0
    why: 'Diffusion models generate images from prompts by denoising step by step. Embedding models output vectors, classifiers assign labels, and speech recognition turns audio into text.'

  - id: d2-218
    c: fm-model-types
    kind: mcq
    diff: 1
    q: 'Which mechanism lets a transformer weigh how each token in the input relates to every other token?'
    o:
      - 'Self-attention'
      - 'Convolution filters'
      - 'Decision tree splits'
      - 'K-means clustering'
    a: 0
    why: 'Self-attention scores every token against the others, so the model can use context from anywhere in the input. It is the core idea of the transformer architecture behind LLMs.'

  - id: d2-219
    c: fm-model-types
    kind: mcq
    diff: 2
    q: 'A clinic wants an assistant that reads an uploaded chart image together with a typed question and answers in text. Which model capability matters MOST?'
    o:
      - 'Multimodal input support'
      - 'A larger text-only context window'
      - 'Diffusion-based image generation'
      - 'A lower temperature setting'
    a: 0
    why: 'The input mixes an image and text, so the model must accept more than one modality. A bigger text-only window cannot read images, and diffusion creates images rather than reading them.'

  - id: d2-220
    c: fm-model-types
    kind: mcq
    diff: 2
    q: 'A company wants a low-latency, low-cost model on Amazon Bedrock for simple text-only tasks such as classification. Which option fits?'
    o:
      - 'Amazon Nova Micro'
      - 'Amazon Rekognition'
      - 'Amazon Polly'
      - 'Amazon Nova Sonic'
    a: 0
    why: 'Nova Micro is the text-only Nova model built for low latency and cost. Rekognition analyzes images and video, Polly turns text into speech, and Sonic handles speech-to-speech conversation.'

  - id: d2-221
    c: fm-model-types
    kind: multi
    diff: 3
    q: 'Which statements about transformer-based LLMs are correct? (Choose TWO.)'
    o:
      - 'They generate output one token at a time'
      - 'They read only one word at a time with no wider context'
      - 'They use self-attention across the input'
      - 'They are a type of diffusion model'
      - 'They need fully labeled data for pre-training'
    a: [0, 2]
    why: 'LLMs attend across the whole input and generate token by token. Pre-training is self-supervised on mostly unlabeled text, and diffusion is a different family used mainly for images.'

  - id: d2-222
    c: fm-model-types
    kind: tf
    diff: 2
    s: 'LLMs are pre-trained mostly on unlabeled text by learning to predict the next token.'
    v: true
    why: 'Next-token prediction is self-supervised: the text itself supplies the answers, so no human labels are needed. That is what makes training on huge datasets practical.'

  - id: d2-223
    c: fm-model-types
    kind: hallu
    diff: 2
    s:
      - 'Amazon Polly turns text into lifelike speech.'
      - 'Amazon Rekognition analyzes images and video.'
      - 'An embedding model returns vectors, not readable text.'
      - 'A diffusion model writes essays by predicting the next word.'
    bad: 3
    o:
      - 'A diffusion model creates images by gradually removing noise.'
      - 'A diffusion model compresses text into vectors for search.'
      - 'A diffusion model turns speech into text in real time.'
    a: 0
    why: 'Next-word prediction is how LLMs write. Diffusion models start from noise and refine it into an image, which is why they lead in image generation.'

  - id: d2-224
    c: fm-model-types
    kind: duel
    diff: 1
    q: 'A legal team needs drafts of contract summaries from long text documents. Which model choice is better?'
    A: 'A text LLM with a context window large enough for the contracts.'
    B: 'A diffusion model tuned on scanned contract images.'
    a: 0
    why: 'Summarizing text is a language task, so an LLM with enough context fits. Diffusion models generate images; they do not read and condense documents.'

  # genai-use-cases
  - id: d2-225
    c: genai-use-cases
    kind: mcq
    diff: 1
    pre: true
    q: 'A call center wants agents to see a short recap of a customer''s previous calls before picking up. Which GenAI use case is this?'
    o:
      - 'Summarization'
      - 'Image generation'
      - 'Translation'
      - 'Code generation'
    a: 0
    why: 'Condensing long call transcripts into a few key points is summarization. The model generates new, shorter text that keeps what matters.'

  - id: d2-226
    c: genai-use-cases
    kind: mcq
    diff: 2
    q: 'A software company wants developers to describe features in plain English and have an AI agent plan and write the code in their editor. Which AWS offering is built for this?'
    o:
      - 'Kiro'
      - 'Amazon Polly'
      - 'Amazon Quick'
      - 'Amazon Rekognition'
    a: 0
    why: 'Kiro is an agentic IDE for code generation that works from specs. Polly turns text into speech, Quick serves business users, and Rekognition analyzes images and video.'

  - id: d2-227
    c: genai-use-cases
    kind: mcq
    diff: 2
    q: 'Which task is BEST suited to traditional ML rather than generative AI?'
    o:
      - 'Drafting personalized marketing emails'
      - 'Creating storyboard images from a script'
      - 'Summarizing long legal documents'
      - 'Scoring each card payment as fraud or not'
    a: 3
    why: 'Scoring payments as fraud or not is classification on structured data, a classic traditional ML job. The other tasks create new text or images, which is what GenAI is for.'

  - id: d2-228
    c: genai-use-cases
    kind: mcq
    diff: 3
    q: 'A telecom company wants a customer service agent that answers plan questions AND can actually change a customer''s plan. What does this need beyond text generation?'
    o:
      - 'Tool use to call the billing system API'
      - 'A higher temperature for a friendlier tone'
      - 'A diffusion model to draw plan comparisons'
      - 'A larger embedding vector dimension'
    a: 0
    why: 'Answering is text generation; changing a plan is an action. The agent needs a tool that calls the billing system, which the app runs on the model''s request.'

  - id: d2-229
    c: genai-use-cases
    kind: multi
    diff: 1
    q: 'A streaming company is listing projects for next year. Which are generative AI use cases? (Choose THREE.)'
    o:
      - 'Creating a short promo video from a script'
      - 'Producing a synthetic voiceover for a trailer'
      - 'Writing episode summaries for the website'
      - 'Storing raw footage in Amazon S3'
      - 'Counting views per episode in a dashboard'
      - 'Encrypting archived video files'
    a: [0, 1, 2]
    why: 'Video, audio and text creation are generative. Storage, counting and encryption are ordinary IT tasks that create no new content.'

  - id: d2-230
    c: genai-use-cases
    kind: tf
    diff: 2
    s: 'Code from a code generation assistant is always correct and secure, so human review is no longer needed.'
    v: false
    why: 'Generated code can contain bugs, outdated calls or security flaws, just like a hallucinated fact. Treat it as a fast first draft: review it, test it, and scan it.'

  - id: d2-231
    c: genai-use-cases
    kind: hallu
    diff: 2
    s:
      - 'GenAI can draft first versions of marketing copy.'
      - 'Recommendation engines can use embeddings to find similar items.'
      - 'Some models can generate natural-sounding speech.'
      - 'Translating with an LLM needs a separate fine-tuned model for every language pair.'
    bad: 3
    o:
      - 'Many LLMs are multilingual and can translate from a simple prompt.'
      - 'LLMs can translate only into English, never out of it.'
      - 'Translation always needs a diffusion model.'
    a: 0
    why: 'Large models are pre-trained on many languages, so a prompt like "translate this into Spanish" usually works with no extra training. Fine-tuning is an option for special domains, not a requirement.'

  - id: d2-232
    c: genai-use-cases
    kind: match
    diff: 2
    q: 'Match each AWS model or service to what it does.'
    pairs:
      - ['Amazon Rekognition', 'Analyzes images and video']
      - ['Amazon Translate', 'Converts text between languages']
      - ['Amazon Nova Sonic', 'Speech-to-speech conversation model']
      - ['Amazon Nova Micro', 'Fast, low-cost text-only model']
    why: 'Rekognition analyzes images and video, Translate converts text between languages, Sonic handles real-time speech-to-speech conversation, and Micro is the fast, low-cost text-only model.'

  # fm-lifecycle
  - id: d2-233
    c: fm-lifecycle
    kind: mcq
    diff: 1
    pre: true
    q: 'Which FM lifecycle stage adapts an already pre-trained model to a company''s specific task using a smaller dataset?'
    o:
      - 'Fine-tuning'
      - 'Pre-training'
      - 'Data selection'
      - 'Deployment'
    a: 0
    why: 'Fine-tuning starts from a pre-trained model and trains it further on task-specific data. Pre-training builds the general model, and deployment serves it.'

  - id: d2-234
    c: fm-lifecycle
    kind: mcq
    diff: 2
    q: 'A startup wants a model that assigns medical billing codes. What is the BEST first step in the FM lifecycle?'
    o:
      - 'Select the data and a suitable base model'
      - 'Deploy a model to a production endpoint'
      - 'Collect user feedback on live answers'
      - 'Fine-tune on whatever data is at hand'
    a: 0
    why: 'The lifecycle starts with choosing data and a model. You cannot fine-tune well without the right data, and deployment and feedback come after evaluation.'

  - id: d2-235
    c: fm-lifecycle
    kind: mcq
    diff: 1
    q: 'Before launch, a bank tests its fine-tuned FM on realistic customer questions to confirm it meets accuracy and tone targets. Which lifecycle stage is this?'
    o:
      - 'Evaluation'
      - 'Pre-training'
      - 'Feedback'
      - 'Data selection'
    a: 0
    why: 'Evaluation checks the model against benchmarks and business requirements before users see it. Feedback comes from real users after deployment.'

  - id: d2-236
    c: fm-lifecycle
    kind: mcq
    diff: 3
    q: 'A company needs a model for its niche industry. It has 5,000 labeled examples and a small budget. Which approach is MOST cost-effective?'
    o:
      - 'Fine-tune an existing foundation model'
      - 'Pre-train a new model from scratch'
      - 'Train a new transformer on the 5,000 examples'
      - 'Deploy an untuned model and skip evaluation'
    a: 0
    why: 'Fine-tuning reuses everything a pre-trained model already knows. Pre-training needs vast data and compute, 5,000 examples are far too few to train a transformer from zero, and skipping evaluation is risky.'

  - id: d2-237
    c: fm-lifecycle
    kind: multi
    diff: 2
    q: 'Which activities belong to the deployment and feedback stages of the FM lifecycle? (Choose TWO.)'
    o:
      - 'Serving the model behind an inference endpoint or API'
      - 'Collecting user ratings and monitoring live outputs'
      - 'Pre-training on a large web-scale text corpus'
      - 'Choosing which base model architecture to use'
      - 'Curating the initial training dataset'
    a: [0, 1]
    why: 'Deployment puts the model behind an endpoint, and feedback gathers ratings and monitoring data from real use. Pre-training, model choice and data curation happen earlier.'

  - id: d2-238
    c: fm-lifecycle
    kind: tf
    diff: 1
    s: 'Model selection, choosing which base model to start from, comes before fine-tuning in the FM lifecycle.'
    v: true
    why: 'You must pick a base model before you can adapt it. Most teams select an existing pre-trained FM, then fine-tune and evaluate it.'

  - id: d2-239
    c: fm-lifecycle
    kind: hallu
    diff: 3
    s:
      - 'Data selection affects the quality and bias of the final model.'
      - 'Pre-training teaches general patterns from broad data.'
      - 'Fine-tuning usually needs far less data than pre-training.'
      - 'Evaluation is finished once the model scores well on one public benchmark.'
    bad: 3
    o:
      - 'Evaluation should also test real tasks and business goals, not just one benchmark.'
      - 'Evaluation is done only by the model provider, never by the customer.'
      - 'Evaluation means counting how many tokens the model outputs.'
    a: 0
    why: 'A public benchmark shows general skill, not fitness for your job. Good evaluation also uses your own test data, human review and business metrics.'

  - id: d2-240
    c: fm-lifecycle
    kind: duel
    diff: 3
    q: 'A retailer''s deployed model gets worse ratings after many new products launch. Which plan is better?'
    A: 'Collect the low-rated cases, add fresh product data, fine-tune, re-evaluate, then redeploy.'
    B: 'Pre-train a brand-new model from scratch on web data plus the product catalog.'
    a: 0
    why: 'Feedback feeds the next lifecycle loop: targeted new data, fine-tuning and re-evaluation. Pre-training from scratch is the most expensive stage and unnecessary for a catalog update.'

  # context-engineering
  - id: d2-241
    c: context-engineering
    kind: mcq
    diff: 1
    pre: true
    q: 'Which item is part of an FM''s context for a request, rather than its trained weights?'
    o:
      - 'Documents retrieved for this request'
      - 'Patterns learned during pre-training'
      - 'Knowledge added by fine-tuning'
      - 'The model''s total parameter count'
    a: 0
    why: 'Context is whatever the app sends with the request: instructions, retrieved documents, history, tool results. Pre-training and fine-tuning live in the weights.'

  - id: d2-242
    c: context-engineering
    kind: mcq
    diff: 2
    q: 'An agent has access to 80 tools and often picks the wrong one. Which context engineering change should the team try FIRST?'
    o:
      - 'Expose only the tools the task needs'
      - 'Fine-tune the model on all 80 tool descriptions'
      - 'Raise the temperature to explore more tools'
      - 'Switch the agent to Provisioned Throughput'
    a: 0
    why: 'Fewer, relevant tool definitions make the right choice clearer and save tokens. Fine-tuning is slow and costly, temperature adds randomness, and capacity does not affect tool choice.'

  - id: d2-243
    c: context-engineering
    kind: mcq
    diff: 3
    q: 'An HR assistant answers from retrieved policy passages but sometimes mixes in another country''s rules. What is the BEST context engineering fix?'
    o:
      - 'Filter retrieval by employee country metadata'
      - 'Raise the maximum output token limit per answer'
      - 'Include every country''s policy in each prompt'
      - 'Remove the system prompt to free up space'
    a: 0
    why: 'Metadata filtering narrows retrieval to passages that apply to this employee. Sending every policy makes mix-ups more likely, and a longer output cap changes nothing about the input.'

  - id: d2-244
    c: context-engineering
    kind: mcq
    diff: 2
    q: 'A prompt mixes instructions, a customer email and retrieved FAQ text with no separation. The model sometimes obeys sentences inside the email. Which change helps MOST?'
    o:
      - 'Clearly delimit and label each section'
      - 'Put the customer email before the system prompt'
      - 'Raise the temperature to vary the output'
      - 'Remove the retrieved FAQ text entirely'
    a: 0
    why: 'Labels or tags show the model which text is instruction and which is data. That reduces confusion and some injection risk, though it is not a full defense on its own.'

  - id: d2-245
    c: context-engineering
    kind: multi
    diff: 3
    q: 'A long-running agent keeps hitting its context window limit. Which techniques help? (Choose TWO.)'
    o:
      - 'Summarize older conversation turns'
      - 'Keep key facts in memory and retrieve them when relevant'
      - 'Append every tool output in full for the whole session'
      - 'Raise the temperature setting'
      - 'Repeat the system prompt at the end of each request'
    a: [0, 1]
    why: 'Summaries and selective memory keep what matters in fewer tokens. Full tool outputs and repeated prompts fill the window faster, and temperature does not change its size.'

  - id: d2-246
    c: context-engineering
    kind: tf
    diff: 2
    s: 'With a very large context window, you no longer need to choose what context to include.'
    v: false
    why: 'A big window holds more, but every token still costs money and time, and irrelevant text can distract the model. Choosing relevant context still matters.'

  - id: d2-247
    c: context-engineering
    kind: tf
    diff: 2
    s: 'Better context engineering can improve an agent''s results without retraining or fine-tuning the model.'
    v: true
    why: 'Context engineering changes what the model sees at inference time, such as better retrieval, cleaner history and fewer tools. The weights stay the same.'

  - id: d2-248
    c: context-engineering
    kind: hallu
    diff: 2
    s:
      - 'A system prompt sets the model''s role and rules.'
      - 'Retrieved documents can give the model facts it was not trained on.'
      - 'Old chat turns can be summarized to save tokens.'
      - 'Only the user''s latest message counts toward the context window.'
    bad: 3
    o:
      - 'System prompt, history, retrieved text and tool results all count toward it.'
      - 'Only the system prompt counts toward the context window.'
      - 'Only output tokens count toward the context window.'
    a: 0
    why: 'The context window covers everything sent in the request, plus the generated output on most models. Big system prompts and long histories eat it just as user messages do.'

  # multi-agent-patterns
  - id: d2-249
    c: multi-agent-patterns
    kind: mcq
    diff: 1
    pre: true
