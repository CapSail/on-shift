      - 'Raise the temperature for refund requests'
      - 'Store refund rules in short-term memory only'
      - 'Let the agent retry until the refund succeeds'
    a: 0
    why: 'A human-in-the-loop step gates high-risk actions before they run. Memory and temperature do not enforce approval, and retrying could issue the refund without anyone checking.'

  - id: d2-269
