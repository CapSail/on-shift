      - 'The model''s weights update after each chat'
      - 'Every raw message is copied into later prompts'
      - 'Developers retrain the model nightly on chats'
    a: 0
    why: 'AgentCore Memory stores session events as short-term memory, and memory strategies extract facts, preferences or summaries into long-term memory. The model weights never change.'

  - id: d2-267
    c: agent-memory-orchestration
    kind: mcq
    diff: 2
    q: 'An agent sometimes calls the same tool again and again without finishing, running up costs. What should the team add FIRST?'
    o:
      - 'A maximum step or iteration limit'
      - 'A higher temperature setting'
      - 'A larger context window'
      - 'More tools for the agent to choose from'
    a: 0
    why: 'A step limit stops runaway loops and caps cost per request. A bigger window or more tools let the loop run longer, and higher temperature makes behavior less predictable.'

  - id: d2-268
    c: agent-memory-orchestration
    kind: mcq
    diff: 2
    q: 'An agent can issue refunds. The company wants a person to approve any refund over $500 before it happens. Which orchestration design fits?'
