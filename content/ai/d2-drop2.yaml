    why: 'The loop repeats reason, act and observe until the model has enough to respond. Each observation becomes context for the next reasoning step.'

  # genai-pros-cons
  - id: d2-273
    c: genai-pros-cons
    kind: mcq
    diff: 1
    pre: true
    q: 'A chatbot cites a court case that does not exist, in a confident and detailed answer. What is this called?'
    o:
      - 'Hallucination'
      - 'Overfitting'
      - 'Data drift'
      - 'Tokenization'
    a: 0
    why: 'A hallucination is fluent, confident output that is false or made up. Overfitting and drift are training and data problems, and tokenization just splits text.'

  - id: d2-274
    c: genai-pros-cons
    kind: mcq
    diff: 2
    q: 'An airline asks its assistant the same question five times and gets five differently worded answers. Which GenAI characteristic explains this?'
    o:
      - 'Nondeterminism'
      - 'Hallucination'
      - 'Interpretability'
      - 'Data residency'
    a: 0
    why: 'LLMs sample their output, so the same prompt can produce different wording. Varied answers are not necessarily wrong, so this is nondeterminism, not hallucination.'

  - id: d2-275
    c: genai-pros-cons
    kind: mcq
    diff: 2
    q: 'A pharmacy''s assistant sometimes invents drug interaction details. What should the team do FIRST to reduce this?'
    o:
      - 'Ground answers in approved references (RAG)'
      - 'Raise the temperature to sample more answers'
      - 'Switch to a larger image generation model'
      - 'Remove the system prompt instructions'
    a: 0
    why: 'Grounding answers in trusted, retrieved sources is the main defense against hallucination. Higher temperature adds randomness, and dropping instructions removes guidance.'

  - id: d2-276
    c: genai-pros-cons
    kind: mcq
    diff: 2
    q: 'A retailer replaces dozens of separate scripts with one FM that answers product questions, drafts emails and summarizes reviews, each through a different prompt. Which GenAI advantage does this show?'
    o:
      - 'Adaptability'
      - 'Determinism'
      - 'Interpretability'
      - 'Data residency'
    a: 0
    why: 'One pre-trained model handling many tasks just by changing the prompt is adaptability. GenAI is not deterministic or easy to interpret, which are its known weaknesses.'

  - id: d2-277
    c: genai-pros-cons
    kind: multi
    diff: 3
    q: 'A company wants an LLM to draft replies to regulator inquiries. Which controls address GenAI limitations? (Choose TWO.)'
    o:
      - 'Human review before anything is sent'
      - 'Grounding drafts in the company''s approved records'
      - 'Raising the temperature for more creative wording'
      - 'Trusting answers that sound confident'
      - 'Turning off logging of prompts and outputs'
    a: [0, 1]
    why: 'Grounding cuts hallucinations and human review catches what slips through. Confidence is not accuracy, more creativity adds risk, and logging supports audits.'

  - id: d2-278
    c: genai-pros-cons
    kind: tf
    diff: 2
    s: 'If an LLM''s answer is fluent and detailed, it is very likely to be factually correct.'
    v: false
    why: 'Fluency comes from language patterns, not fact checking. Hallucinations are often the most detailed answers in the room. Verify claims against trusted sources.'

  - id: d2-279
    c: genai-pros-cons
    kind: tf
    diff: 1
    s: 'Holding a natural, back-and-forth conversation in plain language is one of the main business advantages of GenAI.'
    v: true
    why: 'Conversational capability lets customers and staff ask in their own words and follow up, without menus or query languages.'

  - id: d2-280
    c: genai-pros-cons
    kind: hallu
    diff: 2
    s:
      - 'Hallucinations can sound fluent and confident.'
      - 'Checking outputs against trusted data helps catch errors.'
      - 'GenAI can produce content at large scale and speed.'
      - 'LLMs are easy to interpret, because you can read their weights.'
    bad: 3
    o:
      - 'LLM weights are billions of numbers, so explaining an answer is hard.'
      - 'LLM weights are stored as readable English sentences.'
      - 'LLMs log the exact reason for every answer they give.'
    a: 0
    why: 'Billions of numeric parameters do not explain themselves. That poor interpretability is a key limitation when regulators or customers need reasons.'

