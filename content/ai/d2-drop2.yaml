  # agent-memory-orchestration
  - id: d2-265
    c: agent-memory-orchestration
    kind: mcq
    diff: 1
    pre: true
    q: 'An agent plans a step, calls a search tool, reads the result, and decides what to do next, again and again. What is this cycle called?'
    o:
      - 'The agent orchestration loop'
      - 'Foundation model pre-training'
      - 'Asynchronous batch inference'
      - 'Document chunking'
    a: 0
    why: 'Orchestration runs the reason, act, observe loop until the task is done. Pre-training builds the model, batch inference processes bulk jobs, and chunking prepares documents.'

  - id: d2-266
    c: agent-memory-orchestration
    kind: mcq
    diff: 3
    q: 'With Amazon Bedrock AgentCore Memory, how is long-term memory typically created?'
    o:
