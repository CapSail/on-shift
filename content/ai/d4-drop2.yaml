    g: bias-variance-terms
    term: 'Overfitting'
    def: 'Great on training data, poor on new data; memorized the noise'
  - id: f4-020
    c: bias-variance-fit
    g: bias-variance-terms
    term: 'Underfitting'
    def: 'Too simple, so it performs poorly on training and new data'
  - id: f4-021
    c: bias-variance-fit
    g: bias-variance-terms
    term: 'Good fit'
    def: 'Low error on training and new data alike; generalizes well'
  - id: f4-022
