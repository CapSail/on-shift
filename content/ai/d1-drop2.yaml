  # ------------------------------------------------ aws-managed-ai-services
  - id: d1-273
    c: aws-managed-ai-services
    kind: mcq
    diff: 1
    pre: true
    q: 'A global retailer wants to show product reviews written in Japanese to English-speaking shoppers, automatically and at scale. Which service should it use?'
    o:
      - 'Amazon Comprehend'
      - 'Amazon Transcribe'
      - 'Amazon Translate'
      - 'Amazon Polly'
    a: 2
    why: 'Amazon Translate converts text between languages. Comprehend analyzes text, Transcribe turns audio into text, and Polly turns text into speech.'

  - id: d1-274
    c: aws-managed-ai-services
    kind: mcq
    diff: 3
    q: 'A travel company wants its English trip itineraries read aloud to customers in Spanish. Which combination fits BEST?'
    o:
      - 'Amazon Polly, then Amazon Translate'
      - 'Amazon Translate, then Amazon Polly'
      - 'Amazon Transcribe, then Amazon Polly'
      - 'Amazon Comprehend, then Amazon Lex'
    a: 1
    why: 'First translate the English text into Spanish with Translate, then turn the Spanish text into speech with Polly. Running Polly first would produce English audio that Translate cannot use.'

  - id: d1-275
    c: aws-managed-ai-services
    kind: multi
    diff: 2
    q: 'A pharmacy wants a phone and chat assistant that understands requests like "refill my prescription" and asks for the prescription number if it is missing. Which statements are correct? (Choose TWO.)'
    o:
      - 'Amazon Lex can recognize the intent behind the request'
      - 'Amazon Lex can prompt the user for missing details'
      - 'Amazon Polly can detect the intent of the request'
      - 'Amazon Translate is needed to understand English'
      - 'Amazon Textract runs the voice conversation'
    a: [0, 1]
    why: 'Lex maps what users say to intents and collects required details, called slots, by asking follow-up questions. Polly only speaks, Translate converts languages and Textract reads documents.'

  - id: d1-276
    c: aws-managed-ai-services
    kind: mcq
    diff: 2
    q: 'A call center must remove card numbers and other personal data from call transcripts. Which service feature helps MOST directly during transcription?'
    o:
      - 'Neural voices in Amazon Polly'
      - 'PII redaction in Amazon Transcribe'
      - 'Custom terminology in Amazon Translate'
      - 'Intent slots in Amazon Lex'
    a: 1
    why: 'Amazon Transcribe can identify and redact personally identifiable information in its transcripts. The other features exist but solve different problems: voices, brand terms and chatbot inputs.'

  - id: d1-277
    c: aws-managed-ai-services
    kind: mcq
    diff: 3
    q: 'A medical-device company finds Amazon Transcribe often misspells its product names. Which fix needs the LEAST effort?'
    o:
      - 'Add a custom vocabulary to Amazon Transcribe'
      - 'Train a new speech model from scratch in SageMaker AI'
      - 'Use Amazon Polly to re-read the audio'
      - 'Run Amazon Translate on each transcript'
    a: 0
    why: 'A custom vocabulary teaches Transcribe domain words like product names. Building a speech model from scratch is far more work, and Polly and Translate do not fix recognition.'

  - id: d1-278
    c: aws-managed-ai-services
    kind: tf
    diff: 1
    s: 'Amazon Lex turns written documents into lifelike speech, for example to create audiobook versions of manuals.'
    v: false
    why: 'Turning text into lifelike speech is Amazon Polly. Lex builds conversational bots that understand voice and text input.'

  - id: d1-279
    c: aws-managed-ai-services
    kind: hallu
    diff: 2
    s:
      - 'Amazon Transcribe can label which speaker said what in a call.'
      - 'Amazon Translate supports custom terminology for brand names.'
      - 'Amazon Polly analyzes customer emails for sentiment.'
      - 'Amazon Lex uses intents to understand what a user wants.'
    bad: 2
    o:
      - 'Amazon Comprehend analyzes sentiment; Polly turns text into speech.'
      - 'Amazon Transcribe analyzes sentiment; Polly translates text.'
      - 'Amazon Lex analyzes sentiment; Polly builds chatbots.'
    a: 0
    why: 'Sentiment in written text is Amazon Comprehend''s job. Polly only speaks. Speaker labels in Transcribe and custom terminology in Translate are real features.'

  - id: d1-280
    c: aws-managed-ai-services
    kind: multi
    diff: 3
    q: 'A company wants sentiment analysis in its app with the LEAST development effort now. Later it will need a model for a unique prediction no AWS AI service offers. Which choices fit? (Choose TWO.)'
    o:
      - 'Use Amazon Comprehend now for sentiment analysis'
      - 'Use Amazon SageMaker AI later for the custom model'
      - 'Use Amazon Polly now for sentiment analysis'
      - 'Train a sentiment model from scratch now'
      - 'Use Amazon Transcribe later for the custom model'
    a: [0, 1]
    why: 'Use a pre-built service when it already solves the task, and SageMaker AI when nothing pre-built fits. Training sentiment from scratch wastes effort, and Polly and Transcribe do neither job.'

  # ------------------------------------------------ traditional-ml-vs-fm
  - id: d1-281
    c: traditional-ml-vs-fm
    kind: mcq
    diff: 2
    pre: true
    q: 'A company must classify 5 million rows of tabular transaction data every hour. Which approach is MOST cost-effective?'
    o:
      - 'A gradient-boosted tree model such as XGBoost'
      - 'A large language model prompted once per row'
      - 'A diffusion model fine-tuned on the rows'
      - 'A multimodal foundation model on each row'
    a: 0
    why: 'Narrow, high-volume tabular classification is where small traditional models excel: fast, cheap and accurate. Sending millions of rows to a foundation model would cost far more for no gain.'

  - id: d1-282
    c: traditional-ml-vs-fm
    kind: mcq
    diff: 1
    q: 'A marketing team needs product descriptions in 12 languages and several tones for thousands of new items, with no labeled training data. Which approach fits BEST?'
    o:
      - 'A decision tree trained on product prices'
      - 'A foundation model guided by prompts'
      - 'A linear regression on item weights'
      - 'K-means clustering on product names'
    a: 1
    why: 'Open-ended, multilingual text generation is a foundation model strength, and prompts can steer tone with no training data. The other options predict numbers or groups, not text.'

  - id: d1-283
    c: traditional-ml-vs-fm
    kind: multi
    diff: 3
    q: 'A health insurer is choosing between a foundation model and a traditional ML model for claim approvals. Which requirements favor traditional ML? (Choose TWO.)'
    o:
      - 'Regulators require a clear reason for every decision'
      - 'Each decision must be reproducible for audits'
      - 'Inputs are open-ended conversations with members'
      - 'The model must draft long, friendly letters'
      - 'One model should handle many unrelated tasks'
    a: [0, 1]
    why: 'Explainability and repeatable, auditable outputs point to traditional, interpretable models. Conversation, letter writing and broad multi-task use are foundation model strengths.'

  - id: d1-284
    c: traditional-ml-vs-fm
    kind: mcq
    diff: 3
    q: 'A foundation model gives slightly different answers to the same prompt each time. For which task is this behavior the BIGGEST problem?'
    o:
      - 'Brainstorming blog post titles'
      - 'Drafting a friendly welcome email for new hires'
      - 'Quoting a regulated insurance premium'
      - 'Suggesting names for a new product'
    a: 2
    why: 'A regulated premium must be exact and repeatable, so nondeterminism is unacceptable. For creative tasks like titles, emails and names, variety is a feature.'

  - id: d1-285
    c: traditional-ml-vs-fm
    kind: tf
    diff: 2
    s: 'A foundation model can often do a new task from a well-written prompt and a few examples, with no task-specific training.'
    v: true
    why: 'Broad pre-training lets FMs adapt through zero-shot or few-shot prompting. Traditional ML usually needs its own labeled dataset and training run for each task.'

  - id: d1-286
    c: traditional-ml-vs-fm
    kind: hallu
    diff: 2
    s:
      - 'Traditional ML models are usually much smaller than foundation models.'
      - 'Foundation models are pre-trained on broad data.'
      - 'Foundation models always respond faster than a small decision tree.'
      - 'Traditional ML often needs labeled data for each task.'
    bad: 2
    o:
      - 'Large FMs usually have higher latency and cost than small models.'
      - 'Decision trees need GPUs, so they are always slower.'
      - 'FMs and decision trees always have identical latency.'
    a: 0
    why: 'Billions of parameters take more compute per request. A small decision tree answers in a blink on modest hardware, which matters for tight latency budgets.'

  - id: d1-287
    c: traditional-ml-vs-fm
    kind: duel
    diff: 2
    q: 'A logistics firm must classify package size from five numeric sensor fields on a handheld scanner with no internet connection. Which design is better?'
    A: 'Call a large foundation model in the cloud for every package scanned.'
    B: 'Deploy a small traditional classification model directly on the scanner.'
    a: 1
    why: 'No connectivity, limited hardware and a narrow numeric task all favor a small local model. A cloud FM call would fail offline and is overkill for five numbers.'

  - id: d1-288
    c: traditional-ml-vs-fm
    kind: mcq
    diff: 1
    q: 'Which is a typical advantage of a foundation model over a traditional ML model?'
    o:
      - 'It adapts to many tasks with little task-specific data'
      - 'It is always easier to explain to auditors and regulators'
      - 'It is always cheaper to run per prediction'
      - 'It needs no compute to serve requests'
    a: 0
    why: 'Versatility is the FM superpower. The trade-off is higher cost per request and less transparency than small traditional models.'

  # ------------------------------------------------ ml-pipeline-stages
  - id: d1-289
    c: ml-pipeline-stages
    kind: mcq
    diff: 2
    pre: true
    q: 'A data scientist fills missing ages with the median, removes duplicate rows and converts all dates to one format. Which pipeline stage is this?'
    o:
      - 'Feature engineering'
      - 'Data pre-processing'
      - 'Model evaluation'
      - 'Hyperparameter tuning'
    a: 1
    why: 'Fixing missing values, duplicates and formats is cleaning, which is data pre-processing. Feature engineering creates new inputs; it does not repair broken ones.'

  - id: d1-290
    c: ml-pipeline-stages
    kind: mcq
    diff: 1
    q: 'Before cleaning anything, an analyst plots histograms and a correlation matrix to see how the columns are distributed and related. Which stage is this?'
    o:
      - 'Data pre-processing'
      - 'Feature engineering'
      - 'Production model monitoring'
      - 'Exploratory data analysis'
    a: 3
    why: 'Looking at distributions and relationships to understand the data is exploratory data analysis. It shapes the cleaning and feature decisions that follow.'

  - id: d1-291
    c: ml-pipeline-stages
    kind: mcq
    diff: 3
    q: 'A team runs dozens of training jobs with different learning rates and tree depths to find the best validation score. Which Amazon SageMaker AI capability automates this?'
    o:
      - 'SageMaker automatic model tuning'
      - 'SageMaker Model Monitor'
      - 'SageMaker Ground Truth labeling jobs'
      - 'SageMaker Clarify'
    a: 0
    why: 'Automatic model tuning launches many training jobs over a range of hyperparameter values and keeps the best one. Model Monitor watches live models, Ground Truth labels data, Clarify checks bias.'

  - id: d1-292
    c: ml-pipeline-stages
    kind: order
    diff: 2
    q: 'A telecom is building a churn model. Put these steps in order.'
    steps:
      - 'Pull customer records from the billing and CRM systems'
      - 'Chart churn rates and check for missing values'
      - 'Remove bad rows and standardize date formats'
      - 'Create a "months since signup" input'
      - 'Train the model on historical data'
    why: 'Collect, explore, clean, engineer features, then train. Each step depends on the one before: you cannot clean what you have not looked at.'

  - id: d1-293
    c: ml-pipeline-stages
    kind: multi
    diff: 2
    q: 'Which activities are part of feature engineering? (Choose TWO.)'
    o:
      - 'Creating a debt-to-income ratio from two existing fields'
      - 'Turning a color category into numeric columns'
      - 'Choosing the learning rate for training'
      - 'Measuring F1 score on the test set'
      - 'Watching a deployed model for drift'
    a: [0, 1]
    why: 'Deriving new inputs and encoding categories as numbers make data easier for a model to learn from. Learning rate is tuning, F1 is evaluation, and drift watching is monitoring.'

  - id: d1-294
    c: ml-pipeline-stages
    kind: tf
    diff: 3
    s: 'The test dataset should be used again and again during hyperparameter tuning to pick the best settings.'
    v: false
    why: 'Tuning uses the validation set. The test set is held back for one final, honest check; reusing it while tuning leaks information and inflates the score.'

  - id: d1-295
    c: ml-pipeline-stages
    kind: hallu
    diff: 2
    s:
      - 'Data collection gathers raw data from source systems.'
      - 'Feature engineering creates useful inputs for the model.'
      - 'Model evaluation should use the same data the model trained on.'
      - 'Deployment makes the model available to applications.'
    bad: 2
    o:
      - 'Model evaluation uses held-out data the model never trained on.'
      - 'Model evaluation happens only after a year in production.'
      - 'Model evaluation replaces the need for training.'
    a: 0
    why: 'Testing on training data rewards memorizing. Only unseen data shows how the model will do in the real world.'

  - id: d1-296
    c: ml-pipeline-stages
    kind: mcq
    diff: 3
    q: 'A model scored 95 percent in testing but only 70 percent after deployment. Investigation shows live data was not cleaned the way training data was. Which practice would have prevented this?'
    o:
      - 'Apply the same pre-processing steps to live inference data'
      - 'Move from real-time to batch inference on bigger instances'
      - 'Skip exploratory data analysis on the next project'
      - 'Collect less training data next time'
    a: 0
    why: 'A model expects inputs shaped like its training data. Running the same cleaning and feature steps at inference prevents this training-serving mismatch.'

  # ------------------------------------------------ fm-sourcing-and-serving
  - id: d1-297
    c: fm-sourcing-and-serving
    kind: mcq
    diff: 2
    pre: true
    q: 'A startup wants to start from a popular open-source pre-trained model and deploy it to its own SageMaker AI endpoint in a few clicks. Which feature fits BEST?'
    o:
      - 'Amazon SageMaker Ground Truth'
      - 'Amazon SageMaker JumpStart'
      - 'Amazon SageMaker Clarify'
      - 'Amazon SageMaker Model Monitor'
    a: 1
    why: 'SageMaker JumpStart is a hub of pre-trained models, including open-source ones, that you can deploy or fine-tune quickly. The others label data, check bias or monitor live models.'

  - id: d1-298
    c: fm-sourcing-and-serving
    kind: mcq
    diff: 3
    q: 'A retailer wants a chatbot backed by a foundation model within two weeks. It has no ML engineers and wants the LEAST operational overhead. Which approach fits BEST?'
    o:
      - 'Train a custom FM on Amazon EC2'
      - 'Self-host an open model on Amazon EKS'
      - 'Call a model through Amazon Bedrock'
      - 'Build a model from scratch in SageMaker AI'
    a: 2
    why: 'Amazon Bedrock is a managed API: no servers, no training, pay per use. Self-hosting or training from scratch needs ML skills, time and ongoing operations the team lacks.'

  - id: d1-299
    c: fm-sourcing-and-serving
    kind: multi
    diff: 2
    q: 'Which are tradeoffs of self-hosting a model on your own endpoint compared with using a managed API? (Choose TWO.)'
    o:
      - 'More control over instance types and scaling'
      - 'More responsibility for capacity, patching and uptime'
      - 'No ability to choose which model runs'
      - 'AWS handles all scaling decisions for you'
      - 'No infrastructure costs of any kind'
    a: [0, 1]
    why: 'Self-hosting buys control at the price of operational work. A managed API flips that: the provider runs and scales the infrastructure, and you give up some control.'

  - id: d1-300
    c: fm-sourcing-and-serving
    kind: mcq
    diff: 2
    q: 'A business analyst with no coding skills wants to explore sales dashboards and ask an AI assistant questions about company data. Which AWS service fits BEST?'
    o:
      - 'Kiro'
      - 'Amazon SageMaker AI'
      - 'Amazon Transcribe'
      - 'Amazon Quick'
    a: 3
    why: 'Amazon Quick gives business users BI dashboards and AI agents over their data. Kiro is for developers writing code, SageMaker AI is for building models, and Transcribe handles audio.'

  - id: d1-301
    c: fm-sourcing-and-serving
    kind: mcq
    diff: 2
    q: 'A development team wants an AI coding environment that turns written requirements into a design and a task list before generating code. Which AWS tool fits BEST?'
    o:
      - 'Amazon Quick'
      - 'Kiro'
      - 'Amazon Polly'
      - 'Amazon Lex'
    a: 1
    why: 'Kiro is an agentic IDE built on spec-driven development: requirements, then design, then tasks, then code. Amazon Quick serves business users, and Polly and Lex handle speech and chatbots.'

  - id: d1-302
    c: fm-sourcing-and-serving
    kind: tf
    diff: 2
    s: 'For a company with a small dataset and a tight budget, training a custom foundation model from scratch is usually the best first choice.'
    v: false
    why: 'Pre-training needs massive data and compute. Starting from a pre-trained model, through a managed API or an open-source model, is far cheaper and faster.'

  - id: d1-303
    c: fm-sourcing-and-serving
    kind: hallu
    diff: 3
    s:
      - 'Amazon Bedrock offers models from several providers through one API.'
      - 'SageMaker JumpStart offers pre-trained models you can deploy.'
      - 'Amazon Quick is an agentic IDE for writing application code.'
      - 'Self-hosting gives more control but more operational work.'
    bad: 2
    o:
      - 'Kiro is the agentic IDE; Amazon Quick serves business users with BI and agents.'
      - 'Amazon Polly is the agentic IDE; Amazon Quick converts speech.'
      - 'Amazon Lex is the agentic IDE; Amazon Quick builds chatbots.'
    a: 0
    why: 'Developers code in Kiro. Business users analyze data and work with AI agents in Amazon Quick. I mixed up my coworkers again.'

  - id: d1-304
    c: fm-sourcing-and-serving
    kind: duel
    diff: 3
    q: 'A bank needs a foundation model and must control the exact instance types, network setup and its own custom inference code. Which design is better?'
    A: 'Deploy the model to a SageMaker AI endpoint that the team configures and manages.'
    B: 'Use a managed API and accept the provider''s standard serving setup.'
    a: 0
    why: 'Custom inference code and instance-level control are what self-hosting provides. A managed API is simpler but does not let you choose instances or run your own serving code.'

  # ------------------------------------------------ mlops-fundamentals
  - id: d1-305
    c: mlops-fundamentals
    kind: mcq
    diff: 2
    pre: true
    q: 'A team wants every model version stored with its metrics and approval status, so deployments always use a known, approved version. Which SageMaker AI feature fits?'
    o:
      - 'SageMaker Ground Truth'
      - 'SageMaker Model Registry'
      - 'SageMaker Clarify'
      - 'SageMaker JumpStart'
    a: 1
    why: 'The Model Registry catalogs model versions with metadata and approval status for controlled deployment. Ground Truth labels data, Clarify checks bias, JumpStart offers pre-trained models.'

  - id: d1-306
    c: mlops-fundamentals
    kind: mcq
    diff: 2
    q: 'A company wants data preparation, training, evaluation and registration to run the same way every time, automatically, when new data arrives. Which service fits BEST?'
    o:
      - 'Amazon SageMaker Pipelines'
      - 'Amazon SageMaker Model Monitor'
      - 'Amazon SageMaker Ground Truth'
      - 'Amazon SageMaker Clarify'
    a: 0
    why: 'SageMaker Pipelines defines ML workflow steps as a repeatable, automated pipeline. Model Monitor watches deployed models; it does not orchestrate training.'

  - id: d1-307
    c: mlops-fundamentals
    kind: multi
    diff: 2
    q: 'Which are signs of technical debt in an ML project? (Choose TWO.)'
    o:
      - 'One-off scripts that only one person understands'
      - 'Manual deployment steps that nobody documented'
      - 'Automated, versioned training pipelines'
      - 'Live models monitored for drift with alerts'
      - 'Experiments logged with data and parameters'
    a: [0, 1]
    why: 'Untracked scripts and undocumented manual steps make systems fragile and hard to change. Pipelines, monitoring and experiment tracking are the MLOps habits that pay that debt down.'

  - id: d1-308
    c: mlops-fundamentals
    kind: mcq
    diff: 3
    q: 'A loan model''s input data looks the same as at launch, but during a recession the link between income and default changed, and accuracy fell. What is this called?'
    o:
      - 'Data leakage'
      - 'Underfitting'
      - 'Concept drift'
      - 'Class imbalance'
    a: 2
    why: 'When the relationship between inputs and the target changes, that is concept drift. Data drift is when the inputs themselves shift. Either one calls for retraining on recent data.'

  - id: d1-309
    c: mlops-fundamentals
    kind: mcq
    diff: 2
    q: 'A team wants alerts when the distribution of live input data moves away from the training data baseline. Which SageMaker AI feature fits BEST?'
    o:
      - 'SageMaker automatic model tuning'
      - 'SageMaker Ground Truth'
      - 'SageMaker JumpStart'
      - 'SageMaker Model Monitor'
    a: 3
    why: 'Model Monitor compares live data and predictions against a baseline and raises alerts on drift. Tuning picks hyperparameters, Ground Truth labels data, and JumpStart offers models.'

  - id: d1-310
    c: mlops-fundamentals
    kind: tf
    diff: 2
    s: 'In MLOps, once a model passes evaluation at launch, later model versions can skip automated testing to ship faster.'
    v: false
    why: 'Every new version should pass the same automated checks before promotion. Skipping tests is how a worse model quietly reaches production.'

  - id: d1-311
    c: mlops-fundamentals
    kind: hallu
    diff: 2
    s:
      - 'SageMaker Pipelines automates ML workflow steps.'
      - 'SageMaker Model Registry tracks model versions.'
      - 'SageMaker Model Monitor trains brand-new models from scratch.'
      - 'Retraining on fresh data can restore accuracy after drift.'
    bad: 2
    o:
      - 'Model Monitor detects drift and quality issues; a pipeline can then retrain.'
      - 'Model Monitor labels images to build training datasets.'
      - 'Model Monitor translates model outputs into other languages.'
    a: 0
    why: 'Model Monitor watches; it does not train. Its alerts can trigger a pipeline that retrains, evaluates and registers a new version.'

  - id: d1-312
    c: mlops-fundamentals
    kind: order
    diff: 2
    q: 'Put this automated retraining loop in order.'
    steps:
      - 'Monitoring detects drift in live data'
      - 'A pipeline retrains the model on recent data'
      - 'The new model is evaluated against the current one'
      - 'The approved version is registered'
      - 'The new version is deployed'
    why: 'Detect, retrain, evaluate, register, deploy. Evaluation before registration makes sure only a better model gets promoted.'

  # ------------------------------------------------ precision-recall-f1
  - id: d1-313
    c: precision-recall-f1
    kind: mcq
    diff: 1
    pre: true
    q: 'A fraud model flags 100 transactions, and 80 of them are actually fraud. What is the model''s precision?'
    o:
      - '20 percent'
      - '80 percent'
      - '100 percent'
      - 'Unknown without the recall'
    a: 1
    why: 'Precision is true positives divided by everything flagged: 80 out of 100 is 80 percent. Recall would need the total number of real fraud cases.'

  - id: d1-314
    c: precision-recall-f1
    kind: mcq
    diff: 3
    q: 'There are 50 real fraud cases. A model catches 40 of them and also flags 20 legitimate transactions. What are its precision and recall?'
    o:
      - 'Precision 80 percent, recall about 67 percent'
      - 'Precision 40 percent, recall 60 percent'
      - 'Precision about 67 percent, recall 80 percent'
      - 'Precision 80 percent, recall 100 percent'
    a: 2
    why: 'Precision is 40 of 60 flagged, about 67 percent. Recall is 40 of 50 real cases, 80 percent. The trap option swaps the two.'

  - id: d1-315
    c: precision-recall-f1
    kind: multi
    diff: 2
    q: 'In which situations should a team prioritize recall? (Choose TWO.)'
    o:
      - 'Screening for a serious but treatable disease'
      - 'Detecting intrusions where a missed attack is costly'
      - 'Flagging spam when false alarms anger users'
      - 'Auto-approving refunds where false approvals cost money'
      - 'Showing one featured product on a home page'
    a: [0, 1]
    why: 'When a missed positive is the expensive mistake, maximize recall. When false alarms are the expensive mistake, as with spam or wrong refund approvals, precision matters more.'

  - id: d1-316
    c: precision-recall-f1
    kind: mcq
    diff: 2
    q: 'Classes are imbalanced, and both false positives and false negatives matter. Which single metric is MOST useful?'
    o:
      - 'Accuracy'
      - 'Mean squared error'
      - 'F1 score'
      - 'Training loss'
    a: 2
    why: 'F1 is the harmonic mean of precision and recall, so it drops if either is poor. Accuracy hides rare-class failures, and mean squared error is for regression.'

  - id: d1-317
    c: precision-recall-f1
    kind: mcq
    diff: 3
    q: 'An AI shopping assistant raised conversions a little, but serving costs rose so much that the project now loses money. Which metric shows this problem MOST directly?'
    o:
      - 'Recall'
      - 'Return on investment'
      - 'F1 score'
      - 'Area under the ROC curve'
    a: 1
    why: 'Return on investment compares the value gained with what was spent, so a money-losing project shows a negative ROI. Recall, F1 and AUC only measure prediction quality.'

  - id: d1-318
    c: precision-recall-f1
    kind: tf
    diff: 2
    s: 'Precision, recall and F1 are classification metrics; a regression model that predicts prices is scored with error measures instead.'
    v: true
    why: 'Regression is judged by how far predictions land from actual values, with measures like mean squared error. Precision and recall need categories to count hits and misses.'

  - id: d1-319
    c: precision-recall-f1
    kind: hallu
    diff: 2
    s:
      - 'A false positive is a negative case flagged as positive.'
      - 'A false negative is a positive case the model missed.'
      - 'Raising the decision threshold usually raises recall.'
      - 'Precision and recall often trade off against each other.'
    bad: 2
    o:
      - 'A higher threshold usually raises precision and lowers recall.'
      - 'A higher threshold always raises both precision and recall.'
      - 'A higher threshold has no effect on predictions.'
    a: 0
    why: 'A stricter threshold flags fewer items, so flags are more often right (precision up) but more real cases slip through (recall down).'

  - id: d1-320
    c: precision-recall-f1
    kind: match
    diff: 2
    q: 'Match each metric to the question it answers.'
    pairs:
      - ['Precision', 'Of the items flagged, how many were real?']
      - ['Recall', 'Of the real cases, how many were caught?']
      - ['Accuracy', 'Of all predictions, how many were right?']
      - ['Cost per user', 'What does serving each user cost?']
    why: 'Precision starts from the flags, recall starts from the real cases, accuracy counts everything, and cost per user is a business metric.'

