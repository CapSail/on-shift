# Domain 1 content drop 2: extra cards and facts for existing D1 concepts.
# Ids are stable forever: never renumber or reuse a card or fact id.

cards:
  # ------------------------------------------------ ai-ml-dl-genai-agentic
  - id: d1-201
    c: ai-ml-dl-genai-agentic
    kind: order
    diff: 1
    pre: true
    q: 'Order these fields from the broadest to the most specific.'
    steps:
      - 'Artificial intelligence'
      - 'Machine learning'
      - 'Deep learning'
      - 'Generative AI'
    why: 'AI is the umbrella. ML is AI that learns from data, deep learning is ML with multi-layer neural networks, and GenAI uses deep models to create new content.'

  - id: d1-202
    c: ai-ml-dl-genai-agentic
    kind: mcq
    diff: 2
    q: 'A hospital wants software that examines X-ray images and highlights possible fractures for a radiologist. Which combination BEST describes this solution?'
    o:
      - 'Computer vision built on deep learning'
      - 'NLP built on reinforcement learning'
      - 'Speech recognition built on clustering'
      - 'Generative AI built on hand-written rules'
    a: 0
    why: 'Interpreting images is computer vision, and modern image models are deep neural networks. NLP handles language, speech recognition handles audio, and nothing here needs new content generated.'

  - id: d1-203
    c: ai-ml-dl-genai-agentic
    kind: mcq
    diff: 2
    q: 'A bank''s assistant answers questions about fees but cannot act. The bank wants it to check a balance, open a dispute ticket and send a confirmation email on its own. What is the bank moving toward?'
    o:
      - 'Supervised learning'
      - 'Agentic AI'
      - 'Computer vision'
      - 'Batch inference'
    a: 1
    why: 'Planning several steps and acting through other systems is agentic AI. An agent uses a foundation model to decide which tools to call, instead of only answering.'

  - id: d1-204
    c: ai-ml-dl-genai-agentic
    kind: multi
    diff: 2
    q: 'A team is new to large language models (LLMs). Which statements about LLMs are correct? (Choose TWO.)'
    o:
      - 'They are deep learning models built on neural networks'
      - 'They generate new text, so they are a form of GenAI'
      - 'They are rule sets written by hand with no training'
      - 'They always return the same answer to the same prompt'
      - 'They only work on structured, tabular data'
    a: [0, 1]
    why: 'LLMs are large neural networks trained on vast text, and they generate content, which makes them GenAI. Their output is nondeterministic, and they handle unstructured text.'

  - id: d1-205
    c: ai-ml-dl-genai-agentic
    kind: mcq
    diff: 3
    q: 'A product manager lists four claims about deep learning. Which claim is NOT correct?'
    o:
      - 'It uses neural networks with many layers'
      - 'It is a subset of machine learning'
      - 'It needs no training data to learn'
      - 'It underpins most modern GenAI models'
    a: 2
    why: 'Deep learning learns its weights from data, usually a lot of it. The other three claims are true: it is multi-layer neural networks, part of ML, and the basis of today''s GenAI.'

  - id: d1-206
    c: ai-ml-dl-genai-agentic
    kind: tf
    diff: 1
    s: 'An AI agent usually relies on a foundation model to reason about which tool or action to use next.'
    v: true
    why: 'Agentic AI wraps a foundation model with tools, memory and a goal. The model does the reasoning and planning; the tools carry out the actions.'

  - id: d1-207
    c: ai-ml-dl-genai-agentic
    kind: hallu
    diff: 2
    s:
      - 'Machine learning learns patterns from data.'
      - 'Neural networks are layers of connected nodes.'
      - 'Computer vision is the branch of AI that interprets images.'
      - 'Natural language processing only works on images of handwriting.'
    bad: 3
    o:
      - 'NLP works with human language, such as emails, reviews and chat messages.'
      - 'NLP only works with numbers stored in spreadsheets.'
      - 'NLP only works with sensor readings over time.'
    a: 0
    why: 'Natural language processing understands and generates human language, mostly as text. Reading images is computer vision. I was 97 percent confident, which is how you know.'

  - id: d1-208
    c: ai-ml-dl-genai-agentic
    kind: multi
    diff: 3
    q: 'A company lists five systems it runs. Which are examples of generative AI? (Choose TWO.)'
    o:
      - 'A model that writes product descriptions from bullet points'
      - 'A model that creates images from a text prompt'
      - 'A model that labels emails as spam or not spam'
      - 'A model that groups customers into segments'
      - 'A model that predicts next month''s revenue'
    a: [0, 1]
    why: 'GenAI creates new content, like text or images. Spam labeling is classification, segmentation is clustering, and revenue prediction is regression: all predictive ML, not generative.'

  # ------------------------------------------------ model-training-inference
  - id: d1-209
    c: model-training-inference
    kind: mcq
    diff: 1
    pre: true
    q: 'A grocery chain has a trained demand model. Each evening it sends every store''s latest sales to the model to get tomorrow''s forecast. What is this step called?'
    o:
      - 'Training'
      - 'Feature engineering'
      - 'Inference'
      - 'Hyperparameter tuning'
    a: 2
    why: 'Sending new data to a finished model and getting predictions back is inference. Training built the model earlier; nothing is being learned in this step.'

  - id: d1-210
    c: model-training-inference
    kind: mcq
    diff: 2
    q: 'A team compares the cost of one training run with the cost of one prediction. Which statement is MOST accurate?'
    o:
      - 'One training run usually costs far more than one prediction'
      - 'One prediction usually costs far more than a training run'
      - 'Training and inference always cost exactly the same'
      - 'Inference has no cost once training ends'
    a: 0
    why: 'Training processes the whole dataset, often many times, so one run is expensive. A single prediction is cheap, though serving millions of them still adds up.'

  - id: d1-211
    c: model-training-inference
    kind: multi
    diff: 2
    q: 'Which are model parameters learned during training, rather than settings chosen before training? (Choose TWO.)'
    o:
      - 'The weights in a neural network'
      - 'The coefficients in a linear regression'
      - 'The learning rate'
      - 'The number of training epochs'
      - 'The batch size'
    a: [0, 1]
    why: 'Weights and coefficients are learned from the data, and they make up the model. Learning rate, epochs and batch size are hyperparameters you set before training.'

  - id: d1-212
    c: model-training-inference
    kind: mcq
    diff: 3
    q: 'A fintech trains a fraud model once a month in a few hours. The model then scores hundreds of transactions per second, all day, every day. Over a year, which statement is MOST likely true?'
    o:
      - 'Total inference cost can exceed training cost'
      - 'Training always dominates total cost in every project'
      - 'Inference is free once the model is trained'
      - 'Both cost the same because they use one model'
    a: 0
    why: 'One prediction is cheap, but constant high-volume serving runs around the clock. Over time, inference can become the larger share of the bill, so serving choices matter.'

  - id: d1-213
    c: model-training-inference
    kind: tf
    diff: 1
    s: 'Algorithm and model mean the same thing, so the two words can be used interchangeably.'
    v: false
    why: 'The algorithm is the learning procedure. The model is what training produces: the learned parameters you deploy. Same recipe, different cakes.'

  - id: d1-214
    c: model-training-inference
    kind: hallu
    diff: 2
    s:
      - 'Training finds patterns in historical data.'
      - 'A trained model can be saved and deployed.'
      - 'A neural network is one kind of model architecture.'
      - 'Inference needs the full training dataset on every request.'
    bad: 3
    o:
      - 'Inference needs only the trained model and the new input.'
      - 'Inference needs the dataset plus a fresh training run.'
      - 'Inference needs a correct label for every new request.'
    a: 0
    why: 'The model already holds what it learned. At inference time it only needs the new input, which is why predictions are fast and cheap compared with training.'

  - id: d1-215
    c: model-training-inference
    kind: duel
    diff: 2
    q: 'A model serves good predictions. A new hire suggests retraining it from scratch before every single request "to keep it fresh". Which approach is better?'
    A: 'Retrain the model from scratch before each request so every prediction uses the newest possible weights.'
    B: 'Serve predictions from the deployed model and retrain on a schedule, or when monitoring shows quality dropping.'
    a: 1
    why: 'Training is slow and costly; inference should be fast. Retraining belongs on a schedule or a drift trigger, not inside every request.'

  - id: d1-216
    c: model-training-inference
    kind: mcq
    diff: 2
    q: 'During training, a neural network''s predictions are compared with the correct answers. What does training adjust to reduce the error?'
    o:
      - 'The number of input records'
      - 'The labels in the dataset'
      - 'The endpoint instance type'
      - 'The weights between the nodes'
    a: 3
    why: 'Training repeatedly nudges the network''s weights to shrink the gap between predictions and labels. The data, labels and hosting hardware are not what the model learns.'

  # ------------------------------------------------ fit-bias-fairness
  - id: d1-217
    c: fit-bias-fairness
    kind: mcq
    diff: 2
    q: 'A model scores 72 percent on training data and 71 percent on validation data. The business needs 90 percent. Which diagnosis and fix is MOST likely right?'
    o:
      - 'Underfitting; use a richer model or better features'
      - 'Overfitting; simplify the model and add regularization'
      - 'Data drift; retrain the model on newer production data'
      - 'Overfitting; remove most of the validation data'
    a: 0
    why: 'Low, similar scores on both sets mean the model is too simple to capture the pattern. Overfitting would show a high training score with a much lower validation score.'

  - id: d1-218
    c: fit-bias-fairness
    kind: multi
    diff: 2
    q: 'A model has 98 percent training accuracy but 70 percent accuracy on new data. Which actions can help reduce this problem? (Choose TWO.)'
    o:
      - 'Add more diverse training data'
      - 'Use regularization or a simpler model'
      - 'Train for many more epochs'
      - 'Add more features from the same small dataset'
      - 'Evaluate only on the training data'
    a: [0, 1]
    why: 'This is overfitting. More varied data and regularization or a simpler model help it generalize. More epochs and more features usually make memorizing worse, and training-only evaluation hides the problem.'

  - id: d1-219
    c: fit-bias-fairness
    kind: mcq
    diff: 3
    q: 'A hiring model was trained on 10 years of past hiring decisions. It ranks equally qualified candidates of one gender lower. What is the MOST likely root cause?'
    o:
      - 'Underfitting from too few training epochs'
      - 'Historical bias in the training labels'
      - 'Using real-time instead of batch inference'
      - 'A learning rate that was set too high'
    a: 1
    why: 'If past human decisions were biased, the labels teach the model that bias. The fix starts with the data and labels, not with epochs, learning rate or inference mode.'

  - id: d1-220
    c: fit-bias-fairness
    kind: mcq
    diff: 2
    q: 'A company wants an AWS tool to measure bias in its training data and explain which features drive its model''s predictions. Which should it use?'
    o:
      - 'Amazon SageMaker Ground Truth'
      - 'Amazon Comprehend'
      - 'Amazon SageMaker Clarify'
      - 'Amazon SageMaker Feature Store'
    a: 2
    why: 'SageMaker Clarify detects bias in data and models and explains predictions with feature attributions. Ground Truth labels data, Feature Store stores features, and Comprehend analyzes text.'

  - id: d1-221
    c: fit-bias-fairness
    kind: tf
    diff: 3
    s: 'A model can still be biased by gender even with no gender column, because features like job title can act as proxies.'
    v: true
    why: 'Dropping a sensitive column does not guarantee fairness. Correlated features can carry the same signal, so you still need to check results for each group.'

  - id: d1-222
    c: fit-bias-fairness
    kind: hallu
    diff: 3
    s:
      - 'High variance usually shows up as overfitting.'
      - 'High bias usually shows up as underfitting.'
      - 'Training for more epochs always fixes overfitting.'
      - 'Regularization can help a model generalize.'
    bad: 2
    o:
      - 'More epochs can worsen overfitting; stopping early often helps instead.'
      - 'More epochs always fix underfitting but never affect overfitting.'
      - 'Overfitting can only be fixed by deleting the validation data.'
    a: 0
    why: 'The longer a model trains on the same data, the more it can memorize noise. Early stopping, regularization and more varied data are the usual fixes for overfitting.'

  - id: d1-223
    c: fit-bias-fairness
    kind: match
    diff: 2
    q: 'Match each symptom to the diagnosis.'
    pairs:
      - ['Strong on training data, weak on validation data', 'Overfitting']
      - ['Weak on both training and validation data', 'Underfitting']
      - ['Similar, strong results on both data sets', 'Good fit']
      - ['Accurate overall but far worse for one age group', 'Unfair bias']
    why: 'The train-versus-validation gap shows overfitting, low scores everywhere show underfitting, and close strong scores mean a good fit. A subgroup that fares much worse points to bias.'

  - id: d1-224
    c: fit-bias-fairness
    kind: multi
    diff: 2
    q: 'Which statements about bias and fairness in ML are correct? (Choose TWO.)'
    o:
      - 'Bias can come from past human decisions captured in labels'
      - 'Unrepresentative training data can lead to biased predictions'
      - 'A very large dataset is automatically free of bias'
      - 'Fairness checks are only needed for generative AI'
      - 'Fixing overfitting also guarantees a fair model'
    a: [0, 1]
    why: 'Biased labels and skewed samples are the classic sources of unfair models. Size alone does not remove bias, fairness applies to every model type, and good fit is not the same as fairness.'

  # ------------------------------------------------ inference-types
  - id: d1-225
    c: inference-types
    kind: mcq
    diff: 1
    pre: true
    q: 'A mobile game wants to personalize the store screen the instant a player opens it. Traffic is steady all day. Which inference option fits BEST?'
    o:
      - 'Batch inference'
      - 'Asynchronous inference'
      - 'Real-time inference'
      - 'Serverless inference'
    a: 2
    why: 'An instant answer with steady traffic calls for an always-on real-time endpoint. Batch and async return results later, and serverless can add cold-start delays.'

  - id: d1-226
    c: inference-types
    kind: mcq
    diff: 3
    q: 'A tax-prep startup gets heavy model traffic in March and April and almost none the rest of the year. It can tolerate an occasional short startup delay. Which option has the LEAST cost and operational overhead?'
    o:
      - 'Serverless inference'
      - 'Real-time inference on dedicated instances'
      - 'A nightly batch transform job'
      - 'Asynchronous inference on a large instance'
    a: 0
    why: 'Serverless inference scales with demand, down to nothing when idle, and there are no instances to manage. Dedicated real-time instances would sit idle for ten months, and batch cannot answer users on demand.'

  - id: d1-227
    c: inference-types
    kind: multi
    diff: 1
    q: 'Which characteristics point to batch inference rather than real-time inference? (Choose TWO.)'
    o:
      - 'Predictions are needed for a whole dataset at once'
      - 'Results are not needed immediately'
      - 'Each user waits on screen for an answer'
      - 'Requests arrive one at a time all day'
      - 'Latency must be well under one second'
    a: [0, 1]
    why: 'Batch scores many records together when nobody is waiting. Users waiting on screen, steady single requests and tight latency all point to a real-time endpoint.'

  - id: d1-228
    c: inference-types
    kind: multi
    diff: 3
    q: 'A company uses Amazon SageMaker AI asynchronous inference. Which statements are correct? (Choose TWO.)'
    o:
      - 'Incoming requests are queued and processed as capacity allows'
      - 'It suits large payloads and long processing times'
      - 'The client must hold the connection open until the result returns'
      - 'It can only score an entire dataset in one scheduled job'
      - 'It needs a new training job for each request'
    a: [0, 1]
    why: 'Async inference queues requests and writes results to Amazon S3 when done, so clients do not wait on an open connection. Scoring a whole stored dataset in one job is batch transform.'

  - id: d1-229
    c: inference-types
    kind: tf
    diff: 2
    s: 'Batch inference keeps a persistent endpoint running around the clock so it can score a record at any moment.'
    v: false
    why: 'Batch inference spins up compute for the job, scores the dataset offline and then stops. An always-on endpoint describes real-time inference.'

  - id: d1-230
    c: inference-types
    kind: hallu
    diff: 2
    s:
      - 'Real-time inference suits a fraud check at checkout.'
      - 'Batch inference suits nightly scoring of every customer.'
      - 'Asynchronous inference is best when each user needs an answer in milliseconds.'
      - 'Serverless inference can have a cold start after idle time.'
    bad: 2
    o:
      - 'Asynchronous inference suits large, slow requests whose results can arrive later.'
      - 'Asynchronous inference only scores whole datasets once a month.'
      - 'Asynchronous inference runs with no compute at all.'
    a: 0
    why: 'Async means the answer comes back later, which is great for big, slow jobs and wrong for millisecond responses. Millisecond answers need a real-time endpoint.'

  - id: d1-231
    c: inference-types
    kind: duel
    diff: 3
    q: 'A ride-share app must show a fare estimate as soon as a rider enters a destination, with thousands of requests per minute all day. Which design is better?'
    A: 'Host the model on a real-time endpoint with auto scaling.'
    B: 'Run a batch transform job every hour and show the cached results.'
    a: 0
    why: 'Each fare depends on a destination nobody knew an hour ago, and the rider is waiting. That needs a low-latency real-time endpoint; batch results would be stale or missing.'

  - id: d1-232
    c: inference-types
    kind: mcq
    diff: 1
    q: 'Which Amazon SageMaker AI inference option means you choose no instance types at all, with capacity scaling to match incoming requests?'
    o:
      - 'Real-time inference'
      - 'Serverless inference'
      - 'Batch transform'
      - 'Asynchronous inference'
    a: 1
    why: 'With serverless inference you set memory and concurrency, and AWS provisions and scales the compute. Real-time, async and batch transform all run on instance types you pick.'

  # ------------------------------------------------ data-types
  - id: d1-233
    c: data-types
    kind: mcq
    diff: 1
    pre: true
    q: 'A team tags 10,000 X-ray images as "fracture" or "no fracture" to train a model. What has the team created?'
    o:
      - 'Unlabeled tabular data'
      - 'Labeled image data'
      - 'Time-series text data'
      - 'Structured graph data'
    a: 1
    why: 'Each image now carries its correct answer, which makes it labeled data, and the inputs are images. That is exactly what a supervised image classifier needs.'

  - id: d1-234
    c: data-types
    kind: mcq
    diff: 2
    q: 'A company has 200,000 product photos and needs people to tag the objects in each one to create training data. Which AWS service helps manage this labeling work?'
    o:
      - 'Amazon Rekognition'
      - 'Amazon SageMaker Feature Store'
      - 'Amazon SageMaker Clarify'
      - 'Amazon SageMaker Ground Truth'
    a: 3
    why: 'SageMaker Ground Truth manages labeling jobs with human workers and optional automated labeling. Rekognition analyzes images with its own models, Feature Store stores model inputs, and Clarify checks bias.'

  - id: d1-235
    c: data-types
    kind: multi
    diff: 1
    q: 'Which of these datasets are time-series data? (Choose TWO.)'
    o:
      - 'Hourly electricity use per building for three years'
      - 'Daily closing price of a stock for a decade'
      - 'A folder of customer profile photos'
      - 'A list of product names and colors'
      - 'A collection of support emails'
    a: [0, 1]
    why: 'Readings taken at regular time steps, where order matters, are time series. Photos, product lists and emails have no meaningful time order.'

  - id: d1-236
    c: data-types
    kind: mcq
    diff: 2
    q: 'A clinic wants to train a model, but privacy rules restrict use of real patient records. What type of data could it generate to mimic the statistics of real records?'
    o:
      - 'Time-series data'
      - 'Synthetic data'
      - 'Unlabeled data'
      - 'Streaming data'
    a: 1
    why: 'Synthetic data is artificially generated to resemble the patterns of real data without exposing real people. The other options describe data properties, not a privacy-safe substitute.'

  - id: d1-237
    c: data-types
    kind: tf
    diff: 2
    s: 'Images and free text cannot be used for machine learning until someone converts them by hand into rows and columns.'
    v: false
    why: 'Deep learning models learn directly from raw unstructured data like images, text and audio. Hand-building a table is not required.'

  - id: d1-238
    c: data-types
    kind: hallu
    diff: 2
    s:
      - 'Tabular data is organized in rows and columns.'
      - 'Time-series data is ordered by time.'
      - 'Labeled data is usually cheaper to get than unlabeled data.'
      - 'Audio recordings are unstructured data.'
    bad: 2
    o:
      - 'Labeling takes time and money, so labeled data is usually scarcer and costlier.'
      - 'Labeled data is free because the model labels it during inference.'
      - 'Labeled and unlabeled data always cost exactly the same.'
    a: 0
    why: 'Someone, often an expert, must attach the right answer to each example. That effort makes labeled data harder to get than raw unlabeled data.'

  - id: d1-239
    c: data-types
    kind: mcq
    diff: 3
    q: 'A retailer predicts weekly sales per store. It randomly shuffles all weekly rows before splitting into training and test sets, and test scores look unrealistically good. What is the MOST likely problem?'
    o:
      - 'Random splits leaked future weeks into training'
      - 'Unstructured data cannot be split for testing'
      - 'The task needed reinforcement learning instead'
      - 'The model needed more features from the same weeks'
    a: 0
    why: 'With time-series data, a random split lets the model train on weeks after the ones it is tested on. Split by time instead: train on the past, test on the future.'

  - id: d1-240
    c: data-types
    kind: match
    diff: 2
    q: 'Match each dataset to how structured it is.'
    pairs:
      - ['Customer records with the same fixed columns', 'Structured data']
      - ['Recorded calls and photos of receipts', 'Unstructured data']
      - ['JSON event logs whose fields vary by record', 'Semi-structured data']
    why: 'A fixed schema is structured. Audio and images have no schema at all. JSON has keys and tags but no rigid schema, so it is semi-structured.'

  # ------------------------------------------------ supervised-unsupervised-reinforcement
  - id: d1-241
    c: supervised-unsupervised-reinforcement
    kind: multi
    diff: 2
    pre: true
    q: 'Which tasks are examples of supervised learning? (Choose TWO.)'
    o:
      - 'Predicting house prices from past sales with known prices'
      - 'Routing tickets using past tickets tagged by department'
      - 'Grouping news articles by topic with no labels'
      - 'Teaching a robot arm to grasp through rewards'
      - 'Finding unusual patterns in unlabeled server logs'
    a: [0, 1]
    why: 'Both use historical examples with known answers, a price or a department, which is supervised. Unlabeled grouping and outlier hunting are unsupervised, and rewards mean reinforcement learning.'

  - id: d1-242
    c: supervised-unsupervised-reinforcement
    kind: mcq
    diff: 3
    q: 'Which scenario is NOT an example of unsupervised learning?'
    o:
      - 'Segmenting shoppers by behavior with no labels'
      - 'Predicting loan default from labeled past loans'
      - 'Flagging unusual sensor readings with no labels'
      - 'Reducing hundreds of features to a few for charts'
    a: 1
    why: 'Loans labeled as defaulted or repaid make this supervised classification. Unlabeled segmentation, unlabeled anomaly detection and dimensionality reduction are all unsupervised.'

  - id: d1-243
    c: supervised-unsupervised-reinforcement
    kind: mcq
    diff: 2
    q: 'A research team rewards a simulated car for staying in its lane and penalizes it for collisions. Over millions of tries, the car improves. In reinforcement learning terms, what is the car''s control software?'
    o:
      - 'The label'
      - 'The cluster'
      - 'The agent'
      - 'The feature'
    a: 2
    why: 'In reinforcement learning, the agent takes actions in an environment and learns from rewards and penalties. The simulator is the environment; there are no labels or clusters.'

  - id: d1-244
    c: supervised-unsupervised-reinforcement
    kind: mcq
    diff: 3
    q: 'Large language models are first pre-trained on huge amounts of raw text that nobody labeled. Which approach makes this possible?'
    o:
      - 'Self-supervised next-word prediction'
      - 'Reinforcement learning from game scores'
      - 'Supervised learning on hand-labeled text'
      - 'K-means clustering of documents'
    a: 0
    why: 'The text supplies its own targets: the model predicts the next or a hidden word and checks itself. That self-supervised setup needs no human labels, which is how pre-training scales.'

  - id: d1-245
    c: supervised-unsupervised-reinforcement
    kind: tf
    diff: 2
    s: 'Reinforcement learning from human feedback uses people''s rankings of model answers to build a reward signal for improving the model.'
    v: true
    why: 'In RLHF, humans compare or rank responses, a reward model learns those preferences, and reinforcement learning tunes the model toward answers people prefer.'

  - id: d1-246
    c: supervised-unsupervised-reinforcement
    kind: hallu
    diff: 2
    s:
      - 'Supervised learning compares predictions with known labels.'
      - 'Unsupervised learning can find clusters without labels.'
      - 'Semi-supervised learning uses only fully labeled data.'
      - 'Reinforcement learning uses rewards and penalties.'
    bad: 2
    o:
      - 'Semi-supervised learning mixes a little labeled data with lots of unlabeled data.'
      - 'Semi-supervised learning uses only rewards from an environment.'
      - 'Semi-supervised learning uses no data at all.'
    a: 0
    why: 'Semi-supervised learning is the middle ground: a small labeled set guides learning from a much larger unlabeled set. Handy when labeling everything is too costly.'

  - id: d1-247
    c: supervised-unsupervised-reinforcement
    kind: match
    diff: 1
    q: 'Match each learning type to the feedback it learns from.'
    pairs:
      - ['Supervised learning', 'Known correct labels']
      - ['Unsupervised learning', 'No labels, only structure in the data']
      - ['Reinforcement learning', 'Rewards and penalties for actions']
    why: 'Labels guide supervised learning, unsupervised learning finds structure on its own, and reinforcement learning improves from reward signals.'

  - id: d1-248
    c: supervised-unsupervised-reinforcement
    kind: multi
    diff: 3
    q: 'A bank has 2 million transactions, and only 1 percent are labeled fraud or legitimate. Which statements are correct? (Choose TWO.)'
    o:
      - 'Semi-supervised learning can use both labeled and unlabeled records'
      - 'Unsupervised anomaly detection can flag unusual records without labels'
      - 'Supervised learning cannot use the labeled 1 percent at all'
      - 'Reinforcement learning is required whenever labels are scarce'
      - 'Unlabeled records must be deleted before any training'
    a: [0, 1]
    why: 'Scarce labels suit semi-supervised learning, and anomaly detection works with no labels. The labeled slice is still usable, and reinforcement learning needs an environment with rewards, not just few labels.'

  # ------------------------------------------------ ai-value-and-limits
  - id: d1-249
    c: ai-value-and-limits
    kind: mcq
    diff: 1
    pre: true
    q: 'A bank reviews 2 million loan documents a year for missing fields, and 40 analysts spend most of their time on it. Which AI benefit is MOST relevant?'
    o:
      - 'Guaranteeing zero errors on every document'
      - 'Scaling and automating high-volume work'
      - 'Removing the need for any human oversight'
      - 'Avoiding the need for any training data'
    a: 1
    why: 'High-volume, repetitive review is where AI scales and automates. AI does not guarantee zero errors, still benefits from human oversight, and needs data.'

  - id: d1-250
    c: ai-value-and-limits
    kind: mcq
    diff: 3
    q: 'An executive at a retailer says, "We need AI." Which is the BEST first step before choosing any model?'
    o:
      - 'Define the problem and a success metric'
      - 'Pick the largest foundation model available'
      - 'Reserve GPU instances for training'
      - 'Label every record in the data lake'
    a: 0
    why: 'Start with the business problem and how success will be measured. That decides whether ML fits at all, which data matters, and what to build. Hardware and labeling come later.'

  - id: d1-251
    c: ai-value-and-limits
    kind: multi
    diff: 2
    q: 'Which situations suggest ML is NOT a good fit? (Choose TWO.)'
    o:
      - 'The result must follow an exact, known formula every time'
      - 'Running the model would cost more than the value it adds'
      - 'There are millions of records with complex patterns'
      - 'The rules are too complex for people to write by hand'
      - 'The task involves sorting free-text messages'
    a: [0, 1]
    why: 'Exact formulas belong in code, and a model that costs more than it returns fails the cost-benefit test. Complex patterns at scale and messy text are where ML shines.'

  - id: d1-252
    c: ai-value-and-limits
    kind: mcq
    diff: 2
    q: 'A small bakery has 40 rows of sales history and wants a demand forecast. A consultant proposes a custom deep learning model. What is the MAIN concern?'
    o:
      - 'Too little data for the cost to pay off'
      - 'Deep learning cannot predict numbers'
      - 'Forecasts require reinforcement learning'
      - 'Sales history is always unstructured'
    a: 0
    why: 'Deep models need lots of data, and the build and hosting costs would dwarf the benefit for a tiny bakery. A simple method or spreadsheet trend would do.'

  - id: d1-253
    c: ai-value-and-limits
    kind: tf
    diff: 2
    s: 'Once an ML model is highly accurate, high-impact decisions such as loan denials no longer need any human review.'
    v: false
    why: 'ML predictions are probabilistic, so even a good model is sometimes wrong. High-impact decisions often keep a human in the loop to review, explain and correct outcomes.'

  - id: d1-254
    c: ai-value-and-limits
    kind: hallu
    diff: 2
    s:
      - 'AI can assist people by ranking cases for review.'
      - 'AI can scale analysis to volumes people cannot handle.'
      - 'A good ML model gives the exact right answer every time, like a calculator.'
      - 'ML projects need quality data to deliver value.'
    bad: 2
    o:
      - 'ML predictions are probabilistic and can be wrong, unlike a fixed formula.'
      - 'ML returns random answers with no patterns at all.'
      - 'ML only works when there is no data available.'
    a: 0
    why: 'Models estimate likely answers from patterns, so some predictions miss. When you need a guaranteed exact answer, a calculator beats me. Dale says that is most days.'

  - id: d1-255
    c: ai-value-and-limits
    kind: duel
    diff: 3
    q: 'Dale wants to route 10,000 free-text support emails a day to the right team. Which approach is better?'
    A: 'Write keyword if-then rules for every possible way a customer might phrase a request.'
    B: 'Train a text classifier on past emails that agents already routed, and send low-confidence cases to a person.'
    a: 1
    why: 'Free text varies too much for hand-written rules to cover. Learning from labeled history scales, and a human check on low-confidence cases manages the risk of wrong guesses.'

  - id: d1-256
    c: ai-value-and-limits
    kind: mcq
    diff: 3
    q: 'Which project is the STRONGEST candidate for ML rather than traditional code?'
    o:
      - 'Converting Celsius readings to Fahrenheit'
      - 'Applying a fixed sales tax rate to each order total'
      - 'Predicting machine failures from sensor history'
      - 'Checking that passwords meet length rules'
    a: 2
    why: 'Failure prediction depends on subtle patterns in historical data, which is what ML learns. The other three are exact, known rules that plain code handles perfectly.'

  # ------------------------------------------------ regression-classification-clustering
  - id: d1-257
    c: regression-classification-clustering
    kind: mcq
    diff: 1
    pre: true
    q: 'An airline wants to predict how many minutes each flight will be delayed. Which technique fits?'
    o:
      - 'Binary classification'
      - 'Clustering'
      - 'Multiclass classification'
      - 'Regression'
    a: 3
    why: 'Minutes of delay is a continuous number, so this is regression. Classification would only say delayed or on time, or pick a delay bucket.'

  - id: d1-258
    c: regression-classification-clustering
    kind: mcq
    diff: 2
    q: 'A support center wants to assign each ticket to one of eight departments, using past tickets that agents already routed. Which technique fits BEST?'
    o:
      - 'Multiclass classification'
      - 'Binary classification'
      - 'Linear regression'
      - 'K-means clustering of past tickets'
    a: 0
    why: 'Eight possible categories with labeled history is multiclass classification. Binary means only two classes, regression predicts numbers, and k-means is for unlabeled grouping.'

  - id: d1-259
    c: regression-classification-clustering
    kind: mcq
    diff: 3
    q: 'An insurer wants to predict whether each claim is fraudulent, and also how large each payout will be. Which pair of techniques fits?'
    o:
      - 'Regression for fraud, classification for payout'
      - 'Classification for fraud, regression for payout'
      - 'Clustering for fraud, clustering for payout'
      - 'Regression for fraud and for payout'
    a: 1
    why: 'Fraud or not is a category, so classification. Payout amount is a number, so regression. The swapped option is the trap: always ask whether the target is a label or a number.'

  - id: d1-260
    c: regression-classification-clustering
    kind: multi
    diff: 2
    q: 'Which problems are clustering problems? (Choose TWO.)'
    o:
      - 'Grouping news articles by similarity, with no topic labels'
      - 'Segmenting customers by purchase behavior, with no labels'
      - 'Predicting a customer''s exact annual spend'
      - 'Marking X-rays normal or abnormal from labeled scans'
      - 'Estimating delivery time in minutes'
    a: [0, 1]
    why: 'Grouping similar items without labels is clustering. Annual spend and delivery time are regression, and labeled normal-or-abnormal scans are classification.'

  - id: d1-261
    c: regression-classification-clustering
    kind: tf
    diff: 2
    s: 'Despite its name, logistic regression is commonly used for classification problems with yes or no outcomes.'
    v: true
    why: 'Logistic regression outputs the probability of a class, then a threshold turns it into yes or no. It is a classic binary classification algorithm.'

  - id: d1-262
    c: regression-classification-clustering
    kind: hallu
    diff: 2
    s:
      - 'Predicting a temperature is a regression task.'
      - 'K-means is a common clustering algorithm.'
      - 'Binary classification chooses among three or more categories.'
      - 'Classifiers often output a probability for each class.'
    bad: 2
    o:
      - 'Binary classification chooses between exactly two categories.'
      - 'Binary classification predicts a continuous number.'
      - 'Binary classification groups records that have no labels.'
    a: 0
    why: 'Binary means two: spam or not, fraud or not. Three or more categories is multiclass classification.'

  - id: d1-263
    c: regression-classification-clustering
    kind: match
    diff: 2
    q: 'Match each retail problem to the technique.'
    pairs:
      - ['Predict next quarter''s revenue in dollars', 'Regression']
      - ['Tag each review as positive, neutral or negative', 'Multiclass classification']
      - ['Decide whether a customer will churn, yes or no', 'Binary classification']
      - ['Group stores with similar sales patterns, no labels', 'Clustering']
    why: 'Dollars are a number, three sentiment labels are multiclass, yes or no is binary, and unlabeled grouping is clustering.'

  - id: d1-264
    c: regression-classification-clustering
    kind: mcq
    diff: 3
    q: 'A marketing team has no customer labels. It first groups customers by behavior, names each group, and then trains a model to place new customers into those groups. Which sequence of techniques is this?'
    o:
      - 'Classification first, then clustering'
      - 'Regression first, then clustering'
      - 'Clustering first, then classification'
      - 'Classification first, then regression'
    a: 2
    why: 'Discovering the groups without labels is clustering. Once each customer has a group name, those become labels, and assigning new customers is classification.'

  # ------------------------------------------------ ai-real-world-applications
