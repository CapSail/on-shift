    kind: multi
    diff: 3
    q: 'A factory needs a model that predicts machine failure from sensor tables. It must run on a low-power device on the factory floor with millisecond latency. Which factors favor traditional ML over a foundation model? (Choose TWO.)'
    o:
      - 'Tight latency and limited compute at the edge'
      - 'The task is a narrow prediction on structured data'
      - 'The task needs open-ended text generation'
      - 'Operators want to chat with it in many languages'
      - 'The team wants to avoid having any training data'
    a: [0, 1]
    why: 'Operational constraints like low latency and small hardware, plus a narrow tabular task, favor a small traditional model. Open-ended text and multilingual chat are FM strengths.'

  - id: d1-056
    c: traditional-ml-vs-fm
    kind: duel
    diff: 1
    q: 'A support team wants to draft personalized replies to free-text customer emails. Which approach is better?'
