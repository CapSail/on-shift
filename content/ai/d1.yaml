# Domain 1: Fundamentals of AI and ML (20%). Tasks 1.1, 1.2, 1.3.
# Ids are stable forever: never renumber or reuse a card id.

concepts:
  # ------------------------------------------------------------ 1.1
  - id: ai-ml-dl-genai-agentic
    task: '1.1'
    name: 'AI, ML, deep learning, GenAI, agents'
    rule: 'AI contains ML, ML contains deep learning; GenAI and agents build on deep learning.'
    learn:
      - 'AI is any technique that lets machines do tasks needing human-like intelligence. ML is AI that learns patterns from data instead of hand-written rules.'
      - 'Deep learning is ML using neural networks: layers of connected nodes. GenAI uses deep models, like large language models (LLMs), to create new content.'
      - 'Agentic AI goes further: a foundation model plans steps, calls tools and takes actions toward a goal with limited human input.'
    soc: 'AI is the whole SOC; ML is detection tuning learned from history; agentic AI is the analyst who also runs the playbook.'
    say: 'Think nesting dolls. Artificial intelligence is the biggest doll. Machine learning sits inside it and learns from data. Deep learning sits inside that and uses neural networks. Generative AI uses deep models to create new text, images or code. Agentic AI uses those models to plan and take actions toward a goal.'

  - id: model-training-inference
    task: '1.1'
    name: 'Algorithms, models, training, inference'
    rule: 'An algorithm learns during training to produce a model; inference uses that model.'
    learn:
      - 'An algorithm is the learning procedure, like linear regression or a neural network design. Training runs it on data to produce a model.'
      - 'A model is the trained artifact: learned parameters that map inputs to outputs. It is the thing you deploy.'
      - 'Inference is using the trained model to predict on new data. Training is costly and occasional; inference happens on every request.'
    soc: 'Writing and tuning a detection rule from past incidents is training; that rule firing on live logs is inference.'
    say: 'An algorithm is the recipe for learning. Training feeds data through that recipe and produces a model, which is a file of learned numbers. Inference is when you send new data to that model and get a prediction back. Training happens now and then. Inference happens every time someone uses it.'

  - id: fit-bias-fairness
    task: '1.1'
    name: 'Fit, bias and fairness'
    rule: 'Overfit memorizes training data; underfit misses patterns; fairness means no group is unjustly disadvantaged.'
    learn:
      - 'Overfitting: great on training data, poor on new data (high variance). Underfitting: poor on both because the model is too simple (high bias).'
      - 'A good fit generalizes: it performs about as well on unseen validation data as on training data.'
      - 'Bias also means skewed outcomes, often from unrepresentative data. Fairness means predictions do not unjustly disadvantage groups, such as by age or gender.'
    soc: 'An overfit rule only catches last month''s exact attack; an underfit rule alerts on everything; a biased rule over-flags one office.'
    say: 'Fit is about how well a model generalizes. Overfitting means it memorized the training data and fails on new data. Underfitting means it is too simple and does badly everywhere. Bias can also mean skewed results from unbalanced data. Fairness means the model treats different groups of people equitably.'

  - id: inference-types
    task: '1.1'
    name: 'Inference types'
    rule: 'Real-time: instant. Batch: big offline jobs. Async: large, slow requests. Serverless: intermittent traffic.'
    learn:
      - 'Real-time inference: a persistent endpoint answers each request with low latency, for interactive apps like fraud checks at checkout.'
      - 'Batch inference scores a whole dataset offline, no persistent endpoint. Asynchronous inference queues requests for large payloads and long processing; results arrive later.'
      - 'Serverless inference: no instances to manage, scales automatically, even to zero between bursts. Expect a cold-start delay after idle periods.'
    soc: 'Real-time is the live alert queue; batch is the overnight threat-hunt report; async is sandbox detonation results arriving later.'
    say: 'There are four ways to serve predictions. Real time means an always-on endpoint answers instantly. Batch means scoring a big pile of data offline, like overnight. Asynchronous means requests wait in a queue and results come back later, good for big or slow jobs. Serverless means no servers to manage, good for traffic that comes and goes.'

  - id: data-types
    task: '1.1'
    name: 'Data types'
    rule: 'Labeled data has answers attached; structured fits rows and columns; unstructured does not.'
    learn:
      - 'Labeled data includes the target answer, like spam or not spam. Unlabeled data has no answers; it is cheaper but cannot train supervised models.'
      - 'Structured data fits a fixed schema, like tabular rows and columns. Unstructured data, like free text, images and audio, has no fixed schema.'
      - 'Time-series data is ordered by timestamp, such as daily sales or sensor readings. The order itself carries meaning.'
    soc: 'A triaged alert marked true or false positive is labeled data; untriaged logs are unlabeled; a SIEM table is structured; phishing email bodies are unstructured.'
    say: 'Labeled data comes with the answer attached, like emails tagged spam or not spam. Unlabeled data has no answers. Structured data fits neatly into rows and columns, like a spreadsheet. Unstructured data, like free text, photos and audio, does not. Time series data is a sequence of readings over time, where the order matters.'

  - id: supervised-unsupervised-reinforcement
    task: '1.1'
    name: 'Supervised, unsupervised, reinforcement'
    rule: 'Supervised learns from labels, unsupervised finds hidden structure, reinforcement learns from rewards.'
    learn:
      - 'Supervised learning trains on labeled examples to predict a known target. Classification and regression are supervised.'
      - 'Unsupervised learning finds patterns in unlabeled data, such as clustering customers into segments or spotting anomalies.'
      - 'Reinforcement learning: an agent acts in an environment and learns by trial and error to maximize reward, as in robot navigation or game play.'
    soc: 'Supervised: training on tickets already marked true positive. Unsupervised: UEBA flagging behavior unlike the baseline. Reinforcement: learning which actions earn praise from Dale.'
    say: 'Supervised learning learns from examples that already have the right answer. Unsupervised learning gets no answers and finds groups or oddities on its own. Reinforcement learning has an agent try actions, get rewards or penalties, and slowly learn the best strategy, like a game player getting better with practice.'

  # ------------------------------------------------------------ 1.2
  - id: ai-value-and-limits
    task: '1.2'
    name: 'When AI/ML fits, and when it does not'
    rule: 'Use ML for patterns at scale; use plain rules when you need exact, deterministic answers.'
    learn:
      - 'AI/ML adds value by assisting human decisions, scaling work beyond what people can review, and automating repetitive tasks.'
      - 'ML gives probabilistic predictions. If a task needs one exact, deterministic outcome, like applying a fixed fee, use traditional code.'
      - 'Weigh cost against benefit: data, training, hosting and upkeep must cost less than the value delivered. Without enough quality data, ML may not pay off.'
    soc: 'ML can help rank thousands of alerts, but blocking a known-bad hash should be a deterministic rule, not a guess.'
    say: 'Machine learning shines when there are patterns in lots of data and you need to scale, automate, or help people decide. It is the wrong tool when you need one exact answer every time, like adding up an invoice, or when building and running it costs more than the value it brings.'

  - id: regression-classification-clustering
    task: '1.2'
    name: 'Regression, classification, clustering'
    rule: 'Regression predicts a number, classification predicts a category, clustering groups unlabeled data.'
    learn:
      - 'Regression predicts a continuous number: a house price, next week''s demand, a delivery time.'
      - 'Classification predicts a category: spam or not, fraud or legitimate, which product type. Binary means two classes; multiclass means more.'
      - 'Clustering groups similar items without labels, such as customer segments. Clustering is unsupervised; regression and classification are supervised.'
    soc: 'Regression estimates a risk score number; classification says malicious or benign; clustering groups similar alerts into one campaign.'
    say: 'Three classic techniques. Regression predicts a number, like a price or a temperature. Classification predicts a category, like spam or not spam. Clustering takes data with no labels and puts similar things into groups, like sorting customers into segments. If the answer is a number, think regression. If it is a label, think classification.'

  - id: ai-real-world-applications
    task: '1.2'
    name: 'Real-world AI applications'
    rule: 'Match the data to the job: images to vision, text to NLP, audio to speech.'
    learn:
      - 'Computer vision interprets images and video, like defect detection. Natural language processing (NLP) understands and generates text. Speech recognition turns audio into text.'
      - 'Recommendation systems suggest items from behavior. Fraud detection flags unusual transactions. Forecasting predicts future values, like demand, from historical time-series data.'
      - 'Knowledge bases let AI answer from company documents. Agentic AI completes multi-step tasks, such as processing a refund across several systems.'
    soc: 'Fraud detection is your impossible-travel alert; a knowledge base is the runbook wiki an assistant searches for you.'
    say: 'AI shows up everywhere. Computer vision reads images, like spotting defects on a production line. Natural language processing understands text. Speech recognition turns talk into text. Recommendation systems suggest products. Fraud detection flags odd transactions. Forecasting predicts demand. Knowledge bases let assistants answer from your documents, and agents complete multi-step tasks.'

  - id: aws-managed-ai-services
    task: '1.2'
    name: 'AWS managed AI services'
    rule: 'Transcribe hears, Polly speaks, Translate converts, Comprehend understands, Lex chats, SageMaker AI builds.'
    learn:
      - 'Amazon Transcribe: speech to text. Amazon Polly: text to lifelike speech. Amazon Translate: neural machine translation between languages.'
      - 'Amazon Comprehend: NLP on text, such as sentiment, entities, key phrases, language and PII detection. Amazon Lex: chatbots that understand voice and text.'
      - 'Amazon SageMaker AI: a fully managed service to build, train, tune and deploy your own ML models at scale.'
    soc: 'Like your tooling stack: each service does one job well, and SageMaker AI is the lab where you build custom detections.'
    say: 'Six services to know. Transcribe turns speech into text. Polly turns text into speech. Translate converts text between languages. Comprehend reads text and finds sentiment, names, and key phrases. Lex builds chatbots that understand voice and text. SageMaker AI is the workshop for building, training, and deploying your own custom models.'

  - id: traditional-ml-vs-fm
    task: '1.2'
    name: 'Traditional ML vs foundation models'
    rule: 'Pick traditional ML for explainability, tight latency, low cost; FMs for broad language tasks.'
    learn:
      - 'Foundation models (FMs) are large, general-purpose models pre-trained on broad data and adaptable to many tasks, often with little task-specific data.'
      - 'Traditional ML, like a decision tree on tabular data, is smaller, cheaper and faster to run, and easier to explain.'
      - 'Regulated decisions needing clear explanations, strict latency or edge constraints, and narrow tabular predictions often favor traditional ML over an FM.'
    soc: 'A tuned correlation rule is cheap and auditable; an LLM copilot is flexible but harder to explain to the auditor.'
    say: 'Foundation models are huge general models that can write, summarize, and chat with little extra training. Traditional machine learning models are smaller and focused on one job, like scoring loan risk from a table. When regulators need clear explanations, when answers must be very fast or cheap, or when the data is a simple table, traditional models often win.'

  # ------------------------------------------------------------ 1.3
  - id: ml-pipeline-stages
    task: '1.3'
    name: 'ML pipeline stages'
    rule: 'Collect, explore, prepare, engineer features, train, tune, evaluate, deploy, monitor, then repeat.'
    learn:
      - 'Data collection gathers raw data. Exploratory data analysis (EDA) uses statistics and charts to understand it. Pre-processing cleans it: missing values, duplicates, formats.'
      - 'Feature engineering creates or selects useful inputs. Training fits the model; hyperparameter tuning searches settings like learning rate for the best result.'
      - 'Evaluation tests on held-out data. Deployment serves the model. Monitoring watches for drift and quality drops, which triggers retraining.'
    soc: 'Collect logs, explore them, normalize fields, build enrichments, write the rule, tune thresholds, test, push to the SIEM, watch false positives.'
    say: 'A machine learning pipeline runs like this. Collect data. Explore it to understand it. Clean it up. Engineer features, meaning the useful inputs. Train the model. Tune its settings, called hyperparameters. Evaluate it on data it never saw. Deploy it. Then monitor it, because the world changes and the model will need retraining.'

  - id: fm-sourcing-and-serving
    task: '1.3'
    name: 'Model sources, hosting and AWS tools'
    rule: 'Use pre-trained or custom models, via a managed API or your own hosted endpoint.'
    learn:
      - 'Model sources: open-source pre-trained models you adapt, for example from SageMaker JumpStart, or custom models you train yourself, which needs far more data and compute.'
      - 'Managed API, like Amazon Bedrock: call FMs with no servers to manage. Self-hosted: deploy a model to an endpoint you control, like SageMaker AI.'
      - 'SageMaker AI covers the full ML lifecycle. Amazon Quick brings BI and AI agents to business users. Kiro is an agentic IDE using spec-driven development.'
    soc: 'A managed API is like a SaaS SIEM: just send data. Self-hosting is running your own SIEM cluster: more control, more patching.'
    say: 'Start from an open source pre-trained model, or train your own custom model, which takes far more data and money. In production, call it through a managed service like Amazon Bedrock, or host it on your own endpoint, like SageMaker AI. Amazon Quick gives business users dashboards and AI agents. Kiro is an AI coding tool.'

  - id: mlops-fundamentals
    task: '1.3'
    name: 'MLOps fundamentals'
    rule: 'MLOps makes ML repeatable, scalable, monitored and retrained, like DevOps for models.'
    learn:
      - 'Track experiments (data, code, parameters, results) so runs can be compared and reproduced. Automate repeatable pipelines, for example with Amazon SageMaker Pipelines.'
      - 'Production readiness: version models in a registry, test, scale serving, and avoid technical debt like untracked one-off scripts and manual steps.'
      - 'Monitor live models for data and quality drift, for example with SageMaker Model Monitor. When performance drops, retrain on fresh data and redeploy.'
    soc: 'Like detection-as-code: version-controlled rules, automated tests, a deploy pipeline, and re-tuning when false positives creep up.'
    say: 'MLOps is DevOps for machine learning. Track every experiment so you can repeat it. Automate the pipeline so training is the same every time. Version your models. Design for scale. Avoid messy one-off scripts, which are technical debt. Then watch the live model, because data drifts, and retrain it when quality drops.'

  - id: precision-recall-f1
    task: '1.3'
    name: 'Model metrics and business metrics'
    rule: 'Precision: flagged items that are real. Recall: real cases caught. F1 balances both.'
    learn:
      - 'Accuracy: share of all predictions that are correct; misleading on imbalanced data. Precision: of the items flagged positive, how many truly were.'
      - 'Recall: of all real positives, how many the model caught. F1 score is the harmonic mean of precision and recall.'
      - 'Business metrics judge value: cost per user, development costs, customer feedback and ROI. A great F1 means little if ROI is negative.'
    soc: 'Low precision floods the queue with false positives; low recall means real intrusions slip by with no alert.'
    say: 'Accuracy is how often the model is right overall, but it misleads when one class is rare. Precision asks: of everything flagged, how much was real? Recall asks: of everything real, how much did we catch? F1 balances the two. Then check business metrics, like cost per user, development cost, customer feedback, and return on investment.'

cards:
  # ------------------------------------------------ ai-ml-dl-genai-agentic
  - id: d1-001
    c: ai-ml-dl-genai-agentic
    kind: tf
    diff: 1
    pre: true
    s: 'Every machine learning system is a kind of AI, but not every AI system uses machine learning.'
    v: true
    why: 'ML is a subset of AI. A rule-based expert system is AI that follows hand-written rules without learning from data.'

  - id: d1-002
    c: ai-ml-dl-genai-agentic
    kind: mcq
    diff: 1
    q: 'A company wants a system that writes first drafts of marketing emails from a short product description. Which category of AI does this describe?'
    o:
      - 'Generative AI'
      - 'Reinforcement learning'
      - 'Clustering'
      - 'Computer vision'
    a: 0
    why: 'Creating new content such as text is generative AI. Clustering groups existing data, reinforcement learning learns from rewards, and computer vision interprets images.'

  - id: d1-003
    c: ai-ml-dl-genai-agentic
    kind: hallu
    diff: 2
    s:
      - 'Deep learning uses neural networks with many layers.'
      - 'Large language models are a type of deep learning model.'
      - 'Generative AI is a separate field that does not use machine learning at all.'
      - 'Agentic AI can plan steps and call tools to reach a goal.'
    bad: 2
    o:
      - 'Generative AI is a subset of deep learning, which is part of ML.'
      - 'Generative AI is a type of hand-written rule-based expert system.'
      - 'Generative AI only creates images, never text or code.'
    a: 0
    why: 'GenAI models such as LLMs and diffusion models are deep neural networks trained on data, so GenAI sits inside ML, not outside it.'

  - id: d1-004
    c: ai-ml-dl-genai-agentic
    kind: multi
    diff: 3
    q: 'A team is comparing agentic AI with a basic LLM chatbot that only answers questions. Which capabilities are characteristic of agentic AI? (Choose TWO.)'
    o:
      - 'Breaking a goal into multiple steps and planning them'
      - 'Calling external tools or APIs to take actions'
      - 'Guaranteeing identical output for every request'
      - 'Learning a task without any training data'
      - 'Working without any underlying foundation model'
    a: [0, 1]
    why: 'Agents use a foundation model to reason, plan multi-step work and act through tools. They are still nondeterministic and still rely on a model trained on data.'

  - id: d1-005
    c: ai-ml-dl-genai-agentic
    kind: tf
    diff: 1
    s: 'Deep learning is a separate branch of AI that does not count as machine learning.'
    v: false
    why: 'Deep learning is a subset of ML that uses multi-layer neural networks. It learns from data like any other ML.'

  # ------------------------------------------------ model-training-inference
  - id: d1-006
    c: model-training-inference
    kind: tf
    diff: 1
    pre: true
    s: 'Inference is the step where a trained model makes predictions on new data it has not seen before.'
    v: true
    why: 'Training builds the model from historical data. Inference applies the finished model to new inputs, such as scoring a live transaction.'

  - id: d1-007
    c: model-training-inference
    kind: mcq
    diff: 1
    q: 'A data scientist runs the XGBoost algorithm on two years of labeled sales data and saves the resulting artifact to Amazon S3. What is the saved artifact?'
    o:
      - 'A trained model'
      - 'A feature store'
      - 'An inference endpoint'
      - 'A training dataset'
    a: 0
    why: 'Running an algorithm on data during training produces a model artifact of learned parameters. An endpoint is where a model is later hosted for inference.'

  - id: d1-008
    c: model-training-inference
    kind: hallu
    diff: 2
    s:
      - 'An algorithm is the method used to learn from data.'
      - 'A model is the output of training an algorithm on data.'
      - 'Inference updates the model weights every time it makes a prediction.'
      - 'Training usually needs far more compute than one inference request.'
    bad: 2
    o:
      - 'Inference uses fixed weights; changing them requires training or retraining.'
      - 'Inference only happens while the model is still being trained.'
      - 'Inference deletes the old model and builds a new one each time.'
    a: 0
    why: 'Serving a prediction does not change the model. New learning only happens when you train or retrain, then redeploy.'

  - id: d1-009
    c: model-training-inference
    kind: match
    diff: 1
    q: 'Match each term to its description.'
    pairs:
      - ['Algorithm', 'The learning procedure applied to data']
      - ['Model', 'The trained artifact holding learned parameters']
      - ['Training', 'Fitting parameters using historical data']
      - ['Inference', 'Using the trained artifact on new inputs']
    why: 'An algorithm plus data, through training, gives a model. The model is then used for inference on new data.'

  - id: d1-010
    c: model-training-inference
    kind: tf
    diff: 2
    s: 'A neural network is a fixed set of if-then rules that an expert writes by hand.'
    v: false
    why: 'A neural network is layers of connected nodes whose weights are learned from data during training. Hand-written if-then rules describe a traditional expert system.'

  # ------------------------------------------------ fit-bias-fairness
  - id: d1-011
    c: fit-bias-fairness
    kind: tf
    diff: 1
    pre: true
    s: 'A model that scores 99 percent on training data but 60 percent on new data is most likely overfitting.'
    v: true
    why: 'A large gap between training and unseen-data performance is the classic sign of overfitting: the model memorized noise instead of general patterns.'

  - id: d1-012
    c: fit-bias-fairness
    kind: mcq
    diff: 2
    q: 'A model performs poorly on both its training data and its validation data. Which issue is the MOST likely cause?'
    o:
      - 'Underfitting'
      - 'Overfitting'
      - 'Data leakage'
      - 'Model drift'
    a: 0
    why: 'Poor results on both sets mean the model is too simple to capture the pattern (high bias). Overfitting shows strong training scores but weak validation scores.'

  - id: d1-013
    c: fit-bias-fairness
    kind: hallu
    diff: 2
    s:
      - 'Overfitting means the model memorized noise in the training data.'
      - 'Underfitting often means the model is too simple.'
      - 'More diverse training data can help reduce overfitting.'
      - 'A model is fair as long as its overall accuracy is high.'
    bad: 3
    o:
      - 'High overall accuracy can hide much worse results for specific groups.'
      - 'Fairness only matters for image models, not tabular ones.'
      - 'A model is fair as long as the dataset is very large.'
    a: 0
    why: 'A model can be accurate on average yet systematically worse for a subgroup. Checking fairness needs per-group analysis, not one overall score.'

  - id: d1-014
    c: fit-bias-fairness
    kind: multi
    diff: 3
    q: 'A loan approval model rejects applicants from one region far more often than others. The training data contains few examples from that region. Which actions would help address this? (Choose TWO.)'
    o:
      - 'Collect more representative data from the underrepresented region'
      - 'Measure model performance separately for each subgroup'
      - 'Train for more epochs on the same dataset'
      - 'Remove the validation dataset to use more training data'
      - 'Switch the endpoint from real-time to batch inference'
    a: [0, 1]
    why: 'Unrepresentative data causes the bias. More representative data and subgroup metrics tackle it. More epochs on the same skewed data can deepen overfitting, and inference mode does not change fairness.'

  - id: d1-015
    c: fit-bias-fairness
    kind: tf
    diff: 2
    s: 'Underfitting happens when a model is so complex that it memorizes the training data.'
    v: false
    why: 'That describes overfitting. Underfitting is the opposite: the model is too simple and misses real patterns, so it does poorly even on training data.'

  # ------------------------------------------------ inference-types
  - id: d1-016
    c: inference-types
    kind: mcq
    diff: 1
    pre: true
    q: 'A retailer needs product recommendations for all 2 million customers once every night. Results are not needed until the next morning. Which inference type is MOST cost-effective?'
    o:
      - 'Batch inference'
      - 'Real-time inference'
      - 'Serverless inference'
      - 'Asynchronous inference'
    a: 0
    why: 'Scoring a full dataset on a schedule with no latency requirement is batch inference. No endpoint has to stay running, which keeps cost low.'

  - id: d1-017
    c: inference-types
    kind: mcq
    diff: 2
    q: 'A company runs a document-analysis model. Each request has a large payload and can take several minutes to process. Users can wait for results. Which Amazon SageMaker AI inference option fits BEST?'
    o:
      - 'Asynchronous inference'
      - 'Real-time inference'
      - 'Serverless inference'
      - 'SageMaker AI batch transform'
    a: 0
    why: 'Asynchronous inference queues requests, accepts large payloads and long processing times, and returns results later. Real-time and serverless target quick responses; batch transform suits whole offline datasets, not individual user requests.'

  - id: d1-018
    c: inference-types
    kind: hallu
    diff: 2
    s:
      - 'Real-time inference keeps an endpoint ready for low-latency responses.'
      - 'Batch inference processes many records at once, offline.'
      - 'Serverless inference requires you to choose and manage the server instances.'
      - 'Asynchronous inference queues requests and returns results later.'
    bad: 2
    o:
      - 'Serverless inference provisions and scales compute for you, even down to zero.'
      - 'Serverless inference can only run scheduled batch jobs.'
      - 'Serverless inference requires a GPU cluster that you patch.'
    a: 0
    why: 'With serverless inference, AWS manages the compute and scales with traffic. The tradeoff is a possible cold start after idle time.'

  - id: d1-019
    c: inference-types
    kind: tf
    diff: 2
    s: 'Serverless inference suits an app with long idle periods between bursts of traffic, if it can tolerate occasional cold starts.'
    v: true
    why: 'Serverless scales to zero when idle, so you do not pay for an idle endpoint. The first request after idle time may see a cold-start delay.'

  - id: d1-020
    c: inference-types
    kind: match
    diff: 3
    q: 'Match each workload to the best inference type.'
    pairs:
      - ['Fraud score during card checkout', 'Real-time inference']
      - ['Monthly churn scores for every customer', 'Batch inference']
      - ['One large file per request, minutes to process', 'Asynchronous inference']
      - ['Internal tool used a few times a day', 'Serverless inference']
    why: 'Instant answers need real-time. Whole datasets on a schedule are batch. Big, slow single requests are async. Rare, spiky use suits serverless.'

  # ------------------------------------------------ data-types
  - id: d1-021
    c: data-types
    kind: tf
    diff: 1
    pre: true
    s: 'A spreadsheet of customer records with columns for age, region and monthly spend is structured, tabular data.'
    v: true
    why: 'Rows and columns with a fixed schema are the definition of structured, tabular data.'

  - id: d1-022
    c: data-types
    kind: mcq
    diff: 1
    q: 'A manufacturer records each machine''s temperature every 10 seconds and wants to predict failures from recent trends. Which type of data is this?'
    o:
      - 'Time-series data'
      - 'Unstructured image data'
      - 'Unlabeled text data'
      - 'Graph data'
    a: 0
    why: 'Readings captured at regular time intervals, where order and trend matter, are time-series data.'

  - id: d1-023
    c: data-types
    kind: hallu
    diff: 2
    s:
      - 'Photos and audio recordings are unstructured data.'
      - 'Labeled data includes the correct answer for each example.'
      - 'Free-text customer reviews are structured data once stored in a database.'
      - 'Time-series data is ordered by time.'
    bad: 2
    o:
      - 'Free-text reviews are unstructured, even when stored in a database column.'
      - 'Free-text reviews are time-series data by definition.'
      - 'Free-text reviews are always labeled data.'
    a: 0
    why: 'Structure is about the content, not where it is stored. The review text has no fixed schema, so it is unstructured, while a star-rating column is structured.'

  - id: d1-024
    c: data-types
    kind: multi
    diff: 2
    q: 'A company is preparing data for an ML project. Which of the following are examples of unstructured data? (Choose TWO.)'
    o:
      - 'Scanned images of paper invoices'
      - 'Recorded customer support calls'
      - 'A table of order IDs and order totals'
      - 'A CSV file of daily stock prices'
      - 'A relational table of employee records'
    a: [0, 1]
    why: 'Images and audio have no fixed schema, so they are unstructured. Tables and CSV files with defined columns are structured.'

  - id: d1-025
    c: data-types
    kind: tf
    diff: 2
    s: 'Unlabeled data is useless for machine learning, because every ML algorithm needs the correct answers to learn.'
    v: false
    why: 'Unsupervised methods such as clustering and anomaly detection learn from unlabeled data. Only supervised learning requires labels.'

  # ------------------------------------------------ supervised-unsupervised-reinforcement
  - id: d1-026
    c: supervised-unsupervised-reinforcement
    kind: mcq
    diff: 1
    pre: true
    q: 'A bank has five years of transactions, each labeled as fraudulent or legitimate. It wants to flag fraud in new transactions. Which learning type fits BEST?'
    o:
      - 'Supervised learning'
      - 'Unsupervised learning'
      - 'Reinforcement learning'
      - 'Semi-supervised learning'
    a: 0
