  # ------------------------------------------------ mlops-fundamentals
  - id: d1-068
    c: mlops-fundamentals
    kind: tf
    diff: 1
    pre: true
    s: 'A model that performed well at launch can lose accuracy over time as real-world data changes, so it needs monitoring.'
    v: true
    why: 'Data and concept drift erode performance after deployment. Monitoring catches the drop so the team can retrain.'

  - id: d1-069
    c: mlops-fundamentals
    kind: mcq
    diff: 2
    q: 'A fraud model''s accuracy has dropped because customer spending patterns changed after it was trained. What should the team do?'
    o:
      - 'Retrain the model on recent data and redeploy'
      - 'Move the endpoint to a larger instance size'
      - 'Switch from real-time to batch inference'
      - 'Raise the auto scaling limits on the model endpoint'
    a: 0
    why: 'The problem is drift: the data changed, not the hardware. Retraining on recent data restores accuracy; bigger instances or more scaling only change speed and capacity.'

  - id: d1-070
    c: mlops-fundamentals
    kind: hallu
    diff: 2
    s:
      - 'MLOps applies DevOps-style automation to the ML lifecycle.'
      - 'Tracking experiments makes results reproducible.'
      - 'Once a model is deployed, it never needs retraining.'
      - 'Manual one-off scripts add technical debt.'
    bad: 2
    o:
      - 'Deployed models need monitoring and retraining as data drifts.'
      - 'Deployed models retrain themselves on every inference request.'
      - 'Models only need retraining when the application code changes.'
    a: 0
    why: 'Real-world data shifts over time. MLOps builds in monitoring and retraining so production models stay accurate.'

  - id: d1-071
    c: mlops-fundamentals
    kind: multi
    diff: 2
    q: 'A team wants its ML workflow to follow MLOps best practices. Which actions support this? (Choose THREE.)'
    o:
      - 'Automate training and deployment with a repeatable pipeline'
      - 'Version models in a model registry'
      - 'Monitor deployed models for drift'
      - 'Retrain by hand on a laptop when someone remembers'
      - 'Skip evaluation so models deploy faster'
      - 'Keep experiment results only in personal notes'
    a: [0, 1, 2]
    why: 'Repeatable pipelines, versioned models and monitoring are core MLOps. Manual retraining, skipped evaluation and untracked experiments create technical debt.'

  - id: d1-072
    c: mlops-fundamentals
    kind: duel
    diff: 3
    q: 'Which approach is better for keeping a production churn model reliable?'
    A: 'A data scientist retrains the model by hand whenever customers complain, copying files between folders.'
    B: 'An automated pipeline retrains, evaluates and registers a new model version when monitoring detects drift.'
    a: 1
    why: 'B is repeatable, versioned and triggered by monitoring, which is MLOps. A is manual, reactive and untracked, which builds technical debt.'

  - id: d1-073
    c: mlops-fundamentals
    kind: tf
    diff: 3
    s: 'Experiment tracking only matters during research; once a model is in production, nobody needs to know which data and parameters built it.'
    v: false
    why: 'Knowing the data, code and parameters behind a production model is needed to reproduce, audit, debug and retrain it.'

  # ------------------------------------------------ precision-recall-f1
  - id: d1-074
    c: precision-recall-f1
    kind: tf
    diff: 2
    pre: true
    s: 'If only 1 percent of transactions are fraud, a model that labels everything legitimate scores 99 percent accuracy yet catches no fraud.'
    v: true
    why: 'Accuracy misleads on imbalanced data. Here recall for fraud is zero, which is why precision, recall and F1 matter.'

  - id: d1-075
    c: precision-recall-f1
    kind: mcq
    diff: 2
    q: 'A medical screening model must miss as few real disease cases as possible, even if some healthy patients get extra tests. Which metric should the team prioritize?'
    o:
      - 'Recall'
      - 'Precision'
      - 'Accuracy'
      - 'Mean squared error'
    a: 0
    why: 'Missed cases are false negatives. Recall measures the share of real positives caught, so maximizing it minimizes misses, at the cost of more false positives.'

  - id: d1-076
    c: precision-recall-f1
    kind: mcq
    diff: 3
    q: 'A spam filter often sends legitimate customer emails to the spam folder. The business says this is worse than letting some spam through. Which metric should the team improve?'
    o:
      - 'Precision'
      - 'Recall'
      - 'Training accuracy'
      - 'R-squared'
    a: 0
    why: 'Legitimate emails flagged as spam are false positives. Precision measures how many flagged items are truly spam, so raising it cuts false positives.'

  - id: d1-077
    c: precision-recall-f1
    kind: hallu
    diff: 2
    s:
      - 'Precision measures how many flagged positives were truly positive.'
      - 'Recall measures how many actual positives the model found.'
      - 'F1 score is the simple average of accuracy and recall.'
      - 'Accuracy can be misleading when classes are imbalanced.'
    bad: 2
    o:
      - 'F1 score is the harmonic mean of precision and recall.'
      - 'F1 score is the product of accuracy and precision.'
      - 'F1 score is the count of false negatives.'
    a: 0
    why: 'F1 combines precision and recall with a harmonic mean, so it stays low if either one is low. Accuracy is not part of it.'

