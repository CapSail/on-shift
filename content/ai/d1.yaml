  # ------------------------------------------------ traditional-ml-vs-fm
  - id: d1-052
    c: traditional-ml-vs-fm
    kind: mcq
    diff: 2
    pre: true
    q: 'A bank must explain to regulators exactly which factors led to each credit decision. The input data is tabular. Which approach is MOST appropriate?'
    o:
      - 'An interpretable model such as a decision tree'
      - 'A large language model prompted to approve or deny'
      - 'A diffusion model trained on applicant documents'
      - 'A general multimodal foundation model as-is'
    a: 0
    why: 'Regulated decisions on tabular data need clear, traceable reasons. A decision tree shows which factors drove each outcome; large foundation models are much harder to explain.'

  - id: d1-053
    c: traditional-ml-vs-fm
    kind: tf
    diff: 2
    s: 'Foundation models are the best choice for every prediction task, because they are the most capable models available.'
    v: false
    why: 'FMs cost more, run slower and are harder to explain. For narrow tabular tasks, strict latency or regulated decisions, traditional ML is often the better fit.'

  - id: d1-054
    c: traditional-ml-vs-fm
    kind: hallu
    diff: 3
    s:
      - 'Foundation models are pre-trained on very large, broad datasets.'
      - 'One foundation model can handle many tasks, like summarizing and answering questions.'
      - 'Foundation models are easier to explain than a small decision tree.'
      - 'Traditional ML can be cheaper to run for narrow tabular tasks.'
    bad: 2
    o:
      - 'Small models like decision trees are generally easier to explain than large FMs.'
      - 'Foundation models explain every output using exact if-then rules.'
      - 'Decision trees cannot be explained by any method.'
    a: 0
    why: 'A decision tree''s logic can be read step by step. A foundation model has billions of parameters, so its reasoning is far less transparent.'

  - id: d1-055
