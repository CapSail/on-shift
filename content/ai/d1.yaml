  # ------------------------------------------------ ai-value-and-limits
  - id: d1-031
    c: ai-value-and-limits
    kind: tf
    diff: 1
    pre: true
    s: 'If a business rule must always give the same exact result, like a fixed shipping fee, traditional code usually beats ML.'
    v: true
    why: 'ML outputs are probabilistic predictions. When the outcome is fully defined and must be exact, a deterministic rule is cheaper, explainable and always correct.'

  - id: d1-032
    c: ai-value-and-limits
    kind: mcq
    diff: 2
    q: 'A company is reviewing four project ideas. Which one is LEAST appropriate for an ML solution?'
    o:
      - 'Computing payroll deductions from a tax table'
      - 'Predicting which customers are likely to cancel'
      - 'Spotting unusual logins across millions of events'
      - 'Routing support tickets based on their free text'
    a: 0
    why: 'Payroll deductions from a fixed table need an exact, deterministic answer, so plain code fits. The others involve patterns in large or messy data, where ML adds value.'

  - id: d1-033
    c: ai-value-and-limits
    kind: multi
    diff: 2
    q: 'A company is deciding where AI/ML could add business value. Which are typical benefits of AI/ML? (Choose THREE.)'
    o:
      - 'Assisting human decisions with predictions'
      - 'Scaling analysis beyond what people can review'
      - 'Automating repetitive, high-volume tasks'
      - 'Guaranteeing fully accurate outputs every time'
      - 'Removing the need for any training data'
      - 'Producing exact results for rule-based calculations'
    a: [0, 1, 2]
    why: 'AI/ML assists decisions, scales and automates. It never guarantees accuracy, it needs data, and exact rule-based calculations are better done in code.'

  - id: d1-034
    c: ai-value-and-limits
    kind: hallu
    diff: 3
    s:
      - 'ML helps when patterns are too complex to write as rules.'
      - 'ML can automate high-volume, repetitive decisions.'
      - 'Once deployed, ML is always cheaper than a rule-based system.'
      - 'ML predictions are probabilistic, not guaranteed.'
    bad: 2
    o:
      - 'ML has ongoing costs for data, hosting, monitoring and retraining, so weigh cost against benefit.'
      - 'ML has no costs at all once training has finished.'
      - 'ML is always more expensive, so it should never be used.'
    a: 0
    why: 'ML carries ongoing costs: hosting, monitoring, retraining and data work. It only makes sense when the value outweighs them.'

  - id: d1-035
    c: ai-value-and-limits
    kind: duel
    diff: 2
    q: 'Dale wants to apply a fixed 10 percent discount to every order over 100 dollars. Which design is better?'
    A: 'Train a classification model on past orders to predict which orders should get the discount.'
    B: 'Write a simple rule in code: if the order total is over 100 dollars, apply 10 percent off.'
    a: 1
    why: 'The outcome is fully defined and must be exact every time. A deterministic rule is cheaper, explainable and never wrong; a model would only approximate it.'

