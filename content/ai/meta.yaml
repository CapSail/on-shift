# Bump content_version on every content change that ships.
content_version: '1.0.0'
exam:
  code: AIF-C01
  name: AWS Certified AI Practitioner
  guide: 'Exam guide v1.2 (2026-10-29)'
  url: 'https://docs.aws.amazon.com/aws-certification/latest/ai-practitioner-01/ai-practitioner-01.html'
  prep: 'https://skillbuilder.aws/'
# Domain weights are % of scored content (they must sum to 100).
domains:
  - { n: 1, name: 'Fundamentals of AI and ML', short: 'AI & ML basics', w: 20, color: '#38bdf8' }
  - { n: 2, name: 'Fundamentals of Generative AI', short: 'GenAI basics', w: 24, color: '#a78bfa' }
  - { n: 3, name: 'Applications of Foundation Models', short: 'Using FMs', w: 28, color: '#3ee68a' }
  - { n: 4, name: 'Guidelines for Responsible AI', short: 'Responsible AI', w: 14, color: '#fbbf24' }
  - { n: 5, name: 'Security, Compliance, and Governance for AI Solutions', short: 'Security & gov', w: 14, color: '#ff4d5e' }
# Every task statement in the exam guide; the build fails if one has no concept.
tasks: ['1.1', '1.2', '1.3', '2.1', '2.2', '2.3', '3.1', '3.2', '3.3', '3.4', '4.1', '4.2', '5.1', '5.2']
