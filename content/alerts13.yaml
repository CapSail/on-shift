- id: y153
  d: endpoint
  src: 'EDR · process creation'
  t: 'wscript.exe running a JavaScript file'
  h: 'WS-LEG-0189 · tnoor'
  l: ['userinit.exe → wscript.exe //B \\corp.com\NETLOGON\map-drives.js at user logon', 'script on the NETLOGON share, 3 KB, last modified 14 months ago by the GPO admin group; same hash on every domain controller', 'child processes: net.exe use for 4 drive letters only; no network egress, no files written', 'the same command line ran 2,300 times today across the fleet at logon']
  v: 0
  x: T1059.007
  c: wscript-js-origin
  k: [0, 1, 3]
  diff: 2
  trap: scary
  say: 'The Windows script host ran a JavaScript file from the domain logon share at user logon, mapping drives on a legal workstation.'
  tell: 'wscript on a .js is the scary part, but the parent is userinit at logon, the file sits on NETLOGON with a 14-month-old change by the GPO admin group, and it ran 2,300 times across the fleet with one command line. A browser-downloaded zip in Temp is the other kind.'
- id: y154
  d: email
  src: 'Mail gateway · URL analysis'
  t: 'Mail link goes through a redirector'
  h: 'To: procurement@corp.com'
  l: ['link in the body: https://redir.mediaportal.com/go?u=hxxps://m365-docshare[.]top/r/Q4-PO, an open redirect on a news portal on the sender-reputation allowlist', 'final destination: m365-docshare[.]top registered 3 days ago; the page proxies the real Microsoft sign-in and relays the session', 'sender: the usual supplier address, SPF and DKIM pass, first message in 8 months', 'at delivery the redirector returned a 302 to a clean page for the gateway''s datacenter address, and to the sign-in proxy only for residential browser addresses']
  v: 1
  x: T1566.002
  c: redirector-link-destination
  k: [1, 3]
  diff: 3
  say: 'A mail link goes through a news portal redirect endpoint to a sign-in page on a three-day-old domain; the gateway scan saw a clean page.'
  tell: 'Open redirects on trusted domains launder reputation: the link starts on a portal your gateway likes, and the cloaked 302 gives a datacenter scanner a clean page while residential browsers get the sign-in proxy. The final destination, registered three days ago, is the verdict, not the first hop.'
  q:
    kind: tune
    ask: 'Best tuning?'
    o: ['Allowlist the news portal domain', 'Detonate from residential egress, follow to the final URL, and score on domain age', 'Block all redirect links']
    a: 1
    why: 'Cloaking beats datacenter scanners. Follow the chain from realistic egress and judge the last hop.'
