  l: ['attachment Q3-statements.7z (AES-encrypted); the body says the password arrives by SMS, as always', 'sender: a.dupont@lawfirm-partners.com, partner firm in the contracts system for 5 years, SPF, DKIM and DMARC pass; the same kind of archive arrived on the 3rd of every month for 2 years', 'DLP exception for this sender domain owned by legal-ops, reviewed last quarter; the archive was scanned after the recipient supplied the password', 'contents: 3 PDFs and 1 XLSX, no executables or nested archives; EDR shows only the PDF viewer and Excel']
