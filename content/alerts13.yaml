- id: y159
  d: network
  src: 'NDR · TLS metadata'
  t: 'TLS fingerprint on the intel watchlist'
  h: 'WS-DEV-0731 → 185.x.x.x:443'
  l: ['client JA3 matches an entry on the intel feed''s Cobalt Strike list; 38 of 38 sessions share it', 'server JARM also matches the feed''s team server list; the certificate is a 6-day-old Let''s Encrypt cert for cdn-assets-update[.]com', 'sessions every 60 s with about 10% jitter for 19 h, 1.2 KB up and 2-80 KB down, to a small VPS ASN never seen from this network', 'client process (EDR): rundll32.exe with no arguments, started by a scheduled task that runs from C:\ProgramData']
  v: 1
  x: T1071.001
  c: tls-fingerprint-context
  k: [1, 2]
  diff: 3
  say: 'A workstation process talks to a recently registered domain every minute with jitter for nineteen hours; both client and server fingerprints are on a watchlist.'
  tell: 'One fingerprint is a coin flip. Client JA3 plus server JARM plus a six-day-old Let''s Encrypt domain, 60-second jitter for 19 hours and a bare rundll32 from a ProgramData task is a team server and its beacon. Contain the host, then hunt that JARM across the fleet.'
  q:
    kind: contain
    ask: 'First action?'
    o: ['Isolate the host, capture memory, and dump the scheduled task definition', 'Add the JA3 to the block list and close', 'Wait for more sessions to confirm']
    a: 0
    why: 'The behaviour is a live beacon. Isolate and capture before the evidence or the operator moves.'
- id: y160
  d: network
  src: 'NDR · TLS metadata'
  t: 'TLS fingerprint on the intel watchlist'
  h: 'SRV-APP-0214 → 34.x.x.x:443'
  l: ['client JA3 matches an entry on the intel feed''s Sliver implant list; 212 of 212 sessions from this host share it', 'server JARM is on no list; certificate is a public CA cert for ingest.metrics-vendor.com issued 5 months ago, domain registered 9 years ago', 'sessions every 30 s for months, steady 4 KB up and 400 B down, to the vendor''s published range hosted in a cloud ASN used by 300 corp hosts', 'client process (EDR): metrics-agent, a Go binary signed by the vendor, deployed by the software distribution tool to 1,900 hosts, parent services.exe']
  v: 0
  x: T1071.001
  c: tls-fingerprint-context
  k: [2, 3]
  diff: 3
  trap: scary
  say: 'A server process beats to a vendor endpoint every thirty seconds, and its client fingerprint matches an implant list entry.'
  tell: 'JA3 is a hash of how a TLS client is built, not who wrote it. Sliver is written in Go, so is half the monitoring ecosystem, and they share Go''s TLS stack. A signed agent from the software tool on 1,900 hosts, a nine-year-old vendor domain and a public cert say telemetry, not a hit.'
