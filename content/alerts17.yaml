- id: ah23
  d: home
  deck: afterhours
  src: 'Phone · system log'
  t: 'Phone lost its signal'
  h: 'Phone · Priya'
  l: ['14:02 status bar shows "No service" and stays that way; Wi-Fi works; neighbours on the same carrier have bars', '14:05-14:14 six password-reset emails and SMS codes requested for the email, bank and exchange accounts, none by Priya', 'carrier chat history: "SIM change processed at a retail store at 14:01, ID shown"', 'owner: at her desk all afternoon, has not visited any store']
  v: 1
  x: T1111
  c: sim-swap-signs
  k: [0, 1]
  diff: 3
  trap: bland
  say: 'A phone drops to no service in the afternoon while Wi-Fi works, and six password-reset requests for email and bank accounts arrive within ten minutes.'
  tell: 'No service while Wi-Fi works, plus a burst of reset requests nobody at the desk made, is the SIM-swap signature. Her number now lives on someone else''s SIM, so SMS codes go to them and they are walking through email and bank resets. Call the carrier from another line, lock the number, then secure the accounts.'
  q:
    kind: contain
    ask: First move?
    o: ['Restart the phone and wait for signal', 'Call the carrier from another line to take the number back and lock it, then secure email first', 'Change the bank password from the phone']
    a: 1
    why: The number is the key being used, so take it back first and move email off SMS codes before the resets finish.
