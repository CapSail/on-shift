- id: ah30
  d: home
  deck: afterhours
  src: 'Phone · system log'
  t: 'App permission review'
  h: 'Phone · Alma'
  l: ['app: "System Service" with no launcher icon, installed 3 weeks ago from a downloaded APK, not the store', 'permissions: accessibility service, device admin and notification access on, location always; 18% of battery use in the background', 'network: uploads about 40 MB a day to tracker-sync.example, including on Wi-Fi at 3 a.m.', 'timeline: installed the day after an ex-partner borrowed the unlocked phone "to check a photo"']
  v: 1
  x: T1056
  c: stalkerware-signs
  k: [0, 1]
  diff: 3
  say: 'A phone has an app with no icon, installed outside the store, with accessibility and device admin rights, uploading data nightly to an unfamiliar host.'
  tell: 'An app called "System Service" with no icon, installed from a downloaded file after a borrowed-phone moment, holding accessibility, device admin and notification access, and quietly uploading every night. That is the stalkerware recipe. Plan safety steps before removing it, because the person watching will notice.'
  q:
    kind: contain
    ask: Before removing it?
    o: ['Uninstall it right now and tell the person who installed it', 'Plan safely: secure accounts from a clean device, keep evidence, then remove it with a support contact', 'Ignore it, battery use is not a risk']
    a: 1
    why: Removal alerts the watcher; secure accounts from another device first and get support if there is a safety risk.
