- id: ah27
  d: home
  deck: afterhours
  src: 'Router · admin log'
  t: 'Settings changed'
  h: 'Router · Ben'
  l: ['02:14 remote administration switched on · login from 198.51.100.88 (internet, hosting provider) using the default admin password', '02:15 DNS servers changed from the ISP resolvers to 203.0.113.53 and 203.0.113.54, which no one in the house has set before', '02:16 port forward added: WAN 8080 to 192.168.1.30 port 80 (the NAS)', '02:17 firmware is 3 years old; the admin password was never changed after install']
  v: 1
  x: T1584.008
  c: router-config-change
  k: [0, 1]
  diff: 1
  say: 'A router admin log shows a login from the internet with the default password, then new DNS servers and a port forward within three minutes.'
  tell: 'The internet should never reach the router admin page, and the default password made it trivial. Within three minutes the DNS servers were swapped for unknown ones and a port forward appeared, so every lookup in the house now answers to someone else. Reset, update, put DNS back.'
  q:
    kind: contain
    ask: First move?
    o: ['Factory reset, update firmware, set a new admin password, turn remote administration off', 'Delete the port forward and keep everything else', 'Reboot the router']
    a: 0
    why: DNS, forwards and remote access were all changed with a known password, so reset to a clean state and close the door.
