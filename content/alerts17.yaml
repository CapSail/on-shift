# ON SHIFT After Hours deck, part 2: personal accounts, devices and the home network (ah21-ah40)
- id: ah21
  d: home
  deck: afterhours
  src: 'Discord · security log'
  t: 'New session on the account'
  h: 'Account · Jonas'
  l: ['session: active from 198.51.100.77 (hosting provider, Romania) · client: browser · no login event and no 2FA prompt logged', 'owner: last login 6 days ago from the home PC 203.0.113.10, 2FA by authenticator app', 'yesterday: Jonas ran "FPS-Booster-Free.exe" from a download link a friend sent by DM in a game server', 'now: the session sent a "free gift, claim here" link to 41 friends and changed the account email']
  v: 1
  x: T1539
  c: chat-token-session
  k: [0, 2]
  diff: 2
  say: 'A chat account shows a new session from a hosting address with no login event, then sends 41 friends a giveaway link.'
  tell: 'Every login leaves a login event and a 2FA prompt; this session has neither, which is what a stolen session token looks like. It followed a "booster" tool that arrived by DM, and its first moves were spamming friends and swapping the email. Token grabbers skip the password entirely.'
  q:
    kind: contain
    ask: First move?
    o: ['Change the password and keep the session open', 'Log out all sessions, change the password, remove the email change and scan the PC', 'Message the friends to ignore the link and wait']
    a: 1
    why: A token survives a password change on some services, so kill sessions, restore recovery details and clean the PC that leaked it.
