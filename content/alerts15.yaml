  diff: 3
  trap: scary
  say: 'A YubiKey typed a forty-four character string in two tenths of a second into a password manager login field, then pressed Enter.'
  tell: 'Also a keyboard that types dozens of characters in a fraction of a second, but it is a token: serial in the inventory, one field, no Win+R, no shell and a successful sign-in a second later. Judge input bursts by where they land.'
- id: y195
  d: network
  src: 'NAC · DHCP + flow logs'
  t: 'Unknown device sweeping internal subnets'
  h: 'SW-3F-Gi1/0/12 · 10.40.3.77'
  l: ['NAC: new MAC with an OUI registered to Raspberry Pi Trading on switch port Gi1/0/12 (conference room 3F wall plate), authenticated by MAC bypass after 802.1X timed out; DHCP hostname "HP-LaserJet-3F"', 'flows: slow SYN sweep of three /24s on 22, 445, 3389 and 5985 at about 2 packets per second for 40 minutes', 'egress: persistent TLS to 185.x.x.x:443 with no SNI and a 90-second keepalive, from the user VLAN', 'asset inventory: no record for this MAC; the floor''s only printer is on port Gi1/0/31 with a different MAC']
  v: 1
  x: T1200
  c: network-implant-vs-scanner
  k: [0, 3]
  diff: 3
  say: 'A new Raspberry Pi device on a conference room port, named like a printer, slowly sweeps three subnets and holds a quiet 443 connection out.'
  tell: 'A Pi wearing a printer hostname in a conference-room wall jack is every red-team report and a few real intrusions. Low-and-slow sweep, silent tunnel out over 443, no inventory record, and the real printer is down the hall on a different MAC. Pull the port first and ask facilities later.'
  q: {kind: contain, ask: 'Best first action?', o: ['Disable the switch port and preserve the device and port logs for forensics', 'Add the MAC to the NAC allowlist and keep monitoring', 'Send facilities a survey about the new printer'], a: 0, why: 'A rogue wired device is a live foothold; take the port down and keep the hardware.'}
- id: y196
  d: network
  src: 'NAC · DHCP + flow logs'
  t: 'Unknown device sweeping internal subnets'
  h: 'SW-DC1-Gi1/0/8 · 10.40.9.15'
  l: ['NAC: new virtual NIC MAC (hypervisor OUI) on the vulnerability-management VLAN; DHCP hostname "scan02"; first lease today, VM cloned from the corporate scanner template', 'flows: full-range sweep of 10.40.0.0/16 and 10.50.0.0/16 on all ports at about 4,000 packets per second, then authenticated checks over 445, 22 and 5985 against roughly 900 hosts with the svc-scan managed service account', 'egress: TLS to the scanner vendor''s cloud console on 443 with its published SNI and a certificate issued to the vendor, 60-second heartbeat', 'asset inventory: registered 3 days ago by the vulnerability-management lead with owner and scan window Tue 01:00-05:00; the source IP is in the IDS and EDR scan exclusions']
  v: 0
  x: T1200
  c: network-implant-vs-scanner
  k: [1, 3]
  diff: 3
  trap: scary
  say: 'A cloned VM sweeps two /16 ranges at four thousand packets a second, then logs into about nine hundred hosts with a service account.'
  tell: 'Louder than the implant by two orders of magnitude and still the safer one: a full-range sweep from a cloned scanner VM with a vendor-bound heartbeat, a managed service account and a registered scan window. Loud, inventoried and vendor-bound is a scanner. Quiet, uninventoried and tunnelling out is not.'
- id: y197
  d: cloud
  src: 'HRIS · Audit log'
  t: 'Direct-deposit details changed'
  h: 'hris-prod · s.mehta@corp.com'
  l: ['operation: Change bank account by employee self-service · s.mehta@corp.com (VP Finance Planning) · new account at a neobank (ending 4417), previous account at the long-standing payroll bank', 'session: sign-in from 45.x.x.x (residential proxy ASN) on a new device; password reset by email link 12 min earlier, new authenticator registered 9 min earlier', 'mailbox: inbox rule created 2 h earlier moving messages matching "direct deposit", "payroll" and "bank" to the RSS Subscriptions folder', 'payroll cutoff in 2 days; the HRIS sends its confirmation to the work email only']
  v: 1
  x: T1657
  c: payroll-bank-change
  k: [1, 2]
  diff: 3
  trap: bland
  say: 'An employee self-service edit moved direct deposit to a neobank account after a password reset, a new authenticator and an inbox rule hiding payroll mail.'
  tell: 'One employee, one bank field, a self-service edit: the dullest request in HR. The 12-minute-old password reset, the fresh authenticator and the inbox rule hiding payroll mail are the payroll-diversion kit BEC crews have run for years. What matters is whether the real employee would ever see the confirmation.'
  q: {kind: contain, ask: 'Best containment?', o: ['Hold the payroll change, revoke sessions and authenticators, remove the rule and call the employee on a known number', 'Email the employee to ask whether they changed it', 'Let payroll run and claw the money back later'], a: 0, why: 'Confirmation emails go to the mailbox the intruder controls; verify out of band and stop the payment first.'}
- id: y198
  d: cloud
  src: 'HRIS · Audit log'
  t: 'Direct-deposit details changed'
  h: 'hris-prod · svc-hris-int'
  l: ['operation: Update bank account (batch) · 1,812 employee records in 4 min by svc-hris-int, the HRIS integration user, from the payroll provider connector', 'before and after compare: account values identical on 1,809 of 1,812 records, only the storage format changed from plain to tokenised; 3 records differ where employees had self-service edits pending', 'cause: payroll provider cutover project; connector credentials added 3 weeks ago by the HR operations lead with a second approver; the provider confirmed receipt of the tokenised values', 'each employee received the standard "your bank details were updated" email; no suppression rules, sign-in only from the connector''s published IP range']
  v: 0
  x: T1657
  c: payroll-bank-change
  k: [1, 3]
  diff: 3
  trap: scary
  say: 'An integration user rewrote bank account fields on 1,812 employee records in four minutes during a payroll provider cutover project.'
  tell: 'A bulk rewrite of 1,812 bank fields smells like a payroll heist until you diff it: the values are the same, only the storage format moved, and the three that differ were employees'' own pending edits. Integration identity, a second approver, notifications left on. Judge bank-detail edits by whether the value changed and who is told.'
- id: y199
  d: cloud
  src: 'Registrar · account audit log'
  t: 'Nameserver change on primary domain'
  h: 'domain: corp.com'
  l: ['operation: Update nameservers for corp.com · ns1.dnshost-a.example and ns2.dnshost-a.example → ns1.dns-hub-9.example and ns2.dns-hub-9.example', 'actor: dns-owner@corp.com signed in from 185.x.x.x in a new country with a password only; two-factor was turned off 6 min earlier and the transfer lock was removed', 'zone at the new nameservers (queried 4 min later): mail and vpn hostnames resolve to 185.x.x.x hosting, TTL 300 on every record against 3600 before', 'CT log: new certificate for mail.corp.com issued 9 min after the change by a public CA that the old zone''s CAA record did not allow']
  v: 1
  x: T1584.001
  c: registrar-ns-change
  k: [1, 3]
  diff: 3
  say: 'Main domain nameservers changed from a new country after two-factor was disabled and the lock removed; a mail certificate followed nine minutes later.'
  tell: 'Nameserver change plus lock removal plus two-factor switched off six minutes earlier, then a certificate for the mail host from a CA the old CAA record forbade: the shape of the sea-turtle-style registrar hijacks. Own the DNS and you can pass domain validation and sit in the middle with a valid certificate.'
  q: {kind: contain, ask: 'Fastest containment?', o: ['Contact the registrar to lock and revert the nameservers, reset the account and revoke the new certificate', 'Wait for the TTL to expire so the records heal', 'Re-issue the corporate certificate and carry on'], a: 0, why: 'Revert at the registrar first; caches, certificates and credentials follow from there.'}
- id: y200
  d: cloud
  src: 'Registrar · account audit log'
