  h: 'LT-ACC31 · corp\r.dube'
  l: ['device: YubiKey 5 NFC (vendor Yubico), serial in the token inventory and issued to this user 3 weeks ago; keyboard interface only, no mass storage', 'input: 44 characters in 0.2 s, a modhex string starting with "cccccc", then Enter, into a focused password-manager login field in Edge', 'process: no new processes, no Win+R, no shell window; the foreground app is unchanged before and after', 'result: the password-manager sign-in succeeded 1 s later with the YubiKey OTP method']
