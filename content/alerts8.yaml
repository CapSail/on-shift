  src: 'Slack · Audit Logs'
  t: 'Workspace export started'
  h: 'actor: v.romero@corp.com (Workspace Owner)'
  l: ['action: export_started · scope: all public and private channels and DMs, 24 months', 'actor session: new device, IP 91.x.x.x, sign-in through an unrecognized SSO app token', 'no legal hold, discovery case or corporate export policy referenced', 'export download requested 3 min after start from a different IP (104.x.x.x)']
  v: 1
  x: T1213
  c: slack-export
  k: [0, 2, 3]
  diff: 3
  say: 'A workspace owner started a full channel and DM export from a new device; the download came from a different address.'
  tell: 'A full export including private channels and DMs is the biggest single data grab in Slack. New device, an SSO session from an unrecognised app token, no hold or discovery case behind it, and the file fetched from a different IP than the one that asked for it. Treat the owner as compromised.'
