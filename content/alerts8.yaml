  t: 'Bulk link-sharing change'
  h: 'user: priya.shah@corp.com'
  l: ['event: change_user_access to "anyone with the link" on 214 files in 6 min', 'folders: Finance/Payroll-2026, HR/Offers, Legal/M&A', 'client: Chrome on Windows, new device, IP 103.x.x.x, sign-in 12 min earlier without an MFA step (session cookie)', 'followed by an export of all 214 link URLs through a Sheets formula']
  v: 1
  x: T1567
  c: gws-bulk-link-share
  k: [0, 2]
  diff: 3
  say: 'Over two hundred finance, HR and legal files were switched to anyone-with-the-link in six minutes, from a new device on a cookie session.'
  tell: 'Opening 214 sensitive files to the link in six minutes is bulk exposure, and exporting the URLs to a sheet is the harvest. New device, a session with no MFA step (a stolen cookie), sensitive folders. Revoke the session first, then unshare.'
