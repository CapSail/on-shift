  src: 'GitHub · Audit log'
  t: 'Workflow file changed'
  h: 'repo: corp/payments-core'
  l: ['action: git.push to main by platform-bot (merged PR 2210 from the platform team)', 'diff to .github/workflows/deploy.yml: adds aws-actions/configure-aws-credentials with role-to-assume (OIDC) and removes the long-lived AWS_SECRET_ACCESS_KEY secret', 'trigger: push to main only; permissions: id-token write, contents read', 'CODEOWNERS review by security-engineering on the PR']
  v: 0
  x: T1552.001
  c: gha-workflow-change
  k: [1, 2]
  diff: 3
  trap: scary
  say: 'A merged platform team pull request swapped a long-lived cloud key for OIDC role assumption, on a main-only trigger with security review.'
  tell: 'Workflow edits that touch secrets are not all bad: this one removes a long-lived key and adopts OIDC, from the platform team through a merged, security-reviewed PR, on a push-to-main trigger with minimal permissions. Author, trigger and egress all point toward hardening.'
