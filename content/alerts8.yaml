  c: github-deploy-key
  k: [0, 1, 3]
  diff: 3
  say: 'A write-enabled deploy key was added to the production infrastructure repo from a new country on a recovery-code session.'
  tell: 'A deploy key with write access is a password-free way back into infra-prod that survives the user''s own password reset. New geo, recovery-code session, a key fingerprint no host owns, and no change record. Remove the key and review pushes since.'
