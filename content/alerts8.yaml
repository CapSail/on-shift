  src: 'Okta · System Log'
  t: 'Sign-on policy rule updated'
  h: 'policy: Global Session Policy'
  l: ['eventType: policy.rule.update · rule "Require MFA, all apps" changed to "MFA: not required" for group Everyone', 'actor: admin.contractor@corp.com (created 3 days ago, Org Admin)', 'change made from IP 45.x.x.x, new geo; no matching change in the IAM repo', 'followed by 14 password-only sign-ins to the finance app within 20 min']
  v: 1
  x: T1556.009
  c: okta-policy-change
  k: [0, 3]
  diff: 3
  say: 'A contractor admin created three days ago switched the MFA requirement off for everyone, from a new location, and password-only finance sign-ins followed.'
  tell: 'Switching MFA off at the policy is the strongest move in the identity playbook: no prompt left to defeat. Brand-new admin, new geo, no matching change in the IAM repo, and password-only sign-ins to finance within minutes.'
