# ON SHIFT alerts, drop 2, part 3: SaaS (Okta, Google Workspace, GitHub, Slack, Salesforce, Snowflake) pairs (y41-y60)
- id: y41
  d: identity
  src: 'Okta · System Log'
  t: 'API token created'
  h: 'admin: j.ferro@corp.com'
  l: ['eventType: system.api_token.create · token name "sync-helper" · inherits Super Admin', 'actor: j.ferro (help desk role elevated to Super Admin 22 min earlier via a support case)', 'client: new device, IP 185.x.x.x (residential proxy), user agent Chrome on Linux', 'no integration references this token name']
  v: 1
  x: T1098.001
  c: okta-api-token
  k: [1, 2]
  diff: 3
  say: 'An Okta API token with super admin rights was created by a help desk user, elevated 22 minutes earlier, from a residential proxy.'
  tell: 'Okta API tokens inherit the creating admin''s privileges and survive password resets and MFA. A fresh Super Admin elevation 22 minutes earlier plus a token minted from a residential proxy is the persistence play after takeover. Revoke the token, not just the session.'
- id: y42
  d: identity
  src: 'Okta · System Log'
  t: 'API token created'
  h: 'admin: svc-iac-okta'
  l: ['eventType: system.api_token.create · token name "terraform-okta-prod"', 'actor: svc-iac-okta (dedicated automation admin, custom role limited to app and group management)', 'client: corp CI egress IP, user agent HashiCorp Terraform provider', 'token name matches the secret rotated in the vault in pipeline run 6718']
  v: 0
  x: T1098.001
  c: okta-api-token
  k: [1, 3]
  diff: 3
  trap: scary
  say: 'An Okta API token was created by the infrastructure automation admin with a limited role, from the CI egress address, matching a pipeline secret rotation.'
  tell: 'Token creation is expected from automation. The tells here are the identity (a dedicated service admin with a custom, limited role), the source (CI egress, Terraform provider user agent) and a matching secret rotation in the same pipeline run. A super admin minting an unnamed helper token is the other thing.'
- id: y43
