  say: 'The IAM team tightened the sign-on policy to FIDO2 methods only, applied from the pipeline, with a temporary exception group for users still enrolling.'
  tell: 'Policy edits cut both ways. This one raises the bar to phishing-resistant factors, comes from the IAM team over the VPN through the repo and pipeline, and keeps a time-boxed exception group. Direction, actor and source all point the same way.'
- id: y45
  d: cloud
  src: 'Google Workspace · Admin audit log'
  t: 'Domain-wide delegation granted'
  h: 'client: 1029384756-mailsync.apps.googleusercontent.com'
  l: ['event: AUTHORIZE_API_CLIENT_ACCESS · scopes: https://mail.google.com/ and full Drive', 'actor: super admin eli.sandoval@corp.com from 91.x.x.x (new country)', 'client ID is not in the Marketplace or the approved app list; created in a Cloud project owned by a personal Gmail account', 'first API calls from the client: users.messages.list for 11 executives within 4 min']
  v: 1
  x: T1098.003
  c: gws-domain-delegation
  k: [1, 2]
  diff: 3
  say: 'Domain-wide delegation with full mail and Drive scopes was granted to an unlisted client from a new country, then it read executive mailboxes.'
  tell: 'Domain-wide delegation lets a service account impersonate every user in the domain, so full mail scopes granted to an unlisted client are a skeleton key. The client lives in a personal Cloud project, the grant came from a new country, and four minutes later it was listing messages for executives.'
