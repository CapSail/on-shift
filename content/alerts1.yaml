- id: e08
  d: endpoint
  src: Sysmon · Event ID 10
  t: LSASS handle opened
  h: WS-IT-0033 · admin_kp
  l: ['source: C:\Users\admin_kp\Downloads\pd64.exe', 'target: C:\Windows\System32\lsass.exe', 'granted access: 0x1fffff', 'signer: Sysinternals (Microsoft)']
  v: 1
  x: T1003.001
  c: lsass-access
  k: [0]
  diff: 2
  say: A tool in the downloads folder opened the local security authority process with full access; its signer is Microsoft Sysinternals.
  tell: Signed by Microsoft does not mean safe. That is ProcDump renamed to pd64.exe in Downloads, with full access (0x1fffff) on LSASS. Signed tools, unsigned intentions.
- id: e09
  d: endpoint
  src: Sysmon · Event ID 10
  t: LSASS handle opened
  h: WS-MKT-0588 · SYSTEM
  l: ['source: C:\Program Files\Windows Defender Advanced Threat Protection\MsSense.exe', 'target: C:\Windows\System32\lsass.exe', 'granted access: 0x1000']
  v: 0
  x: T1003.001
  c: lsass-access
  k: [0]
  diff: 2
  trap: scary
  say: The endpoint sensor opened the local security authority process from its own install folder with a limited query access right.
  q:
    kind: tune
    ask: Best tuning?
    o: [Stop all LSASS-access alerts, Allowlist the EDR image path for LSASS access, Allowlist by access mask only]
    a: 1
    why: Trust the signed sensor image, not a mask attackers can copy.
  tell: 'Your own EDR touches LSASS all day. The tell is the signed sensor image from its own install path, not the access mask: attackers copy innocent-looking masks too.'
- id: e10
