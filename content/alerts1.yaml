  l: ['parent: HealthService.exe', 'cmd: powershell.exe -NoProfile -EncodedCommand JABlAHIAcgBvAHIAQQBjAHQAaQBvAG4A...', 'decoded: $errorActionPreference=''Stop''; Get-Counter ''\Processor(_Total)\% Processor Time''']
  v: 0
