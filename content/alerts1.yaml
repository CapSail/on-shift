  diff: 1
  say: In ten minutes one host failed sign-ins against two hundred accounts using the same password, launched from PowerShell.
  q:
    kind: contain
    ask: First action?
    o: [Isolate the host launching the spray, Reset the two hundred accounts, Block the office subnet]
    a: 0
