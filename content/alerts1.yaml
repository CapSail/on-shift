- id: e40
  d: endpoint
  src: Defender for Endpoint · AlertEvidence
  t: Password spray from host
  h: WS-REC-0051 · cwells
  l: [4625 failures against 212 different accounts in 10 min, 'password pattern: same for all (Autumn2026!)', 'source process: powershell.exe']
  v: 1
  x: T1110.003
  c: password-spray-brute
