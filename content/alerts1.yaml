# ON SHIFT alerts — part 1: Windows endpoint
# v: 1 = true positive (escalate), 0 = false positive (close)
- id: e01
  d: endpoint
  src: Defender for Endpoint · DeviceProcessEvents
  t: rundll32 comsvcs.dll execution
  h: WS-ACCT-0318 · rturner
  l: ['parent: cmd.exe', 'cmd: rundll32.exe C:\Windows\System32\comsvcs.dll, MiniDump 724 C:\Users\Public\l.dmp full']
  v: 1
  x: T1003.001
  c: comsvcs-minidump-lsass
  k: [1]
  diff: 2
  say: A rundll32 command calls the comsvcs dll MiniDump function against a process ID, writing a dump to a public folder.
  q:
    kind: pivot
    ask: First pivot?
    o: [Pull the process tree and LSASS access on the host, Reset the user and move on, Block the public IP at the firewall]
    a: 0
    why: Scope the host and confirm the dump before chasing creds.
  tell: comsvcs.dll + MiniDump against a PID in the LSASS range = credential dumping with a built-in Windows DLL. No malware needed, just vibes and your passwords.
- id: e02
  d: endpoint
  src: Defender for Endpoint · DeviceProcessEvents
  t: PowerShell execution policy bypass
  h: SRV-FILE-02 · SYSTEM
  l: ['parent: CcmExec.exe', 'cmd: powershell.exe -ExecutionPolicy Bypass -File C:\Windows\CCM\SystemTemp\a1f3.ps1']
  v: 0
  x: T1059.001
  c: powershell-bypass-parent
  k: [0]
  diff: 2
  trap: scary
  say: PowerShell launched with an execution policy bypass to run a script, and its parent process is the systems management agent.
  q:
    kind: tune
    ask: Best tuning?
    o: [Suppress all -ExecutionPolicy Bypass org-wide, Exclude the whole file server, Exclude parent CcmExec.exe plus the CCM SystemTemp path]
    a: 2
    why: Scope to the agent and its path; a blanket bypass exclusion blinds real abuse.
  tell: Parent is CcmExec.exe, the SCCM agent. It runs bypass scripts out of CCM\SystemTemp all day. Check the parent before you summon IR.
