gon event to a text file in Windows Temp.","id":"inc_volt_4"},{"d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Shadow copy created","h":"SRV-DC-01 \u00b7 svc_fortinet_ldap","l":["cmd: vssadmin create shadow /for=C:","then: copy \\\\?\\GLOBALROOT\\Device\\HarddiskVolumeShadowCopy3\\Windows\\NTDS\\ntds.dit C:\\Windows\\Temp\\x\\","also: reg save HKLM\\SYSTEM C:\\Windows\\Temp\\x\\s"],"v":1,"x":"T1003.003","tell":"Shadow copy on a DC, ntds.dit + SYSTEM hive copied out. Every hash in the domain, using only vssadmin, copy and reg. Pure LOTL.","c":"ntds-dit-extraction","k":["h",1,2],"diff":1,"say":"On the DC, the firewall service account made a shadow copy of C, copied ntds dot dit out of it, and saved the SYSTEM hive.","id":"inc_volt_5"},{"d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Shadow storage modified","h":"SRV-FS-02 \u00b7 CORP\\adm.chen","l":["cmd: vssadmin resize shadowstorage /for=E: /on=E: /maxsize=25%","previous maxsize: 10% \u00b7 alert: \"Shadow storage 98% full\"","ticket: CHG-6631 \u00b7 run from PAW-IT-01"],"v":0,"x":"T1490","tell":"Ransomware SHRINKS shadow storage to nuke snapshots. This one GREW it after a storage-full alert. Same command, opposite direction. Read the number.","c":"vss-change-scope","k":[0,1],"diff":3,"say":"An admin raised shadow storage on the file server E drive from ten to twenty-five percent, after a storage-full alert, on a change ticket.","id":"inc_volt_6"},{"d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Port proxy configured","h":"SRV-JUMP-02 \u00b7 svc_fortinet_ldap","l":["cmd: netsh interface portproxy add v4tov4 listenport=9999 listenaddress=0.0.0.0 connectport=3389 connectaddress=10.50.1.20","10.50.1.0/24: OT HMI subnet"],"v":1,"x":"T1090.001","tell":"netsh portproxy turns a server into a relay into OT. No tools dropped, just a registry entry that survives reboots. Volt's favorite souvenir.","c":"netsh-portproxy-relay","k":[0,1],"diff":2,"say":"netsh portproxy on the jump server, listening on port 9999 for anyone, forwarding to RDP on an OT HMI at 10.50.1.20.","id":"inc_volt_7"},{"d":"network","src":"Firewall \u00b7 FortiGate traffic log","t":"Connection to OT network","h":"10.50.1.20 (HMI-1)","l":["RDP from SRV-JUMP-02:9999 portproxy (not the OT DMZ jump)","no PSM session \u00b7 no OT change ticket","first IT-to-OT RDP from this host in 90 days \u00b7 03:40 local"],"v":1,"x":"T1021.001","tell":"Through the portproxy, around the conduit, at 3:40am. They are not here to steal. They are here to be ready. That is pre-positioning.","c":"it-ot-path-approval","k":[0,1],"diff":1,"say":"RDP into an OT HMI through the IT jump server portproxy at 3:40 a.m. No recorded session, no ticket, first time in ninety days.","id":"inc_volt_8"},{"d":"network","src":"Firewall \u00b7 FortiGate traffic log","t":"Connection to OT network","h":"10.50.1.21 (HMI-2)","l":["RDP from OT-DMZ-JUMP-01 (approved IT/OT conduit)","session: CyberArk PSM, recorded \u00b7 user: ot.vendor.siemens","ticket: OT-CHG-311 HMI firmware window 14:00-16:00 \u00b7 now 14:22"],"v":0,"x":"T1021.001","tell":"The approved conduit, a recorded PSM session, inside the vendor's change window. That is what IT-to-OT is supposed to look like. Memorize it so the other one jumps out.","c":"it-ot-path-approval","k":[0,1,2],"diff":2,"say":"RDP to an OT HMI from the approved DMZ jump host, through a recorded CyberArk session, inside the vendor firmware change window.","id":"inc_volt_9"}]},{"id":"inc_akira","g":"G1024","title":"VPN Account Without MFA","diff":1,"intro":"Every ransomware report starts the same way. Tonight it is your turn. Akira has a VPN login and a free weekend. Your on-call admins also have a busy weekend. Do not ransom your own coworkers.","win":"You stopped Akira between exfil and encryption and let the on-call crew finish their tickets. No ransom, no leak site, no Monday meeting with Legal. Crew captured.","lose":"Akira encrypted 300 servers and posted your HR files on their leak site, or you burned IR on Sunday backups. The ransom note is in every folder. Run it back.","contain":{"at":7,"ask":"rclone is shipping HR to MEGA and they hold every hash. Move?","o":["Cut VPN + AnyDesk, isolate FS-01, disable admin.test, block MEGA","Block mega.nz at the proxy and keep watching","Disable admin.test and reset its password"],"a":0,"why":"They hold the hashes and have two ways in; one block just reroutes them. Cut every path at once, then reset privileged creds."},"a":[{"d":"network","src":"VPN \u00b7 Cisco ASA","t":"VPN login","h":"vpn.corp.com","l":["user: admin.test (created 2022, not in MFA group)","source: 45.x.x.x (VPS hosting ASN)","preceded by: 4,800 failed logins from 900 IPs"],"v":1,"x":"T1133","tell":"A spray that ends in success on a test account outside MFA. Akira loves a Cisco VPN with no MFA. Disable it, then check everything it touched.","c":"vpn-mfa-coverage","k":[0,2],"diff":1,"say":"VPN login as admin test, an account outside the MFA group, from a VPS, after forty-eight hundred failed logins from nine hundred IPs.","id":"inc_akira_0"},{"d":"network","src":"VPN \u00b7 Cisco ASA","t":"VPN login","h":"vpn.corp.com","l":["user: rpatel \u00b7 Duo push approved","source: 73.x.x.x Comcast residential \u00b7 same as last 60 days","time: Sun 02:10 \u00b7 rpatel is infra on-call (PagerDuty INC-7710)","device cert: corp-issued LT-RPATEL-2"],"v":0,"x":"T1133","tell":"2am Sunday is scary until you check: MFA approved, home ISP they always use, a corp cert, and an actual page. On-call humans exist.","c":"vpn-mfa-coverage","k":[0,1,2],"diff":2,"say":"Sunday 2 a.m. VPN login by rpatel with Duo approved, from their usual home ISP, on a corp laptop, while on call for a page.","id":"inc_akira_1"},{"d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Directory query tool","h":"SRV-JUMP-01 \u00b7 admin.test","l":["cmd: AdFind.exe -f \"(objectcategory=computer)\" > c.txt","also: AdFind.exe -gcb -sc trustdmp > trusts.txt","binary: C:\\Users\\admin.test\\Music\\AdFind.exe"],"v":1,"x":"T1482","tell":"AdFind dumping every computer and every domain trust, from a Music folder. It is the ransomware crew's shopping list and map in one.","c":"adfind-trust-recon","k":[0,1],"diff":1,"say":"AdFind run from the admin test Music folder on the jump server, dumping every computer object and all domain trusts to text files.","id":"inc_akira_2"},{"d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"Remote support tool installed","h":"SRV-JUMP-01 \u00b7 admin.test","l":["cmd: AnyDesk.exe --install \"C:\\ProgramData\\AnyDesk\" --start-with-win --silent","then: echo ******** | AnyDesk.exe --set-password","corp RMM standard: ScreenConnect (corp tenant) \u00b7 AnyDesk not approved"],"v":1,"x":"T1219","tell":"Silent AnyDesk service with a preset password = their backup door for when you kill the VPN account. Not your RMM, not your problem-solver.","c":"rmm-instance-ownership","k":[1,2],"diff":1,"say":"AnyDesk silently installed as a startup service on the jump server, password preset from the command line. Corporate standard is ScreenConnect.","id":"inc_akira_3"},{"d":"network","src":"Proxy \u00b7 Zscaler","t":"Large upload to cloud storage","h":"SRV-FS-01 \u2192 corpbackup01.blob.core.windows.net","l":["tool: azcopy.exe (parent: scheduled task \"FS-01 offsite copy\") \u00b7 96 GB","destination: corp-owned storage account (Azure sub: Prod-Backup)","baseline: same size, same time, every Sunday 01:00"],"v":0,"x":"T1567.002","tell":"Big upload, but to YOUR storage account, by YOUR scheduled task, same as every Sunday. Exfil is about whose bucket, not how big.","c":"bulk-upload-destination","k":[1,2],"diff":2,"say":"Ninety-six gigabytes from the file server to the corp-owned Azure backup storage account by a scheduled azcopy task, same as every Sunday.","id":"inc_akira_4"},{"d":"endpoint","src":"Defender for Endpoint \u00b7 DeviceProcessEvents","t":"NTD t is exfil.","tac":"Exfiltration","d":"cloud"},"s3-mass-read":{"rule":"Bulk S3 reads: legit role from wrong network means stolen creds.","tac":"Collection","d":"cloud"},"imds-cred-offbox":{"rule":"Instance role creds used anywhere but their instance were stolen.","tac":"Credential Access","d":"cloud"},"gcp-sa-key":{"rule":"SA keys from IaC with a commit are fine; human-made admin keys are escalation.","tac":"Persistence","d":"cloud"},"disable-cloud-log":{"rule":"Log setting deleted and recreated is IaC; deleted and left dark is cover.","tac":"Defense Impairment","d":"cloud"},"k8s-exec-context":{"rule":"Pod exec by on-call humans with an incident is debugging; by service accounts, not.","tac":"Execution","d":"cloud"},"k8s-rbac-escalate":{"rule":"cluster-admin bindings are fine only when traceable to a reviewed Git manifest.","tac":"Privilege Escalation","d":"cloud"},"ediscovery-abuse":{"rule":"eDiscovery export: check role history, scope and a real legal matter.","tac":"Collection","d":"email"},"dmarc-fail-spoof":{"rule":"DMARC fail plus swapped reply-to is spoof; unaligned vendor DKIM is misconfig.","tac":"Stealth","d":"email"},"dns-tunnel-entropy":{"rule":"High-entropy DNS labels: check domain age and querying process before tunneling.","tac":"Command and Control","d":"network"},"domain-front-c2":{"rule":"Fronting needs an unrelated Host behind the CDN; same-domain mismatch is coalescing.","tac":"Command and Control","d":"network"},"beacon-vs-telemetry":{"rule":"Fixed-interval beacons: resolve process and destination. Agents beat on timers.","tac":"Command and Control","d":"network"},"llmnr-poison":{"rule":"Endpoints never answer LLMNR for names they do not own.","tac":"Credential Access","d":"network"},"smb-admin-context":{"rule":"Mass ADMIN$ from the deploy server and account in a window is patching.","tac":"Lateral Movement","d":"network"},"tor-egress":{"rule":"Tor egress is evil until the source is a scoped, ROE-listed test host.","tac":"Command and Control","d":"network"},"systemd-persist":{"rule":"Service units: trace the writer and ExecStart. Web user plus curl|bash is persistence.","tac":"Persistence","d":"linux"},"disable-auditd":{"rule":"Auditd reloads: rules grew is hardening, rules vanished is tampering.","tac":"Defense Impairment","d":"linux"},"history-wipe":{"rule":"HISTFILE nulled in a base image is hygiene; mid-session by a human is cover.","tac":"Stealth","d":"linux"},"passwd-shadow-read":{"rule":"Reading /etc/passwd is lookup. Credential dumping needs /etc/shadow.","tac":"Credential Access","d":"linux"},"defender-change-writer":{"rule":"Defender changes: GPO on a lab OU is policy; macro-spawned PowerShell is tamper.","tac":"Defense Impairment","d":"edr"},"sensor-uninstall":{"rule":"EDR going dark is fine only when the box is retired and wiped.","tac":"Defense Impairment","d":"edr"},"macos-osascript":{"rule":"osascript doing shell curl to /tmp from an unsigned app is a stealer.","tac":"Execution","d":"edr"},"macos-gatekeeper":{"rule":"Quarantine removal matters on unsigned binaries, not notarized installers.","tac":"Defense Impairment","d":"edr"},"ticket-must-match-scope":{"rule":"A ticket only counts if host, binary, and action all match it.","tac":"Persistence","d":"endpoint"},"ticket-window-expired":{"rule":"Check ticket status and window. Anyone can paste a CHG number.","tac":"Privilege Escalation","d":"identity"},"ticket-provenance":{"rule":"Who filed and approved the ticket matters. Self-approved or phoned-in is suspect.","tac":"Initial Access","d":"cloud"}},"tutorial":["e10","e13","e06"],"meta":{"attack":"20.1"}}</script>
<script>
(()=>{
'use strict';
const D=JSON.parse(document.getElementById('data').textContent);
const LIB='https://claude.ai/artifact/AqcUYuaFvU1wjbqGycSH7z';
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let RNG=Math.random;
const rnd=()=>RNG();
const pick=a=>a[Math.floor(rnd()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function mulberry(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const DAY=864e5, today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/DAY);
const tUrl=t=>'https://attack.mitre.org/techniques/'+t.replace('.','/')+'/';
const DOM={endpoint:['Endpoint','var(--cy)'],identity:['Identity','var(--pu)'],cloud:['Cloud / SaaS','var(--pk)'],email:['Email','var(--yl)'],network:['Network','var(--grn)'],linux:['Linux / K8s','var(--or)'],edr:['EDR / AV','var(--red)'],macos:['macOS','#e2e8f0']};
const RAR=[['Common','var(--r0)'],['Rare','var(--r1)'],['Epic','var(--r2)'],['Legendary','var(--r3)']];
const RANKS=[[0,'Intern','still looking for the coffee'],[150,'Tier 1 Analyst','closing tickets, opening eyes'],[450,'Tier 2 Analyst','the one who actually reads the logs'],[900,'Tier 3 Analyst','pivots in their sleep'],[1600,'Incident Responder','calm in the chaos'],[2600,'Detection Engineer','writes the rules everyone else trips'],[4000,'Threat Hunter','finds what the rules missed'],[6000,'SOC Lead','the pager fears you'],[8500,"CISO's Favorite",'mentioned in the board deck'],[12000,"APT's Worst Nightmare",'nation-states have a file on you']];
const ALERTS=D.alerts, byId={};ALERTS.forEach(a=>byId[a.id]=a);
const INC_ALERTS=[];D.inc.forEach(i=>i.a.forEach(a=>INC_ALERTS.push(a)));
const CON=D.concepts||{};
const crewById={};D.crews.forEach(c=>crewById[c.id]=c);
const byTech={};D.crews.forEach(c=>c.t.forEach(t=>{(byTech[t]=byTech[t]||[]).push(c);const p=t.split('.')[0];if(p!==t)(byTech[p]=byTech[p]||[]).push(c)}));
const conceptAlerts={};ALERTS.forEach(a=>{const c=a.c||a.id;(conceptAlerts[c]=conceptAlerts[c]||[]).push(a)});
const ruleOf=a=>(CON[a.c]&&CON[a.c].rule)||'';
const userOf=a=>{const p=String(a.h).split(' · ');return p[1]||p[0]};
const hostOf=a=>String(a.h).split(' · ')[0];

/* ---------- voice ---------- */
const ROAST={
 tp:["Escalated. {host}'s C2 just went real quiet.","Caught it. The threat actor is rage-quitting as we speak.","W. The leak site stays empty tonight.","Clean catch. IR owes you a coffee.","Escalated. Their initial access broker wants a refund.","You just ruined a ransomware affiliate's whole quarter.","{user} is getting a password reset and a stern email.","Escalated. That's a 'lessons learned' slide with YOUR name on it.","Caught. Somewhere a Telegram channel just went 'bro what'.","Escalated. MTTD: you.","The pager is proud of you.","Detection coverage: confirmed. Ego: inflated."],
 fp:["Closed. You just saved IR from a 3am page. Hero behavior.","Correctly ignored. Alert fatigue fears you.","Benign. Your MTTR thanks you.","Closed. Not every PowerShell is a crime.","The on-call engineer gets to keep sleeping. Because of you.","Closed. You know what normal looks like, and that's rare.","Closed it. {user} will never know how close they came to an awkward call.","Benign. Tuning ticket incoming, chief.","Closed. That's a suppression rule waiting to happen.","Correct. Ignoring noise is half the job and nobody claps for it. *claps*"],
 miss:["You CLOSED that? The ransom note is printing on every printer right now.","Bro closed a true positive. The threat actor sent you a thank-you card.","Closed. Somewhere a leak site just got a new post.","Missed. This one comes back, and it remembers.","You closed it. The attacker high-fived their whole Telegram channel.","That's a true positive, chief. Legal is drafting the breach notice.","{host} is now somebody else's computer.","Closed. The CISO will be finding out about this from a journalist.","You let {user} get owned. They'll never know it was you.","Missed. The DFIR firm thanks you for their next invoice."],
 fesc:["Escalated a benign. IR just muted your channel.","You woke up the on-call for THAT? They know where you live.","False positive. Tier 3 is screenshotting this for the group chat.","The SOC manager just added a slide about you.","That was benign. You owe IR a pizza.","False alarm. The pager has filed a restraining order.","You isolated {host} for that? {user} is calling the help desk crying.","Escalated. IR spent 40 minutes proving it was nothing.","Benign. Alert fatigue claims another victim: everyone else.","Bro escalated IT doing IT things."]};
const DALE={combo5:["Five in a row. Don't let it go to your head.","Okay, you're on a heater. I'm watching.","Combo x5. Somebody get this analyst a second monitor."],
 combo8:["Eight straight. Are you reading the logs or are you the logs?","This is unreasonable. Keep going."],
 perfect:["Perfect shift. I'm putting you in for... nothing, budget's frozen. But mentally? A raise.","Ten for ten. I didn't know we hired detection engineers on the night shift."],
 bad:["Rough night. Read the tells, come back tomorrow, we've all been there.","Look, everyone closes a true positive once. Maybe not four times."],
 first:["Welcome to the night shift. Rule one: check the parent process. Rule two: there are no other rules. Kidding. There are like 60."],
 streak:["{n} days straight. You're more consistent than our SIEM ingestion."]};
const TAUNT={hit:["Lucky guess.","That tickled.","You read one report and think you know me?","Okay that one hurt.","Fine. You saw that one."],miss:["Ha. You don't even know my TTPs.","Your detection coverage is a vibe, not a strategy.","I've been in your network since 2023.","Imagine not knowing my playbook.","Your SIEM retention is 30 days. Mine is forever."]};
const decks={};
function line(kind,a){const pool=(kind in ROAST)?ROAST[kind]:kind;const k=typeof kind==='string'?kind:pool[0];
 if(!decks[k]||!decks[k].length)decks[k]=shuffle(pool);let s=decks[k].pop();
 if(a)s=s.replace(/{host}/g,hostOf(a)).replace(/{user}/g,userOf(a));return s}

/* ---------- state ---------- */
const KEY='onshift.v2';
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S){try{const o=JSON.parse(localStorage.getItem('onshift.v1'));if(o)S={xp:o.xp||0,dex:o.dex||{},sound:o.sound!==false}}catch(e){}}
S=Object.assign({xp:0,streak:0,lastPlay:null,freeze:0,cs:{},seen:{},log:[],dex:{},intel:{},inc:{},boss:{},daily:{},onb:false,sound:true,rolling:{1:[],2:[],3:[]},shifts:0,dayGoal:{}},S||{});
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
function earnStreak(){const t=today();if(S.lastPlay===t)return false;
 if(S.lastPlay===t-1)S.streak++;else if(S.lastPlay===t-2&&S.freeze>0){S.freeze--;S.streak++;toast('🧊 Streak freeze used')}else S.streak=1;
 S.lastPlay=t;if(S.streak%7===0){S.freeze=Math.min(S.freeze+1,2);setTimeout(()=>toast('🧊 Streak freeze earned'),1500)}save();return true}
const liveStreak=()=>S.lastPlay>=today()-1||(S.lastPlay===today()-2&&S.freeze>0)?S.streak:0;
function rankOf(xp){let i=0;RANKS.forEach((r,j)=>{if(xp>=r[0])i=j});return i}
function addXP(n,el){const before=rankOf(S.xp);S.xp=Math.max(0,S.xp+n);save();
 if(n){const e=document.createElement('div');e.className='xpf'+(n<0?' neg':'');e.textContent=(n>0?'+':'')+n+' XP';
  const r=el&&el.getBoundingClientRect?el.getBoundingClientRect():{left:innerWidth/2-40,top:innerHeight*.3};
  e.style.left=Math.min(innerWidth-110,Math.max(10,r.left+(r.width||0)-100))+'px';e.style.top=Math.max(60,r.top-10)+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),1000)}
 const after=rankOf(S.xp);if(after>before){setTimeout(()=>{toast('⬆ RANK UP → '+RANKS[after][1]);sfx('rank');confetti(40)},500)}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
function confetti(n){const cs=['#3ee68a','#22d3ee','#fbbf24','#f472b6','#a78bfa','#ff4d5e'];for(let i=0;i<n;i++){const d=document.createElement('div');d.className='conf';d.style.left=Math.random()*100+'vw';d.style.background=cs[i%cs.length];d.style.animationDuration=(1.6+Math.random()*1.6)+'s';d.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3800)}}
function logEv(e){S.log.push(Object.assign({day:today()},e));if(S.log.length>2500)S.log.splice(0,S.log.length-2500)}

/* ---------- sound ---------- */
let AC;function sfx(k,pitch){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
 const m=pitch||1;const seq={ok:[[660*m,.06],[990*m,.11]],no:[[200,.16],[140,.24]],rank:[[523,.09],[659,.09],[784,.09],[1047,.22]],drop:[[880,.05],[1175,.05],[1568,.16]],hit:[[300,.05],[600,.08]],tick:[[1200,.03]],sure:[[440,.04],[880,.04]]}[k]||[];
 let t=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.05,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);t+=d})}catch(e){}}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};

/* ---------- navigation ---------- */
let leaving=null;
function go(fn){if(leaving){leaving();leaving=null}try{history.pushState({s:1},'')}catch(e){}window.onkeydown=null;fn();app.scrollTop=0}
addEventListener('popstate',()=>{if(leaving){leaving();leaving=null}window.onkeydown=null;home()});

/* ---------- spaced repetition (per concept) ---------- */
const GAPS=[1,3,7,16,35,90];
function gradeConcept(a,g){const c=a.c||a.id;let r=S.cs[c];const isNew=!r;r=r||{b:0,d:0,lapses:0,n:0};
 if(isNew)r.b=g>=3?2:g===2?1:0;else if(g>=2)r.b=Math.min(r.b+1,GAPS.length-1);else{r.b=0;r.lapses++}
 r.d=today()+GAPS[r.b];r.n++;r.last=today();r.item=a.id;S.cs[c]=r;S.seen[a.id]=(S.seen[a.id]||0)+1;save()}
const dueConcepts=()=>Object.keys(S.cs).filter(c=>S.cs[c].d<=today()&&conceptAlerts[c]).sort((x,y)=>S.cs[x].d-S.cs[y].d);
const missedDue=()=>dueConcepts().filter(c=>S.cs[c].b===0).length;
function variantFor(c){const pool=conceptAlerts[c]||[];const last=S.cs[c]&&S.cs[c].item;const others=pool.filter(a=>a.id!==last);
 const p=(others.length?others:pool).slice().sort((x,y)=>(S.seen[x.id]||0)-(S.seen[y.id]||0));return p[0]}
function rollingTier(){for(const d of [3,2]){const r=S.rolling[d]||[];if(r.length>=6&&r.filter(Boolean).length/r.length>=.7)return d}
 const r2=S.rolling[2]||[],r1=S.rolling[1]||[];if(r1.length>=4&&r1.filter(Boolean).length/r1.length>=.7)return 2;return 1}
function pushRolling(a,ok){const d=a.diff||2;const r=S.rolling[d]=S.rolling[d]||[];r.push(ok?1:0);if(r.length>30)r.shift()}

function buildShift(n,opts){n=n||10;opts=opts||{};
 const used=new Set(),out=[];
 if(!opts.fresh){for(const c of dueConcepts().slice(0,5)){const a=variantFor(c);if(a&&!used.has(a.id)){used.add(a.id);out.push({...a,review:true})}}}
 const tier=rollingTier();
 let fresh=ALERTS.filter(a=>!used.has(a.id)&&!S.cs[a.c||a.id]);
 if(fresh.length<n)fresh=fresh.concat(ALERTS.filter(a=>!used.has(a.id)&&S.cs[a.c||a.id]&&!fresh.includes(a)).sort((x,y)=>(S.cs[x.c||x.id].last||0)-(S.cs[y.c||y.id].last||0)).slice(0,30));
 const wantTP=opts.tp??(2+Math.floor(rnd()*5));
 const score=a=>{const d=a.diff||2;let s=-Math.abs(d-tier)*2+rnd()*2;if(d===tier+1&&rnd()<.34)s+=1.5;return s};
 const pool=shuffle(fresh).sort((x,y)=>score(y)-score(x));
 let tp=out.filter(a=>a.v).length;
 for(const a of pool){if(out.length>=n)break;if(used.has(a.id))continue;
  if(a.v&&tp>=wantTP)continue;if(!a.v&&(out.length-tp)>=n-wantTP)continue;
  if(out.some(b=>(b.c||b.id)===(a.c||a.id)))continue;
  used.add(a.id);out.push({...a});if(a.v)tp++}
 for(const a of pool){if(out.length>=n)break;if(!used.has(a.id)&&!out.some(b=>(b.c||b.id)===(a.c||a.id))){used.add(a.id);out.push({...a})}}
 // guarantee one scary-benign and one bland-malicious if the bank has them
 for(const [want,v] of [['scary',0],['bland',1]]){if(!out.some(a=>a.trap===want)){const cand=pool.find(a=>a.trap===want&&!used.has(a.id));if(cand){const i=out.findIndex(a=>!a.review&&a.v===v&&!a.trap);if(i>=0){out[i]={...cand};used.add(cand.id)}}}}
 // order: interleave, no same domain back to back when avoidable
 let rest=shuffle(out),ord=[];while(rest.length){let i=rest.findIndex(a=>!ord.length||a.d!==ord[ord.length-1].d);if(i<0)i=0;ord.push(rest.splice(i,1)[0])}
 return ord}

/* ---------- crews / intel ---------- */
const mono=n=>n.replace(/[^A-Za-z0-9 ]/g,'').split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,3).toUpperCase()||n.slice(0,2).toUpperCase();
function crewCard(c,via){const[rn,rc]=RAR[c.r];const lv=Math.min(10,Math.ceil(c.t.length/12));const iv=S.intel[c.id]||0;const foil=iv>=10;
 return `<div class="crew flip ${foil?'foil':''}" style="--rc:${rc}"><div class="in"><div class="rr">${rn.toUpperCase()}${foil?' · FOIL':''}</div><div class="mg">${esc(mono(c.n))}</div><div class="nm">${esc(c.n)}</div>
 <div class="al">${c.a.length?'aka '+c.a.slice(0,2).map(esc).join(' · '):esc(c.id)}</div>
 <div class="tl">THREAT LEVEL<br>${'<i class="on"></i>'.repeat(lv)}${'<i></i>'.repeat(10-lv)}<br>${c.t.length} techniques on record · intel ${iv}${via?'<br>'+esc(via):''}</div></div></div>`}
function capture(id,via){const n=!S.dex[id];if(n)S.dex[id]={via,d:today()};save();return n}
function gainIntel(a){const cands=(byTech[a.x]||[]).filter((c,i,arr)=>arr.indexOf(c)===i);if(!cands.length)return null;
 const un=cands.filter(c=>!S.dex[c.id]);const c=pick(un.length&&rnd()<.75?un:cands);S.intel[c.id]=(S.intel[c.id]||0)+1;
 let cap=false;if(S.intel[c.id]>=3&&!S.dex[c.id]){capture(c.id,'intel from your catches');cap=true}save();return{c,cap,n:S.intel[c.id]}}
function rollCrew(boost){const w=boost?[38,32,21,9]:[60,28,10,2];let r=rnd()*100,k=0;while(k<3&&r>w[k]){r-=w[k];k++}
 let pool=D.crews.filter(c=>c.r===k&&!S.dex[c.id]);if(!pool.length)pool=D.crews.filter(c=>c.r===k);return pick(pool)}

/* ---------- home ---------- */
function goalRing(){const g=S.dayGoal[today()]||0,G=20,p=Math.min(1,g/G),r=18,C=2*Math.PI*r;
 return `<div class="ring"><svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="${r}" fill="none" stroke="#151c27" stroke-width="6"/><circle cx="23" cy="23" r="${r}" fill="none" stroke="${p>=1?'#3ee68a':'#22d3ee'}" stroke-width="6" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-p)}" transform="rotate(-90 23 23)"/></svg>
 <div><b>${p>=1?'Daily goal hit ✓':g+' / '+G+' correct calls today'}</b><span>🔥 ${liveStreak()}-day streak${S.freeze?' · 🧊×'+S.freeze:''} · streak counts when you finish a shift</span></div></div>`}
function home(){
 if(!S.onb)return tutorial();
 const ri=rankOf(S.xp),r=RANKS[ri],nx=RANKS[ri+1];
 const pct=nx?Math.round(100*(S.xp-r[0])/(nx[0]-r[0])):100;
 const due=dueConcepts().length,miss=missedDue();
 const boss=weeklyBoss(),bs=S.boss[bossKey()]||{};const dly=S.daily[today()];
 const played=S.shifts>0;

/* ---------- alert runner ---------- */
function runAlerts(cfg){
 let i=0,combo=0,right=0,xp=0,lives=3,phase='call',conf=0,call=null,grid=[],chain=[],extra=0;
 const Q=cfg.queue;const isInc=cfg.mode==='inc',isBoss=cfg.mode==='boss',isTut=cfg.mode==='tut';

 leaving=()=>{stopDock()};
 function header(){

  app.innerHTML=`<div class="scr">${header()}
  ${isTut?`<div class="coachtxt">${i===0?'Real attack or not? This one is pretty loud. Swipe the card RIGHT (or tap Escalate) to escalate.':i===1?'Scary-sounding, but read the details. Swipe LEFT to close if it\'s normal.':'Last one. Look at every line before you call it.'}</div>`:''}

  <div id="fb"></div>
  ${isTut&&i<2?`<div class="coach" style="--dx:${i===0?80:-80}px">👆</div>`:''}</div></div>
  <div id="after"><div class="acts">
   <button class="b-cls b-sure" data-c="0" data-f="1">Close<small>sure</small></button>

   <button class="b-esc" data-c="1" data-f="0">Escalate<small>lean</small></button>

 }
 function swipe(el){let sx=0,sy=0,dx=0,on=false,tick=false;const se=$('#se'),sc=$('#sc');

  el.addEventListener('pointermove',e=>{if(!on)return;dx=e.clientX-sx;if(Math.abs(e.clientY-sy)>60&&Math.abs(dx)<30){on=false;el.classList.remove('drag');el.style.transform='';return}
   el.style.transform=`translateX(${dx}px) rotate(${dx/20}deg)`;const sure=Math.abs(dx)>170;
   se.style.opacity=Math.max(0,dx/90);sc.style.opacity=Math.max(0,-dx/90);se.textContent=sure?'ESCALATE!':'ESCALATE?';sc.textContent=sure?'CLOSE!':'CLOSE?';
   if(sure&&!tick){tick=true;buzz(12);sfx('tick')}if(!sure)tick=false});
  const end=()=>{if(!on)return;on=false;el.classList.remove('drag');el.style.transform='';se.style.opacity=0;sc.style.opacity=0;if(Math.abs(dx)>80)decide(dx>0,Math.abs(dx)>170)};

 function resolve(pk){

  if(!ride_on)return;
  if(ans===null){await say(`Time. It was ${a.v?'escalate':'close'}. ${ruleOf(a)||''}`);draw('ans',false)}
  else{const ok=ans===!!a.v;if(ok){score++;sfx('ok');addXP(8)}else{sfx('no');addXP(-2)}gradeConcept(a,ok?2:1);logEv({id:a.id,c:a.c||a.id,v:a.v,call:ans,conf:0,ok,mode:'ride',d:a.d,x:a.x,diff:a.diff||2});if(ok)S.dayGoal[today()]=(S.dayGoal[today()]||0)+1;save();
   draw('ans',ok);await say(`${ok?'Correct.':'Wrong.'} ${a.v?'Escalate.':'Close it.'} ${ruleOf(a)||a.tell}`)}
  if(!ride_on)return;await wait(1200);k++;}
  if(k>=Q.length){earnStreak();await say(`Shift over. ${score} out of ${Q.length}.`);stopRide();
   app.innerHTML=`<div class="scr center"><div class="sec">RIDE SHIFT DONE</div><div class="grade">${score}/${Q.length}</div><button class="next" id="h">Back to the SOC</button><button class="next ghost" id="a">Another ride</button></div>`;
   $('#h').onclick=()=>go(home);$('#a').onclick=()=>go(ride)}}
 draw()}

try{history.replaceState({s:0},'')}catch(e){}
home();
})();
</script>
